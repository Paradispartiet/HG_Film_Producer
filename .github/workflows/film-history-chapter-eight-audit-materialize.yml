# Rerun after Chapter 7 verify-chain reconciliation
name: Materialize permanent Film History Chapter 8 Atlas audit

on:
  push:
    branches:
      - agent/film-history-chapter-eight-atlas-audit
    paths:
      - .github/workflows/film-history-chapter-eight-audit-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-history-chapter-eight-atlas-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lock resolved Chapter 8 matrix as permanent audit
        shell: bash
        run: |
          cp scripts/film-history-chapter-eight-atlas-resolver.mjs scripts/film-history-chapter-eight-atlas-audit.mjs
          python3 <<'PY'
          from pathlib import Path

          audit_path = Path('scripts/film-history-chapter-eight-atlas-audit.mjs')
          text = audit_path.read_text(encoding='utf-8')

          marker = '].map(([label, chapterFunction]) => ({ label, role: "historical_object", atlasDecision: "NO_PRODUCTION_CASE", chapterFunction }));\n\nfunction readText'
          expected = '\n'.join([
              '].map(([label, chapterFunction]) => ({ label, role: "historical_object", atlasDecision: "NO_PRODUCTION_CASE", chapterFunction }));',
              '',
              'const expectedDecisions = {',
              '  USE_EXISTING: ["The Passion of Joan of Arc"],',
              '  P0: ["Cœur fidèle", "Napoléon", "Un Chien Andalou"],',
              '  P1: ["Entr\'acte", "The Smiling Madame Beudet"],',
              '  P2: ["Ballet mécanique", "Emak-Bakia", "L\'Inhumaine", "L\'Âge d\'Or", "L\'Étoile de mer", "La Coquille et le Clergyman", "La Roue", "Ménilmontant", "The Fall of the House of Usher"],',
              '};',
              '',
              'function readText',
          ])
          if text.count(marker) != 1:
              raise SystemExit('historical marker mismatch')
          text = text.replace(marker, expected, 1)

          marker = '  return acceptedTitles(left).some((title) => rightTitles.has(title));\n}\n\nconst seed'
          replacement = '  return acceptedTitles(left).some((title) => rightTitles.has(title));\n}\nfunction sameList(left, right) { return JSON.stringify([...left].sort()) === JSON.stringify([...right].sort()); }\n\nconst seed'
          if text.count(marker) != 1:
              raise SystemExit('matches marker mismatch')
          text = text.replace(marker, replacement, 1)

          marker = 'const byDecision = Object.fromEntries(["USE_EXISTING", "P0", "P1", "P2", "EXISTING_REQUIRED"].map((decision) => [decision, candidateResults.filter((candidate) => candidate.decision === decision).map((candidate) => candidate.title)]));\nconst report = {'
          structural = '\n'.join([
              'const byDecision = Object.fromEntries(["USE_EXISTING", "P0", "P1", "P2", "EXISTING_REQUIRED"].map((decision) => [decision, candidateResults.filter((candidate) => candidate.decision === decision).map((candidate) => candidate.title)]));',
              'const structuralProblems = [];',
              'for (const [decision, expectedTitles] of Object.entries(expectedDecisions)) {',
              '  if (!sameList(byDecision[decision] ?? [], expectedTitles)) structuralProblems.push(`${decision} must equal ${expectedTitles.join(" | ")}; found ${(byDecision[decision] ?? []).join(" | ")}`);',
              '}',
              'if ((byDecision.EXISTING_REQUIRED ?? []).length > 0) structuralProblems.push(`Required existing candidates are missing: ${byDecision.EXISTING_REQUIRED.join(", ")}`);',
              'const report = {',
          ])
          if text.count(marker) != 1:
              raise SystemExit('decision marker mismatch')
          text = text.replace(marker, structural, 1)

          marker = '  remainingBookReferenceOnlyFilms: byDecision.P2,\n};'
          replacement = '  remainingBookReferenceOnlyFilms: byDecision.P2,\n  structuralProblems,\n};'
          if text.count(marker) != 1:
              raise SystemExit('report marker mismatch')
          text = text.replace(marker, replacement, 1)
          text = text.replace('HG_FILM_HISTORY_CHAPTER_EIGHT_ATLAS_RESOLVER_START', 'HG_FILM_HISTORY_CHAPTER_EIGHT_ATLAS_AUDIT_START')
          text = text.replace('HG_FILM_HISTORY_CHAPTER_EIGHT_ATLAS_RESOLVER_END', 'HG_FILM_HISTORY_CHAPTER_EIGHT_ATLAS_AUDIT_END')
          text += '\nif (structuralProblems.length > 0) {\n  console.error(`Film History Chapter 8 Atlas audit found ${structuralProblems.length} structural problem(s).`);\n  process.exitCode = 1;\n}\n'
          audit_path.write_text(text, encoding='utf-8')

          package_path = Path('package.json')
          package_text = package_path.read_text(encoding='utf-8')
          old = '    "audit:film-history-ch7": "node scripts/film-history-chapter-seven-atlas-audit.mjs",\n'
          new = old + '    "audit:film-history-ch8": "node scripts/film-history-chapter-eight-atlas-audit.mjs",\n'
          if package_text.count(old) != 1:
              raise SystemExit('package script marker mismatch')
          package_text = package_text.replace(old, new, 1)
          old = 'npm run audit:film-history-ch6 && npm run audit:film-history-ch7 && npm run typecheck'
          new = 'npm run audit:film-history-ch6 && npm run audit:film-history-ch7 && npm run audit:film-history-ch8 && npm run typecheck'
          if package_text.count(old) != 1:
              raise SystemExit('verify marker mismatch')
          package_text = package_text.replace(old, new, 1)
          package_path.write_text(package_text, encoding='utf-8')
          PY
          rm scripts/film-history-chapter-eight-atlas-resolver.mjs
      - name: Preflight
        run: npm run preflight:v0.1
      - name: Global production-case audit
        run: npm run audit:production-cases
      - name: Chapter 1 audit
        run: npm run audit:film-history-ch1
      - name: Chapter 2 audit
        run: npm run audit:film-history-ch2
      - name: Chapter 3 audit
        run: npm run audit:film-history-ch3
      - name: Chapter 4 audit
        run: npm run audit:film-history-ch4
      - name: Chapter 5 audit
        run: npm run audit:film-history-ch5
      - name: Chapter 6 audit
        run: npm run audit:film-history-ch6
      - name: Chapter 7 audit
        run: npm run audit:film-history-ch7
      - name: Chapter 8 audit
        run: npm run audit:film-history-ch8
      - name: Typecheck
        run: npm run typecheck
      - name: Build core tests
        run: npm run build
      - name: Chapter 8 audit contract test
        run: node --test dist/core/filmHistoryChapterEightAuditContract.test.js
      - name: All core tests
        run: node --test dist/core/*.test.js
      - name: UI build
        run: npm run build:ui
      - name: Commit permanent audit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/film-history-chapter-eight-audit-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lock Film History Chapter 8 Atlas audit"
          git push origin HEAD:agent/film-history-chapter-eight-atlas-audit
