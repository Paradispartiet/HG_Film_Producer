name: TEMP Chapter 19 Nomadland finalize

on:
  push:
    branches:
      - agent/ch19-nomadland-production-case
    paths:
      - .github/workflows/TEMP-ch19-nomadland-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-nomadland-production-case
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exact Nomadland integration patch
        run: |
          node - <<'NODE'
          const fs = require('fs');

          function replaceExact(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`${file}: missing exact anchor: ${before.slice(0, 240)}`);
            const next = source.replace(before, after);
            if (next === source) throw new Error(`${file}: replacement produced no change`);
            fs.writeFileSync(file, next);
          }

          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'import { mergeChapterNineteenAvatarWayOfWaterExpansion } from "../../core/chapterNineteenAvatarWayOfWaterExpansion.js";\n',
            'import { mergeChapterNineteenAvatarWayOfWaterExpansion } from "../../core/chapterNineteenAvatarWayOfWaterExpansion.js";\nimport { mergeChapterNineteenNomadlandExpansion } from "../../core/chapterNineteenNomadlandExpansion.js";\n',
          );
          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'const chapterNineteenAvatarWayOfWaterScenarios = mergeChapterNineteenAvatarWayOfWaterExpansion(chapterNineteenFleeScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenAvatarWayOfWaterScenarios);',
            'const chapterNineteenAvatarWayOfWaterScenarios = mergeChapterNineteenAvatarWayOfWaterExpansion(chapterNineteenFleeScenarios);\nconst chapterNineteenNomadlandScenarios = mergeChapterNineteenNomadlandExpansion(chapterNineteenAvatarWayOfWaterScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenNomadlandScenarios);',
          );
          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'manual_chapter_nineteen_avatar_way_of_water_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
            'manual_chapter_nineteen_avatar_way_of_water_expansion_2026+manual_chapter_nineteen_nomadland_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
          );

          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            'import { avatarWayOfWaterProductionCaseVerification } from "./scenarioProductionVerificationAvatarWayOfWater";\n',
            'import { avatarWayOfWaterProductionCaseVerification } from "./scenarioProductionVerificationAvatarWayOfWater";\nimport { nomadlandProductionCaseVerification } from "./scenarioProductionVerificationNomadland";\n',
          );
          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            '  fleeProductionCaseVerification,\n  avatarWayOfWaterProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
            '  fleeProductionCaseVerification,\n  avatarWayOfWaterProductionCaseVerification,\n  nomadlandProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
          );

          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            'import { avatarWayOfWaterFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenAvatarWayOfWater";\n',
            'import { avatarWayOfWaterFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenAvatarWayOfWater";\nimport { nomadlandFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenNomadland";\n',
          );
          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            '  [fleeFilmHistoryProfile.scenarioId]: fleeFilmHistoryProfile,\n  [avatarWayOfWaterFilmHistoryProfile.scenarioId]: avatarWayOfWaterFilmHistoryProfile,\n  scenario_the_machinist_2004:',
            '  [fleeFilmHistoryProfile.scenarioId]: fleeFilmHistoryProfile,\n  [avatarWayOfWaterFilmHistoryProfile.scenarioId]: avatarWayOfWaterFilmHistoryProfile,\n  [nomadlandFilmHistoryProfile.scenarioId]: nomadlandFilmHistoryProfile,\n  scenario_the_machinist_2004:',
          );

          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            'const EXPECTED_PLAYABLE_SCENARIOS = 545;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 545;',
            'const EXPECTED_PLAYABLE_SCENARIOS = 546;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 546;',
          );
          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            '  "chapterNineteenAvatarWayOfWaterExpansion.ts",\n  "modernCanonExpansion.ts",',
            '  "chapterNineteenAvatarWayOfWaterExpansion.ts",\n  "chapterNineteenNomadlandExpansion.ts",\n  "modernCanonExpansion.ts",',
          );

          replaceExact(
            'scripts/film-history-chapter-nineteen-atlas-audit.mjs',
            'const EXPECTED_ATLAS_COUNT = 545;',
            'const EXPECTED_ATLAS_COUNT = 546;',
          );

          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            'const exactUseExisting = [\n  "Tenet",\n  "Soul",',
            'const exactUseExisting = [\n  "Tenet",\n  "Nomadland",\n  "Soul",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            'const exactP1Queue = [\n  "Nomadland",\n  "Collective",',
            'const exactP1Queue = [\n  "Collective",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 545;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 545);\n  assert.equal(resolved.atlas.actualCount, 545);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 545);',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 546;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 546);\n  assert.equal(resolved.atlas.actualCount, 546);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 546);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(exactUseExisting.length, 13);\n  assert.equal(exactP0Queue.length, 16);\n  assert.equal(exactP1Queue.length, 27);',
            '  assert.equal(exactUseExisting.length, 14);\n  assert.equal(exactP0Queue.length, 16);\n  assert.equal(exactP1Queue.length, 26);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 43);',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 42);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(resolved.productionStrategy.nextRecommendedCase, "Nomadland");\n  assert.equal(resolved.productionStrategy.nextRecommendedLane, "independent_low_mid_budget");\n  assert.deepEqual(resolved.recommendedNewProductionCases.slice(0, 5), [\n    "Nomadland",\n    "Drive My Car",\n    "Collective",\n    "RRR",\n    "Top Gun: Maverick",\n  ]);\n  assert.deepEqual(\n    resolved.productionStrategy.remainingSequence.slice(0, 5).map((item) => item.lane),\n    ["independent_low_mid_budget", "auteur_festival", "nonfiction_hybrid", "regional_global", "industrial_scale_technical"],\n  );\n  assert.ok(resolved.recommendedNewProductionCases.indexOf("Top Gun: Maverick") > resolved.recommendedNewProductionCases.indexOf("Nomadland"));',
            '  assert.equal(resolved.productionStrategy.nextRecommendedCase, "Drive My Car");\n  assert.equal(resolved.productionStrategy.nextRecommendedLane, "auteur_festival");\n  assert.deepEqual(resolved.recommendedNewProductionCases.slice(0, 5), [\n    "Drive My Car",\n    "Collective",\n    "RRR",\n    "Top Gun: Maverick",\n    "Titane",\n  ]);\n  assert.deepEqual(\n    resolved.productionStrategy.remainingSequence.slice(0, 5).map((item) => item.lane),\n    ["auteur_festival", "nonfiction_hybrid", "regional_global", "industrial_scale_technical", "auteur_festival"],\n  );\n  assert.ok(!resolved.recommendedNewProductionCases.includes("Nomadland"));\n  assert.ok(resolved.recommendedNewProductionCases.indexOf("Top Gun: Maverick") > resolved.recommendedNewProductionCases.indexOf("Drive My Car"));',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  const soul = resolved.candidates.find((candidate) => candidate.title === "Soul");',
            '  const nomadland = resolved.candidates.find((candidate) => candidate.title === "Nomadland");\n  assert.ok(nomadland);\n  assert.equal(nomadland.decision, "USE_EXISTING");\n  assert.equal(nomadland.scenarioId, "scenario_nomadland_2020");\n  assert.equal(nomadland.matches, 1);\n  assert.equal(nomadland.productionVerified, true);\n\n  const soul = resolved.candidates.find((candidate) => candidate.title === "Soul");',
          );

          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(verificationIds.size === 545, `Global Production Verification registry must contain exactly 545 unique scenarioIds after the sixth Chapter 19 case: ${verificationIds.size}`);',
            'invariant(verificationIds.size === 546, `Global Production Verification registry must contain exactly 546 unique scenarioIds after the seventh Chapter 19 case: ${verificationIds.size}`);',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 545, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 545.");',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 546, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 546.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 13 && chapter19.byDecision?.P0?.length === 16 && chapter19.byDecision?.P1?.length === 27 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 13 USE_EXISTING / 16 P0 / 27 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 14 && chapter19.byDecision?.P0?.length === 16 && chapter19.byDecision?.P1?.length === 26 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 14 USE_EXISTING / 16 P0 / 26 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(avatarWayOfWater?.decision === "USE_EXISTING" && avatarWayOfWater?.scenarioId === "scenario_avatar_the_way_of_water_2022" && avatarWayOfWater?.matches === 1 && avatarWayOfWater?.productionVerified === true, "Avatar: The Way of Water is not closed as the sixth production-verified Chapter 19 USE_EXISTING case.");',
            'invariant(avatarWayOfWater?.decision === "USE_EXISTING" && avatarWayOfWater?.scenarioId === "scenario_avatar_the_way_of_water_2022" && avatarWayOfWater?.matches === 1 && avatarWayOfWater?.productionVerified === true, "Avatar: The Way of Water is not closed as the sixth production-verified Chapter 19 USE_EXISTING case.");\nconst nomadland = chapter19.candidates.find((candidate) => candidate.title === "Nomadland");\ninvariant(nomadland?.decision === "USE_EXISTING" && nomadland?.scenarioId === "scenario_nomadland_2020" && nomadland?.matches === 1 && nomadland?.productionVerified === true, "Nomadland is not closed as the seventh production-verified Chapter 19 USE_EXISTING case.");\ninvariant(chapter19.productionStrategy?.nextRecommendedCase === "Drive My Car" && chapter19.productionStrategy?.nextRecommendedLane === "auteur_festival", "Chapter 19 balanced scheduler must advance from Nomadland to Drive My Car after the seventh case.");',
          );
          NODE

      - name: Generate canonical Chapter 19 snapshot
        run: |
          node scripts/film-history-chapter-nineteen-atlas-audit.mjs > /tmp/ch19-nomadland.json
          cp /tmp/ch19-nomadland.json docs/film-history-chapter-nineteen-atlas-resolved.json

      - name: Assert Nomadland transition
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const nomadland = data.candidates.find((candidate) => candidate.title === 'Nomadland');
          const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
          if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 546 || data.atlas.actualCount !== 546) throw new Error(JSON.stringify(data.atlas));
          if (data.verificationIndex.literalVerifiedScenarioIds !== 546) throw new Error(JSON.stringify(data.verificationIndex));
          if (!nomadland || nomadland.decision !== 'USE_EXISTING' || nomadland.scenarioId !== 'scenario_nomadland_2020' || nomadland.matches !== 1 || nomadland.productionVerified !== true || nomadland.origin !== 'chapterNineteenNomadlandExpansion.ts') throw new Error(JSON.stringify(nomadland));
          if (counts.USE_EXISTING !== 14 || counts.P0 !== 16 || counts.P1 !== 26 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(JSON.stringify(counts));
          if (data.productionStrategy.nextRecommendedCase !== 'Drive My Car' || data.productionStrategy.nextRecommendedLane !== 'auteur_festival') throw new Error(JSON.stringify(data.productionStrategy));
          if (data.recommendedNewProductionCases.length !== 42 || data.recommendedNewProductionCases[0] !== 'Drive My Car' || data.recommendedNewProductionCases.includes('Nomadland')) throw new Error(JSON.stringify(data.recommendedNewProductionCases.slice(0, 10)));
          NODE

      - name: Remove TEMP surfaces from verification working tree
        run: |
          rm -f .github/workflows/TEMP-ch19-nomadland-*.yml
          rm -f TEMP-nomadland-*.txt TEMP-nomadland-*.log

      - name: Install dependencies
        run: npm ci

      - name: Verify full v0.1 fail-closed gate with diagnostics
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee /tmp/nomadland-verify.log

      - name: Upload full verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomadland-verify-${{ github.run_attempt }}
          path: /tmp/nomadland-verify.log
          if-no-files-found: error

      - name: Assert Nomadland snapshot survived full verification
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const nomadland = data.candidates.find((candidate) => candidate.title === 'Nomadland');
          const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
          if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 546 || data.atlas.actualCount !== 546 || data.verificationIndex.literalVerifiedScenarioIds !== 546) throw new Error(JSON.stringify({ atlas: data.atlas, verificationIndex: data.verificationIndex }));
          if (!nomadland || nomadland.decision !== 'USE_EXISTING' || nomadland.scenarioId !== 'scenario_nomadland_2020' || nomadland.matches !== 1 || nomadland.productionVerified !== true || nomadland.origin !== 'chapterNineteenNomadlandExpansion.ts') throw new Error(JSON.stringify(nomadland));
          if (counts.USE_EXISTING !== 14 || counts.P0 !== 16 || counts.P1 !== 26 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(JSON.stringify(counts));
          if (data.productionStrategy.nextRecommendedCase !== 'Drive My Car' || data.productionStrategy.nextRecommendedLane !== 'auteur_festival') throw new Error(JSON.stringify(data.productionStrategy));
          NODE

      - name: Commit permanent materialization after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            scripts/production-case-rest-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            docs/film-history-chapter-nineteen-atlas-resolved.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent Nomadland materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialize Chapter 19 Nomadland production case"
          git push origin HEAD:agent/ch19-nomadland-production-case
