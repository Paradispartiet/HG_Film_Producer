name: Materialize Nollywood representation admission

on:
  push:
    branches:
      - agent/nollywood-representation-admission-run-20260911

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[nollywood materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize exact Living in Bondage admission
        shell: bash
        run: |
          cat > src/core/nollywoodLivingInBondageExpansion.ts <<'EOF'
          import type { HistoricalFilmScenario } from "./earlyCinemaExpansion.js";
          import { normalizeEarlyCinemaTitle } from "./earlyCinemaExpansion.js";

          export const nollywoodLivingInBondageExpansionDefinitions = [
            {
              id: "scenario_living_in_bondage_1992",
              title: "Living in Bondage",
              originalTitle: "Living in Bondage",
              year: 1992,
              titleType: "Movie",
              runtimeMins: 163,
              directors: ["Chris Obi Rapu"],
              genres: ["Drama"],
              premise: "Build Living in Bondage as a source-bound 1992 Nigerian video-film production case that closes the documented Nollywood industry-system gap through concrete financing, capture, distribution and audience evidence. Academic research identifies Okechukwu Ogunjiofor as story originator/writer-producer, Kenneth Nnebue as the financier and informal-sector video marketer, and Chris Obi Rapu as director. SAGE research reports an approximately 150,000-naira production cost, Super VHS capture and a deliberate straight-to-home-video model; preserve the figure as a cited historical estimate rather than an audited ledger. UNESCO records the wider economic context in which celluloid production had become prohibitively difficult, Living in Bondage was shot on video and circulated through the emerging home-video circuit, and the success helped trigger a cheap popular production system later called Nollywood. Oxford research places the film's production inside West African informal-sector marketing rather than a conventional vertically integrated studio model. BFI identifies VHS as the accessible technology of the period and treats the film as Nollywood's first major success. Keep production, financing, technology and distribution evidence distinct: Nnebue's cassette/marketing role does not prove unsupported ownership terms; Super VHS does not justify inventing camera, lens, lighting, tape-stock, edit-suite or sound-hardware specifications; and later industry scale does not retroactively establish the film's original crew size or exact sales. The production's industrial importance is the documented combination of low-cost video capture, private/informal finance, marketer-led duplication and distribution, and domestic home viewing. Do not use awards, prestige or nationality alone as the admission rationale.",
              sourceId: "living_in_bondage_1992_nollywood_admission",
              sourceUrl: "https://journals.sagepub.com/doi/10.1177/21582440211032620",
              scenarioType: "nollywood_low_budget_super_vhs_informal_finance_home_video_distribution",
              requiredChoicesSeed: {
                screenplay: ["ogunjiofor_story_and_writer_producer_role", "obi_rapu_direction_distinct", "industry_context_not_plot_proxy"],
                camera: ["super_vhs_capture_only", "video_as_cost_response", "no_invented_camera_lens_or_lighting_specs"],
                editing: ["straight_to_home_video_delivery", "duplication_distribution_distinct_from_editing", "no_invented_post_hardware"],
                sound: ["no_invented_sound_capture_or_mix_specs", "home_video_delivery_not_sound_format_proof"],
                themes: ["film_history", "1992", "nigeria", "nollywood", "living_in_bondage", "kenneth_nnebue", "okechukwu_ogunjiofor", "chris_obi_rapu", "informal_finance", "super_vhs", "home_video", "video_distribution", "audience_system"],
              },
              learningGoals: [
                "Explain why Living in Bondage qualifies as a representation-gap admission through a concrete Nigerian production and distribution system rather than nationality or prestige.",
                "Keep Okechukwu Ogunjiofor's story/writer-producer role, Kenneth Nnebue's financing/marketing role and Chris Obi Rapu's directing role distinct.",
                "Use the cited approximately 150,000-naira cost as a historical research estimate, not as an audited production ledger.",
                "Connect Super VHS capture to the cost and infrastructure conditions that made video a practical alternative to celluloid without inventing unsupported camera or post specifications.",
                "Model straight-to-home-video distribution and informal video marketing as central industrial infrastructure rather than as an afterthought to theatrical release.",
                "Distinguish title-specific 1992 evidence from the much larger Nollywood production volume that developed later.",
                "Treat audience demand and home viewing as distribution-system evidence while avoiding unsupported exact sales totals.",
                "Do not infer ownership, recoupment, crew size, schedule, camera model, lens, lighting, edit hardware, sound hardware or duplication quantities absent from the reviewed sources.",
              ],
              phases: [
                { id: "package_and_finance", label: "Assemble a privately financed Nigerian video feature", player_task: "Keep Ogunjiofor's originating/producing role, Nnebue's financing/marketing role and Obi Rapu's directing role distinct; use the cited budget only as a historical estimate." },
                { id: "choose_video_infrastructure", label: "Choose video under severe celluloid-cost constraints", player_task: "Use the documented Super VHS decision as an industrial response to cost and access; leave unsupported camera, lens, lighting and tape-stock details unset." },
                { id: "produce_with_compact_resources", label: "Produce within the early video-film resource model", player_task: "Treat limited resources as production evidence without inventing exact crew size, schedule or location logistics." },
                { id: "post_and_duplicate", label: "Prepare the feature for home-video circulation", player_task: "Keep editorial work separate from cassette duplication and distribution; do not reverse-engineer undocumented post hardware or sound specifications." },
                { id: "market_and_distribute", label: "Distribute through marketer-led home-video channels", player_task: "Model informal video marketing and straight-to-home circulation as the core release infrastructure rather than assuming a conventional theatrical window." },
                { id: "audience_and_industry_effect", label: "Separate the 1992 case from the later Nollywood boom", player_task: "Use documented market-opening and audience effects as historical consequences while keeping later industry scale downstream from the original production." },
              ],
            },
          ] as const;

          export function mergeNollywoodLivingInBondageExpansion(baseScenarios: readonly HistoricalFilmScenario[]): readonly HistoricalFilmScenario[] {
            const merged = [...baseScenarios];
            let nextPosition = Math.max(0, ...baseScenarios.map((scenario) => scenario.source.position)) + 1;
            for (const definition of nollywoodLivingInBondageExpansionDefinitions) {
              const acceptedTitles = [definition.title, definition.originalTitle].map(normalizeEarlyCinemaTitle);
              const exists = merged.some((scenario) => scenario.id === definition.id || (scenario.film.year === definition.year && [scenario.film.title, scenario.film.original_title].map(normalizeEarlyCinemaTitle).some((title) => acceptedTitles.includes(title))));
              if (exists) continue;
              merged.push({
                id: definition.id,
                status: "manual_nollywood_representation_admission_verified",
                source: { list_id: "manual_nollywood_living_in_bondage_representation_admission_2026", position: nextPosition, imdb_id: definition.sourceId, url: definition.sourceUrl },
                film: { title: definition.title, original_title: definition.originalTitle, year: definition.year, title_type: definition.titleType, runtime_mins: definition.runtimeMins, directors: definition.directors, genres: definition.genres, genre_keys: definition.genres.map((genre) => genre.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "")), imdb_rating: 0, user_rating: 0 },
                scenario_type: definition.scenarioType,
                production_challenge: definition.premise,
                required_choices_seed: definition.requiredChoicesSeed,
                phases: definition.phases,
                learning_goals_seed: definition.learningGoals,
                manual_enrichment_needed: [],
              });
              nextPosition += 1;
            }
            return merged;
          }
          EOF

          cat > src/ui/data/scenarioProductionVerificationLivingInBondage.ts <<'EOF'
          import type { ProductionCaseVerificationRecord } from "./scenarioProductionVerification";

          export const livingInBondageProductionCaseVerification = {
            scenarioId: "scenario_living_in_bondage_1992",
            status: "verified",
            verifiedAt: "2026-09-11",
            summary: "Living in Bondage is verified as a 1992 Nigerian video-film production that supplies the previously absent exact Nollywood industry-system case. Peer-reviewed SAGE research identifies Okechukwu Ogunjiofor as story originator/writer-producer, Kenneth Nnebue as financier, Chris Obi Rapu as director, an approximately 150,000-naira production cost, Super VHS capture and a straight-to-home consumption blueprint. A companion SAGE study explains that high celluloid costs constrained Nigerian production, that Nnebue's videocassette business and prior video-film financing/distribution supplied the required funds, and that the 1992 project emerged from this video-market infrastructure. Jonathan Haynes's Oxford/Chicago scholarship states that Living in Bondage opened the market for Nigerian video films and that its collaborators embodied the new industry's informal-sector and West African marketing base. UNESCO's African film-industry report places the film in the early-1990s collapse of viable celluloid production and theatrical access, records that it was shot on video and distributed through this circuit, and describes the resulting popular low-cost cinema as formative for Nollywood. BFI independently identifies the film as Nollywood's first major success and VHS as the accessible technology of the period. Together the sources establish production scale, financing, video infrastructure, distribution and audience-system evidence while leaving exact camera, lens, lighting, edit, sound, crew, schedule, rights, recoupment and sales quantities unset where not securely established.",
            sources: [
              {
                title: "From Living in Bondage to Queen Amina: An Aesthetic Evaluation of Contemporary Nollywood",
                publisher: "SAGE Open",
                url: "https://journals.sagepub.com/doi/10.1177/21582440211032620",
                sourceKind: "academic_research",
                supports: ["overall", "cinematography"],
                note: "Peer-reviewed research identifies Ogunjiofor, Nnebue and Obi Rapu; reports the approximately 150,000-naira cost, limited-budget and straight-to-home model; and identifies Super VHS capture as the cheaper alternative to declining celluloid production."
              },
              {
                title: "The New Nollywood: Professionalization or Gentrification of Cultural Industry",
                publisher: "SAGE Open",
                url: "https://journals.sagepub.com/doi/full/10.1177/2158244020940994",
                sourceKind: "academic_research",
                supports: ["overall"],
                note: "Peer-reviewed research records video filmmaking as a response to prohibitive celluloid costs and identifies Kenneth Nnebue, a videocassette businessman and prior video-film financier/distributor, as the source of funding for Living in Bondage."
              },
              {
                title: "Living in Bondage: Money and Values",
                publisher: "Oxford Academic / University of Chicago Press",
                url: "https://academic.oup.com/chicago-scholarship-online/book/18664/chapter-abstract/176869060",
                sourceKind: "academic_research",
                supports: ["overall", "screenplay"],
                note: "Jonathan Haynes documents Living in Bondage as opening the Nigerian video-film market and identifies Nnebue as informal-sector marketer, Obi Rapu as television director and Ogunjiofor as writer/producer, tying the production to West African marketing structures."
              },
              {
                title: "The African Film Industry: Trends, Challenges and Opportunities for Growth",
                publisher: "UNESCO",
                url: "https://www.unesco.org/creativity/sites/default/files/medias/fichiers/2023/01/379165eng.pdf",
                sourceKind: "institutional_report",
                supports: ["overall"],
                note: "UNESCO records the economic decline of celluloid production and cinemas, Living in Bondage being shot on video and distributed through the emerging circuit, and the home-video boom that followed."
              },
              {
                title: "Around the world in melodrama: 9 countries, 45 essential films",
                publisher: "British Film Institute",
                url: "https://www.bfi.org.uk/features/around-world-melodrama-9-countries-45-essential-films",
                sourceKind: "film_institute",
                supports: ["overall"],
                note: "BFI identifies Living in Bondage as Nollywood's first major success, links the early boom to low-budget production and records VHS as the accessible distribution technology of the period."
              }
            ]
          } as const satisfies ProductionCaseVerificationRecord;
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"Expected exactly one occurrence in {path}: {old[:80]!r}; found {s.count(old)}")
              p.write_text(s.replace(old, new, 1))

          # Runtime Atlas: append the representation admission after all existing balancing merges.
          p = Path('src/ui/data/filmScenarios.ts')
          s = p.read_text()
          anchor = 'import seedData from "../../../data/film/scenarios/film_scenarios_seed.json";\n'
          if anchor not in s: raise SystemExit('filmScenarios import anchor missing')
          s = s.replace(anchor, anchor + 'import { mergeNollywoodLivingInBondageExpansion } from "../../core/nollywoodLivingInBondageExpansion.js";\n', 1)
          old = 'const mergedScenarios = mergeItalyFranceGermanyBeneluxExpansion(easternIberianBritishScenarios);'
          new = old + '\nconst representationClosureScenarios = mergeNollywoodLivingInBondageExpansion(mergedScenarios);'
          if s.count(old) != 1: raise SystemExit('mergedScenarios anchor drifted')
          s = s.replace(old, new, 1)
          marker = '+manual_italy_france_germany_benelux_expansion_2026`,'
          if s.count(marker) != 1: raise SystemExit('source-list tail anchor drifted')
          s = s.replace(marker, '+manual_italy_france_germany_benelux_expansion_2026+manual_nollywood_living_in_bondage_representation_admission_2026`,', 1)
          if s.count('scenario_count: mergedScenarios.length') != 1 or s.count('scenarios: mergedScenarios') != 1: raise SystemExit('scenario output anchors drifted')
          s = s.replace('scenario_count: mergedScenarios.length', 'scenario_count: representationClosureScenarios.length', 1)
          s = s.replace('scenarios: mergedScenarios', 'scenarios: representationClosureScenarios', 1)
          p.write_text(s)

          # ProductionVerification source kinds: do not misclassify academic or UNESCO evidence.
          replace_once('src/ui/data/scenarioProductionVerification.ts',
              'readonly sourceKind: "filmmaker_interview" | "trade_feature" | "film_institute" | "archive_feature" | "manufacturer_case_study";',
              'readonly sourceKind: "filmmaker_interview" | "trade_feature" | "film_institute" | "archive_feature" | "manufacturer_case_study" | "academic_research" | "institutional_report";')

          # Runtime PV registry.
          p = Path('src/ui/data/scenarioProductionVerificationRegistry.ts')
          s = p.read_text()
          import_anchor = 'import { shiriProductionCaseVerification } from "./scenarioProductionVerificationShiri";'
          if s.count(import_anchor) != 1: raise SystemExit('PV registry import anchor drifted')
          s = s.replace(import_anchor, import_anchor + '\nimport { livingInBondageProductionCaseVerification } from "./scenarioProductionVerificationLivingInBondage";', 1)
          record_anchor = '  shiriProductionCaseVerification,'
          if s.count(record_anchor) != 1: raise SystemExit('PV registry record anchor drifted')
          s = s.replace(record_anchor, record_anchor + '\n  livingInBondageProductionCaseVerification,', 1)
          p.write_text(s)

          # Representation audit deliberately graduates from frozen 613/open to 614/closed.
          p = Path('scripts/film-history-representation-coverage-audit-v1.mjs')
          s = p.read_text()
          replacements = {
              'const EXPECTED_CORE = 613;': 'const EXPECTED_CORE = 614;',
              'assert(contract.status === "OPEN_GAPS_FAIL_CLOSED", "v1 must remain OPEN_GAPS_FAIL_CLOSED until the closure contract is deliberately revised");': 'assert(contract.status === "REPRESENTATIONALLY_AUDITED", "representation coverage contract must be deliberately closed after all P0 gaps and exact scenario reviews are complete");',
              'assert(contract.baseline?.expected_production_verified_core_scenarios === EXPECTED_CORE, "613-scenario core invariant changed");': 'assert(contract.baseline?.expected_production_verified_core_scenarios === EXPECTED_CORE, "614-scenario audited core invariant changed");',
              'assert(contract.closure_contract?.selection_may_be_called_representationally_audited === false, "open v1 audit may not claim representational closure");': 'assert(contract.closure_contract?.selection_may_be_called_representationally_audited === true, "closed representation audit must explicitly permit the representationally-audited claim");',
              '"review_every_one_of_the_613_exact_production_verified_atlas_scenario_ids",': '"review_every_one_of_the_614_exact_production_verified_atlas_scenario_ids",',
              'assert(representationalClosure === false, "v1 unexpectedly reached closure; revise the closure contract deliberately instead of silently flipping state");': 'assert(representationalClosure === true, "representation audit may close only with every exact scenario reviewed and every P0 development at status 2 or 3");',
              'status: "PASS_FAIL_CLOSED",': 'status: "PASS_REPRESENTATIONALLY_AUDITED",',
          }
          for old, new in replacements.items():
              if s.count(old) != 1: raise SystemExit(f'representation audit anchor drifted: {old[:70]} count={s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Chapter 18 historical closure remains 539; global PV census moves to 614 after this post-Chapter-19 admission.
          replace_once('scripts/film-history-chapter-eighteen-completion-audit.mjs',
              'invariant(verificationIds.size === 613, `Global Production Verification registry must contain exactly 613 unique scenarioIds after The Little Sister Chapter 19 materialization: ${verificationIds.size}`);',
              'invariant(verificationIds.size === 614, `Global Production Verification registry must contain exactly 614 unique scenarioIds after the post-Chapter-19 Nollywood representation admission: ${verificationIds.size}`);')

          # Coverage contract and exact mapping.
          p = Path('data/film/film_history_representation_coverage_v1.json')
          c = json.loads(p.read_text())
          if c.get('status') != 'OPEN_GAPS_FAIL_CLOSED': raise SystemExit('coverage status baseline drifted')
          if c['baseline'].get('expected_production_verified_core_scenarios') != 613: raise SystemExit('coverage core baseline drifted')
          if len(c.get('scenario_reviews', [])) != 613: raise SystemExit(f"expected 613 existing reviews, got {len(c.get('scenario_reviews', []))}")
          row = next((r for r in c['development_matrix'] if r.get('development_id') == 'nigeria_nollywood_industry_system'), None)
          if not row or row.get('declared_status') != 0 or row.get('priority') != 'P0': raise SystemExit('Nollywood row baseline drifted')
          c['audited_at'] = '2026-09-11'
          c['status'] = 'REPRESENTATIONALLY_AUDITED'
          c['baseline']['expected_production_verified_core_scenarios'] = 614
          c['baseline']['post_freeze_admission'] = {
              'scenario_id': 'scenario_living_in_bondage_1992',
              'reason': 'closes_status_0_to_at_least_2',
              'development_id': 'nigeria_nollywood_industry_system',
              'prior_exact_core_search': '613 reviewed production-verified scenarios; zero Nigeria/Nollywood/Lagos matches',
              'in_place_enrichment_sufficient': False,
          }
          row['declared_status'] = 2
          row['coverage_basis'] = 'Living in Bondage (1992) supplies the previously absent exact Nigerian/Nollywood production case: source-bound private/informal financing, low-cost Super VHS production, marketer-led straight-to-home-video circulation and domestic audience infrastructure. One exact case supports status 2; status 3 is not claimed without a complementary second production system.'
          cc = c.get('closure_contract', {})
          if cc.get('selection_may_be_called_representationally_audited') is not False: raise SystemExit('closure claim baseline drifted')
          cc['selection_may_be_called_representationally_audited'] = True
          req = cc.get('required_to_close', [])
          old_req = 'review_every_one_of_the_613_exact_production_verified_atlas_scenario_ids'
          if old_req not in req: raise SystemExit('closure review requirement drifted')
          cc['required_to_close'] = ['review_every_one_of_the_614_exact_production_verified_atlas_scenario_ids' if x == old_req else x for x in req]
          cc['closure_evidence'] = {
              'exact_reviewed_scenarios': 614,
              'unreviewed_scenarios': 0,
              'open_p0_developments': 0,
              'admission_that_closed_final_p0': 'scenario_living_in_bondage_1992',
          }
          c['closure_contract'] = cc
          if any(r.get('scenario_id') == 'scenario_living_in_bondage_1992' for r in c['scenario_reviews']): raise SystemExit('Living in Bondage review already exists')
          c['scenario_reviews'].append({
              'scenario_id': 'scenario_living_in_bondage_1992',
              'review_state': 'MAPPED',
              'development_ids': ['nigeria_nollywood_industry_system'],
              'evidence_paths': ['src/ui/data/scenarioProductionVerificationLivingInBondage.ts'],
              'rationale': 'The admitted ProductionVerification directly documents a Nigerian video-film production system through Kenneth Nnebue financing/marketing, an approximately 150,000-naira low-cost production, Super VHS capture, straight-to-home-video distribution and the audience/market infrastructure that opened the Nollywood video-film economy. The admission closes a documented P0 status-0 gap after all prior 613 exact scenarios were reviewed and none could be enriched into a Nigeria/Nollywood case.'
          })
          p.write_text(json.dumps(c, ensure_ascii=False, indent=2) + '\n')
          PY

          node scripts/film-history-representation-coverage-audit-v1.mjs --write=.tmp/representation-closure.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('.tmp/representation-closure.json', 'utf8'));
          if (r.status !== 'PASS_REPRESENTATIONALLY_AUDITED') throw new Error(`Unexpected status ${r.status}`);
          if (r.core.expected !== 614 || r.core.runtimeAtlasScenarios !== 614 || r.core.uniqueProductionVerificationIds !== 614 || !r.core.exactSetEquality) throw new Error('614/614 core not exact');
          if (r.mapping.reviewedScenarioIds !== 614 || r.mapping.mappedScenarioIds !== 233 || r.mapping.reviewedNoMappingScenarioIds !== 381 || r.mapping.unmappedScenarioIds !== 0) throw new Error(`Unexpected closure mapping ${JSON.stringify(r.mapping)}`);
          if (r.coverage.p0OpenRows !== 0 || r.representationalClosure !== true) throw new Error(`Representation closure not achieved ${JSON.stringify(r.coverage)}`);
          console.log(JSON.stringify(r, null, 2));
          NODE

          npm run verify:v0.1

      - name: Commit only verified permanent admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/nollywood-representation-admission.yml
          git add \
            src/core/nollywoodLivingInBondageExpansion.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioProductionVerification.ts \
            src/ui/data/scenarioProductionVerificationLivingInBondage.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts \
            scripts/film-history-representation-coverage-audit-v1.mjs \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            data/film/film_history_representation_coverage_v1.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m 'Close film-history representation audit with Nollywood admission [nollywood materialized]'
          git push origin HEAD:agent/nollywood-representation-admission-run-20260911
