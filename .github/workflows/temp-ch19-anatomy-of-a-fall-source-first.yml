name: TEMP Chapter 19 Anatomy of a Fall source-first

on:
  push:
    branches:
      - agent/ch19-anatomy-of-a-fall-production-case
    paths:
      - .github/workflows/temp-ch19-anatomy-of-a-fall-source-first.yml
      - src/core/chapterNineteenAnatomyOfAFallExpansion.ts
      - src/core/chapterNineteenAnatomyOfAFallExpansion.test.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenAnatomyOfAFall.ts
      - src/ui/data/scenarioProductionVerificationAnatomyOfAFall.ts

permissions:
  contents: read

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict Anatomy of a Fall contract
        run: node --test dist/core/chapterNineteenAnatomyOfAFallExpansion.test.js

      - name: Build UI
        run: npm run build:ui
