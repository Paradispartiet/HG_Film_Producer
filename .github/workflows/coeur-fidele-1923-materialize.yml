name: Materialize Coeur fidele 1923 production case

on:
  push:
    branches:
      - agent/coeur-fidele-1923
    paths:
      - .github/workflows/coeur-fidele-1923-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coeur-fidele-1923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate Coeur fidele into Atlas
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Runtime scenario chain.
          replace_once(
              'src/ui/data/filmScenarios.ts',
              'import { mergeChapterSevenWeimarExpansion } from "../../core/chapterSevenWeimarExpansion.js";\n',
              'import { mergeChapterSevenWeimarExpansion } from "../../core/chapterSevenWeimarExpansion.js";\nimport { mergeChapterEightFrenchAvantGardeExpansion } from "../../core/chapterEightFrenchAvantGardeExpansion.js";\n',
          )
          replace_once(
              'src/ui/data/filmScenarios.ts',
              'const chapterSevenWeimarScenarios = mergeChapterSevenWeimarExpansion(chapterSixHollywoodScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSevenWeimarScenarios);',
              'const chapterSevenWeimarScenarios = mergeChapterSevenWeimarExpansion(chapterSixHollywoodScenarios);\nconst chapterEightFrenchAvantGardeScenarios = mergeChapterEightFrenchAvantGardeExpansion(chapterSevenWeimarScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterEightFrenchAvantGardeScenarios);',
          )
          replace_once(
              'src/ui/data/filmScenarios.ts',
              '+manual_chapter_seven_weimar_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_seven_weimar_expansion_2026+manual_chapter_eight_french_avant_garde_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
          )
          replace_once(
              'src/ui/data/filmScenarios.ts',
              'Chapter 7 Weimar-cinema expansion, modern independent/Asian/prize-cinema expansion',
              'Chapter 7 Weimar-cinema expansion, Chapter 8 French avant-garde expansion, modern independent/Asian/prize-cinema expansion',
          )

          # Film Study runtime registration.
          replace_once(
              'src/ui/data/scenarioFilmStudyMap.ts',
              'import { pandorasBoxFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsPandorasBox";\n',
              'import { pandorasBoxFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsPandorasBox";\nimport { coeurFideleFilmHistoryProfile } from "./scenarioFilmStudyFrenchAvantGardeCoeurFidele";\n',
          )
          replace_once(
              'src/ui/data/scenarioFilmStudyMap.ts',
              '  [pandorasBoxFilmHistoryProfile.scenarioId]: pandorasBoxFilmHistoryProfile,\n',
              '  [pandorasBoxFilmHistoryProfile.scenarioId]: pandorasBoxFilmHistoryProfile,\n  [coeurFideleFilmHistoryProfile.scenarioId]: coeurFideleFilmHistoryProfile,\n',
          )

          # Production Verification registry.
          replace_once(
              'src/ui/data/scenarioProductionVerificationRegistry.ts',
              'import { pandorasBoxProductionCaseVerification } from "./scenarioProductionVerificationPandorasBox";\n',
              'import { pandorasBoxProductionCaseVerification } from "./scenarioProductionVerificationPandorasBox";\nimport { coeurFideleProductionCaseVerification } from "./scenarioProductionVerificationCoeurFidele";\n',
          )
          replace_once(
              'src/ui/data/scenarioProductionVerificationRegistry.ts',
              '  pandorasBoxProductionCaseVerification,\n',
              '  pandorasBoxProductionCaseVerification,\n  coeurFideleProductionCaseVerification,\n',
          )

          # Chapter 8 audit owns the new expansion and gap-state transition.
          replace_once('scripts/film-history-chapter-eight-atlas-audit.mjs', 'const EXPECTED_ATLAS_COUNT = 405;', 'const EXPECTED_ATLAS_COUNT = 406;')
          replace_once(
              'scripts/film-history-chapter-eight-atlas-audit.mjs',
              '  "chapterSevenWeimarExpansion.ts",\n  "modernCanonExpansion.ts",',
              '  "chapterSevenWeimarExpansion.ts",\n  "chapterEightFrenchAvantGardeExpansion.ts",\n  "modernCanonExpansion.ts",',
          )
          replace_once(
              'scripts/film-history-chapter-eight-atlas-audit.mjs',
              '  USE_EXISTING: ["The Passion of Joan of Arc"],\n  P0: ["Cœur fidèle", "Napoléon", "Un Chien Andalou"],',
              '  USE_EXISTING: ["Cœur fidèle", "The Passion of Joan of Arc"],\n  P0: ["Napoléon", "Un Chien Andalou"],',
          )

          # Global production-case integrity.
          replace_once('scripts/production-case-rest-audit.mjs', 'const EXPECTED_PLAYABLE_SCENARIOS = 405;', 'const EXPECTED_PLAYABLE_SCENARIOS = 406;')
          replace_once('scripts/production-case-rest-audit.mjs', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 405;', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 406;')
          replace_once(
              'scripts/production-case-rest-audit.mjs',
              '  "chapterSevenWeimarExpansion.ts",\n  "modernCanonExpansion.ts",',
              '  "chapterSevenWeimarExpansion.ts",\n  "chapterEightFrenchAvantGardeExpansion.ts",\n  "modernCanonExpansion.ts",',
          )

          # Permanent Chapter 8 matrix contract follows the materialized state.
          p = Path('src/core/filmHistoryChapterEightAuditContract.test.ts')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ('assert.match(audit, /const EXPECTED_ATLAS_COUNT = 405;/);', 'assert.match(audit, /const EXPECTED_ATLAS_COUNT = 406;/);'),
              ('assert.match(audit, /USE_EXISTING: \\["The Passion of Joan of Arc"\\]/);', 'assert.match(audit, /USE_EXISTING: \\["Cœur fidèle", "The Passion of Joan of Arc"\\]/);'),
              ('assert.match(audit, /P0: \\["Cœur fidèle", "Napoléon", "Un Chien Andalou"\\]/);', 'assert.match(audit, /P0: \\["Napoléon", "Un Chien Andalou"\\]/);'),
              ('assert.deepEqual(resolved.byDecision.USE_EXISTING, ["The Passion of Joan of Arc"]);', 'assert.deepEqual(resolved.byDecision.USE_EXISTING, ["The Passion of Joan of Arc", "Cœur fidèle"]);'),
              ('assert.deepEqual(resolved.byDecision.P0, ["Cœur fidèle", "Napoléon", "Un Chien Andalou"]);', 'assert.deepEqual(resolved.byDecision.P0, ["Napoléon", "Un Chien Andalou"]);'),
              ('assert.deepEqual(resolved.recommendedNewProductionCases, ["Cœur fidèle", "Napoléon", "Un Chien Andalou", "The Smiling Madame Beudet", "Entr\'acte"]);', 'assert.deepEqual(resolved.recommendedNewProductionCases, ["Napoléon", "Un Chien Andalou", "The Smiling Madame Beudet", "Entr\'acte"]);'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Chapter 8 contract marker mismatch {count}: {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Full v0.1 verification
        run: npm run verify:v0.1
      - name: Commit verified Coeur fidele materialization and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/coeur-fidele-1923-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Coeur fidele 1923 production case"
          git push origin HEAD:agent/coeur-fidele-1923
