name: Archive obsolete helper repositories

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-obsolete-helper-repos.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - name: Archive helper repositories
        id: archive
        shell: bash
        run: |
          set -u
          if [[ -z "${ADMIN_TOKEN:-}" ]]; then
            echo 'result=token_missing' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          failed=0
          repos=(
            Paradispartiet/HG_Film_Producer-preview
            Paradispartiet/HistoryGo-FootballManager-preview
            Paradispartiet/History-Go-preview
            Paradispartiet/Paradispartiet.github.io
          )
          for repo in "${repos[@]}"; do
            code="$(curl --silent --output /tmp/body --write-out '%{http_code}' \
              --request PATCH \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${ADMIN_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${repo}" \
              --data '{"archived":true,"description":"Retired temporary infrastructure; no longer used."}')"
            echo "${repo} -> ${code}"
            [[ "$code" == '200' ]] || failed=1
          done
          if [[ "$failed" == 0 ]]; then echo 'result=archived' >> "$GITHUB_OUTPUT"; else echo 'result=partial_failure' >> "$GITHUB_OUTPUT"; fi
      - name: Record result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.archive.outputs.result }}
        run: |
          set -euo pipefail
          printf 'helper_repos=%s\nrun_id=%s\n' "${RESULT:-unknown}" "$GITHUB_RUN_ID" > /tmp/result
          encoded="$(base64 -w0 /tmp/result)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.helper-repo-archive-result.txt" -f message="Record helper repo archive ${GITHUB_RUN_ID}" -f content="$encoded" -f branch=main >/dev/null
