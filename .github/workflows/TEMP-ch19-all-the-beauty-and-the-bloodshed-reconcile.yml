name: TEMP Beauty source-area inspection

on:
  push:
    branches:
      - agent/ch19-all-the-beauty-and-the-bloodshed-production-case

permissions:
  contents: write

concurrency:
  group: temp-ch19-all-the-beauty-and-the-bloodshed-reconcile
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect exact Beauty payload and existing profile
        shell: bash
        run: |
          set -euxo pipefail
          printf '\n=== TEMP generated Film Study payload ===\n'
          sed -n '45,120p' scripts/TEMP-ch19-all-the-beauty-and-the-bloodshed-reconcile.mjs
          printf '\n=== Existing Body Archive Beauty profile ===\n'
          sed -n '1,260p' src/ui/data/scenarioFilmStudyBodyArchiveAllBeauty.ts
          printf '\n=== Happening Chapter 19 profile area shape ===\n'
          sed -n '1,180p' src/ui/data/scenarioFilmStudyChapterNineteenHappening.ts
