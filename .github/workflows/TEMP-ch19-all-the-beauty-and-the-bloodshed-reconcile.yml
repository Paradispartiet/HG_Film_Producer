name: TEMP Beauty in-place reconciliation fail-closed

on:
  push:
    branches:
      - agent/ch19-all-the-beauty-and-the-bloodshed-production-case

permissions:
  contents: write

concurrency:
  group: temp-ch19-all-the-beauty-and-the-bloodshed-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Correct TEMP materializer for in-place Beauty enrichment
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/TEMP-ch19-all-the-beauty-and-the-bloodshed-reconcile.mjs')
          s = p.read_text()

          old_profile = 'src/ui/data/scenarioFilmStudyChapterNineteenAllTheBeautyAndTheBloodshed.ts'
          existing_profile = 'src/ui/data/scenarioFilmStudyBodyArchiveAllBeauty.ts'
          if s.count(old_profile) != 1:
              raise SystemExit(f'Expected one generated Beauty profile path, found {s.count(old_profile)}')
          s = s.replace(old_profile, existing_profile)

          map_start = 'insertAfterLineContaining(\n  "src/ui/data/scenarioFilmStudyMap.ts",'
          if s.count(map_start) != 1:
              raise SystemExit(f'Expected one Beauty map insertion block, found {s.count(map_start)}')
          start = s.index(map_start)
          end_marker = 'const pvReplacement ='
          end = s.index(end_marker, start)
          s = s[:start] + s[end:]

          old_literal = 'if (uniquePvIds.size !== 591) throw new Error(`Expected 591 unique literal PV IDs, got ${uniquePvIds.size}`);'
          new_literal = 'if (uniquePvIds.size !== 583) throw new Error(`Expected 583 directly literal PV IDs in the batch scan, got ${uniquePvIds.size}`);'
          if s.count(old_literal) != 1:
              raise SystemExit('TEMP literal-PV assertion anchor drifted')
          s = s.replace(old_literal, new_literal)

          old_output = 'productionVerificationIds: uniquePvIds.size'
          if s.count(old_output) != 1:
              raise SystemExit('TEMP PV output anchor drifted')
          s = s.replace(old_output, 'productionVerificationIds: resolved.verificationIndex.literalVerifiedScenarioIds')

          if 'scenarioFilmStudyChapterNineteenAllTheBeautyAndTheBloodshed' in s:
              raise SystemExit('Duplicate Beauty Film Study path/reference remains after patch')
          if s.count('scenario_all_the_beauty_and_the_bloodshed_2022') < 4:
              raise SystemExit('Beauty identity anchors unexpectedly disappeared')

          p.write_text(s)
          PY

      - name: Materialize corrected Beauty reconciliation
        run: node scripts/TEMP-ch19-all-the-beauty-and-the-bloodshed-reconcile.mjs

      - name: Full fail-closed verification
        shell: bash
        run: |
          set -euxo pipefail
          npm run verify:v0.1

      - name: Assert permanent-only result
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e scripts/TEMP-ch19-all-the-beauty-and-the-bloodshed-reconcile.mjs
          test ! -e .github/workflows/TEMP-ch19-all-the-beauty-and-the-bloodshed-reconcile.yml
          test -f src/ui/data/scenarioFilmStudyBodyArchiveAllBeauty.ts
          test ! -e src/ui/data/scenarioFilmStudyChapterNineteenAllTheBeautyAndTheBloodshed.ts
          test -f docs/film-history-chapter-nineteen-atlas-resolved.json
          grep -q 'scenario_all_the_beauty_and_the_bloodshed_2022' src/ui/data/scenarioFilmStudyBodyArchiveAllBeauty.ts
          git diff --check

      - name: Commit permanent Beauty reconciliation only
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Reconcile All the Beauty and the Bloodshed in Chapter 19"
          git push origin HEAD:${GITHUB_REF_NAME}
