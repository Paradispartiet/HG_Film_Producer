name: TEMP Beauty documentary contract inspection

on:
  push:
    branches:
      - agent/ch19-all-the-beauty-and-the-bloodshed-production-case

permissions:
  contents: write

concurrency:
  group: temp-ch19-all-the-beauty-and-the-bloodshed-reconcile
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect documentary audit contract and Beauty registration
        shell: bash
        run: |
          set -euxo pipefail
          grep -n -C 16 -E 'documentary|constraints|productionSourceAreas' scripts/production-case-rest-audit.mjs || true
          printf '\n=== Existing Beauty profile references ===\n'
          grep -R -n -C 3 'scenario_all_the_beauty_and_the_bloodshed_2022\|allTheBeautyAndTheBloodshedFilmHistoryProfile\|scenarioFilmStudyBodyArchiveAllBeauty' src/ui/data scripts || true
          printf '\n=== Green documentary profiles with documentary constraints ===\n'
          grep -R -n -C 8 -E 'documentaryConstraints|constraints:' src/ui/data/scenarioFilmStudy*.ts | head -n 260 || true
