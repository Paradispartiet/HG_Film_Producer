# retrigger after exact Flee core-test assertion correction
name: TEMP Chapter 19 Flee finalize

on:
  push:
    branches:
      - agent/ch19-flee-production-case
    paths:
      - .github/workflows/TEMP-ch19-flee-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-flee-production-case
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exact Flee integration patch
        run: |
          node - <<'NODE'
          const fs = require('fs');

          function replaceExact(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`${file}: missing exact anchor: ${before.slice(0, 220)}`);
            const next = source.replace(before, after);
            if (next === source) throw new Error(`${file}: replacement produced no change`);
            fs.writeFileSync(file, next);
          }

          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'import { mergeChapterNineteenDuneExpansion } from "../../core/chapterNineteenDuneExpansion.js";\n',
            'import { mergeChapterNineteenDuneExpansion } from "../../core/chapterNineteenDuneExpansion.js";\nimport { mergeChapterNineteenFleeExpansion } from "../../core/chapterNineteenFleeExpansion.js";\n',
          );
          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'const chapterNineteenDuneScenarios = mergeChapterNineteenDuneExpansion(chapterNineteenWolfwalkersScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenDuneScenarios);',
            'const chapterNineteenDuneScenarios = mergeChapterNineteenDuneExpansion(chapterNineteenWolfwalkersScenarios);\nconst chapterNineteenFleeScenarios = mergeChapterNineteenFleeExpansion(chapterNineteenDuneScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenFleeScenarios);',
          );
          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'manual_chapter_nineteen_wolfwalkers_expansion_2026+manual_chapter_nineteen_dune_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
            'manual_chapter_nineteen_wolfwalkers_expansion_2026+manual_chapter_nineteen_dune_expansion_2026+manual_chapter_nineteen_flee_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
          );

          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            'import { duneProductionCaseVerification } from "./scenarioProductionVerificationDune";\n',
            'import { duneProductionCaseVerification } from "./scenarioProductionVerificationDune";\nimport { fleeProductionCaseVerification } from "./scenarioProductionVerificationFlee";\n',
          );
          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            '  wolfwalkersProductionCaseVerification,\n  duneProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
            '  wolfwalkersProductionCaseVerification,\n  duneProductionCaseVerification,\n  fleeProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
          );

          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            'import { duneFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenDune";\n',
            'import { duneFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenDune";\nimport { fleeFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenFlee";\n',
          );
          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            '  [duneFilmHistoryProfile.scenarioId]: duneFilmHistoryProfile,\n  scenario_the_machinist_2004:',
            '  [duneFilmHistoryProfile.scenarioId]: duneFilmHistoryProfile,\n  [fleeFilmHistoryProfile.scenarioId]: fleeFilmHistoryProfile,\n  scenario_the_machinist_2004:',
          );

          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            'const EXPECTED_PLAYABLE_SCENARIOS = 543;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 543;',
            'const EXPECTED_PLAYABLE_SCENARIOS = 544;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 544;',
          );
          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            '  "chapterNineteenDuneExpansion.ts",\n  "modernCanonExpansion.ts",',
            '  "chapterNineteenDuneExpansion.ts",\n  "chapterNineteenFleeExpansion.ts",\n  "modernCanonExpansion.ts",',
          );

          replaceExact(
            'scripts/film-history-chapter-nineteen-atlas-audit.mjs',
            'const EXPECTED_ATLAS_COUNT = 543;',
            'const EXPECTED_ATLAS_COUNT = 544;',
          );

          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  "The Disciple",\n  "Dune",\n  "The Worst Person in the World",',
            '  "The Disciple",\n  "Dune",\n  "Flee",\n  "The Worst Person in the World",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            'const exactP0Queue = [\n  "Flee",\n  "Avatar: The Way of Water",',
            'const exactP0Queue = [\n  "Avatar: The Way of Water",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 543;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 543);\n  assert.equal(resolved.atlas.actualCount, 543);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 543);',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 544;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 544);\n  assert.equal(resolved.atlas.actualCount, 544);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 544);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(exactUseExisting.length, 11);\n  assert.equal(exactP0Queue.length, 18);',
            '  assert.equal(exactUseExisting.length, 12);\n  assert.equal(exactP0Queue.length, 17);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 45);',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 44);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(dune.productionVerified, true);\n\n  for (const candidate of resolved.candidates) {',
            '  assert.equal(dune.productionVerified, true);\n\n  const flee = resolved.candidates.find((candidate) => candidate.title === "Flee");\n  assert.ok(flee);\n  assert.equal(flee.decision, "USE_EXISTING");\n  assert.equal(flee.scenarioId, "scenario_flee_2021");\n  assert.equal(flee.matches, 1);\n  assert.equal(flee.productionVerified, true);\n\n  for (const candidate of resolved.candidates) {',
          );

          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(verificationIds.size === 543, `Global Production Verification registry must contain exactly 543 unique scenarioIds after the fourth Chapter 19 case: ${verificationIds.size}`);',
            'invariant(verificationIds.size === 544, `Global Production Verification registry must contain exactly 544 unique scenarioIds after the fifth Chapter 19 case: ${verificationIds.size}`);',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 543, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 543.");',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 544, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 544.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 11 && chapter19.byDecision?.P0?.length === 18 && chapter19.byDecision?.P1?.length === 27 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 11 USE_EXISTING / 18 P0 / 27 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 12 && chapter19.byDecision?.P0?.length === 17 && chapter19.byDecision?.P1?.length === 27 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 12 USE_EXISTING / 17 P0 / 27 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'const dune = chapter19.candidates.find((candidate) => candidate.title === "Dune");\ninvariant(dune?.decision === "USE_EXISTING" && dune?.scenarioId === "scenario_dune_2021" && dune?.matches === 1 && dune?.productionVerified === true, "Dune is not closed as the fourth production-verified Chapter 19 USE_EXISTING case.");',
            'const dune = chapter19.candidates.find((candidate) => candidate.title === "Dune");\ninvariant(dune?.decision === "USE_EXISTING" && dune?.scenarioId === "scenario_dune_2021" && dune?.matches === 1 && dune?.productionVerified === true, "Dune is not closed as the fourth production-verified Chapter 19 USE_EXISTING case.");\nconst flee = chapter19.candidates.find((candidate) => candidate.title === "Flee");\ninvariant(flee?.decision === "USE_EXISTING" && flee?.scenarioId === "scenario_flee_2021" && flee?.matches === 1 && flee?.productionVerified === true, "Flee is not closed as the fifth production-verified Chapter 19 USE_EXISTING case.");',
          );
          NODE

      - name: Generate canonical Chapter 19 snapshot
        run: |
          node scripts/film-history-chapter-nineteen-atlas-audit.mjs > /tmp/ch19-flee.json
          cp /tmp/ch19-flee.json docs/film-history-chapter-nineteen-atlas-resolved.json

      - name: Assert Flee transition
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const flee = data.candidates.find((candidate) => candidate.title === 'Flee');
          const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
          const expectedUseExisting = ['Tenet','Soul','Quo Vadis, Aida?','Another Round','Never Rarely Sometimes Always','Wolfwalkers','The Disciple','Dune','Flee','The Worst Person in the World','Nickel Boys','Dahomey'];
          if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 544 || data.atlas.actualCount !== 544) throw new Error(JSON.stringify(data.atlas));
          if (data.verificationIndex.literalVerifiedScenarioIds !== 544) throw new Error(JSON.stringify(data.verificationIndex));
          if (!flee || flee.decision !== 'USE_EXISTING' || flee.scenarioId !== 'scenario_flee_2021' || flee.matches !== 1 || flee.productionVerified !== true) throw new Error(JSON.stringify(flee));
          if (counts.USE_EXISTING !== 12 || counts.P0 !== 17 || counts.P1 !== 27 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(JSON.stringify(counts));
          if (JSON.stringify(data.byDecision.USE_EXISTING) !== JSON.stringify(expectedUseExisting)) throw new Error(`USE_EXISTING order drift: ${JSON.stringify(data.byDecision.USE_EXISTING)}`);
          NODE

      - name: Remove TEMP surfaces from verification working tree
        run: |
          rm -f .github/workflows/TEMP-ch19-flee-*.yml
          rm -f TEMP-flee-*.txt TEMP-flee-*.log

      - name: Install dependencies
        run: npm ci

      - name: Verify preflight
        run: npm run preflight:v0.1

      - name: Verify production cases
        run: npm run audit:production-cases

      - name: Verify Film History chapter 1
        run: npm run audit:film-history-ch1

      - name: Verify Film History chapter 2
        run: npm run audit:film-history-ch2

      - name: Verify Film History chapter 3
        run: npm run audit:film-history-ch3

      - name: Verify Film History chapter 4
        run: npm run audit:film-history-ch4

      - name: Verify Film History chapter 5
        run: npm run audit:film-history-ch5

      - name: Verify Film History chapter 6
        run: npm run audit:film-history-ch6

      - name: Verify Film History chapter 7
        run: npm run audit:film-history-ch7

      - name: Verify Film History chapter 8
        run: npm run audit:film-history-ch8

      - name: Verify Film History chapter 9
        run: npm run audit:film-history-ch9

      - name: Verify Film History chapter 10
        run: npm run audit:film-history-ch10

      - name: Verify Film History chapter 11
        run: npm run audit:film-history-ch11

      - name: Verify Film History chapter 12
        run: npm run audit:film-history-ch12

      - name: Verify Film History chapter 13
        run: npm run audit:film-history-ch13

      - name: Verify Film History chapter 14
        run: npm run audit:film-history-ch14

      - name: Verify Film History chapter 15
        run: npm run audit:film-history-ch15

      - name: Verify Film History chapter 16
        run: npm run audit:film-history-ch16

      - name: Verify Film History chapter 17
        run: npm run audit:film-history-ch17

      - name: Verify Film History chapter 18
        run: npm run audit:film-history-ch18

      - name: Verify typecheck
        run: npm run typecheck

      - name: Verify Chapter 18 completion contract
        run: npm run audit:film-history-ch18-completion

      - name: Verify Chapter 19 audit
        run: npm run audit:film-history-ch19

      - name: Verify core tests with durable diagnostics
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/flee-core-tests.log

      - name: Upload core test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flee-core-tests-${{ github.run_attempt }}
          path: /tmp/flee-core-tests.log
          if-no-files-found: error

      - name: Verify UI build
        run: npm run build:ui

      - name: Full fail-closed v0.1 verification confirmation
        run: npm run verify:v0.1

      - name: Assert Flee snapshot survived full verification
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const flee = data.candidates.find((candidate) => candidate.title === 'Flee');
          const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
          if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 544 || data.atlas.actualCount !== 544 || data.verificationIndex.literalVerifiedScenarioIds !== 544) throw new Error(JSON.stringify({ atlas: data.atlas, verificationIndex: data.verificationIndex }));
          if (!flee || flee.decision !== 'USE_EXISTING' || flee.scenarioId !== 'scenario_flee_2021' || flee.matches !== 1 || flee.productionVerified !== true) throw new Error(JSON.stringify(flee));
          if (counts.USE_EXISTING !== 12 || counts.P0 !== 17 || counts.P1 !== 27 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(JSON.stringify(counts));
          NODE

      - name: Commit permanent materialization after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            scripts/production-case-rest-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            docs/film-history-chapter-nineteen-atlas-resolved.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent Flee materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialize Chapter 19 Flee production case"
          git push origin HEAD:agent/ch19-flee-production-case
