name: TEMP Chapter 18 Atanarjuat integration

on:
  push:
    branches:
      - agent/ch18-atanarjuat-production-case
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch18-atanarjuat-production-case
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Integrate Atanarjuat into Atlas
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const read = (p) => fs.readFileSync(p, 'utf8');
          const write = (p, t) => fs.writeFileSync(p, t);
          function replaceRequired(text, from, to, label) {
            if (text.includes(to)) return text;
            if (!text.includes(from)) throw new Error(`Missing expected pattern for ${label}`);
            return text.replace(from, to);
          }

          {
            const path = 'src/ui/data/filmScenarios.ts';
            let t = read(path);
            t = replaceRequired(
              t,
              'import { mergeChapterEighteenInTheMoodForLoveExpansion } from "../../core/chapterEighteenInTheMoodForLoveExpansion.js";\n',
              'import { mergeChapterEighteenInTheMoodForLoveExpansion } from "../../core/chapterEighteenInTheMoodForLoveExpansion.js";\nimport { mergeChapterEighteenAtanarjuatExpansion } from "../../core/chapterEighteenAtanarjuatExpansion.js";\n',
              'filmScenarios import',
            );
            t = replaceRequired(
              t,
              'const chapterEighteenInTheMoodForLoveScenarios = mergeChapterEighteenInTheMoodForLoveExpansion(chapterEighteenGleanersScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterEighteenInTheMoodForLoveScenarios);',
              'const chapterEighteenInTheMoodForLoveScenarios = mergeChapterEighteenInTheMoodForLoveExpansion(chapterEighteenGleanersScenarios);\nconst chapterEighteenAtanarjuatScenarios = mergeChapterEighteenAtanarjuatExpansion(chapterEighteenInTheMoodForLoveScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterEighteenAtanarjuatScenarios);',
              'filmScenarios merge chain',
            );
            t = replaceRequired(
              t,
              '+manual_chapter_eighteen_in_the_mood_for_love_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_eighteen_in_the_mood_for_love_expansion_2026+manual_chapter_eighteen_atanarjuat_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              'filmScenarios source list',
            );
            t = replaceRequired(
              t,
              'Chapter 18 now begins with the source-first The Gleaners and I and In the Mood for Love production cases, preserving digital/documentary production on one side and transnational photochemical auteur production, cinematography succession, design, editing, music and Cannes deadline pressure on the other as distinct evidence layers.',
              'Chapter 18 now begins with source-first The Gleaners and I, In the Mood for Love and Atanarjuat production cases, spanning small-camera documentary practice, transnational photochemical auteur production and Inuit-controlled community-based Digital Betacam feature production while keeping each production system distinct.',
              'filmScenarios note',
            );
            write(path, t);
          }

          {
            const path = 'src/ui/data/scenarioProductionVerificationRegistry.ts';
            let t = read(path);
            t = replaceRequired(
              t,
              'import { inTheMoodForLoveProductionCaseVerification } from "./scenarioProductionVerificationInTheMoodForLove";\n',
              'import { inTheMoodForLoveProductionCaseVerification } from "./scenarioProductionVerificationInTheMoodForLove";\nimport { atanarjuatProductionCaseVerification } from "./scenarioProductionVerificationAtanarjuat";\n',
              'verification import',
            );
            t = replaceRequired(
              t,
              '  inTheMoodForLoveProductionCaseVerification,\n',
              '  inTheMoodForLoveProductionCaseVerification,\n  atanarjuatProductionCaseVerification,\n',
              'verification entry',
            );
            write(path, t);
          }

          {
            const path = 'src/ui/data/scenarioFilmStudyMap.ts';
            let t = read(path);
            t = replaceRequired(
              t,
              'import { inTheMoodForLoveFilmHistoryProfile } from "./scenarioFilmStudyChapterEighteenInTheMoodForLove";\n',
              'import { inTheMoodForLoveFilmHistoryProfile } from "./scenarioFilmStudyChapterEighteenInTheMoodForLove";\nimport { atanarjuatFilmHistoryProfile } from "./scenarioFilmStudyChapterEighteenAtanarjuat";\n',
              'Film Study import',
            );
            t = replaceRequired(
              t,
              '  [inTheMoodForLoveFilmHistoryProfile.scenarioId]: inTheMoodForLoveFilmHistoryProfile,\n',
              '  [inTheMoodForLoveFilmHistoryProfile.scenarioId]: inTheMoodForLoveFilmHistoryProfile,\n  [atanarjuatFilmHistoryProfile.scenarioId]: atanarjuatFilmHistoryProfile,\n',
              'Film Study entry',
            );
            write(path, t);
          }

          {
            const path = 'scripts/production-case-rest-audit.mjs';
            let t = read(path);
            t = replaceRequired(t, 'const EXPECTED_PLAYABLE_SCENARIOS = 495;', 'const EXPECTED_PLAYABLE_SCENARIOS = 496;', 'playable count');
            t = replaceRequired(t, 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 495;', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 496;', 'verified count');
            t = replaceRequired(
              t,
              '  "chapterEighteenInTheMoodForLoveExpansion.ts",\n',
              '  "chapterEighteenInTheMoodForLoveExpansion.ts",\n  "chapterEighteenAtanarjuatExpansion.ts",\n',
              'production audit expansion list',
            );
            write(path, t);
          }

          const chapters = ['twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen'];
          for (const chapter of chapters) {
            const script = `scripts/film-history-chapter-${chapter}-atlas-audit.mjs`;
            let t = read(script);
            t = replaceRequired(t, 'const EXPECTED_ATLAS_COUNT = 495;', 'const EXPECTED_ATLAS_COUNT = 496;', `${chapter} atlas count`);
            t = replaceRequired(
              t,
              '  "chapterEighteenInTheMoodForLoveExpansion.ts",\n',
              '  "chapterEighteenInTheMoodForLoveExpansion.ts",\n  "chapterEighteenAtanarjuatExpansion.ts",\n',
              `${chapter} expansion list`,
            );
            write(script, t);
          }

          for (const chapter of ['Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen']) {
            const path = `src/core/filmHistoryChapter${chapter}AuditContract.test.ts`;
            let t = read(path).replaceAll('495', '496');
            write(path, t);
          }

          {
            const path = 'src/core/filmHistoryChapterEighteenAuditContract.test.ts';
            let t = read(path);
            t = replaceRequired(
              t,
              '  "The Gleaners and I", "Platform", "Dancer in the Dark", "In the Mood for Love", "The Son\'s Room",',
              '  "The Gleaners and I", "Platform", "Dancer in the Dark", "In the Mood for Love", "Atanarjuat: The Fast Runner", "The Son\'s Room",',
              'Chapter 18 existing queue',
            );
            t = replaceRequired(
              t,
              'const exactP0Queue = [\n  "Atanarjuat: The Fast Runner", "Spirited Away",',
              'const exactP0Queue = [\n  "Spirited Away",',
              'Chapter 18 P0 queue',
            );
            t = replaceRequired(t, 'assert.equal(exactExisting.length, 38);', 'assert.equal(exactExisting.length, 39);', 'existing count');
            t = replaceRequired(t, 'assert.equal(exactP0Queue.length, 20);', 'assert.equal(exactP0Queue.length, 19);', 'P0 count');
            t = replaceRequired(t, 'assert.equal(resolved.recommendedNewProductionCases.length, 43);', 'assert.equal(resolved.recommendedNewProductionCases.length, 42);', 'recommended count');
            write(path, t);
          }

          for (const chapter of chapters) {
            cp.execFileSync('node', [`scripts/film-history-chapter-${chapter}-atlas-audit.mjs`, `--write=docs/film-history-chapter-${chapter}-atlas-resolved.json`], { stdio: 'inherit' });
          }
          cp.execFileSync('node', ['scripts/production-case-rest-audit.mjs'], { stdio: 'inherit' });

          const ch18 = JSON.parse(read('docs/film-history-chapter-eighteen-atlas-resolved.json'));
          if (ch18.atlas.actualCount !== 496 || ch18.verificationIndex.literalVerifiedScenarioIds !== 496) throw new Error('Chapter 18 did not reach 496/496');
          if (!ch18.byDecision.USE_EXISTING.includes('Atanarjuat: The Fast Runner')) throw new Error('Atanarjuat did not move to USE_EXISTING');
          if (ch18.byDecision.P0.includes('Atanarjuat: The Fast Runner')) throw new Error('Atanarjuat remains P0');
          if (ch18.byDecision.USE_EXISTING.length !== 39 || ch18.byDecision.P0.length !== 19 || ch18.byDecision.P1.length !== 23 || ch18.byDecision.P2.length !== 1 || ch18.recommendedNewProductionCases.length !== 42) {
            throw new Error(`Unexpected Chapter 18 queue counts: ${JSON.stringify(ch18.byDecision)}`);
          }
          console.log(JSON.stringify({ atlas: ch18.atlas.actualCount, verified: ch18.verificationIndex.literalVerifiedScenarioIds, useExisting: ch18.byDecision.USE_EXISTING.length, p0: ch18.byDecision.P0.length, p1: ch18.byDecision.P1.length, p2: ch18.byDecision.P2.length, recommended: ch18.recommendedNewProductionCases.length }, null, 2));
          NODE
      - name: Commit deterministic integration
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          git commit -m "Integrate Atanarjuat into Chapter 18 Atlas"
          git push origin HEAD:agent/ch18-atanarjuat-production-case
