name: One-shot remove migration admin secret

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-migration-admin-secret.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove migration admin secret
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          gh secret delete REPO_ADMIN_TOKEN --repo "$GITHUB_REPOSITORY"
      - name: Record success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf 'admin_secret_removed=success\nrun_id=%s\n' "$GITHUB_RUN_ID" > /tmp/status
          encoded="$(base64 -w0 /tmp/status)"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/.admin-secret-cleanup-status.txt" \
            -f message="Record admin secret cleanup ${GITHUB_RUN_ID}" \
            -f content="$encoded" \
            -f branch=main >/dev/null
