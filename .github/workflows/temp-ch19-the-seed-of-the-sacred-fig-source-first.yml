name: TEMP Chapter 19 The Seed of the Sacred Fig source-first

on:
  push:
    branches:
      - agent/ch19-the-seed-of-the-sacred-fig-production-case
    paths:
      - .github/workflows/temp-ch19-the-seed-of-the-sacred-fig-source-first.yml
      - src/core/chapterNineteenTheSeedOfTheSacredFigExpansion.ts
      - src/core/chapterNineteenTheSeedOfTheSacredFigExpansion.test.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenTheSeedOfTheSacredFig.ts
      - src/ui/data/scenarioProductionVerificationTheSeedOfTheSacredFig.ts

permissions:
  contents: read

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict Sacred Fig contract
        run: node --test dist/core/chapterNineteenTheSeedOfTheSacredFigExpansion.test.js

      - name: Build UI
        run: npm run build:ui
