name: TEMP The Pot-au-Feu materialize

on:
  push:
    branches:
      - agent/ch19-the-pot-au-feu-production-case

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Correct TEMP materializer markers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/TEMP-materialize-ch19-the-pot-au-feu.mjs')
          s = p.read_text()

          old = "Apart from a late piano transcription from Massenet's Thaïs, the film avoids a conventional score."
          new = "apart from a late piano transcription from Massenet's Thaïs, the film avoids a conventional score."
          if s.count(old) != 1:
              raise SystemExit('The Pot-au-Feu Film Study cleanup marker drifted; refusing runtime patch')
          s = s.replace(old, new)

          old_concat = "  '${toriAndLokitaCandidate}${holySpiderCandidate}${brokerCandidate}`);',\n  '${toriAndLokitaCandidate}${holySpiderCandidate}${brokerCandidate}${thePotAuFeuCandidate}`);');"
          new_concat = "  '${brokerCandidate}`);',\n  '${brokerCandidate}${thePotAuFeuCandidate}`);');"
          if s.count(old_concat) != 1:
              raise SystemExit('The Pot-au-Feu Chapter 19 concat materializer marker drifted; refusing runtime patch')
          s = s.replace(old_concat, new_concat)

          old_atlas = 'execFileSync(process.execPath, [path.join(root, "scripts/film-history-chapter-nineteen-atlas-audit.mjs")], { cwd: root, stdio: "inherit" });'
          new_atlas = 'execFileSync(process.execPath, [files.chapter19Audit, `--write=${files.chapter19Resolved}`], { cwd: root, stdio: "inherit", maxBuffer: 64 * 1024 * 1024 });'
          if s.count(old_atlas) != 1:
              raise SystemExit('The Pot-au-Feu Atlas audit invocation drifted; refusing runtime patch')
          s = s.replace(old_atlas, new_atlas)

          old_cannes = 'execFileSync(process.execPath, [path.join(root, "scripts/film-history-chapter-nineteen-cannes-major-prizes-audit.mjs")], { cwd: root, stdio: "inherit" });'
          new_cannes = 'execFileSync(process.execPath, ["scripts/film-history-chapter-nineteen-cannes-major-prizes-audit.mjs", `--write=${files.cannesResolved}`], { cwd: root, stdio: "inherit", maxBuffer: 64 * 1024 * 1024 });'
          if s.count(old_cannes) != 1:
              raise SystemExit('The Pot-au-Feu Cannes audit invocation drifted; refusing runtime patch')
          s = s.replace(old_cannes, new_cannes)

          p.write_text(s)
          PY

      - name: Parse TEMP materializer
        run: node --check scripts/TEMP-materialize-ch19-the-pot-au-feu.mjs

      - name: Materialize The Pot-au-Feu
        shell: bash
        run: |
          set -o pipefail
          node scripts/TEMP-materialize-ch19-the-pot-au-feu.mjs 2>&1 | tee the-pot-au-feu-materialize.log

      - name: Stage clean verification tree
        run: |
          rm scripts/TEMP-materialize-ch19-the-pot-au-feu.mjs
          rm .github/workflows/TEMP-ch19-the-pot-au-feu-materialize.yml

      - name: Full v0.1 verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee the-pot-au-feu-verify.log

      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: the-pot-au-feu-verification-diagnostics
          path: |
            the-pot-au-feu-materialize.log
            the-pot-au-feu-verify.log
            docs/film-history-chapter-nineteen-atlas-resolved.json
            docs/film-history-chapter-nineteen-cannes-major-prizes-audit.json
          if-no-files-found: ignore

      - name: Commit clean The Pot-au-Feu case
        if: success()
        run: |
          rm -f the-pot-au-feu-materialize.log the-pot-au-feu-verify.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "Add The Pot-au-Feu Chapter 19 production case"
          git push origin HEAD:agent/ch19-the-pot-au-feu-production-case
