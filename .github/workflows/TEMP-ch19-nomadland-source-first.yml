name: TEMP Chapter 19 Nomadland source-first gate

on:
  push:
    branches:
      - agent/ch19-nomadland-production-case
    paths:
      - src/core/chapterNineteenNomadlandExpansion.ts
      - src/core/chapterNineteenNomadlandExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationNomadland.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenNomadland.ts
      - .github/workflows/TEMP-ch19-nomadland-source-first.yml

permissions:
  contents: read

jobs:
  verify-source-first:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-nomadland-production-case
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Core build
        run: npm run build
      - name: Strict Nomadland contract
        run: node --test dist/core/chapterNineteenNomadlandExpansion.test.js
      - name: UI build
        run: npm run build:ui
