name: TEMP Hyenas Chapter 17 materialize

on:
  push:
    branches:
      - agent/ch17-hyenas-production-case

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch17-hyenas-production-case
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Integrate Hyenas and regenerate permanent reports
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');

          function read(file) { return fs.readFileSync(file, 'utf8'); }
          function write(file, text) { fs.writeFileSync(file, text); }
          function replaceOnce(text, from, to, file) {
            const first = text.indexOf(from);
            if (first < 0) throw new Error(`${file}: missing anchor: ${from.slice(0, 100)}`);
            if (text.indexOf(from, first + from.length) >= 0) throw new Error(`${file}: anchor is not unique: ${from.slice(0, 100)}`);
            return text.slice(0, first) + to + text.slice(first + from.length);
          }
          function replaceAllCount(text, from, to, file, min = 1) {
            const count = text.split(from).length - 1;
            if (count < min) throw new Error(`${file}: expected >=${min} occurrences of ${from}, found ${count}`);
            return text.split(from).join(to);
          }
          function mutate(file, fn) {
            const before = read(file);
            const after = fn(before);
            if (after === before) throw new Error(`${file}: mutation produced no change`);
            write(file, after);
          }

          mutate('src/ui/data/filmScenarios.ts', (s) => {
            s = replaceOnce(
              s,
              'import { mergeChapterSixteenRagingBullExpansion } from "../../core/chapterSixteenRagingBullExpansion.js";\n',
              'import { mergeChapterSixteenRagingBullExpansion } from "../../core/chapterSixteenRagingBullExpansion.js";\nimport { mergeChapterSeventeenHyenasExpansion } from "../../core/chapterSeventeenHyenasExpansion.js";\n',
              'filmScenarios.ts import',
            );
            s = replaceOnce(
              s,
              'const chapterSixteenRagingBullScenarios = mergeChapterSixteenRagingBullExpansion(chapterSixteenSalaamBombayScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenRagingBullScenarios);',
              'const chapterSixteenRagingBullScenarios = mergeChapterSixteenRagingBullExpansion(chapterSixteenSalaamBombayScenarios);\nconst chapterSeventeenHyenasScenarios = mergeChapterSeventeenHyenasExpansion(chapterSixteenRagingBullScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSeventeenHyenasScenarios);',
              'filmScenarios.ts chain',
            );
            s = replaceOnce(
              s,
              '+manual_chapter_sixteen_raging_bull_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_sixteen_raging_bull_expansion_2026+manual_chapter_seventeen_hyenas_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              'filmScenarios.ts source list',
            );
            return s;
          });

          mutate('src/ui/data/scenarioFilmStudyMap.ts', (s) => {
            s = replaceOnce(
              s,
              'import { ragingBullFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenRagingBull";\n',
              'import { ragingBullFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenRagingBull";\nimport { hyenasFilmHistoryProfile } from "./scenarioFilmStudyChapterSeventeenHyenas";\n',
              'scenarioFilmStudyMap.ts import',
            );
            s = replaceOnce(
              s,
              '  [ragingBullFilmHistoryProfile.scenarioId]: ragingBullFilmHistoryProfile,\n',
              '  [ragingBullFilmHistoryProfile.scenarioId]: ragingBullFilmHistoryProfile,\n  [hyenasFilmHistoryProfile.scenarioId]: hyenasFilmHistoryProfile,\n',
              'scenarioFilmStudyMap.ts registry',
            );
            return s;
          });

          mutate('src/ui/data/scenarioProductionVerificationRegistry.ts', (s) => {
            s = replaceOnce(
              s,
              'import { ragingBullProductionCaseVerification } from "./scenarioProductionVerificationRagingBull";\n',
              'import { ragingBullProductionCaseVerification } from "./scenarioProductionVerificationRagingBull";\nimport { hyenasProductionCaseVerification } from "./scenarioProductionVerificationHyenas";\n',
              'scenarioProductionVerificationRegistry.ts import',
            );
            s = replaceOnce(
              s,
              '  ragingBullProductionCaseVerification,\n',
              '  ragingBullProductionCaseVerification,\n  hyenasProductionCaseVerification,\n',
              'scenarioProductionVerificationRegistry.ts registry',
            );
            return s;
          });

          mutate('scripts/production-case-rest-audit.mjs', (s) => {
            s = replaceOnce(s, 'const EXPECTED_PLAYABLE_SCENARIOS = 469;', 'const EXPECTED_PLAYABLE_SCENARIOS = 470;', 'production-case-rest playable');
            s = replaceOnce(s, 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 469;', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 470;', 'production-case-rest verification');
            s = replaceOnce(
              s,
              '  "chapterSixteenRagingBullExpansion.ts",\n  "modernCanonExpansion.ts",',
              '  "chapterSixteenRagingBullExpansion.ts",\n  "chapterSeventeenHyenasExpansion.ts",\n  "modernCanonExpansion.ts",',
              'production-case-rest expansion order',
            );
            return s;
          });

          const chapterWords = ['twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen'];
          for (const word of chapterWords) {
            const script = `scripts/film-history-chapter-${word}-atlas-audit.mjs`;
            mutate(script, (s) => {
              s = replaceOnce(s, 'const EXPECTED_ATLAS_COUNT = 469;', 'const EXPECTED_ATLAS_COUNT = 470;', `${script} count`);
              s = replaceOnce(
                s,
                '  "chapterSixteenRagingBullExpansion.ts",\n  "modernCanonExpansion.ts",',
                '  "chapterSixteenRagingBullExpansion.ts",\n  "chapterSeventeenHyenasExpansion.ts",\n  "modernCanonExpansion.ts",',
                `${script} expansion order`,
              );
              return s;
            });
          }

          const contractWords = ['Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen'];
          for (const word of contractWords) {
            const file = `src/core/filmHistoryChapter${word}AuditContract.test.ts`;
            mutate(file, (s) => replaceAllCount(s, '469', '470', file, 3));
          }

          mutate('src/core/filmHistoryChapterSeventeenAuditContract.test.ts', (s) => {
            s = replaceOnce(
              s,
              '  "El Mariachi",\n  "Farewell My Concubine",',
              '  "El Mariachi",\n  "Hyenas",\n  "Farewell My Concubine",',
              'Chapter17 existing queue',
            );
            s = replaceOnce(
              s,
              'const exactP0Queue = [\n  "Hyenas",\n  "Sankofa",',
              'const exactP0Queue = [\n  "Sankofa",',
              'Chapter17 P0 queue',
            );
            s = replaceOnce(
              s,
              '  "Boyz n the Hood",\n  "Hyenas",\n  "The Living End",',
              '  "Boyz n the Hood",\n  "The Living End",',
              'Chapter17 recommended queue',
            );
            return s;
          });

          const reports = [
            ['twelve', 'docs/film-history-chapter-twelve-atlas-resolved.json'],
            ['thirteen', 'docs/film-history-chapter-thirteen-atlas-resolved.json'],
            ['fourteen', 'docs/film-history-chapter-fourteen-atlas-resolved.json'],
            ['fifteen', 'docs/film-history-chapter-fifteen-atlas-resolved.json'],
            ['sixteen', 'docs/film-history-chapter-sixteen-atlas-resolved.json'],
            ['seventeen', 'docs/film-history-chapter-seventeen-atlas-resolved.json'],
          ];
          for (const [word, output] of reports) {
            cp.execFileSync('node', [`scripts/film-history-chapter-${word}-atlas-audit.mjs`, `--write=${output}`], { stdio: ['ignore', 'ignore', 'inherit'] });
          }

          const ch17 = JSON.parse(read('docs/film-history-chapter-seventeen-atlas-resolved.json'));
          if (ch17.atlas.expectedCount !== 470 || ch17.atlas.actualCount !== 470) throw new Error('Chapter 17 is not 470/470');
          if (ch17.verificationIndex.literalVerifiedScenarioIds !== 470) throw new Error('Chapter 17 verification index is not 470');
          const hyenas = ch17.candidates.find((item) => item.title === 'Hyenas');
          if (!hyenas || hyenas.decision !== 'USE_EXISTING' || hyenas.scenarioId !== 'scenario_hyenas_1992' || hyenas.productionVerified !== true) {
            throw new Error(`Hyenas did not resolve as verified USE_EXISTING: ${JSON.stringify(hyenas)}`);
          }
          const expectedP0 = ['Sankofa', 'Chungking Express', 'Bandit Queen', 'Toy Story', 'The Matrix', 'Shiri'];
          if (JSON.stringify(ch17.byDecision.P0) !== JSON.stringify(expectedP0)) throw new Error(`Unexpected Chapter 17 P0: ${JSON.stringify(ch17.byDecision.P0)}`);
          if (ch17.byDecision.P1.length !== 16) throw new Error(`Unexpected Chapter 17 P1 count: ${ch17.byDecision.P1.length}`);
          if (JSON.stringify(ch17.byDecision.P2) !== JSON.stringify(['Goodfellas'])) throw new Error(`Unexpected Chapter 17 P2: ${JSON.stringify(ch17.byDecision.P2)}`);
          if (ch17.recommendedNewProductionCases.includes('Hyenas')) throw new Error('Hyenas still appears in recommended new Production Cases');

          cp.execFileSync('node', ['scripts/production-case-rest-audit.mjs'], { stdio: 'inherit' });
          NODE
      - name: Full verification on materialized tree
        run: npm run verify:v0.1
      - name: Commit permanent materialization only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts \
            scripts/production-case-rest-audit.mjs \
            scripts/film-history-chapter-twelve-atlas-audit.mjs \
            scripts/film-history-chapter-thirteen-atlas-audit.mjs \
            scripts/film-history-chapter-fourteen-atlas-audit.mjs \
            scripts/film-history-chapter-fifteen-atlas-audit.mjs \
            scripts/film-history-chapter-sixteen-atlas-audit.mjs \
            scripts/film-history-chapter-seventeen-atlas-audit.mjs \
            src/core/filmHistoryChapterTwelveAuditContract.test.ts \
            src/core/filmHistoryChapterThirteenAuditContract.test.ts \
            src/core/filmHistoryChapterFourteenAuditContract.test.ts \
            src/core/filmHistoryChapterFifteenAuditContract.test.ts \
            src/core/filmHistoryChapterSixteenAuditContract.test.ts \
            src/core/filmHistoryChapterSeventeenAuditContract.test.ts \
            docs/film-history-chapter-twelve-atlas-resolved.json \
            docs/film-history-chapter-thirteen-atlas-resolved.json \
            docs/film-history-chapter-fourteen-atlas-resolved.json \
            docs/film-history-chapter-fifteen-atlas-resolved.json \
            docs/film-history-chapter-sixteen-atlas-resolved.json \
            docs/film-history-chapter-seventeen-atlas-resolved.json
          if git diff --cached --quiet; then
            echo "No permanent materialization changes"
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "TEMP workflow entered permanent commit" >&2
            exit 1
          fi
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "22"
          git commit -m "Materialize Hyenas Chapter 17 case"
          git push origin HEAD:agent/ch17-hyenas-production-case
