name: Materialize Film History Chapter 6 full text

on:
  push:
    branches:
      - agent/film-history-chapter-six-full
    paths:
      - .github/workflows/chapter-six-full-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-history-chapter-six-full
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate Chapter 6 into canonical book
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          book = Path('src/core/filmHistoryBook.ts')
          text = book.read_text(encoding='utf-8')
          import_marker = 'import { filmHistoryChapterFive } from "./filmHistoryChapterFive.js";\n'
          if text.count(import_marker) != 1:
              raise SystemExit('filmHistoryBook Chapter 5 import marker mismatch')
          text = text.replace(import_marker, import_marker + 'import { filmHistoryChapterSix } from "./filmHistoryChapterSix.js";\n', 1)
          start_marker = '      outline(\n        "classical-hollywood",'
          next_marker = '      outline(\n        "weimar-expressionism",'
          start = text.find(start_marker)
          end = text.find(next_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'Could not isolate Chapter 6 outline: start={start} end={end}')
          text = text[:start] + '      filmHistoryChapterSix,\n' + text[end:]
          book.write_text(text, encoding='utf-8')

          replace_once(
              'src/core/filmHistoryBook.test.ts',
              'test("only Chapters 6–30 remain explicit outlines after Chapter 5 completion", () => {\n  const completed = filmHistoryBookChapters.filter((chapter) => chapter.number <= 5);\n  assert.equal(completed.length, 5);',
              'test("only Chapters 7–30 remain explicit outlines after Chapter 6 completion", () => {\n  const completed = filmHistoryBookChapters.filter((chapter) => chapter.number <= 6);\n  assert.equal(completed.length, 6);',
          )
          replace_once(
              'src/core/filmHistoryBook.test.ts',
              '  const remaining = filmHistoryBookChapters.filter((chapter) => chapter.number > 5);\n  assert.equal(remaining.length, 25);',
              '  const remaining = filmHistoryBookChapters.filter((chapter) => chapter.number > 6);\n  assert.equal(remaining.length, 24);',
          )

          for path in [
              'src/core/filmHistoryChapterThree.test.ts',
              'src/core/filmHistoryChapterFour.test.ts',
              'src/core/filmHistoryChapterFive.test.ts',
          ]:
              replace_once(path, 'canonical book resolves Chapters 1–5 as full', 'canonical book resolves Chapters 1–6 as full')
              replace_once(path, 'assert.equal(getFilmHistoryBookChapter("classical-hollywood")?.status, "outline");', 'assert.equal(getFilmHistoryBookChapter("classical-hollywood")?.status, "full");')
          PY
      - name: Full v0.1 verification
        run: npm run verify:v0.1
      - name: Commit verified Chapter 6 and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/chapter-six-full-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Film History Chapter 6 full text"
          git push origin HEAD:agent/film-history-chapter-six-full
