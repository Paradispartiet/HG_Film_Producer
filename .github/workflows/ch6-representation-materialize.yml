name: Materialize Chapter 6 representation mapping

on:
  push:
    branches:
      - agent/film-history-ch6-representation-mapping

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-history-ch6-representation-mapping
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize fail-closed Chapter 6 reviews
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          path = Path('data/film/film_history_representation_coverage_v1.json')
          data = json.loads(path.read_text())
          reviews = data['scenario_reviews']
          ids = {r['scenario_id'] for r in reviews}
          if len(reviews) != 21 or len(ids) != 21:
              raise SystemExit(f'Expected 21 unique reviews, found {len(reviews)} / {len(ids)}')
          matrix = {r['development_id']: r for r in data['development_matrix']}
          for did in ['classical_hollywood_studio_system','modern_popular_commercial_cinema_as_industry']:
              if matrix[did]['declared_status'] != 0:
                  raise SystemExit(f'{did} baseline drifted from 0')
          matrix['classical_hollywood_studio_system']['declared_status'] = 3
          matrix['classical_hollywood_studio_system']['triangulation_basis'] = "The Crowd documents MGM resources, King Vidor's unusual production freedom, Fox Movietone engineering support and coordinated camera/technical labor; The Cheat adds Famous Players production, the Lasky studio and Paramount distribution; It and Wings add Paramount star manufacturing, producer organization, large-scale technical crews, military cooperation and production/distribution integration. Together these exact cases triangulate studio organization, labor, production management and distribution across MGM, Famous Players and Paramount."
          matrix['modern_popular_commercial_cinema_as_industry']['declared_status'] = 3
          matrix['modern_popular_commercial_cinema_as_industry']['triangulation_basis'] = "The Gold Rush provides a costly Chaplin star-producer feature distributed by United Artists with mass extras, location logistics and documented commercial reach; It adds Paramount's Clara Bow star-vehicle strategy and box-office system; Wings adds Paramount-financed large-scale spectacle, military-aircraft logistics and studio distribution. The cases triangulate mass-audience commercial production across independent star-producer and vertically organized studio models."
          new = [
            {'scenario_id':'scenario_the_general_1926','review_state':'REVIEWED_NO_MAPPING','development_ids':[],'rationale':'The verified Buster Keaton Productions case documents an unusually lavish independent production, specialist technical labor, borrowed locomotives, six-camera practical destruction and silent-era accompaniment. Those facts are historically strong, but the present matrix does not contain a dedicated silent independent/star-producer production row, and the record does not by itself satisfy the mass-audience/distribution-system requirement of the modern popular-commercial row.'},
            {'scenario_id':'scenario_the_crowd_1928','review_state':'MAPPED','development_ids':['classical_hollywood_studio_system'],'evidence_paths':['src/ui/data/scenarioProductionVerificationTheCrowd.ts'],'rationale':"The verified MGM case documents Vidor's production latitude inside a major studio, MGM resource coordination, Fox Movietone engineering support and cinematographer/engineer collaboration for technically difficult moving-camera work, directly evidencing studio organization and specialized labor."},
            {'scenario_id':'scenario_the_gold_rush_1925','review_state':'MAPPED','development_ids':['modern_popular_commercial_cinema_as_industry'],'evidence_paths':['src/ui/data/scenarioProductionVerificationGoldRush.ts'],'rationale':'The verified Chaplin case documents a more-than-$900,000 feature, hundreds of extras, rail and mountain-location logistics, long production, star-producer control, United Artists distribution and major documented commercial reach, providing a concrete mass-audience commercial-production countermodel to studio vertical integration.'},
            {'scenario_id':'scenario_it_1927','review_state':'MAPPED','development_ids':['classical_hollywood_studio_system','modern_popular_commercial_cinema_as_industry'],'evidence_paths':['src/ui/data/scenarioProductionVerificationIt.ts'],'rationale':"The verified Paramount case ties story acquisition explicitly to Clara Bow, B. P. Schulberg's cultivation of her star persona, studio publicity, wage growth, box-office dominance, production locations and Paramount distribution, joining studio organization with a mass-audience star-vehicle business model."},
            {'scenario_id':'scenario_the_cheat_1915','review_state':'MAPPED','development_ids':['classical_hollywood_studio_system'],'evidence_paths':['src/ui/data/scenarioProductionVerificationTheCheat.ts'],'rationale':'The verified case separates Famous Players Film Company production from Paramount distribution and anchors DeMille, Wyckoff and the Lasky studio facility, providing exact early company, facility, labor and distribution evidence for the emerging American studio system.'},
            {'scenario_id':'scenario_wings_1927','review_state':'MAPPED','development_ids':['classical_hollywood_studio_system','modern_popular_commercial_cinema_as_industry'],'evidence_paths':['src/ui/data/scenarioProductionVerificationWings.ts'],'rationale':'The verified Paramount case documents producer/scenario organization, multiple camera and effects specialists, military cooperation, actual aircraft, reconstructed battle landscapes and Paramount production/distribution. It therefore teaches large-scale studio labor/logistics and mass-audience spectacle without misclassifying its arranged music/effects presentation as the synchronized-sound transition.'}
          ]
          for row in new:
              if row['scenario_id'] in ids: raise SystemExit('Already reviewed: '+row['scenario_id'])
              reviews.append(row); ids.add(row['scenario_id'])
          if len(reviews) != 27 or len(ids) != 27: raise SystemExit('Expected 27 unique reviews after Chapter 6')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Verify Chapter 6 branch
        run: npm run verify:v0.1
      - name: Commit verified permanent audit change
        shell: bash
        run: |
          rm .github/workflows/ch6-representation-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/film/film_history_representation_coverage_v1.json .github/workflows/ch6-representation-materialize.yml
          git commit -m "Map Chapter 6 scenarios in Film History representation audit"
          git push origin HEAD:agent/film-history-ch6-representation-mapping
