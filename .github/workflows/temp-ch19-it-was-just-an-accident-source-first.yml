name: TEMP Chapter 19 It Was Just an Accident source-first

on:
  push:
    branches:
      - agent/ch19-it-was-just-an-accident-production-case
    paths:
      - .github/workflows/temp-ch19-it-was-just-an-accident-source-first.yml
      - src/core/chapterNineteenItWasJustAnAccidentExpansion.ts
      - src/core/chapterNineteenItWasJustAnAccidentExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationItWasJustAnAccident.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenItWasJustAnAccident.ts

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-it-was-just-an-accident-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict It Was Just an Accident contract
        run: node --test dist/core/chapterNineteenItWasJustAnAccidentExpansion.test.js

      - name: Build UI
        run: npm run build:ui
