name: TEMP Materialize Police Story Chapter 16

on:
  push:
    branches:
      - agent/ch16-police-story-production-case

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ch16-police-story-production-case
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate Police Story permanently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = "src/ui/data/filmScenarios.ts"
          text = read(path)
          text = replace_once(text,
              'import { mergeChapterSixteenMyBeautifulLaundretteExpansion } from "../../core/chapterSixteenMyBeautifulLaundretteExpansion.js";\n',
              'import { mergeChapterSixteenMyBeautifulLaundretteExpansion } from "../../core/chapterSixteenMyBeautifulLaundretteExpansion.js";\nimport { mergeChapterSixteenPoliceStoryExpansion } from "../../core/chapterSixteenPoliceStoryExpansion.js";\n',
              "filmScenarios import")
          text = replace_once(text,
              'const chapterSixteenMyBeautifulLaundretteScenarios = mergeChapterSixteenMyBeautifulLaundretteExpansion(chapterSixteenYellowEarthScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenMyBeautifulLaundretteScenarios);',
              'const chapterSixteenMyBeautifulLaundretteScenarios = mergeChapterSixteenMyBeautifulLaundretteExpansion(chapterSixteenYellowEarthScenarios);\nconst chapterSixteenPoliceStoryScenarios = mergeChapterSixteenPoliceStoryExpansion(chapterSixteenMyBeautifulLaundretteScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenPoliceStoryScenarios);',
              "filmScenarios merge chain")
          text = replace_once(text,
              '+manual_chapter_sixteen_my_beautiful_laundrette_expansion_2026',
              '+manual_chapter_sixteen_my_beautiful_laundrette_expansion_2026+manual_chapter_sixteen_police_story_expansion_2026',
              "filmScenarios source list")
          write(path, text)

          path = "src/ui/data/scenarioFilmStudyMap.ts"
          text = read(path)
          text = replace_once(text,
              'import { myBeautifulLaundretteFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenMyBeautifulLaundrette";\n',
              'import { myBeautifulLaundretteFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenMyBeautifulLaundrette";\nimport { policeStoryFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenPoliceStory";\n',
              "Film Study import")
          text = replace_once(text,
              '  [myBeautifulLaundretteFilmHistoryProfile.scenarioId]: myBeautifulLaundretteFilmHistoryProfile,\n',
              '  [myBeautifulLaundretteFilmHistoryProfile.scenarioId]: myBeautifulLaundretteFilmHistoryProfile,\n  [policeStoryFilmHistoryProfile.scenarioId]: policeStoryFilmHistoryProfile,\n',
              "Film Study map")
          write(path, text)

          path = "src/ui/data/scenarioProductionVerificationRegistry.ts"
          text = read(path)
          text = replace_once(text,
              'import { myBeautifulLaundretteProductionCaseVerification } from "./scenarioProductionVerificationMyBeautifulLaundrette";\n',
              'import { myBeautifulLaundretteProductionCaseVerification } from "./scenarioProductionVerificationMyBeautifulLaundrette";\nimport { policeStoryProductionCaseVerification } from "./scenarioProductionVerificationPoliceStory";\n',
              "verification import")
          text = replace_once(text,
              '  myBeautifulLaundretteProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
              '  myBeautifulLaundretteProductionCaseVerification,\n  policeStoryProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
              "verification registry")
          write(path, text)

          atlas_scripts = [
              "scripts/film-history-chapter-twelve-atlas-audit.mjs",
              "scripts/film-history-chapter-thirteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fourteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fifteen-atlas-audit.mjs",
              "scripts/film-history-chapter-sixteen-atlas-audit.mjs",
          ]
          for path in atlas_scripts:
              text = read(path)
              text = replace_once(text, "const EXPECTED_ATLAS_COUNT = 451;", "const EXPECTED_ATLAS_COUNT = 452;", f"{path} count")
              text = replace_once(text,
                  '  "chapterSixteenMyBeautifulLaundretteExpansion.ts",\n',
                  '  "chapterSixteenMyBeautifulLaundretteExpansion.ts",\n  "chapterSixteenPoliceStoryExpansion.ts",\n',
                  f"{path} expansion")
              write(path, text)

          path = "scripts/production-case-rest-audit.mjs"
          text = read(path)
          text = replace_once(text, "const EXPECTED_PLAYABLE_SCENARIOS = 451;", "const EXPECTED_PLAYABLE_SCENARIOS = 452;", "production playable")
          text = replace_once(text, "const EXPECTED_VERIFIED_PRODUCTION_CASES = 451;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 452;", "production verified")
          text = replace_once(text,
              '  "chapterSixteenMyBeautifulLaundretteExpansion.ts",\n',
              '  "chapterSixteenMyBeautifulLaundretteExpansion.ts",\n  "chapterSixteenPoliceStoryExpansion.ts",\n',
              "production expansion")
          write(path, text)

          for path in [
              "src/core/filmHistoryChapterTwelveAuditContract.test.ts",
              "src/core/filmHistoryChapterThirteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFourteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFifteenAuditContract.test.ts",
          ]:
              text = read(path)
              if text.count("451") < 3:
                  raise SystemExit(f"{path}: missing 451 count locks")
              write(path, text.replace("451", "452"))

          path = "src/core/filmHistoryChapterSixteenAuditContract.test.ts"
          text = read(path)
          if text.count("451") < 4:
              raise SystemExit("Chapter 16 contract missing 451 count locks")
          text = text.replace("451", "452")
          target = '  "Police Story",\n'
          if text.count(target) != 2:
              raise SystemExit(f"Expected Police Story twice in P0/recommended, found {text.count(target)}")
          text = text.replace(target, "")
          text = replace_once(text,
              '  "My Beautiful Laundrette",\n  "Down by Law",',
              '  "My Beautiful Laundrette",\n  "Police Story",\n  "Down by Law",',
              "Chapter 16 existing queue")
          text = replace_once(text,
              '    "My Beautiful Laundrette": "scenario_my_beautiful_laundrette_1985",\n    "Down by Law":',
              '    "My Beautiful Laundrette": "scenario_my_beautiful_laundrette_1985",\n    "Police Story": "scenario_police_story_1985",\n    "Down by Law":',
              "Chapter 16 exact ID")
          text = text.replace('    "Come and See",\n      "The Official Story",', '    "Come and See",\n    "The Official Story",')
          write(path, text)
          PY

      - name: Regenerate Chapter 12-16 Atlas reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json
          node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json

      - name: Assert canonical Police Story result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('docs/film-history-chapter-sixteen-atlas-resolved.json', 'utf8'));
          if (report.atlas.expectedCount !== 452 || report.atlas.actualCount !== 452) throw new Error(`Atlas ${report.atlas.expectedCount}/${report.atlas.actualCount}`);
          if (report.verificationIndex.literalVerifiedScenarioIds !== 452) throw new Error(`Verification ${report.verificationIndex.literalVerifiedScenarioIds}`);
          const film = report.candidates.find((item) => item.title === 'Police Story');
          if (!film || film.decision !== 'USE_EXISTING' || film.scenarioId !== 'scenario_police_story_1985' || film.productionVerified !== true) throw new Error(`Police Story resolution ${JSON.stringify(film)}`);
          const p0 = ['The Official Story', 'Yeelen', 'Do the Right Thing'];
          if (JSON.stringify(report.byDecision.P0) !== JSON.stringify(p0)) throw new Error(`P0 ${JSON.stringify(report.byDecision.P0)}`);
          const p1 = ['Mephisto','Missing','Blade Runner','E.T. the Extra-Terrestrial','Sugar Cane Alley','The Terminator','Come and See','Back to the Future','Aliens',"She's Gotta Have It",'A Better Tomorrow','RoboCop','Salaam Bombay!'];
          if (JSON.stringify(report.byDecision.P1) !== JSON.stringify(p1)) throw new Error(`P1 ${JSON.stringify(report.byDecision.P1)}`);
          NODE

      - name: Verify full v0.1
        run: npm run verify:v0.1

      - name: Commit permanent integration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ch16-police-story-materialize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize Police Story Chapter 16 Production Case"
          git push origin HEAD:agent/ch16-police-story-production-case
