name: Materialize Chapter 11 Blackmail Production Case

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

concurrency:
  group: ch11-blackmail-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ch11-blackmail-production-case'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic Blackmail wiring
        run: python scripts/materialize-ch11-blackmail.py

      - name: Regenerate canonical Chapter 11 audit
        run: node scripts/film-history-chapter-eleven-atlas-audit.mjs --write=docs/film-history-chapter-eleven-atlas-resolved.json

      - name: Full v0.1 verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee ch11-blackmail-verify.log

      - name: Upload failed verification diagnostics
        if: steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ch11-blackmail-materialize-diagnostics
          path: ch11-blackmail-verify.log

      - name: Fail on verification error
        if: steps.verify.outcome == 'failure'
        run: exit 1

      - name: Commit permanent clean diff
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          rm -f .github/workflows/ch11-blackmail-materialize.yml
          rm -f scripts/materialize-ch11-blackmail.py
          rm -f ch11-blackmail-verify.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No materialized diff to commit"; exit 1; }
          git commit -m "Materialize Blackmail Chapter 11 Production Case"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
