name: Rebase Queen Elizabeth onto current main

on:
  push:
    branches:
      - agent/queen-elizabeth-1912

permissions:
  contents: write

jobs:
  rebase-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Queen branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Merge current main and resolve the Kelly census race
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "src/ui/data/scenarioProductionVerification.test.ts" ]; then
              echo "Unexpected merge conflicts: $conflicts"
              exit 1
            fi
            git checkout --theirs src/ui/data/scenarioProductionVerification.test.ts
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/ui/data/scenarioProductionVerification.test.ts")
          text = path.read_text(encoding="utf-8")
          old_group = '"scenario_the_story_of_the_kelly_gang_1906", "scenario_the_corbett_fitzsimmons_fight_1897"'
          new_group = '"scenario_the_story_of_the_kelly_gang_1906", "scenario_queen_elizabeth_1912", "scenario_the_corbett_fitzsimmons_fight_1897"'
          if old_group not in text:
              raise SystemExit("Kelly group anchor missing")
          text = text.replace(old_group, new_group, 1)
          if "const expectedVerifiedCount = 385;" not in text:
              raise SystemExit("Kelly verification count anchor missing")
          text = text.replace("const expectedVerifiedCount = 385;", "const expectedVerifiedCount = 386;", 1)
          path.write_text(text, encoding="utf-8")
          PY
          git add src/ui/data/scenarioProductionVerification.test.ts
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git rm .github/workflows/queen-rebase-current-main.yml
          git add -A

      - name: Install dependencies
        run: npm ci

      - name: Verify merged Queen delivery
        run: npm run verify:v0.1

      - name: Commit exact merged result
        run: |
          git commit -m "chore: rebase Queen Elizabeth onto Kelly census fix"
          git push origin HEAD:agent/queen-elizabeth-1912
