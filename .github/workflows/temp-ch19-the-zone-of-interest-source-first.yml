name: TEMP Chapter 19 The Zone of Interest source-first

on:
  push:
    branches:
      - agent/ch19-the-zone-of-interest-production-case
    paths:
      - src/core/chapterNineteenTheZoneOfInterestExpansion.ts
      - src/core/chapterNineteenTheZoneOfInterestExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationTheZoneOfInterest.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenTheZoneOfInterest.ts
      - .github/workflows/temp-ch19-the-zone-of-interest-source-first.yml

jobs:
  verify-source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-the-zone-of-interest-production-case

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build:core

      - name: Strict The Zone of Interest contract
        run: node --test dist/core/chapterNineteenTheZoneOfInterestExpansion.test.js

      - name: Build UI
        run: npm run build:ui
