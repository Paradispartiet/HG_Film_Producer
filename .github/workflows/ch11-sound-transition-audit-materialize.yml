name: Materialize Chapter 11 sound-transition audit

on:
  push:
    branches:
      - agent/ch11-sound-transition-atlas-audit
    paths:
      - .github/workflows/ch11-sound-transition-audit-materialize.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch11-sound-transition-atlas-audit
          fetch-depth: 0
      - name: Run Chapter 11 Atlas audit
        run: node scripts/film-history-chapter-eleven-atlas-audit.mjs --write=docs/film-history-chapter-eleven-atlas-resolved.json
      - name: Commit canonical report and remove materializer
        shell: bash
        run: |
          git rm .github/workflows/ch11-sound-transition-audit-materialize.yml
          git add scripts/film-history-chapter-eleven-atlas-audit.mjs docs/film-history-chapter-eleven-atlas-resolved.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize Chapter 11 sound-transition Atlas audit"
          git push origin HEAD:agent/ch11-sound-transition-atlas-audit
