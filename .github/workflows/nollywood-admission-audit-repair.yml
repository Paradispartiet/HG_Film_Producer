name: Repair Nollywood production-audit inventory

on:
  push:
    branches:
      - agent/nollywood-representation-admission-run-20260911

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[audit repaired]') && !contains(github.event.head_commit.message, '[nollywood materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production-case structural audit for admitted 614th case
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/production-case-rest-audit.mjs')
          s = p.read_text()

          replacements = [
              ('const EXPECTED_PLAYABLE_SCENARIOS = 613;', 'const EXPECTED_PLAYABLE_SCENARIOS = 614;'),
              ('const EXPECTED_VERIFIED_PRODUCTION_CASES = 613;', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 614;'),
              ('  "italyFranceGermanyBeneluxExpansion.ts",\n];', '  "italyFranceGermanyBeneluxExpansion.ts",\n  "nollywoodLivingInBondageExpansion.ts",\n];'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'fail-closed repair anchor mismatch: {old!r}; found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          git diff -- scripts/production-case-rest-audit.mjs
          git add scripts/production-case-rest-audit.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: register Nollywood admission in production audit [audit repaired]"
          git push origin HEAD
