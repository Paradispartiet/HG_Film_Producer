name: TEMP Alcarras reconciliation fail-closed

on:
  push:
    branches:
      - agent/ch19-alcarras-reconciliation
    paths:
      - scripts/TEMP-ch19-alcarras-reconcile.mjs
      - .github/workflows/TEMP-ch19-alcarras-reconcile.yml

permissions:
  contents: write

concurrency:
  group: temp-ch19-alcarras-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lock existing Alcarras identities
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object src/ui/data/scenarioFilmStudyContemporaryDissentAlcarras.ts)" = "558551857cb02b04212724ac2757b6d7cadaf8d8"
          test "$(git hash-object src/ui/data/scenarioProductionVerificationContemporaryDissentRuralSystemsBatch.ts)" = "928ab14eaaaf9b93554040268dd4875c104f02a9"

      - name: Materialize Alcarras candidate reconciliation
        run: node scripts/TEMP-ch19-alcarras-reconcile.mjs

      - name: Full fail-closed verification
        run: npm run verify:v0.1

      - name: Assert exact permanent result
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e scripts/TEMP-ch19-alcarras-reconcile.mjs
          test ! -e .github/workflows/TEMP-ch19-alcarras-reconcile.yml
          test "$(git hash-object src/ui/data/scenarioFilmStudyContemporaryDissentAlcarras.ts)" = "558551857cb02b04212724ac2757b6d7cadaf8d8"
          test "$(git hash-object src/ui/data/scenarioProductionVerificationContemporaryDissentRuralSystemsBatch.ts)" = "928ab14eaaaf9b93554040268dd4875c104f02a9"
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const film = r.candidates.find((x) => x.title === 'Alcarràs');
          if (r.atlas.actualCount !== 591 || r.atlas.expectedCount !== 591) throw new Error('Atlas must remain 591/591');
          if (r.verificationIndex.literalVerifiedScenarioIds !== 591) throw new Error('PV count must remain 591');
          if (r.candidates.length !== 68) throw new Error(`Expected 68 candidates, got ${r.candidates.length}`);
          if (r.byDecision.USE_EXISTING.length !== 66) throw new Error(`Expected 66 USE_EXISTING, got ${r.byDecision.USE_EXISTING.length}`);
          if (r.byDecision.P2.length !== 2) throw new Error(`Expected 2 P2, got ${r.byDecision.P2.length}`);
          if (!film || film.scenarioId !== 'scenario_alcarras_2022' || film.matches !== 1 || film.productionVerified !== true || film.decision !== 'USE_EXISTING') throw new Error('Alcarras existing identity did not close exactly');
          NODE
          node scripts/film-history-chapter-nineteen-festival-awards-completion-audit.mjs > /tmp/festival.json
          node - <<'NODE'
          const f = require('/tmp/festival.json');
          const film = f.obligations.find((x) => x.title === 'Alcarràs');
          if (!film || film.status !== 'PRODUCTION_VERIFIED' || film.scenarioId !== 'scenario_alcarras_2022') throw new Error('Festival gate did not close Alcarras');
          if (f.correctiveQueue[0]?.order !== 9 || f.correctiveQueue[0]?.title !== 'On the Adamant') throw new Error(`Unexpected next correction: ${f.correctiveQueue[0]?.title}`);
          NODE
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/TEMP-ch19-alcarras-reconcile.yml',
              'docs/film-history-chapter-nineteen-atlas-resolved.json',
              'scripts/TEMP-ch19-alcarras-reconcile.mjs',
              'scripts/film-history-chapter-eighteen-completion-audit.mjs',
              'scripts/film-history-chapter-nineteen-atlas-audit.mjs',
              'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
          }
          actual = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          if actual != expected:
              raise SystemExit(f'Unexpected working-tree diff. expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check

      - name: Commit permanent Alcarras reconciliation only
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/film-history-chapter-nineteen-atlas-resolved.json \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git status --short
          git commit -m "Reconcile Alcarràs in Chapter 19"
          git push origin HEAD:${GITHUB_REF_NAME}
