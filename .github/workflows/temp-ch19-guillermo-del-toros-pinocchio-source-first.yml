name: TEMP Chapter 19 Guillermo del Toro's Pinocchio source-first

on:
  push:
    branches:
      - agent/ch19-guillermo-del-toros-pinocchio-production-case
    paths:
      - .github/workflows/temp-ch19-guillermo-del-toros-pinocchio-source-first.yml
      - src/core/chapterNineteenGuillermoDelTorosPinocchioExpansion.ts
      - src/core/chapterNineteenGuillermoDelTorosPinocchioExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationGuillermoDelTorosPinocchio.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenGuillermoDelTorosPinocchio.ts

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-guillermo-del-toros-pinocchio-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict Guillermo del Toro's Pinocchio contract
        run: node --test dist/core/chapterNineteenGuillermoDelTorosPinocchioExpansion.test.js

      - name: Build UI
        run: npm run build:ui
