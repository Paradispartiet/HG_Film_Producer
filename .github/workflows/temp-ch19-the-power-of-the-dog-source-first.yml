name: TEMP Chapter 19 The Power of the Dog source-first

on:
  push:
    branches:
      - agent/ch19-the-power-of-the-dog-production-case
    paths:
      - .github/workflows/temp-ch19-the-power-of-the-dog-source-first.yml
      - src/core/chapterNineteenThePowerOfTheDogExpansion.ts
      - src/core/chapterNineteenThePowerOfTheDogExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationThePowerOfTheDog.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenThePowerOfTheDog.ts

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-the-power-of-the-dog-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict The Power of the Dog contract
        run: node --test dist/core/chapterNineteenThePowerOfTheDogExpansion.test.js

      - name: Build UI
        run: npm run build:ui
