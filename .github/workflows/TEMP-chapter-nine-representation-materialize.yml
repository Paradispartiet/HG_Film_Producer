name: TEMP materialize Chapter 9 representation

on:
  push:
    branches: [audit/chapter-9-representation]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: audit/chapter-9-representation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize Chapter 9 representation audit
        run: node scripts/TEMP-materialize-chapter-nine-representation.mjs

      - name: Fail-closed representation audit
        run: node scripts/film-history-representation-coverage-audit-v1.mjs

      - name: Remove temporary artifacts before full verification
        run: |
          rm scripts/TEMP-materialize-chapter-nine-representation.mjs
          rm .github/workflows/TEMP-chapter-nine-representation-materialize.yml

      - name: Full v0.1 verification
        run: npm run verify:v0.1

      - name: Commit permanent audit diff
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          test "$(git diff --cached --name-only | grep -Fx 'data/film/film_history_representation_coverage_v1.json' | wc -l)" -eq 1
          test "$(git diff --cached --name-only | grep -Fx 'scripts/TEMP-materialize-chapter-nine-representation.mjs' | wc -l)" -eq 1
          test "$(git diff --cached --name-only | grep -Fx '.github/workflows/TEMP-chapter-nine-representation-materialize.yml' | wc -l)" -eq 1
          git commit -m "Audit Chapter 9 representation coverage"
          git push origin HEAD:audit/chapter-9-representation
