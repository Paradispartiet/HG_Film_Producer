name: TEMP Chapter 19 The Seed of the Sacred Fig materialize

on:
  push:
    branches:
      - agent/ch19-the-seed-of-the-sacred-fig-production-case
    paths:
      - .github/workflows/temp-ch19-the-seed-of-the-sacred-fig-materialize.yml
      - scripts/temp-materialize-the-seed-of-the-sacred-fig.mjs

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-the-seed-of-the-sacred-fig-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic canonical patch
        run: node scripts/temp-materialize-the-seed-of-the-sacred-fig.mjs

      - name: Remove Sacred Fig TEMP artifacts before full verification
        run: |
          rm -f \
            .github/workflows/temp-ch19-the-seed-of-the-sacred-fig-materialize.yml \
            .github/workflows/temp-ch19-the-seed-of-the-sacred-fig-source-first.yml \
            scripts/temp-materialize-the-seed-of-the-sacred-fig.mjs

      - name: Generate Chapter 19 resolved state
        run: node scripts/film-history-chapter-nineteen-atlas-audit.mjs --write=docs/film-history-chapter-nineteen-atlas-resolved.json > /tmp/sacred-fig-ch19-resolved.json

      - name: Full fail-closed verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee verify-v0.1-output.txt

      - name: Verify post-gate canonical snapshot
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const r = JSON.parse(readFileSync("docs/film-history-chapter-nineteen-atlas-resolved.json", "utf8"));
          const film = r.candidates.find((x) => x.title === "The Seed of the Sacred Fig");
          if (r.atlas.actualCount !== 562 || r.atlas.expectedCount !== 562) throw new Error(`Atlas is not 562/562: ${r.atlas.actualCount}/${r.atlas.expectedCount}`);
          if (r.verificationIndex.literalVerifiedScenarioIds !== 562) throw new Error(`Production Verification count is ${r.verificationIndex.literalVerifiedScenarioIds}`);
          if (!film || film.decision !== "USE_EXISTING" || film.scenarioId !== "scenario_the_seed_of_the_sacred_fig_2024" || film.matches !== 1 || film.productionVerified !== true) throw new Error(`Sacred Fig state invalid: ${JSON.stringify(film)}`);
          if (r.byDecision.USE_EXISTING.length !== 30 || r.byDecision.P0.length !== 11 || r.byDecision.P1.length !== 15 || r.byDecision.P2.length !== 4 || r.byDecision.EXISTING_REQUIRED.length !== 0) throw new Error(`Queue census invalid: ${JSON.stringify(Object.fromEntries(Object.entries(r.byDecision).map(([k,v]) => [k,v.length])))}`);
          if (r.recommendedNewProductionCases.length !== 26) throw new Error(`Recommended production case count is ${r.recommendedNewProductionCases.length}`);
          if (r.productionStrategy.nextRecommendedCase !== "Killers of the Flower Moon" || r.productionStrategy.nextRecommendedLane !== "industrial_scale_technical") throw new Error(`Scheduler did not advance to Killers of the Flower Moon/industrial_scale_technical: ${JSON.stringify(r.productionStrategy)}`);
          const firstFive = r.recommendedNewProductionCases.slice(0, 5);
          const expectedFirstFive = ["Killers of the Flower Moon", "Anatomy of a Fall", "Flow", "Godzilla Minus One", "Poor Things"];
          if (JSON.stringify(firstFive) !== JSON.stringify(expectedFirstFive)) throw new Error(`First remaining sequence drifted: ${JSON.stringify(firstFive)}`);
          const firstFiveLanes = r.productionStrategy.remainingSequence.slice(0, 5).map((x) => x.lane);
          const expectedLanes = ["industrial_scale_technical", "auteur_festival", "independent_low_mid_budget", "regional_global", "industrial_scale_technical"];
          if (JSON.stringify(firstFiveLanes) !== JSON.stringify(expectedLanes)) throw new Error(`First five lane sequence drifted: ${JSON.stringify(firstFiveLanes)}`);
          console.log(JSON.stringify({atlas: r.atlas.actualCount, verified: r.verificationIndex.literalVerifiedScenarioIds, film, queue: Object.fromEntries(Object.entries(r.byDecision).map(([k,v]) => [k,v.length])), next: r.productionStrategy.remainingSequence.slice(0,5)}, null, 2));
          NODE

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-fig-materialization-diagnostics
          path: |
            verify-v0.1-output.txt
            /tmp/sacred-fig-ch19-resolved.json
          if-no-files-found: ignore

      - name: Commit verified canonical state and TEMP cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add \
            docs/film-history-chapter-nineteen-atlas-resolved.json \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          git add -u -- \
            .github/workflows/temp-ch19-the-seed-of-the-sacred-fig-materialize.yml \
            .github/workflows/temp-ch19-the-seed-of-the-sacred-fig-source-first.yml \
            scripts/temp-materialize-the-seed-of-the-sacred-fig.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Materialize The Seed of the Sacred Fig Chapter 19 production case"
          git push origin HEAD:agent/ch19-the-seed-of-the-sacred-fig-production-case
