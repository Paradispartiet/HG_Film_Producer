name: TEMP Chapter 18 Slumdog Millionaire integration

on:
  push:
    branches:
      - agent/ch18-slumdog-millionaire-production-case
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch18-slumdog-millionaire-production-case
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair explicit SI-2K format task
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/core/chapterEighteenSlumdogMillionaireExpansion.ts';
          let t = fs.readFileSync(p, 'utf8');
          const from = 'Use the mobile digital rig where access and movement drive the shot, preserve 35mm where night/image conditions require it, and track every source format for post.';
          const to = 'Use the SI-2K mobile digital rig where access and movement drive the shot, preserve 35mm where night/image conditions require it, and track every source format for post.';
          if (!t.includes(to)) {
            if (!t.includes(from)) throw new Error('Expected Slumdog format-map task not found');
            t = t.replace(from, to);
            fs.writeFileSync(p, t);
          }
          NODE
      - name: Materialize integration
        run: node scripts/TEMP-ch18-slumdog-millionaire-integrate.mjs
      - name: Commit deterministic integration
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          git commit -m "Repair Slumdog Millionaire format-map task"
          git push origin HEAD:agent/ch18-slumdog-millionaire-production-case

# Permanent verification is triggered again after the repaired bot head lands.
