name: TEMP materialize Chapter 18 Parasite

on:
  push:
    branches: [agent/ch18-parasite-production-case]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') && !contains(github.event.head_commit.message, '[diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch18-parasite-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize deterministic integration
        run: node scripts/TEMP-materialize-ch18-parasite.mjs

      - name: Full v0.1 verification
        id: verify
        shell: bash
        run: |
          set +e
          npm run verify:v0.1 2>&1 | tee TEMP-parasite-verify.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit verification diagnostic
        if: ${{ steps.verify.outputs.status != '0' }}
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f TEMP-parasite-verify.log
          git commit -m "Capture Parasite verification failure [diagnostic]"
          git push origin HEAD:agent/ch18-parasite-production-case

      - name: Enforce verification result
        if: ${{ steps.verify.outputs.status != '0' }}
        run: exit 1

      - name: Commit materialized permanent state
        if: ${{ steps.verify.outputs.status == '0' }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -f TEMP-parasite-verify.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/production-case-rest-audit.mjs scripts/film-history-chapter-*-atlas-audit.mjs src/core/filmHistoryChapter*AuditContract.test.ts src/ui/data/filmScenarios.ts src/ui/data/scenarioFilmStudyMap.ts src/ui/data/scenarioProductionVerificationRegistry.ts
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 1
          fi
          git commit -m "Materialize Chapter 18 Parasite integration [materialized]"
          git push origin HEAD:agent/ch18-parasite-production-case
