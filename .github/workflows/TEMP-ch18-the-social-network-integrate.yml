name: TEMP Chapter 18 The Social Network integration

on:
  push:
    branches:
      - agent/ch18-the-social-network-production-case
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch18-the-social-network-production-case
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair Social Network learning contracts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/core/chapterEighteenTheSocialNetworkExpansion.ts';
          let t = fs.readFileSync(p, 'utf8');
          const conformFrom = 'Keep conform distinct from color grading: editorial assembled the DI while Light Iron/Ian Vertovec performed the final grade on Quantel Pablo.';
          const conformTo = 'Keep conform distinct from color grading: editorial assembled the DI in After Effects while Light Iron/Ian Vertovec performed the final grade on Quantel Pablo.';
          if (!t.includes(conformTo)) {
            if (!t.includes(conformFrom)) throw new Error('Expected Social Network conform learning goal not found');
            t = t.replace(conformFrom, conformTo);
          }
          const vfxFrom = 'Preserve the VFX-count discrepancy: contemporary reports say nearly 1,000 effects shots while an HPA presentation cites about 1,200.';
          const vfxTo = 'Preserve the VFX-count discrepancy: contemporary reports place the film near-1,000 effects shots while an HPA presentation cites about 1,200.';
          if (!t.includes(vfxTo)) {
            if (!t.includes(vfxFrom)) throw new Error('Expected Social Network VFX-count learning goal not found');
            t = t.replace(vfxFrom, vfxTo);
          }
          const penceFrom = 'Do not erase Josh Pence from the performance history simply because facial replacement hides him in many finished shots.';
          const penceTo = 'Do not erase Josh Pence or his physical performance from the performance history simply because facial replacement hides him in many finished shots.';
          if (!t.includes(penceTo)) {
            if (!t.includes(penceFrom)) throw new Error('Expected Josh Pence learning goal not found');
            t = t.replace(penceFrom, penceTo);
          }
          fs.writeFileSync(p, t);
          NODE
      - name: Materialize integration
        run: node scripts/TEMP-ch18-the-social-network-integrate.mjs
      - name: Commit deterministic integration
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          git commit -m "Normalize Social Network learning contracts"
          git push origin HEAD:agent/ch18-the-social-network-production-case

# TEMP repair preserves strict conform, source-count and distributed-performance boundaries.
# User-authored no-op change to verify the third repaired materialized 506/506 head.
