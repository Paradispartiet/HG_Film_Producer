name: TEMP Chapter 18 The Social Network integration

on:
  push:
    branches:
      - agent/ch18-the-social-network-production-case
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch18-the-social-network-production-case
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair conform-to-grade learning contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/core/chapterEighteenTheSocialNetworkExpansion.ts';
          let t = fs.readFileSync(p, 'utf8');
          const from = 'Keep conform distinct from color grading: editorial assembled the DI while Light Iron/Ian Vertovec performed the final grade on Quantel Pablo.';
          const to = 'Keep conform distinct from color grading: editorial assembled the DI in After Effects while Light Iron/Ian Vertovec performed the final grade on Quantel Pablo.';
          if (!t.includes(to)) {
            if (!t.includes(from)) throw new Error('Expected Social Network conform learning goal not found');
            t = t.replace(from, to);
            fs.writeFileSync(p, t);
          }
          NODE
      - name: Materialize integration
        run: node scripts/TEMP-ch18-the-social-network-integrate.mjs
      - name: Commit deterministic integration
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          git commit -m "Repair Social Network conform-to-grade learning contract"
          git push origin HEAD:agent/ch18-the-social-network-production-case

# TEMP repair preserves the strict After Effects to Light Iron learning boundary.
