name: Verify representation closure candidates

on:
  push:
    branches:
      - agent/representation-closure-pass-20260910

permissions:
  contents: read

jobs:
  verify-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build frozen-core representation inventory
        run: node scripts/film-history-representation-coverage-audit-v1.mjs --write=.tmp/representation-closure.json
      - name: Prove Nollywood candidate presence or absence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const report = JSON.parse(readFileSync('.tmp/representation-closure.json', 'utf8'));
          const terms = /nollywood|nigeria|nigerian|lagos/i;
          const hits = [];
          const pvByScenario = new Map();
          for (const file of readdirSync('src/ui/data')) {
            if (!file.startsWith('scenarioProductionVerification') || !file.endsWith('.ts')) continue;
            const path = `src/ui/data/${file}`;
            const source = readFileSync(path, 'utf8');
            for (const match of source.matchAll(/scenarioId\s*:\s*["']([^"']+)["']/g)) {
              const paths = pvByScenario.get(match[1]) ?? [];
              paths.push({ path, source });
              pvByScenario.set(match[1], paths);
            }
          }
          for (const item of report.scenarioInventory) {
            const identityText = `${item.scenarioId}\n${item.title}\n${item.originalTitle ?? ''}\n${item.origin}`;
            const pvRecords = pvByScenario.get(item.scenarioId) ?? [];
            const pvText = pvRecords.map((record) => record.source).join('\n');
            if (terms.test(identityText) || terms.test(pvText)) {
              hits.push({
                scenarioId: item.scenarioId,
                title: item.title,
                year: item.year,
                reviewState: item.reviewState,
                paths: pvRecords.map((record) => record.path),
              });
            }
          }
          console.log(`FROZEN_CORE=${report.core.runtimeAtlasScenarios}`);
          console.log(`PRODUCTION_VERIFIED=${report.core.uniqueProductionVerificationIds}`);
          console.log(`NOLLYWOOD_NIGERIA_HITS=${hits.length}`);
          for (const hit of hits) console.log(`NOLLYWOOD_HIT\t${JSON.stringify(hit)}`);
          if (report.core.runtimeAtlasScenarios !== 613 || report.core.uniqueProductionVerificationIds !== 613) throw new Error('Frozen 613/613 invariant changed');
          NODE