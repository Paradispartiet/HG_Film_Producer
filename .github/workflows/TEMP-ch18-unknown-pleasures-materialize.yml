name: TEMP materialize Chapter 18 Unknown Pleasures

on:
  push:
    branches:
      - agent/ch18-unknown-pleasures-production-case

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch18-unknown-pleasures-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strengthen bright-exterior learning contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/chapterEighteenUnknownPleasuresExpansion.ts')
          s = p.read_text()
          old = 'Record that bright exterior conditions were problematic enough to reduce some exterior work.'
          new = 'Record that bright exterior limitations were problematic enough to reduce some exterior work.'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one bright-exterior learning-goal anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY

      - name: Materialize deterministic integration
        run: node scripts/TEMP-materialize-ch18-unknown-pleasures.mjs

      - name: Full v0.1 verification
        id: verify
        shell: bash
        run: |
          set +e
          npm run verify:v0.1 > TEMP-unknown-pleasures-verify.log 2>&1
          code=$?
          tail -n 500 TEMP-unknown-pleasures-verify.log > TEMP-unknown-pleasures-verify-tail.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat TEMP-unknown-pleasures-verify.log
          exit 0

      - name: Commit verification diagnostic
        if: steps.verify.outputs.exit_code != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f TEMP-unknown-pleasures-verify.log TEMP-unknown-pleasures-verify-tail.log
          git commit -m "Capture Unknown Pleasures verification failure [diagnostic]"
          git push origin HEAD:agent/ch18-unknown-pleasures-production-case

      - name: Enforce verification result
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1

      - name: Commit materialized permanent state
        if: steps.verify.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/film-history-chapter-twelve-atlas-resolved.json \
                  docs/film-history-chapter-thirteen-atlas-resolved.json \
                  docs/film-history-chapter-fourteen-atlas-resolved.json \
                  docs/film-history-chapter-fifteen-atlas-resolved.json \
                  docs/film-history-chapter-sixteen-atlas-resolved.json \
                  docs/film-history-chapter-seventeen-atlas-resolved.json \
                  docs/film-history-chapter-eighteen-atlas-resolved.json \
                  scripts/film-history-chapter-twelve-atlas-audit.mjs \
                  scripts/film-history-chapter-thirteen-atlas-audit.mjs \
                  scripts/film-history-chapter-fourteen-atlas-audit.mjs \
                  scripts/film-history-chapter-fifteen-atlas-audit.mjs \
                  scripts/film-history-chapter-sixteen-atlas-audit.mjs \
                  scripts/film-history-chapter-seventeen-atlas-audit.mjs \
                  scripts/film-history-chapter-eighteen-atlas-audit.mjs \
                  scripts/production-case-rest-audit.mjs \
                  src/core/chapterEighteenUnknownPleasuresExpansion.ts \
                  src/core/filmHistoryChapterTwelveAuditContract.test.ts \
                  src/core/filmHistoryChapterThirteenAuditContract.test.ts \
                  src/core/filmHistoryChapterFourteenAuditContract.test.ts \
                  src/core/filmHistoryChapterFifteenAuditContract.test.ts \
                  src/core/filmHistoryChapterSixteenAuditContract.test.ts \
                  src/core/filmHistoryChapterSeventeenAuditContract.test.ts \
                  src/core/filmHistoryChapterEighteenAuditContract.test.ts \
                  src/ui/data/filmScenarios.ts \
                  src/ui/data/scenarioProductionVerificationRegistry.ts \
                  src/ui/data/scenarioFilmStudyMap.ts
          git commit -m "Materialize Chapter 18 Unknown Pleasures integration [materialized]"
          git push origin HEAD:agent/ch18-unknown-pleasures-production-case
