name: Materialize Chapter 13 The Red Shoes

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

concurrency:
  group: ch13-the-red-shoes-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ch13-the-red-shoes-production-case'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Materialize permanent The Red Shoes integration
        run: node scripts/materialize-ch13-the-red-shoes.mjs
      - name: Generate canonical Chapter 12 Atlas report
        run: node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json
      - name: Generate canonical Chapter 13 Atlas report
        run: node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json
      - name: Full v0.1 verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee ch13-the-red-shoes-verify.log
      - name: Upload failed verification diagnostics
        if: steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ch13-the-red-shoes-materialize-diagnostics
          path: ch13-the-red-shoes-verify.log
      - name: Fail on verification error
        if: steps.verify.outcome == 'failure'
        run: exit 1
      - name: Commit permanent clean The Red Shoes diff
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          rm -f .github/workflows/ch13-the-red-shoes-materialize.yml
          rm -f scripts/materialize-ch13-the-red-shoes.mjs
          rm -f ch13-the-red-shoes-verify.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No materialized diff to commit"; exit 1; }
          git commit -m "Materialize The Red Shoes Chapter 13 Production Case"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
