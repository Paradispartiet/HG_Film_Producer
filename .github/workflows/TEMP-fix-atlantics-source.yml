name: TEMP fix Atlantics source contract

on:
  push:
    branches:
      - agent/ch18-atlantics-production-case

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch18-atlantics-production-case
          fetch-depth: 0
      - name: Apply exact source-only wording fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/chapterEighteenAtlanticsExpansion.ts')
          s = p.read_text()
          old = 'rehearsal days, camera-body discrepancy, full lens map'
          new = 'rehearsal days, VariCam body discrepancy, full lens map'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one source anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/chapterEighteenAtlanticsExpansion.ts
          git diff --cached --quiet && { echo 'No source change'; exit 1; }
          git commit -m "Fix Atlantics VariCam uncertainty wording"
          git push origin HEAD:agent/ch18-atlantics-production-case
