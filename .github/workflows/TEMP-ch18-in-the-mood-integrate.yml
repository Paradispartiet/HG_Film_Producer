name: TEMP Chapter 18 In the Mood for Love integration

on:
  push:
    branches:
      - agent/ch18-in-the-mood-for-love-production-case
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch18-in-the-mood-for-love-production-case
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Integrate In the Mood for Love into Atlas
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const read = (p) => fs.readFileSync(p, 'utf8');
          const write = (p, t) => fs.writeFileSync(p, t);
          function replaceRequired(text, from, to, label) {
            if (text.includes(to)) return text;
            if (!text.includes(from)) throw new Error(`Missing expected pattern for ${label}`);
            return text.replace(from, to);
          }

          {
            const path = 'src/core/chapterEighteenInTheMoodForLoveExpansion.ts';
            let t = read(path);
            t = t.replace('umeabayashi_and_nat_king_cole_layers', 'umebayashi_and_nat_king_cole_layers');
            write(path, t);
          }

          {
            const path = 'src/ui/data/filmScenarios.ts';
            let t = read(path);
            t = replaceRequired(
              t,
              'import { mergeChapterEighteenGleanersExpansion } from "../../core/chapterEighteenGleanersExpansion.js";\n',
              'import { mergeChapterEighteenGleanersExpansion } from "../../core/chapterEighteenGleanersExpansion.js";\nimport { mergeChapterEighteenInTheMoodForLoveExpansion } from "../../core/chapterEighteenInTheMoodForLoveExpansion.js";\n',
              'filmScenarios import',
            );
            t = replaceRequired(
              t,
              'const chapterEighteenGleanersScenarios = mergeChapterEighteenGleanersExpansion(chapterSeventeenGoodfellasScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterEighteenGleanersScenarios);',
              'const chapterEighteenGleanersScenarios = mergeChapterEighteenGleanersExpansion(chapterSeventeenGoodfellasScenarios);\nconst chapterEighteenInTheMoodForLoveScenarios = mergeChapterEighteenInTheMoodForLoveExpansion(chapterEighteenGleanersScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterEighteenInTheMoodForLoveScenarios);',
              'filmScenarios merge chain',
            );
            t = replaceRequired(
              t,
              '+manual_chapter_eighteen_gleaners_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_eighteen_gleaners_expansion_2026+manual_chapter_eighteen_in_the_mood_for_love_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              'filmScenarios source list',
            );
            t = replaceRequired(
              t,
              'Chapter 18 now begins with the source-first The Gleaners and I production case, preserving DV acquisition, documentary encounter, artisan editing, theatrical presentation, restoration and circulation as distinct evidence layers.',
              'Chapter 18 now begins with the source-first The Gleaners and I and In the Mood for Love production cases, preserving digital/documentary production on one side and transnational photochemical auteur production, cinematography succession, design, editing, music and Cannes deadline pressure on the other as distinct evidence layers.',
              'filmScenarios note',
            );
            write(path, t);
          }

          {
            const path = 'src/ui/data/scenarioProductionVerificationRegistry.ts';
            let t = read(path);
            t = replaceRequired(
              t,
              'import { gleanersProductionCaseVerification } from "./scenarioProductionVerificationGleaners";\n',
              'import { gleanersProductionCaseVerification } from "./scenarioProductionVerificationGleaners";\nimport { inTheMoodForLoveProductionCaseVerification } from "./scenarioProductionVerificationInTheMoodForLove";\n',
              'verification import',
            );
            t = replaceRequired(
              t,
              '  gleanersProductionCaseVerification,\n',
              '  gleanersProductionCaseVerification,\n  inTheMoodForLoveProductionCaseVerification,\n',
              'verification entry',
            );
            write(path, t);
          }

          {
            const path = 'src/ui/data/scenarioFilmStudyMap.ts';
            let t = read(path);
            t = replaceRequired(
              t,
              'import { gleanersFilmHistoryProfile } from "./scenarioFilmStudyChapterEighteenGleaners";\n',
              'import { gleanersFilmHistoryProfile } from "./scenarioFilmStudyChapterEighteenGleaners";\nimport { inTheMoodForLoveFilmHistoryProfile } from "./scenarioFilmStudyChapterEighteenInTheMoodForLove";\n',
              'Film Study import',
            );
            t = replaceRequired(
              t,
              '  [gleanersFilmHistoryProfile.scenarioId]: gleanersFilmHistoryProfile,\n',
              '  [gleanersFilmHistoryProfile.scenarioId]: gleanersFilmHistoryProfile,\n  [inTheMoodForLoveFilmHistoryProfile.scenarioId]: inTheMoodForLoveFilmHistoryProfile,\n',
              'Film Study entry',
            );
            write(path, t);
          }

          {
            const path = 'scripts/production-case-rest-audit.mjs';
            let t = read(path);
            t = replaceRequired(t, 'const EXPECTED_PLAYABLE_SCENARIOS = 494;', 'const EXPECTED_PLAYABLE_SCENARIOS = 495;', 'playable count');
            t = replaceRequired(t, 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 494;', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 495;', 'verified count');
            t = replaceRequired(
              t,
              '  "chapterEighteenGleanersExpansion.ts",\n',
              '  "chapterEighteenGleanersExpansion.ts",\n  "chapterEighteenInTheMoodForLoveExpansion.ts",\n',
              'production audit expansion list',
            );
            write(path, t);
          }

          const chapters = ['twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen'];
          for (const chapter of chapters) {
            const script = `scripts/film-history-chapter-${chapter}-atlas-audit.mjs`;
            let t = read(script);
            t = replaceRequired(t, 'const EXPECTED_ATLAS_COUNT = 494;', 'const EXPECTED_ATLAS_COUNT = 495;', `${chapter} atlas count`);
            t = replaceRequired(
              t,
              '  "chapterEighteenGleanersExpansion.ts",\n',
              '  "chapterEighteenGleanersExpansion.ts",\n  "chapterEighteenInTheMoodForLoveExpansion.ts",\n',
              `${chapter} expansion list`,
            );
            write(script, t);
          }

          for (const chapter of ['Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen']) {
            const path = `src/core/filmHistoryChapter${chapter}AuditContract.test.ts`;
            let t = read(path).replaceAll('494', '495');
            write(path, t);
          }

          {
            const path = 'src/core/filmHistoryChapterEighteenAuditContract.test.ts';
            let t = read(path);
            t = replaceRequired(
              t,
              '  "The Gleaners and I", "Platform", "Dancer in the Dark", "The Son\'s Room",',
              '  "The Gleaners and I", "Platform", "Dancer in the Dark", "In the Mood for Love", "The Son\'s Room",',
              'Chapter 18 existing queue',
            );
            t = replaceRequired(
              t,
              'const exactP0Queue = [\n  "In the Mood for Love", "Atanarjuat: The Fast Runner",',
              'const exactP0Queue = [\n  "Atanarjuat: The Fast Runner",',
              'Chapter 18 P0 queue',
            );
            t = replaceRequired(t, 'assert.equal(exactExisting.length, 37);', 'assert.equal(exactExisting.length, 38);', 'existing count');
            t = replaceRequired(t, 'assert.equal(exactP0Queue.length, 21);', 'assert.equal(exactP0Queue.length, 20);', 'P0 count');
            t = replaceRequired(t, 'assert.equal(resolved.recommendedNewProductionCases.length, 44);', 'assert.equal(resolved.recommendedNewProductionCases.length, 43);', 'recommended count');
            write(path, t);
          }

          for (const chapter of chapters) {
            cp.execFileSync('node', [`scripts/film-history-chapter-${chapter}-atlas-audit.mjs`, `--write=docs/film-history-chapter-${chapter}-atlas-resolved.json`], { stdio: 'inherit' });
          }
          cp.execFileSync('node', ['scripts/production-case-rest-audit.mjs'], { stdio: 'inherit' });

          const ch18 = JSON.parse(read('docs/film-history-chapter-eighteen-atlas-resolved.json'));
          if (ch18.atlas.actualCount !== 495 || ch18.verificationIndex.literalVerifiedScenarioIds !== 495) throw new Error('Chapter 18 did not reach 495/495');
          if (!ch18.byDecision.USE_EXISTING.includes('In the Mood for Love')) throw new Error('In the Mood for Love did not move to USE_EXISTING');
          if (ch18.byDecision.P0.includes('In the Mood for Love')) throw new Error('In the Mood for Love remains P0');
          if (ch18.byDecision.USE_EXISTING.length !== 38 || ch18.byDecision.P0.length !== 20 || ch18.byDecision.P1.length !== 23 || ch18.byDecision.P2.length !== 1 || ch18.recommendedNewProductionCases.length !== 43) {
            throw new Error(`Unexpected Chapter 18 queue counts: ${JSON.stringify(ch18.byDecision)}`);
          }
          console.log(JSON.stringify({ atlas: ch18.atlas.actualCount, verified: ch18.verificationIndex.literalVerifiedScenarioIds, useExisting: ch18.byDecision.USE_EXISTING.length, p0: ch18.byDecision.P0.length, p1: ch18.byDecision.P1.length, p2: ch18.byDecision.P2.length, recommended: ch18.recommendedNewProductionCases.length }, null, 2));
          NODE
      - name: Commit deterministic integration
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          git commit -m "Integrate In the Mood for Love into Chapter 18 Atlas"
          git push origin HEAD:agent/ch18-in-the-mood-for-love-production-case
