name: Bootstrap public preview publishing

on:
  push:
    branches:
      - agent/bootstrap-public-previews-2026-08-18
    paths:
      - .github/workflows/bootstrap-public-previews.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - name: Require migration credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ADMIN_TOKEN:-}" ]]; then
            echo 'REPO_ADMIN_TOKEN is not available in this repository.' >&2
            exit 1
          fi

      - name: Enable GitHub Pages for preview repositories
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          previews=(
            Paradispartiet/HG_Film_Producer-preview
            Paradispartiet/HistoryGo-FootballManager-preview
            Paradispartiet/History-Go-preview
          )
          for repo in "${previews[@]}"; do
            if gh api "repos/${repo}/pages" >/dev/null 2>&1; then
              gh api --method PUT "repos/${repo}/pages" -f build_type=workflow >/dev/null
              echo "Pages configured: ${repo}"
            else
              gh api --method POST "repos/${repo}/pages" -f build_type=workflow >/dev/null
              echo "Pages created: ${repo}"
            fi
          done

      - name: Install permanent publisher credential in private sources
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          sources=(
            Paradispartiet/HG_Film_Producer
            Paradispartiet/HistoryGo-FootballManager
            Paradispartiet/History-Go
          )
          for repo in "${sources[@]}"; do
            gh secret set PUBLIC_DEPLOY_TOKEN --repo "$repo" --body "$ADMIN_TOKEN"
            echo "PUBLIC_DEPLOY_TOKEN installed: ${repo}"
          done

      - name: Trigger first preview deployments
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          previews=(
            Paradispartiet/HG_Film_Producer-preview
            Paradispartiet/HistoryGo-FootballManager-preview
            Paradispartiet/History-Go-preview
          )
          for repo in "${previews[@]}"; do
            gh api --method POST "repos/${repo}/dispatches" -f event_type=publish-preview >/dev/null
            echo "Preview deploy triggered: ${repo}"
          done

      - name: Verify preview URLs become public
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            https://paradispartiet.github.io/HG_Film_Producer-preview/
            https://paradispartiet.github.io/HistoryGo-FootballManager-preview/
            https://paradispartiet.github.io/History-Go-preview/
          )
          for url in "${urls[@]}"; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --location --fail --silent --show-error --max-time 20 "${url}source-sha.txt" >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 5
            done
            if [[ "$ready" != true ]]; then
              echo "Preview did not become available: ${url}" >&2
              exit 1
            fi
            echo "Preview available: ${url}"
          done

      - name: Publish bootstrap success marker
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          status="{\"status\":\"success\",\"run_id\":\"${GITHUB_RUN_ID}\",\"source_sha\":\"${GITHUB_SHA}\"}"
          encoded="$(printf '%s\n' "$status" | base64 -w0)"
          gh api --method PUT \
            "repos/Paradispartiet/HG_Film_Producer-preview/contents/.bootstrap/status-${GITHUB_RUN_ID}.json" \
            -f message="Record public preview bootstrap ${GITHUB_RUN_ID}" \
            -f content="$encoded" >/dev/null
