name: TEMP Materialize Yeelen Chapter 16

on:
  push:
    branches:
      - agent/ch16-yeelen-production-case

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ch16-yeelen-production-case
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate Yeelen permanently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = "src/ui/data/filmScenarios.ts"
          text = read(path)
          text = replace_once(text,
              'import { mergeChapterSixteenOfficialStoryExpansion } from "../../core/chapterSixteenOfficialStoryExpansion.js";\n',
              'import { mergeChapterSixteenOfficialStoryExpansion } from "../../core/chapterSixteenOfficialStoryExpansion.js";\nimport { mergeChapterSixteenYeelenExpansion } from "../../core/chapterSixteenYeelenExpansion.js";\n',
              "filmScenarios import")
          text = replace_once(text,
              'const chapterSixteenOfficialStoryScenarios = mergeChapterSixteenOfficialStoryExpansion(chapterSixteenPoliceStoryScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenOfficialStoryScenarios);',
              'const chapterSixteenOfficialStoryScenarios = mergeChapterSixteenOfficialStoryExpansion(chapterSixteenPoliceStoryScenarios);\nconst chapterSixteenYeelenScenarios = mergeChapterSixteenYeelenExpansion(chapterSixteenOfficialStoryScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenYeelenScenarios);',
              "filmScenarios merge chain")
          text = replace_once(text,
              '+manual_chapter_sixteen_official_story_expansion_2026',
              '+manual_chapter_sixteen_official_story_expansion_2026+manual_chapter_sixteen_yeelen_expansion_2026',
              "filmScenarios source list")
          write(path, text)

          path = "src/ui/data/scenarioFilmStudyMap.ts"
          text = read(path)
          text = replace_once(text,
              'import { officialStoryFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenOfficialStory";\n',
              'import { officialStoryFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenOfficialStory";\nimport { yeelenFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenYeelen";\n',
              "Film Study import")
          text = replace_once(text,
              '  [officialStoryFilmHistoryProfile.scenarioId]: officialStoryFilmHistoryProfile,\n',
              '  [officialStoryFilmHistoryProfile.scenarioId]: officialStoryFilmHistoryProfile,\n  [yeelenFilmHistoryProfile.scenarioId]: yeelenFilmHistoryProfile,\n',
              "Film Study map")
          write(path, text)

          path = "src/ui/data/scenarioProductionVerificationRegistry.ts"
          text = read(path)
          text = replace_once(text,
              'import { officialStoryProductionCaseVerification } from "./scenarioProductionVerificationOfficialStory";\n',
              'import { officialStoryProductionCaseVerification } from "./scenarioProductionVerificationOfficialStory";\nimport { yeelenProductionCaseVerification } from "./scenarioProductionVerificationYeelen";\n',
              "verification import")
          text = replace_once(text,
              '  officialStoryProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
              '  officialStoryProductionCaseVerification,\n  yeelenProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
              "verification registry")
          write(path, text)

          atlas_scripts = [
              "scripts/film-history-chapter-twelve-atlas-audit.mjs",
              "scripts/film-history-chapter-thirteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fourteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fifteen-atlas-audit.mjs",
              "scripts/film-history-chapter-sixteen-atlas-audit.mjs",
          ]
          for path in atlas_scripts:
              text = read(path)
              text = replace_once(text, "const EXPECTED_ATLAS_COUNT = 453;", "const EXPECTED_ATLAS_COUNT = 454;", f"{path} count")
              text = replace_once(text,
                  '  "chapterSixteenOfficialStoryExpansion.ts",\n',
                  '  "chapterSixteenOfficialStoryExpansion.ts",\n  "chapterSixteenYeelenExpansion.ts",\n',
                  f"{path} expansion")
              write(path, text)

          path = "scripts/production-case-rest-audit.mjs"
          text = read(path)
          text = replace_once(text, "const EXPECTED_PLAYABLE_SCENARIOS = 453;", "const EXPECTED_PLAYABLE_SCENARIOS = 454;", "production playable")
          text = replace_once(text, "const EXPECTED_VERIFIED_PRODUCTION_CASES = 453;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 454;", "production verified")
          text = replace_once(text,
              '  "chapterSixteenOfficialStoryExpansion.ts",\n',
              '  "chapterSixteenOfficialStoryExpansion.ts",\n  "chapterSixteenYeelenExpansion.ts",\n',
              "production expansion")
          write(path, text)

          for path in [
              "src/core/filmHistoryChapterTwelveAuditContract.test.ts",
              "src/core/filmHistoryChapterThirteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFourteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFifteenAuditContract.test.ts",
          ]:
              text = read(path)
              if text.count("453") < 3:
                  raise SystemExit(f"{path}: missing 453 count locks")
              write(path, text.replace("453", "454"))

          path = "src/core/filmHistoryChapterSixteenAuditContract.test.ts"
          text = read(path)
          if text.count("453") < 4:
              raise SystemExit("Chapter 16 contract missing 453 count locks")
          text = text.replace("453", "454")
          text = replace_once(text,
              '  "Yeelen",\n  "Do the Right Thing",',
              '  "Do the Right Thing",',
              "Chapter 16 P0 removal")
          text = replace_once(text,
              '    "Yeelen",\n',
              '',
              "Chapter 16 recommended removal")
          text = replace_once(text,
              '  "Down by Law",\n  "Pelle the Conqueror",',
              '  "Down by Law",\n  "Yeelen",\n  "Pelle the Conqueror",',
              "Chapter 16 existing queue")
          text = replace_once(text,
              '    "Down by Law": "scenario_down_by_law_1986",\n    "Pelle the Conqueror":',
              '    "Down by Law": "scenario_down_by_law_1986",\n    "Yeelen": "scenario_yeelen_1987",\n    "Pelle the Conqueror":',
              "Chapter 16 exact ID")
          write(path, text)
          PY

      - name: Regenerate Chapter 12-16 Atlas reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json
          node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json

      - name: Assert canonical Yeelen result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('docs/film-history-chapter-sixteen-atlas-resolved.json', 'utf8'));
          if (report.atlas.expectedCount !== 454 || report.atlas.actualCount !== 454) throw new Error(`Atlas ${report.atlas.expectedCount}/${report.atlas.actualCount}`);
          if (report.verificationIndex.literalVerifiedScenarioIds !== 454) throw new Error(`Verification ${report.verificationIndex.literalVerifiedScenarioIds}`);
          const film = report.candidates.find((item) => item.title === 'Yeelen');
          if (!film || film.decision !== 'USE_EXISTING' || film.scenarioId !== 'scenario_yeelen_1987' || film.productionVerified !== true) throw new Error(`Yeelen resolution ${JSON.stringify(film)}`);
          const p0 = ['Do the Right Thing'];
          if (JSON.stringify(report.byDecision.P0) !== JSON.stringify(p0)) throw new Error(`P0 ${JSON.stringify(report.byDecision.P0)}`);
          const p1 = ['Mephisto','Missing','Blade Runner','E.T. the Extra-Terrestrial','Sugar Cane Alley','The Terminator','Come and See','Back to the Future','Aliens',"She's Gotta Have It",'A Better Tomorrow','RoboCop','Salaam Bombay!'];
          if (JSON.stringify(report.byDecision.P1) !== JSON.stringify(p1)) throw new Error(`P1 ${JSON.stringify(report.byDecision.P1)}`);
          NODE

      - name: Verify full v0.1
        run: npm run verify:v0.1

      - name: Commit permanent integration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ch16-yeelen-materialize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/film-history-chapter-twelve-atlas-resolved.json \
            docs/film-history-chapter-thirteen-atlas-resolved.json \
            docs/film-history-chapter-fourteen-atlas-resolved.json \
            docs/film-history-chapter-fifteen-atlas-resolved.json \
            docs/film-history-chapter-sixteen-atlas-resolved.json \
            scripts/film-history-chapter-twelve-atlas-audit.mjs \
            scripts/film-history-chapter-thirteen-atlas-audit.mjs \
            scripts/film-history-chapter-fourteen-atlas-audit.mjs \
            scripts/film-history-chapter-fifteen-atlas-audit.mjs \
            scripts/film-history-chapter-sixteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterTwelveAuditContract.test.ts \
            src/core/filmHistoryChapterThirteenAuditContract.test.ts \
            src/core/filmHistoryChapterFourteenAuditContract.test.ts \
            src/core/filmHistoryChapterFifteenAuditContract.test.ts \
            src/core/filmHistoryChapterSixteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          git diff --cached --check
          git commit -m "Materialize Yeelen Chapter 16 Production Case"
          git push origin HEAD:agent/ch16-yeelen-production-case
