name: Minimize Chapter 5 representation audit diff

on:
  push:
    branches:
      - agent/film-history-ch5-representation-mapping

permissions:
  contents: write

jobs:
  minimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-history-ch5-representation-mapping
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild minimal Chapter 5 audit diff from exact base
        shell: bash
        run: |
          git show b464d31e863e1f05fe787cbdb74139cb8eb9515d:data/film/film_history_representation_coverage_v1.json > data/film/film_history_representation_coverage_v1.json
          python3 <<'PY'
          from pathlib import Path

          path = Path('data/film/film_history_representation_coverage_v1.json')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match, found {text.count(old)} for: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '      "development_id": "decolonial_transnational_historiography",\n      "declared_status": 1,',
              '      "development_id": "decolonial_transnational_historiography",\n      "declared_status": 3,'
          )
          replace_once(
              '      "required_evidence": "Exact scenarios must document production, financing, circulation or recovery histories across colonial, postcolonial or transnational systems."\n    },\n    {\n      "development_id": "nordic_norwegian_silent_and_institution_history",',
              '      "required_evidence": "Exact scenarios must document production, financing, circulation or recovery histories across colonial, postcolonial or transnational systems.",\n      "triangulation_basis": "Queen Elizabeth separates French Le Film d’Art production from United States rights, financing and presentation; Cabiria adds Turin-based Itala Film spectacle with documented worldwide success and export ambition; Atlantis adds Nordisk’s internationally oriented feature production and a Russian-market alternate ending. Together these cases triangulate transnational production, rights/circulation and market-specific versioning across France, Italy, Denmark, the United States and Russia without treating nationality alone as coverage."\n    },\n    {\n      "development_id": "nordic_norwegian_silent_and_institution_history",'
          )
          replace_once(
              '      "development_id": "nordic_norwegian_silent_and_institution_history",\n      "declared_status": 0,',
              '      "development_id": "nordic_norwegian_silent_and_institution_history",\n      "declared_status": 3,'
          )
          replace_once(
              '      "required_evidence": "Exact Nordic or Norwegian scenarios must be mapped to companies, export, labor, exhibition or film institutions with inspectable production evidence."\n    },\n    {\n      "development_id": "animation_technique_labor_and_delivery_history",',
              '      "required_evidence": "Exact Nordic or Norwegian scenarios must be mapped to companies, export, labor, exhibition or film institutions with inspectable production evidence.",\n      "triangulation_basis": "Afgrunden documents a compact Kosmorama production around Urban Gad, Alfred Lind and Asta Nielsen, including an eight-day Danish shoot and a star identity that travelled internationally; Atlantis contrasts this with Nordisk Films Kompagni’s biggest and most ambitious prewar feature, longer-film infrastructure, international orientation and market-specific Russian ending. The two exact Danish cases triangulate company scale, workflow, star circulation and export/versioning inside Nordic silent cinema."\n    },\n    {\n      "development_id": "animation_technique_labor_and_delivery_history",'
          )
          replace_once(
              '      "development_id": "genre_industries_horror_action_comedy_romance_exploitation_local_popular",\n      "declared_status": 2,',
              '      "development_id": "genre_industries_horror_action_comedy_romance_exploitation_local_popular",\n      "declared_status": 3,'
          )
          replace_once(
              '      "required_evidence": "Complementary exact scenarios must show popular genres as distinct production and distribution systems, not merely aesthetic categories."\n    },\n    {\n      "development_id": "india_modern_industry_system",',
              '      "required_evidence": "Complementary exact scenarios must show popular genres as distinct production and distribution systems, not merely aesthetic categories.",\n      "triangulation_basis": "Histoire d’un crime and Traffic in Souls establish French Pathé crime production and American IMP/Universal sensational-feature economics; Fantômas adds Gaumont recurring crime-cycle production with stable characters, adaptation and distributor infrastructure; Cabiria adds a distinct Italian historical-epic production system at export scale. The mapped cases now triangulate genre industry across crime, sensational melodrama and epic spectacle, multiple companies and several national production/distribution systems."\n    },\n    {\n      "development_id": "india_modern_industry_system",'
          )
          replace_once(
              '      "triangulation_basis": "A Trip to the Moon documents rediscovery and image-by-image restoration of recovered colour material; Life of an American Fireman shows an original copyright paper print overturning a mistaken later cross-cut reconstruction; Attack on a China Mission shows rediscovered copies and later archive reconstruction changing the apparent editing structure; The Story of the Kelly Gang adds fragmentary survival and modern reconstruction/restoration of a lost complete feature; Workers Leaving the Lumière Factory and Rescued by Rover add surviving-version and replacement/re-shot histories."',
              '      "triangulation_basis": "A Trip to the Moon documents rediscovery and image-by-image restoration of recovered colour material; Life of an American Fireman shows an original copyright paper print overturning a mistaken later cross-cut reconstruction; Attack on a China Mission shows rediscovered copies and archive reconstruction changing the apparent editing structure; The Story of the Kelly Gang adds fragmentary survival and reconstruction; Cabiria separates reconstructed 1914 material from Pastrone’s altered 1931 sound reissue; Afgrunden adds deteriorated surviving material and a key dance passage recovered from Swedish censorship holdings. Workers Leaving the Lumière Factory and Rescued by Rover retain additional surviving-version and replacement/re-shot evidence."'
          )

          marker = '\n  ],\n  "candidate_admission_gate": {'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one scenario_reviews end marker, found {text.count(marker)}')
          insertion = '''
,
    {
      "scenario_id": "scenario_fantomas_1913",
      "review_state": "MAPPED",
      "development_ids": ["genre_industries_horror_action_comedy_romance_exploitation_local_popular"],
      "evidence_paths": ["src/ui/data/scenarioProductionVerificationFantomas.ts"],
      "rationale": "The verified Gaumont case documents a five-film recurring crime cycle with Feuillade, Souvestre–Allain adaptation, René Navarre and a stable recurring ensemble, plus Comptoir Ciné-Location distribution evidence. This makes recurring popular crime production and return-audience continuity an exact company/genre system rather than a style label."
    },
    {
      "scenario_id": "scenario_cabiria_1914",
      "review_state": "MAPPED",
      "development_ids": ["decolonial_transnational_historiography", "genre_industries_horror_action_comedy_romance_exploitation_local_popular", "preservation_restoration_material_survival_as_history_maker"],
      "evidence_paths": ["src/ui/data/scenarioProductionVerificationCabiria.ts"],
      "rationale": "The verified Itala Film case joins Turin-based feature-scale epic production, a multi-person cinematography/effects system, original music and documented worldwide success/export ambition. Its reconstructed 1914 edition and separately restored 1931 sound reissue also make version recovery and preservation history explicit rather than collapsing them into one master."
    },
    {
      "scenario_id": "scenario_afgrunden_1910",
      "review_state": "MAPPED",
      "development_ids": ["nordic_norwegian_silent_and_institution_history", "preservation_restoration_material_survival_as_history_maker"],
      "evidence_paths": ["src/ui/data/scenarioProductionVerificationAfgrunden.ts"],
      "rationale": "The verified Danish case identifies Kosmorama production, an eight-day shoot, Copenhagen/Frederiksberg locations, 35 mm silent format and Asta Nielsen’s internationally travelling star breakthrough. The archival record also documents chemical deterioration and dance-scene material recovered from Swedish censorship holdings, directly linking Nordic production history to material survival."
    },
    {
      "scenario_id": "scenario_atlantis_1913",
      "review_state": "MAPPED",
      "development_ids": ["decolonial_transnational_historiography", "nordic_norwegian_silent_and_institution_history"],
      "evidence_paths": ["src/ui/data/scenarioProductionVerificationAtlantis.ts"],
      "rationale": "The verified Nordisk case documents the company’s biggest and most ambitious prewar feature, 2280 metres of 35 mm production, international orientation and two market-specific endings including an unhappy Russian-market version. This is exact Nordic institutional/export evidence and a concrete transnational versioning strategy."
    }'''
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text)
          PY
      - name: Verify minimal Chapter 5 audit branch
        run: npm run verify:v0.1
      - name: Commit minimal permanent audit diff
        shell: bash
        run: |
          rm .github/workflows/ch5-representation-minimize-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/film/film_history_representation_coverage_v1.json .github/workflows/ch5-representation-minimize-diff.yml
          git commit -m "Minimize Chapter 5 representation audit diff"
          git push origin HEAD:agent/film-history-ch5-representation-mapping
