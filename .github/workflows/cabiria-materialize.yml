name: Materialize Cabiria production case

on:
  push:
    branches:
      - agent/cabiria-1914

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cabiria-1914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize Cabiria and permanent gates
        shell: bash
        env:
          CABIRIA_BLOCK_B64: 
          CH5_TEST_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Missing expected text in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          chapter = Path("src/core/chapterFiveInternationalExpansion.ts")
          text = chapter.read_text()
          marker = "  },\n] as const;"
          if marker not in text:
              raise SystemExit("Cabiria insertion marker missing")
          cabiria = base64.b64decode(os.environ["CABIRIA_BLOCK_B64"]).decode()
          chapter.write_text(text.replace(marker, cabiria + "] as const;", 1))

          Path("src/core/chapterFiveInternationalExpansion.test.ts").write_text(
              base64.b64decode(os.environ["CH5_TEST_B64"]).decode()
          )

          replace_once(
              "src/ui/data/scenarioFilmStudyMap.ts",
              'import { fantomasFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsFantomas";',
              'import { fantomasFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsFantomas";\nimport { cabiriaFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsCabiria";'
          )
          replace_once(
              "src/ui/data/scenarioFilmStudyMap.ts",
              '  [fantomasFilmHistoryProfile.scenarioId]: fantomasFilmHistoryProfile,',
              '  [fantomasFilmHistoryProfile.scenarioId]: fantomasFilmHistoryProfile,\n  [cabiriaFilmHistoryProfile.scenarioId]: cabiriaFilmHistoryProfile,'
          )
          replace_once(
              "src/ui/data/scenarioProductionVerificationRegistry.ts",
              'import { fantomasProductionCaseVerification } from "./scenarioProductionVerificationFantomas";',
              'import { fantomasProductionCaseVerification } from "./scenarioProductionVerificationFantomas";\nimport { cabiriaProductionCaseVerification } from "./scenarioProductionVerificationCabiria";'
          )
          replace_once(
              "src/ui/data/scenarioProductionVerificationRegistry.ts",
              '  fantomasProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
              '  fantomasProductionCaseVerification,\n  cabiriaProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,'
          )
          replace_once("scripts/production-case-rest-audit.mjs", "const EXPECTED_PLAYABLE_SCENARIOS = 395;", "const EXPECTED_PLAYABLE_SCENARIOS = 396;")
          replace_once("scripts/production-case-rest-audit.mjs", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 395;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 396;")
          replace_once("scripts/film-history-chapter-five-atlas-audit.mjs", "const EXPECTED_ATLAS_COUNT = 395;", "const EXPECTED_ATLAS_COUNT = 396;")
          replace_once(
              "scripts/film-history-chapter-five-atlas-audit.mjs",
              '  USE_EXISTING: ["Fantômas", "Queen Elizabeth", "Traffic in Souls"],',
              '  USE_EXISTING: ["Cabiria", "Fantômas", "Queen Elizabeth", "Traffic in Souls"],'
          )
          replace_once("scripts/film-history-chapter-five-atlas-audit.mjs", '  P0: ["Cabiria"],', '  P0: []')
          PY
      - name: Verify complete Cabiria branch
        run: npm run verify:v0.1
      - name: Commit verified materialization
        shell: bash
        run: |
          rm .github/workflows/cabiria-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Cabiria Chapter 5 production case"
          git push origin HEAD:agent/cabiria-1914
