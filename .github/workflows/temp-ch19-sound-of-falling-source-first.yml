name: TEMP Chapter 19 Sound of Falling source-first

on:
  push:
    branches:
      - agent/ch19-sound-of-falling-production-case
    paths:
      - .github/workflows/temp-ch19-sound-of-falling-source-first.yml
      - src/core/chapterNineteenSoundOfFallingExpansion.ts
      - src/core/chapterNineteenSoundOfFallingExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationSoundOfFalling.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenSoundOfFalling.ts

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-sound-of-falling-production-case
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build core
        run: npm run build
      - name: Strict Sound of Falling contract
        run: node --test dist/core/chapterNineteenSoundOfFallingExpansion.test.js
      - name: Build UI
        run: npm run build:ui
