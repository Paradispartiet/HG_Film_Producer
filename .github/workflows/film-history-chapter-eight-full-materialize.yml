name: Materialize Film History Chapter 8 full text

on:
  push:
    branches:
      - agent/film-history-chapter-eight-full
    paths:
      - .github/workflows/film-history-chapter-eight-full-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-history-chapter-eight-full
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate Chapter 8 into canonical book
        run: python3 scripts/materialize-film-history-chapter-eight-full.py
      - name: Full v0.1 verification with captured output
        id: verify
        shell: bash
        run: |
          set +e
          npm run verify:v0.1 > verify-output.log 2>&1
          status=$?
          cat verify-output.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist verification failure for diagnosis
        if: steps.verify.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f verify-output.log
          git commit -m "Capture Chapter 8 full-text verification failure"
          git push origin HEAD:agent/film-history-chapter-eight-full
          exit 1
      - name: Commit verified Chapter 8 and remove temporary files
        if: steps.verify.outputs.status == '0'
        shell: bash
        run: |
          rm -f verify-output.log
          rm .github/workflows/film-history-chapter-eight-full-materialize.yml
          rm scripts/materialize-film-history-chapter-eight-full.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Film History Chapter 8 full text"
          git push origin HEAD:agent/film-history-chapter-eight-full
