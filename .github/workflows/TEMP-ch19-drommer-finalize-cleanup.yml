name: TEMP Drømmer finalize cleanup

on:
  push:
    branches:
      - agent/ch19-drommer-production-case

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register Drømmer source metadata and clean TEMP files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ui/data/filmScenarios.ts')
          text = path.read_text()
          before = 'manual_chapter_nineteen_sound_of_falling_expansion_2026+manual_chapter_nineteen_eo_expansion_2026'
          after = 'manual_chapter_nineteen_sound_of_falling_expansion_2026+manual_chapter_nineteen_drommer_expansion_2026+manual_chapter_nineteen_eo_expansion_2026'
          if after not in text:
              if text.count(before) != 1:
                  raise SystemExit(f'expected exactly one source_list_id marker or already-correct metadata; found {text.count(before)}')
              text = text.replace(before, after, 1)
              path.write_text(text)
          PY
          grep -F 'manual_chapter_nineteen_drommer_expansion_2026' src/ui/data/filmScenarios.ts
          rm -f .github/workflows/TEMP-ch19-drommer-source-list-cleanup.yml
          rm -f .github/workflows/TEMP-ch19-drommer-finalize-cleanup.yml
          test ! -e .github/workflows/TEMP-ch19-drommer-source-list-cleanup.yml
          test ! -e .github/workflows/TEMP-ch19-drommer-finalize-cleanup.yml

      - name: Commit clean Drømmer metadata
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "Register Drømmer scenario source metadata"
            git push origin HEAD:agent/ch19-drommer-production-case
          fi
