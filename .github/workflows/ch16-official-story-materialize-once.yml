name: TEMP Materialize The Official Story Chapter 16

on:
  push:
    branches:
      - agent/ch16-the-official-story-production-case

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ch16-the-official-story-production-case
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate The Official Story permanently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = "src/ui/data/filmScenarios.ts"
          text = read(path)
          text = replace_once(text,
              'import { mergeChapterSixteenPoliceStoryExpansion } from "../../core/chapterSixteenPoliceStoryExpansion.js";\n',
              'import { mergeChapterSixteenPoliceStoryExpansion } from "../../core/chapterSixteenPoliceStoryExpansion.js";\nimport { mergeChapterSixteenOfficialStoryExpansion } from "../../core/chapterSixteenOfficialStoryExpansion.js";\n',
              "filmScenarios import")
          text = replace_once(text,
              'const chapterSixteenPoliceStoryScenarios = mergeChapterSixteenPoliceStoryExpansion(chapterSixteenMyBeautifulLaundretteScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenPoliceStoryScenarios);',
              'const chapterSixteenPoliceStoryScenarios = mergeChapterSixteenPoliceStoryExpansion(chapterSixteenMyBeautifulLaundretteScenarios);\nconst chapterSixteenOfficialStoryScenarios = mergeChapterSixteenOfficialStoryExpansion(chapterSixteenPoliceStoryScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenOfficialStoryScenarios);',
              "filmScenarios merge chain")
          text = replace_once(text,
              '+manual_chapter_sixteen_police_story_expansion_2026',
              '+manual_chapter_sixteen_police_story_expansion_2026+manual_chapter_sixteen_official_story_expansion_2026',
              "filmScenarios source list")
          write(path, text)

          path = "src/ui/data/scenarioFilmStudyMap.ts"
          text = read(path)
          text = replace_once(text,
              'import { policeStoryFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenPoliceStory";\n',
              'import { policeStoryFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenPoliceStory";\nimport { officialStoryFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenOfficialStory";\n',
              "Film Study import")
          text = replace_once(text,
              '  [policeStoryFilmHistoryProfile.scenarioId]: policeStoryFilmHistoryProfile,\n',
              '  [policeStoryFilmHistoryProfile.scenarioId]: policeStoryFilmHistoryProfile,\n  [officialStoryFilmHistoryProfile.scenarioId]: officialStoryFilmHistoryProfile,\n',
              "Film Study map")
          write(path, text)

          path = "src/ui/data/scenarioProductionVerificationRegistry.ts"
          text = read(path)
          text = replace_once(text,
              'import { policeStoryProductionCaseVerification } from "./scenarioProductionVerificationPoliceStory";\n',
              'import { policeStoryProductionCaseVerification } from "./scenarioProductionVerificationPoliceStory";\nimport { officialStoryProductionCaseVerification } from "./scenarioProductionVerificationOfficialStory";\n',
              "verification import")
          text = replace_once(text,
              '  policeStoryProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
              '  policeStoryProductionCaseVerification,\n  officialStoryProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
              "verification registry")
          write(path, text)

          atlas_scripts = [
              "scripts/film-history-chapter-twelve-atlas-audit.mjs",
              "scripts/film-history-chapter-thirteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fourteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fifteen-atlas-audit.mjs",
              "scripts/film-history-chapter-sixteen-atlas-audit.mjs",
          ]
          for path in atlas_scripts:
              text = read(path)
              text = replace_once(text, "const EXPECTED_ATLAS_COUNT = 452;", "const EXPECTED_ATLAS_COUNT = 453;", f"{path} count")
              text = replace_once(text,
                  '  "chapterSixteenPoliceStoryExpansion.ts",\n',
                  '  "chapterSixteenPoliceStoryExpansion.ts",\n  "chapterSixteenOfficialStoryExpansion.ts",\n',
                  f"{path} expansion")
              write(path, text)

          path = "scripts/production-case-rest-audit.mjs"
          text = read(path)
          text = replace_once(text, "const EXPECTED_PLAYABLE_SCENARIOS = 452;", "const EXPECTED_PLAYABLE_SCENARIOS = 453;", "production playable")
          text = replace_once(text, "const EXPECTED_VERIFIED_PRODUCTION_CASES = 452;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 453;", "production verified")
          text = replace_once(text,
              '  "chapterSixteenPoliceStoryExpansion.ts",\n',
              '  "chapterSixteenPoliceStoryExpansion.ts",\n  "chapterSixteenOfficialStoryExpansion.ts",\n',
              "production expansion")
          write(path, text)

          for path in [
              "src/core/filmHistoryChapterTwelveAuditContract.test.ts",
              "src/core/filmHistoryChapterThirteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFourteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFifteenAuditContract.test.ts",
          ]:
              text = read(path)
              if text.count("452") < 3:
                  raise SystemExit(f"{path}: missing 452 count locks")
              write(path, text.replace("452", "453"))

          path = "src/core/filmHistoryChapterSixteenAuditContract.test.ts"
          text = read(path)
          if text.count("452") < 4:
              raise SystemExit("Chapter 16 contract missing 452 count locks")
          text = text.replace("452", "453")
          text = replace_once(text,
              '  "The Official Story",\n  "Yeelen",',
              '  "Yeelen",',
              "Chapter 16 P0 removal")
          text = replace_once(text,
              '        "The Official Story",\n',
              '',
              "Chapter 16 recommended removal")
          text = replace_once(text,
              '  "Police Story",\n  "Down by Law",',
              '  "Police Story",\n  "The Official Story",\n  "Down by Law",',
              "Chapter 16 existing queue")
          text = replace_once(text,
              '    "Police Story": "scenario_police_story_1985",\n    "Down by Law":',
              '    "Police Story": "scenario_police_story_1985",\n    "The Official Story": "scenario_the_official_story_1985",\n    "Down by Law":',
              "Chapter 16 exact ID")
          write(path, text)
          PY

      - name: Regenerate Chapter 12-16 Atlas reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json
          node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json

      - name: Assert canonical The Official Story result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('docs/film-history-chapter-sixteen-atlas-resolved.json', 'utf8'));
          if (report.atlas.expectedCount !== 453 || report.atlas.actualCount !== 453) throw new Error(`Atlas ${report.atlas.expectedCount}/${report.atlas.actualCount}`);
          if (report.verificationIndex.literalVerifiedScenarioIds !== 453) throw new Error(`Verification ${report.verificationIndex.literalVerifiedScenarioIds}`);
          const film = report.candidates.find((item) => item.title === 'The Official Story');
          if (!film || film.decision !== 'USE_EXISTING' || film.scenarioId !== 'scenario_the_official_story_1985' || film.productionVerified !== true) throw new Error(`The Official Story resolution ${JSON.stringify(film)}`);
          const p0 = ['Yeelen', 'Do the Right Thing'];
          if (JSON.stringify(report.byDecision.P0) !== JSON.stringify(p0)) throw new Error(`P0 ${JSON.stringify(report.byDecision.P0)}`);
          const p1 = ['Mephisto','Missing','Blade Runner','E.T. the Extra-Terrestrial','Sugar Cane Alley','The Terminator','Come and See','Back to the Future','Aliens',"She's Gotta Have It",'A Better Tomorrow','RoboCop','Salaam Bombay!'];
          if (JSON.stringify(report.byDecision.P1) !== JSON.stringify(p1)) throw new Error(`P1 ${JSON.stringify(report.byDecision.P1)}`);
          NODE

      - name: Verify full v0.1
        run: npm run verify:v0.1

      - name: Commit permanent integration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ch16-official-story-materialize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/film-history-chapter-twelve-atlas-resolved.json \
            docs/film-history-chapter-thirteen-atlas-resolved.json \
            docs/film-history-chapter-fourteen-atlas-resolved.json \
            docs/film-history-chapter-fifteen-atlas-resolved.json \
            docs/film-history-chapter-sixteen-atlas-resolved.json \
            scripts/film-history-chapter-twelve-atlas-audit.mjs \
            scripts/film-history-chapter-thirteen-atlas-audit.mjs \
            scripts/film-history-chapter-fourteen-atlas-audit.mjs \
            scripts/film-history-chapter-fifteen-atlas-audit.mjs \
            scripts/film-history-chapter-sixteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterTwelveAuditContract.test.ts \
            src/core/filmHistoryChapterThirteenAuditContract.test.ts \
            src/core/filmHistoryChapterFourteenAuditContract.test.ts \
            src/core/filmHistoryChapterFifteenAuditContract.test.ts \
            src/core/filmHistoryChapterSixteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          git diff --cached --check
          git commit -m "Materialize The Official Story Chapter 16 Production Case"
          git push origin HEAD:agent/ch16-the-official-story-production-case
