name: Retry Chapter 19 representation materialization

on:
  push:
    branches:
      - agent/chapter-19-representation-audit

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build exact Chapter 19 audit report
        run: node scripts/film-history-chapter-nineteen-atlas-audit.mjs --write=.tmp/chapter19-audit.json
      - name: Run corrected existing materializer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/chapter19-materialize.yml').read_text()
          src = src.replace('report.productionVerification.literalScenarioIds', 'report.verificationIndex.literalVerifiedScenarioIds')
          marker = "node --input-type=module <<'NODE'\n"
          start = src.index(marker) + len(marker)
          end = src.index('\n          NODE', start)
          lines = src[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/chapter19-materialize.mjs').write_text(code)
          PY
          node /tmp/chapter19-materialize.mjs
      - name: Commit clean permanent tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chapter19-materialize.yml .github/workflows/chapter19-materialize-retry.yml
          git add data/film/film_history_representation_coverage_v1.json
          git diff --cached --check
          git commit -m 'Audit Chapter 19 representation coverage'
          test "$(git diff --name-only origin/main...HEAD | sort)" = "data/film/film_history_representation_coverage_v1.json"
          git push origin HEAD:agent/chapter-19-representation-audit
