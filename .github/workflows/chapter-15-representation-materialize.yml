name: Chapter 15 representation materialize

on:
  push:
    branches:
      - agent/chapter-15-representation-audit

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chapter-15-representation-audit
          fetch-depth: 0
      - name: Materialize canonical Chapter 15 coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'data/film/film_history_representation_coverage_v1.json';
          let text = fs.readFileSync(path, 'utf8');
          const original = JSON.parse(text);
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const latinId = 'latin_america_beyond_single_movement';
          const newReviews = [
            {
              scenario_id: 'scenario_bonnie_and_clyde_1967',
              review_state: 'MAPPED',
              development_ids: ['modern_popular_commercial_cinema_as_industry', 'genre_industries_horror_action_comedy_romance_exploitation_local_popular'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationNewHollywoodBlockbusterBatch.ts'],
              rationale: 'The verified Beatty-led case documents producer-star development, Texas and Burbank production, period craft, practical violence and studio distribution at the opening of New Hollywood. It therefore adds an exact commercially distributed crime-production system to the modern-popular and genre-industry rows rather than treating New Hollywood as an auteur label.'
            },
            {
              scenario_id: 'scenario_the_cremator_1969',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationCzechoslovakNewWaveBatch.ts'],
              rationale: 'The verified Czechoslovak case ties Fuks adaptation, wide-angle psychological distortion, associative editing, production design and Liška’s score to a 1968 institutional production whose post-Prague-Spring suppression is documented. BFI places Herz within and at the edge of the Czechoslovak New Wave, so the movement mapping is production-situated rather than stylistic.'
            },
            {
              scenario_id: 'scenario_kes_1969',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationBritishIrishPlaceBodySystemsBatch.ts'],
              rationale: 'The verified tiny United Artists-backed 35 mm production documents Barnsley location work, Hines-Loach adaptation, first-time-performer training, Chris Menges photography and distributor resistance to Yorkshire dialect followed by regional release. It anchors British social-realist alternative practice to exact scale, location, labor and circulation choices.'
            },
            {
              scenario_id: 'scenario_the_conformist_1970',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationEuropeanPoliticalFeministModernismBatch.ts'],
              rationale: 'The verified Moravia adaptation binds fractured political memory, Fascist architecture, Scarfiotti design, Storaro’s mobile colour-and-shadow system and Delerue’s score to an inspectable production with documented resource constraints. It therefore maps European political modernism through concrete collaborative craft rather than through Bertolucci’s auteur status.'
            },
            {
              scenario_id: 'scenario_a_clockwork_orange_1971',
              review_state: 'REVIEWED_NO_MAPPING',
              development_ids: [],
              rationale: 'The verified case strongly documents British-based Warner production, existing modernist locations, controlled camera and editing craft, Wendy Carlos’s music system and exhibition controversy. Those facts are central to Chapter 15, but the current matrix has no dedicated ratings/censorship or 1970s studio-auteur transition row, so the case remains reviewed without forcing a modernism or commercial-industry mapping.'
            },
            {
              scenario_id: 'scenario_the_godfather_1972',
              review_state: 'MAPPED',
              development_ids: ['modern_popular_commercial_cinema_as_industry', 'genre_industries_horror_action_comedy_romance_exploitation_local_popular'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationNewHollywoodBlockbusterBatch.ts'],
              rationale: 'The verified Paramount case documents Coppola-Puzo adaptation, producer-director conflict, New York and Sicily locations, period departments, Gordon Willis’s controlled darkness and coordinated editing, sound and music labor. It therefore adds an exact prestige-scale commercial gangster-production system to both the modern-popular and genre-industry rows.'
            },
            {
              scenario_id: 'scenario_aguirre_the_wrath_of_god_1972',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationNewGermanCinemaSystemsBatch.ts'],
              rationale: 'The verified Werner Herzog Filmproduktion-Hessischer Rundfunk case documents a small-budget, tiny-crew New German Cinema production on difficult Peruvian locations with named camera, editing, sound and music labor. It maps alternative movement history to exact finance, scale and physical production rather than to extreme-location mythology.'
            },
            {
              scenario_id: 'scenario_mean_streets_1973',
              review_state: 'REVIEWED_NO_MAPPING',
              development_ids: [],
              rationale: 'The verified approximately $480,000 independent case documents a twenty-seven-day New York/Los Angeles production, practical locations, actor-driven volatility, Scorsese-controlled editing and structural popular-music use. Its strongest historical function is the independent-to-studio New Hollywood transition, for which the current matrix has no dedicated row, so Chapter 15 leaves it reviewed and unmapped.'
            },
            {
              scenario_id: 'scenario_amarcord_1973',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationFinal1970sBatch.ts'],
              rationale: 'The verified case ties Fellini’s episodic memory and Fascist provincial satire to Cinecittà reconstruction, Rotunno colour, Donati design and Rota music. It therefore anchors a 1970s European modernist memory system in studio reconstruction and named craft rather than treating autobiographical style as sufficient evidence.'
            },
            {
              scenario_id: 'scenario_the_spirit_of_the_beehive_1973',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationEuropeanPoeticMemorySystemsBatch.ts'],
              rationale: 'The verified Elías Querejeta production places Erice’s child-viewpoint, elliptical sound-image construction and historical allegory inside a late-Franco Spanish production with named writing, camera and editing labor. It therefore maps political modernism to an exact production context rather than to national symbolism alone.'
            },
            {
              scenario_id: 'scenario_touki_bouki_1973',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements', 'decolonial_transnational_historiography'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationToukiBouki.ts'],
              rationale: 'The verified Cinegrit case documents a roughly $30,000 Senegalese production, Mambéty’s producer-writer-director role, named local craft and a production ecology that still depended on French stock, equipment, processing and editing infrastructure. Its associative montage is explicitly situated as Senegalese postcolonial modernism in dialogue with but not reducible to European precedents, supporting both movement and decolonial/transnational mappings.'
            },
            {
              scenario_id: 'scenario_scenes_from_a_marriage_1974',
              review_state: 'REVIEWED_NO_MAPPING',
              development_ids: [],
              rationale: 'The verified case strongly documents a six-part television conception, low-cost 16 mm production, accelerated schedule, actor collaboration and later 35 mm theatrical abridgement. The current matrix has no dedicated broadcaster-to-theatrical workflow or pre-platform release-window row for this period, so the case remains reviewed without being forced into a broader movement or commercial category.'
            },
            {
              scenario_id: 'scenario_ali_fear_eats_the_soul_1974',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationNewGermanCinemaSystemsBatch.ts'],
              rationale: 'The verified fifteen-day Tango-Film production connects Fassbinder’s social melodrama, migration and racism to a compressed New German Cinema workflow with named photography, design, editing and sound labor. It therefore supplies exact production-situated alternative-movement evidence rather than a representation token.'
            },
            {
              scenario_id: 'scenario_jeanne_dielman_23_quai_du_commerce_1080_bruxelles_1975',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationEuropeanPoliticalFeministModernismBatch.ts'],
              rationale: 'The verified Belgian case ties complete domestic labor, fixed frontal camera, measured duration, direct household sound and controlled colour to documented financing, production craft and feminist avant-garde context. It therefore maps feminist modernism through exact production organization and material practice rather than through later canon status.'
            },
            {
              scenario_id: 'scenario_jaws_1975',
              review_state: 'MAPPED',
              development_ids: ['modern_popular_commercial_cinema_as_industry', 'genre_industries_horror_action_comedy_romance_exploitation_local_popular'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationNewHollywoodBlockbusterBatch.ts'],
              rationale: 'The verified Universal/Zanuck-Brown case documents Martha’s Vineyard open-water production, mechanical-shark failure, specialist marine camera work, Verna Fields editing, John Williams’s score and release history. It makes blockbuster emergence and suspense/horror production an inspectable commercial and genre-industry system rather than a box-office label.'
            },
            {
              scenario_id: 'scenario_dog_day_afternoon_1975',
              review_state: 'MAPPED',
              development_ids: ['genre_industries_horror_action_comedy_romance_exploitation_local_popular'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationNewHollywoodNewYorkBatch.ts'],
              rationale: 'The verified real-event Brooklyn case documents rehearsal-led ensemble work, practical geography, changing available light, near-real-time editing, media feedback and an almost scoreless institutional sound field. It adds a distinct 1970s American crime-production workflow to the genre-industry row without treating New Hollywood itself as a matrix category.'
            },
            {
              scenario_id: 'scenario_manila_in_the_claws_of_light_1975',
              review_state: 'MAPPED',
              development_ids: ['decolonial_transnational_historiography'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationManilaClawsLight.ts'],
              rationale: 'The verified Philippine case documents De Leon and Manotok production resources, mixed professional/nonprofessional casting, Manila location labor, production and release under Marcos’s martial-law regime and an internationally shortened subplot version. It therefore supplies exact postcolonial production, regulation and circulation evidence without forcing the film into a generic modernism label.'
            },
            {
              scenario_id: 'scenario_the_battle_of_chile_part_i_1975',
              review_state: 'MAPPED',
              development_ids: ['decolonial_transnational_historiography', 'latin_america_beyond_single_movement'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationBattleChilePartOne.ts'],
              rationale: 'The verified case documents a five-person Chilean field team filming the 1973 crisis with Éclair 16 mm and Nagra equipment, Chris Marker’s material support and, after the coup, exile-driven completion and long editing in Cuba with ICAIC support/co-production. It therefore supplies exact decolonial/transnational workflow evidence and the Chile-originating counterpart required to distinguish Latin American production systems from the existing Cuban ICAIC case.'
            },
            {
              scenario_id: 'scenario_cria_cuervos_1976',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationIberianPortugueseMemorySystemsBatch.ts'],
              rationale: 'The verified Saura-Querejeta case documents production at the end of the Franco dictatorship, Madrid domestic space, child-centered memory, Teodoro Escamilla photography, Pablo G. del Amo editing and named sound/music labor. It anchors transition-era Spanish political modernism to exact production context and collaborative craft.'
            },
            {
              scenario_id: 'scenario_taxi_driver_1976',
              review_state: 'REVIEWED_NO_MAPPING',
              development_ids: [],
              rationale: 'The verified case strongly documents post-Vietnam subjectivity, New York production, unusual slow-motion camera practice, layered urban sound, Herrmann’s score and optical colour intervention. Its Chapter 15 function is an integrated New Hollywood production system, but the current matrix has no exact row for that formation and the evidence does not require a genre-industry mapping from noir lineage alone.'
            },
            {
              scenario_id: 'scenario_killer_of_sheep_1977',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationAmericanIndependentBreakthroughsBatch.ts'],
              rationale: 'The verified UCLA/L.A. Rebellion case documents spare-weekend 16 mm production in Watts, nonprofessional casting, Burnett’s multi-role authorship and a circulation history materially affected by music rights. It therefore anchors Black American independent alternative practice to exact production scale, labor and circulation rather than to identity representation alone.'
            },
            {
              scenario_id: 'scenario_star_wars_1977',
              review_state: 'MAPPED',
              development_ids: ['modern_popular_commercial_cinema_as_industry', 'genre_industries_horror_action_comedy_romance_exploitation_local_popular'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationNewHollywoodBlockbusterBatch.ts'],
              rationale: 'The verified Lucasfilm/Fox case documents Tunisia and British-stage production, used-future design, ILM’s custom VistaVision and motion-control effects pipeline, three-editor structure and Ben Burtt’s sound work. It therefore makes blockbuster transformation and science-fiction spectacle concrete as commercial infrastructure, specialist labor and genre production.'
            },
            {
              scenario_id: 'scenario_the_marriage_of_maria_braun_1979',
              review_state: 'MAPPED',
              development_ids: ['modernism_new_waves_alternative_movements'],
              evidence_paths: ['src/ui/data/scenarioProductionVerificationNewGermanCinemaSystemsBatch.ts'],
              rationale: 'The verified Albatros-Trio-WDR case documents broadcaster participation, West German location production, Märthesheimer-Fröhlich writing, Ballhaus photography, Lorenz-Fassbinder editing and international sales/distribution history. It closes the decade with New German Cinema grounded in production institutions and collaborative labor rather than auteur reputation.'
            }
          ];

          assert(original.schema === 'hg_film_producer_film_history_representation_coverage_v1', 'unexpected coverage schema');
          assert(original.baseline.expected_production_verified_core_scenarios === 613, '613 PV core moved');
          assert(original.baseline.closed_chapter_18_atlas_count === 539, '539 closed atlas moved');
          assert(original.scenario_reviews.length === 118, `expected 118 reviews before Chapter 15, got ${original.scenario_reviews.length}`);
          assert(new Set(original.scenario_reviews.map(r => r.scenario_id)).size === 118, 'pre-Chapter-15 review IDs are not unique');
          assert(newReviews.length === 23 && new Set(newReviews.map(r => r.scenario_id)).size === 23, 'Chapter 15 24→23 dedupe is not exact');
          const originalIds = new Set(original.scenario_reviews.map(r => r.scenario_id));
          for (const review of newReviews) assert(!originalIds.has(review.scenario_id), `new Chapter 15 review already exists: ${review.scenario_id}`);
          assert(originalIds.has('scenario_memories_of_underdevelopment_1968'), 'Memories enrichment target missing');
          assert(!newReviews.some(r => r.scenario_id === 'scenario_memories_of_underdevelopment_1968'), 'Memories must enrich in place, not duplicate');
          const latinBefore = original.development_matrix.find(d => d.development_id === latinId);
          assert(latinBefore && latinBefore.declared_status === 0, 'Latin America baseline is not fail-closed status 0');

          for (const review of newReviews.filter(r => r.review_state === 'MAPPED')) {
            assert(Array.isArray(review.evidence_paths) && review.evidence_paths.length > 0, `mapped review lacks PV path: ${review.scenario_id}`);
            for (const evidencePath of review.evidence_paths) {
              assert(fs.existsSync(evidencePath), `PV file missing: ${evidencePath}`);
              const pv = fs.readFileSync(evidencePath, 'utf8');
              assert(pv.includes(review.scenario_id), `PV file does not contain exact scenario ID ${review.scenario_id}: ${evidencePath}`);
            }
          }
          const battlePv = fs.readFileSync('src/ui/data/scenarioProductionVerificationBattleChilePartOne.ts', 'utf8');
          assert(battlePv.includes('five-person field team') && battlePv.includes('ICAIC') && battlePv.includes('after the coup'), 'Battle of Chile Chile-field/Cuba-post distinction is not explicit in permanent PV');
          const memoriesPv = fs.readFileSync('src/ui/data/scenarioProductionVerificationMemoriesUnderdevelopment.ts', 'utf8');
          assert(memoriesPv.includes('ICAIC'), 'Memories permanent PV no longer anchors ICAIC');

          function locateObjectByKey(source, key, value) {
            const marker = `    {\n      "${key}": ${JSON.stringify(value)},\n`;
            const start = source.indexOf(marker);
            assert(start >= 0, `object marker missing: ${key}=${value}`);
            assert(source.indexOf(marker, start + 1) < 0, `object marker duplicated: ${key}=${value}`);
            const close = source.indexOf('\n    }', start);
            assert(close >= 0, `object close missing: ${key}=${value}`);
            return { start, end: close + '\n    }'.length };
          }

          function renderArray(values) {
            return `[${values.map(v => JSON.stringify(v)).join(', ')}]`;
          }

          function renderReview(review) {
            const lines = [
              '    {',
              `      "scenario_id": ${JSON.stringify(review.scenario_id)},`,
              `      "review_state": ${JSON.stringify(review.review_state)},`,
              `      "development_ids": ${renderArray(review.development_ids)},`
            ];
            if (review.evidence_paths) lines.push(`      "evidence_paths": ${renderArray(review.evidence_paths)},`);
            lines.push(`      "rationale": ${JSON.stringify(review.rationale)}`, '    }');
            return lines.join('\n');
          }

          function replaceReview(source, id, updater) {
            const loc = locateObjectByKey(source, 'scenario_id', id);
            const current = JSON.parse(source.slice(loc.start, loc.end));
            const updated = updater(current);
            return source.slice(0, loc.start) + renderReview(updated) + source.slice(loc.end);
          }

          function renderDevelopment(dev) {
            const lines = [
              '    {',
              `      "development_id": ${JSON.stringify(dev.development_id)},`,
              `      "declared_status": ${dev.declared_status},`,
              `      "priority": ${JSON.stringify(dev.priority)},`,
              '      "axis_ids": ['
            ];
            dev.axis_ids.forEach((axis, index) => lines.push(`        ${JSON.stringify(axis)}${index < dev.axis_ids.length - 1 ? ',' : ''}`));
            lines.push('      ],', `      "required_evidence": ${JSON.stringify(dev.required_evidence)},`);
            lines.push(`      "triangulation_basis": ${JSON.stringify(dev.triangulation_basis)}`, '    }');
            return lines.join('\n');
          }

          const latinLoc = locateObjectByKey(text, 'development_id', latinId);
          const latin = JSON.parse(text.slice(latinLoc.start, latinLoc.end));
          latin.declared_status = 3;
          latin.triangulation_basis = 'Chapter 15 triangulates two materially distinct Latin American production systems through exact Production Verification cases. Memories of Underdevelopment anchors domestic Cuban revolutionary production in ICAIC, a state film institution integrating fiction, Havana street production and ICAIC documentary/newsreel material. The Battle of Chile: Part I contrasts a five-person Chilean field-documentary system filming the 1973 political crisis with Chris Marker material support and, after the coup, exile-driven completion and long editing in Cuba with ICAIC support/co-production. The pair therefore distinguishes domestic Cuban institutional production from Chile-originating coup-era field production that later depended on transnational Cuban post-production infrastructure, rather than treating Cuba and Chile as nationality tokens.';
          text = text.slice(0, latinLoc.start) + renderDevelopment(latin) + text.slice(latinLoc.end);

          text = replaceReview(text, 'scenario_los_olvidados_1950', review => ({
            ...review,
            rationale: 'The verified Mexican case documents two years of social research, Ultramar/Óscar Dancigers production, Estudios Tepeyac and Mexico City locations, Gabriel Figueroa photography, Carlos Savage editing, professional craft and surrealist rupture inside a social-realist project. It supplies exact production-situated alternative-form evidence. At the Chapter 13 stage this single Mexican case was insufficient to establish the multiple regional industry, financing or distribution systems required by latin_america_beyond_single_movement; Chapter 15 closes that separate row only through complementary exact Cuban and Chile-originating system evidence.'
          }));

          text = replaceReview(text, 'scenario_memories_of_underdevelopment_1968', review => ({
            ...review,
            development_ids: [...review.development_ids, latinId],
            rationale: 'The verified ICAIC production documents a revolutionary state film institution founded in 1959, collective-production ideals, Gutiérrez Alea-Desnoes adaptation, Havana street material and the integration of ICAIC documentary/newsreel footage through Nelson Rodríguez’s fragmented editing. It therefore maps Cuban revolutionary modernism and decolonial institutional history and, paired with the Chile-originating field-production/Cuban-post-production system of The Battle of Chile: Part I, supplies the domestic-institutional half of the exact workflow triangulation required for latin_america_beyond_single_movement.'
          }));

          const arrayEnd = '\n  ],\n  "candidate_admission_gate": {';
          const endIndex = text.indexOf(arrayEnd);
          assert(endIndex >= 0 && text.indexOf(arrayEnd, endIndex + 1) < 0, 'scenario review array end anchor is not unique');
          text = text.slice(0, endIndex) + ',\n' + newReviews.map(renderReview).join(',\n') + text.slice(endIndex);

          const finalDoc = JSON.parse(text);
          assert(finalDoc.scenario_reviews.length === 141, `expected 141 reviews after Chapter 15, got ${finalDoc.scenario_reviews.length}`);
          assert(new Set(finalDoc.scenario_reviews.map(r => r.scenario_id)).size === 141, 'post-Chapter-15 review IDs are not unique');
          const latinAfter = finalDoc.development_matrix.find(d => d.development_id === latinId);
          assert(latinAfter && latinAfter.declared_status === 3 && typeof latinAfter.triangulation_basis === 'string', 'Latin America 0→3 was not materialized');
          const memoriesAfter = finalDoc.scenario_reviews.find(r => r.scenario_id === 'scenario_memories_of_underdevelopment_1968');
          const battleAfter = finalDoc.scenario_reviews.find(r => r.scenario_id === 'scenario_the_battle_of_chile_part_i_1975');
          assert(memoriesAfter.development_ids.includes(latinId) && battleAfter.development_ids.includes(latinId), 'Latin America triangulation is not mapped to both exact PV scenarios');
          const latinMapped = finalDoc.scenario_reviews.filter(r => r.development_ids.includes(latinId)).map(r => r.scenario_id);
          assert(latinMapped.length === 2 && latinMapped.includes(memoriesAfter.scenario_id) && latinMapped.includes(battleAfter.scenario_id), `unexpected Latin America mapped set: ${latinMapped.join(', ')}`);
          assert(finalDoc.closure_contract.selection_may_be_called_representationally_audited === false, 'global representation audit was closed accidentally');
          assert(!finalDoc.scenario_reviews.some(r => ['scenario_easy_rider_1969', 'scenario_wanda_1970', 'scenario_apocalypse_now_1979', 'scenario_alien_1979'].includes(r.scenario_id)), 'P2 comparison leaked into Chapter 15 review additions');

          fs.writeFileSync(path, text);
          console.log(`Chapter 15 materialized: ${original.scenario_reviews.length} -> ${finalDoc.scenario_reviews.length} reviews; latin_america_beyond_single_movement 0 -> ${latinAfter.declared_status}; 23 new unique reviews; Memories enriched in place.`);
          NODE

          node -e "JSON.parse(require('node:fs').readFileSync('data/film/film_history_representation_coverage_v1.json','utf8')); console.log('coverage JSON parse OK')"
          git diff --check
          git rm .github/workflows/chapter-15-representation-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/film/film_history_representation_coverage_v1.json
          git diff --cached --name-status
          git commit -m 'Audit Chapter 15 representation coverage'
          git push origin HEAD:agent/chapter-15-representation-audit
