name: Finalize Film History Chapter 10 Atlas audit

on:
  push:
    branches: [agent/film-history-chapter-ten-atlas-audit]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-history-chapter-ten-atlas-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate canonical Chapter 10 resolved report
        run: npm run audit:film-history-ch10
      - name: Full v0.1 verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee ch10-atlas-verify.log
      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ch10-atlas-verify-log
          path: ch10-atlas-verify.log
      - name: Commit clean verified audit state
        run: |
          rm -f .github/workflows/ch10-atlas-finalize.yml .github/workflows/ch10-atlas-diagnostic.yml
          rm -f scripts/diagnose-film-history-ch10-atlas.py docs/film-history-chapter-ten-atlas-diagnostic.json ch10-atlas-verify.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Film History Chapter 10 Atlas audit"
          git push origin HEAD:agent/film-history-chapter-ten-atlas-audit
