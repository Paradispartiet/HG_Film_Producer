name: TEMP Chapter 19 One Battle After Another source-first

on:
  push:
    branches:
      - agent/ch19-one-battle-after-another-production-case
    paths:
      - .github/workflows/temp-ch19-one-battle-after-another-source-first.yml
      - src/core/chapterNineteenOneBattleAfterAnotherExpansion.ts
      - src/core/chapterNineteenOneBattleAfterAnotherExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationOneBattleAfterAnother.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenOneBattleAfterAnother.ts

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-one-battle-after-another-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict One Battle After Another contract
        run: node --test dist/core/chapterNineteenOneBattleAfterAnotherExpansion.test.js

      - name: Build UI
        run: npm run build:ui
