name: Materialize Film History Chapter 5 editorial integration

on:
  push:
    branches:
      - agent/complete-film-history-chapter-five-text

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire canonical Chapter 5 and migrate completion assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          book = Path('src/core/filmHistoryBook.ts')
          text = book.read_text()
          import_old = 'import { filmHistoryChapterFour } from "./filmHistoryChapterFour.js";\n'
          import_new = import_old + 'import { filmHistoryChapterFive } from "./filmHistoryChapterFive.js";\n'
          if 'filmHistoryChapterFive } from "./filmHistoryChapterFive.js"' not in text:
              if import_old not in text:
                  raise SystemExit('Chapter 4 import anchor missing')
              text = text.replace(import_old, import_new, 1)

          if '      filmHistoryChapterFive,' not in text:
              marker = '"global-before-wwi"'
              marker_index = text.find(marker)
              if marker_index < 0:
                  raise SystemExit('Chapter 5 id anchor missing')
              start = text.rfind('      outline(', 0, marker_index)
              if start < 0:
                  raise SystemExit('Chapter 5 outline start missing')
              end_marker = '["national cinema", "export market", "star system", "genre", "feature"],'
              terms_index = text.find(end_marker, marker_index)
              if terms_index < 0:
                  raise SystemExit('Chapter 5 key-terms anchor missing')
              end = text.find('      ),', terms_index)
              if end < 0:
                  raise SystemExit('Chapter 5 outline end missing')
              end += len('      ),')
              text = text[:start] + '      filmHistoryChapterFive,' + text[end:]
          book.write_text(text)

          def patch(path, replacements):
              p = Path(path)
              value = p.read_text()
              for old, new in replacements:
                  if old not in value:
                      raise SystemExit(f'{path}: assertion anchor missing: {old[:80]}')
                  value = value.replace(old, new, 1)
              p.write_text(value)

          patch('src/core/filmHistoryBook.test.ts', [
              ('test("only Chapters 5–30 remain explicit outlines after Chapter 4 completion", () => {',
               'test("only Chapters 6–30 remain explicit outlines after Chapter 5 completion", () => {'),
              ('const completed = filmHistoryBookChapters.filter((chapter) => chapter.number <= 4);\n  assert.equal(completed.length, 4);',
               'const completed = filmHistoryBookChapters.filter((chapter) => chapter.number <= 5);\n  assert.equal(completed.length, 5);'),
              ('const remaining = filmHistoryBookChapters.filter((chapter) => chapter.number > 4);\n  assert.equal(remaining.length, 26);',
               'const remaining = filmHistoryBookChapters.filter((chapter) => chapter.number > 5);\n  assert.equal(remaining.length, 25);'),
          ])

          patch('src/core/filmHistoryChapterFour.test.ts', [
              ('test("canonical book resolves Chapters 1–4 as full and preserves the six-part thirty-chapter architecture", () => {',
               'test("canonical book resolves Chapters 1–5 as full and preserves the six-part thirty-chapter architecture", () => {'),
              ('assert.equal(getFilmHistoryBookChapter("global-before-wwi")?.status, "outline");',
               'assert.equal(getFilmHistoryBookChapter("global-before-wwi")?.status, "full");\n  assert.equal(getFilmHistoryBookChapter("classical-hollywood")?.status, "outline");'),
          ])

          patch('src/core/filmHistoryChapterThree.test.ts', [
              ('test("canonical book resolves Chapters 1–4 as full and preserves the six-part thirty-chapter architecture", () => {',
               'test("canonical book resolves Chapters 1–5 as full and preserves the six-part thirty-chapter architecture", () => {'),
              ('assert.equal(getFilmHistoryBookChapter("global-before-wwi")?.status, "outline");',
               'assert.equal(getFilmHistoryBookChapter("global-before-wwi")?.status, "full");\n  assert.equal(getFilmHistoryBookChapter("classical-hollywood")?.status, "outline");'),
          ])
          PY
          git rm .github/workflows/ch5-editorial-materialize.yml
      - name: Verify full v0.1 with canonical Chapter 5
        id: verify
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee verify-ch5-output.txt
      - name: Upload failed Chapter 5 verification diagnostics
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ch5-verification-diagnostics
          path: verify-ch5-output.txt
      - name: Commit verified Chapter 5 book integration
        if: success()
        run: |
          rm -f verify-ch5-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Film History Chapter 5 full text"
          git push origin HEAD:agent/complete-film-history-chapter-five-text
