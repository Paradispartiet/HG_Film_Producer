name: TEMP Chapter 19 Tenet source diagnostic

on:
  push:
    branches:
      - agent/ch19-tenet-production-case
    paths:
      - .github/workflows/TEMP-ch19-tenet-diagnostic.yml
      - src/core/chapterNineteenTenetExpansion.test.ts

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-tenet-production-case
          fetch-depth: 0
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Typecheck source-first Tenet files
        run: npm run typecheck
      - name: Build core tests
        run: npm run build
      - name: Run strict Tenet contract only
        run: node --test dist/core/chapterNineteenTenetExpansion.test.js
      - name: Build UI from source-first state
        run: npm run build:ui
