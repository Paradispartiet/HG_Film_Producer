name: TEMP Chapter 19 Tenet assertion diagnostic

on:
  push:
    branches:
      - agent/ch19-tenet-production-case
    paths:
      - .github/workflows/TEMP-ch19-tenet-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-tenet-production-case
          fetch-depth: 0
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build core
        run: npm run build
      - name: Premise and choice contract
        run: |
          node --input-type=module - <<'NODE'
          const { chapterNineteenTenetExpansionDefinitions: defs } = await import('./dist/core/chapterNineteenTenetExpansion.js');
          const f=defs[0];
          const checks=[
            f.id==='scenario_tenet_2020', f.runtimeMins===149,
            f.premise.includes('photographed in 2019'), f.premise.includes('six IMAX camera packages'), f.premise.includes('Sphero 65'), f.premise.includes('both forward and backward directions'),
            f.premise.includes('full-size retired 747'), f.premise.includes('roughly 300-person DNEG effort'), f.premise.includes('6.3K'), f.premise.includes('limited looping'), f.premise.includes('COVID-19 protocols'),
            f.requiredChoicesSeed.camera.includes('imax_15perf_70mm'), f.requiredChoicesSeed.camera.includes('panavision_system65'), f.requiredChoicesSeed.sound.includes('ludwig_goransson')
          ];
          if(checks.some(x=>!x)) throw new Error(`premise/choices failed indexes ${checks.map((x,i)=>x?null:i).filter(x=>x!==null)}`);
          NODE
      - name: Learning goals camera and inversion
        run: |
          node --input-type=module - <<'NODE'
          const { chapterNineteenTenetExpansionDefinitions: defs } = await import('./dist/core/chapterNineteenTenetExpansion.js'); const g=defs[0].learningGoals;
          const checks=[
            g.some(x=>x.includes('2019 production')&&x.includes('pandemic-disrupted 2020 release')),
            g.some(x=>x.includes('BFI 149-minute')&&x.includes('playable runtime anchor')),
            g.some(x=>x.includes('six IMAX camera packages')&&x.includes('shot-by-shot')),
            g.some(x=>x.includes('System 65 Studio')&&x.includes('Sphero 65')),
            g.some(x=>x.includes('ARRI 65')&&x.includes('Logmar Magellan')),
            g.some(x=>x.includes('15-perf 70mm IMAX')&&x.includes('expanded')),
            g.some(x=>x.includes('exact Kodak stock')&&x.includes('unresolved')),
            g.some(x=>x.includes('forward and backward directions')&&x.includes('without generalizing')),
            g.some(x=>x.includes('Nathan Crowley')&&x.includes('two temporal directions')),
            g.some(x=>x.includes('Denmark')&&x.includes('Estonia')&&x.includes('India')&&x.includes('Norway'))
          ]; if(checks.some(x=>!x)) throw new Error(`camera/inversion failed indexes ${checks.map((x,i)=>x?null:i).filter(x=>x!==null)}`);
          NODE
      - name: Learning goals effects and finishing
        run: |
          node --input-type=module - <<'NODE'
          const { chapterNineteenTenetExpansionDefinitions: defs } = await import('./dist/core/chapterNineteenTenetExpansion.js'); const g=defs[0].learningGoals;
          const checks=[
            g.some(x=>x.includes('Scott Fisher')&&x.includes('DNEG')),
            g.some(x=>x.includes('false claim')&&x.includes('no VFX')),
            g.some(x=>x.includes('full-size 747')&&x.includes('digital cleanup')),
            g.some(x=>x.includes('747 hit a set-built structure')&&x.includes('cable removal')),
            g.some(x=>x.includes('Andrew Jackson')&&x.includes('Andy Lockley')),
            g.some(x=>x.includes('roughly 300-person')&&x.includes('company testimony')),
            g.some(x=>x.includes('photography and LIDAR')),
            g.some(x=>x.includes('VFX reference capture')&&x.includes('contingency infrastructure')),
            g.some(x=>x.includes('6.3K')&&x.includes('every scan')),
            g.some(x=>x.includes('photochemical-finish')&&x.includes('digital intermediate'))
          ]; if(checks.some(x=>!x)) throw new Error(`effects/finishing failed indexes ${checks.map((x,i)=>x?null:i).filter(x=>x!==null)}`);
          NODE
      - name: Learning goals editorial sound history
        run: |
          node --input-type=module - <<'NODE'
          const { chapterNineteenTenetExpansionDefinitions: defs } = await import('./dist/core/chapterNineteenTenetExpansion.js'); const g=defs[0].learningGoals;
          const checks=[
            g.some(x=>x.includes('Jennifer Lame')&&x.includes('forward and inverted action')),
            g.some(x=>x.includes('Richard King')&&x.includes('sound-design')),
            g.some(x=>x.includes('Willie Burton')&&x.includes('masked dialogue')),
            g.some(x=>x.includes('limited looping')&&x.includes('ADR census')),
            g.some(x=>x.includes('Ludwig Göransson')&&x.includes('Richard King')),
            g.some(x=>x.includes('COVID-19 lockdown')&&x.includes('2019')),
            g.some(x=>x.includes('return-to-work protocols')&&x.includes('principal photography')),
            g.some(x=>x.includes('uncertainty register')&&x.includes('VFX ledger')&&x.includes('mix topology')),
            g.some(x=>x.includes('Chapter 19 significance')&&x.includes('photochemical large-format production'))
          ]; if(checks.some(x=>!x)) throw new Error(`editorial/sound/history failed indexes ${checks.map((x,i)=>x?null:i).filter(x=>x!==null)}`);
          NODE
      - name: Phase contract
        run: |
          node --input-type=module - <<'NODE'
          const { chapterNineteenTenetExpansionDefinitions: defs } = await import('./dist/core/chapterNineteenTenetExpansion.js'); const p=defs[0].phases; const at=id=>p.find(x=>x.id===id)?.player_task||'';
          const checks=[
            at('chronology_boundary').includes('2019'),
            at('large_format_strategy').includes('IMAX 15-perf 70mm')&&at('large_format_strategy').includes('65mm'),
            at('system65').includes('Sphero 65'),
            at('dual_direction_capture').includes('key inversion sequences')&&at('dual_direction_capture').includes('without claiming every'),
            at('sfx_vfx_boundary').includes('Scott Fisher')&&at('sfx_vfx_boundary').includes('Andrew Jackson/DNEG'),
            at('plane_sequence').includes('full-size aircraft')&&at('plane_sequence').includes('cable removal'),
            at('photochemical_finish').includes('photochemical finishing'),
            at('production_dialogue').includes('Willie Burton'),
            at('post_lockdown').includes('2019 shoot'),
            at('unknowns_register').includes('VFX ledger')&&at('unknowns_register').includes('ADR')
          ]; if(checks.some(x=>!x)) throw new Error(`phase failed indexes ${checks.map((x,i)=>x?null:i).filter(x=>x!==null)}`);
          NODE
      - name: Coverage counts
        run: |
          node --input-type=module - <<'NODE'
          const { chapterNineteenTenetExpansionDefinitions: defs } = await import('./dist/core/chapterNineteenTenetExpansion.js'); const f=defs[0];
          if(f.learningGoals.length<55) throw new Error(`learning goals ${f.learningGoals.length}`);
          if(f.phases.length<35) throw new Error(`phases ${f.phases.length}`);
          NODE
      - name: Original strict test
        run: node --test dist/core/chapterNineteenTenetExpansion.test.js
