name: Materialize The Crowd production case

on:
  push:
    branches:
      - agent/the-crowd-1928
    paths:
      - .github/workflows/crowd-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/the-crowd-1928
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Write The Crowd case and guarded registry updates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one marker in {path}, found {count}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          crowd_definition = '''  {
            id: "scenario_the_crowd_1928",
            title: "The Crowd",
            originalTitle: "The Crowd",
            aliases: ["The Mob"],
            year: 1928,
            titleType: "Feature",
            runtimeMins: 98,
            directors: ["King Vidor"],
            genres: ["Drama"],
            premise: "Build The Crowd as a 1928 Metro-Goldwyn-Mayer production problem in making an ordinary urban life legible inside a large studio system. King Vidor and John V. A. Weaver shape John and Mary Sims around work, marriage, grief and disappointed ambition; Henry Sharp's cinematography moves between controlled interiors and concealed-camera New York exteriors; Cedric Gibbons and A. Arnold Gillespie are credited for settings; Hugh Wynn edits a nine-reel silent feature whose ending was actively tested and versioned for exhibitors. Use the famous movement from city scale into a vast office to make the individual visible inside mass organization without inventing an undocumented effects recipe, and preserve the difference between the 1928 silent release and the 1981 Brownlow-Gill restoration with Carl Davis's later score.",
            sourceId: "manual_the_crowd_1928",
            sourceUrl: "https://catalog.afi.com/Film/3514-THE-CROWD",
            scenarioType: "studio_social_realism_production",
            requiredChoicesSeed: {
              screenplay: ["everyman_social_pressure_arc", "marriage_grief_work_progression", "ordinary_life_without_heroic_exception"],
              camera: ["office_mass_to_individual_reveal", "concealed_camera_new_york_exteriors", "interior_exterior_scale_contrast"],
              editing: ["social_rhythm_and_causal_continuity", "preview_tested_endings", "exhibitor_ending_version_control"],
              sound: ["silent_1928_release", "no_invented_original_score", "1981_restoration_score_not_original"],
              themes: ["film_history", "mgm", "loews", "urban_modernity", "studio_social_realism"],
            },
            learningGoals: [
              "Use a major-studio production system to tell an ordinary couple's story without turning scale, sets or camera virtuosity into spectacle detached from social experience.",
              "Coordinate Henry Sharp's documented cinematography with the credited settings work of Cedric Gibbons and A. Arnold Gillespie so the office and city visually position John Sims as one person inside mass organization.",
              "Combine controlled studio interiors with documented concealed-camera New York exteriors, including Coney Island, while keeping the fiction's observational immediacy distinct from documentary authorship.",
              "Treat James Murray and Eleanor Boardman's documented naturalistic performances as part of a larger system of framing, blocking, setting and emotional duration rather than claiming one actor or director invented screen realism.",
              "Model MGM's preview and exhibition pressures through the documented multiple endings: seven endings were reportedly tested and two release endings were available to exhibitors, so editorial control is also an industrial distribution problem.",
              "Preserve version history: the 1928 release is a black-and-white silent feature, while the 1981 Brownlow-Gill restoration and Carl Davis score belong to later preservation and presentation history.",
            ],
            phases: [
              { id: "pitch", label: "Ordinary-life studio pitch", player_task: "Define why MGM should devote feature resources to a story whose stakes are employment, marriage, grief and frustrated ambition rather than exceptional adventure or star spectacle." },
              { id: "research", label: "MGM, city and version research", player_task: "Ground Vidor, Weaver, Sharp, Gibbons, Gillespie, Wynn, MGM/Loew's, New York location practice, silent format and the multiple-ending history in institutional evidence." },
              { id: "screenplay", label: "Everyman pressure arc", player_task: "Structure John's ambitions and the Sims marriage around work, money, children, loss and reconciliation so ordinary events accumulate causal and emotional weight." },
              { id: "casting", label: "Naturalistic central couple", player_task: "Keep James Murray and Eleanor Boardman emotionally specific without isolating them from the crowds, relatives, coworkers and social environments that define their pressures." },
              { id: "production_design", label: "Individual inside mass space", player_task: "Use the credited settings system to contrast the Sims household, the giant office and public urban spaces while avoiding unsupported claims about exact construction or effects methods." },
              { id: "cinematography", label: "City scale to human scale", player_task: "Coordinate the office reveal, intimate interiors and documented concealed-camera New York material so the camera can move between anonymity in the crowd and individual experience." },
              { id: "editing", label: "Continuity and contested endings", player_task: "Sustain a lucid social-emotional progression across nine reels, then treat previewed and exhibitor-selectable endings as explicit version branches rather than one falsely immutable cut." },
              { id: "sound", label: "Silent production, later restoration score", player_task: "Keep the 1928 object silent and do not assign Carl Davis's 1981 restoration score or any other later accompaniment to original synchronized production sound." },
              { id: "release", label: "Studio distribution meets audience testing", player_task: "Model how MGM/Loew's distribution, previews and exhibitor choice could shape the final public object even when the director preferred the less upbeat ending." },
            ],
          },
          '''

          replace_once(
              "src/core/chapterSixHollywoodExpansion.ts",
              "  },\n] as const;\n\nexport function mergeChapterSixHollywoodExpansion(",
              "  },\n" + crowd_definition + "] as const;\n\nexport function mergeChapterSixHollywoodExpansion(",
          )

          write("src/ui/data/scenarioFilmStudySilentFoundationsTheCrowd.ts", '''import type { FilmHistoryProfile } from "./scenarioFilmStudyMap";

          export const theCrowdFilmHistoryProfile = {
            scenarioId: "scenario_the_crowd_1928",
            period: "1928 mature MGM silent production under Loew's: a major studio and distributor applying coordinated writing, settings, cinematography, editing, location work and audience testing to an ordinary urban marriage rather than to prestige spectacle alone",
            traditions: ["late American silent cinema", "MGM studio production", "urban social realism", "classical continuity", "location-studio hybrid filmmaking"],
            before: "King Vidor followed the large-scale success of The Big Parade with a project deliberately centered on an anonymous urban worker and his family. The Crowd therefore tests what mature Hollywood organization could do with ordinary social experience rather than standing outside the studio system as an anti-industrial exception.",
            moment: "MGM produces and distributes through the Loew's structure; Vidor and John V. A. Weaver write, Henry Sharp photographs, Cedric Gibbons and A. Arnold Gillespie receive settings credits, and Hugh Wynn edits. The film moves from city scale into a sea of office desks, uses concealed-camera New York exteriors including Coney Island, and subjects its conclusion to unusually visible preview and exhibitor versioning.",
            after: "The Crowd became a canonical late-silent example of dynamic cinematography serving social realism and was nominated at the first Academy Awards for dramatic direction and Unique and Artistic Picture. Its 1981 Brownlow-Gill restoration with a Carl Davis score is a later preservation object and must remain separate from claims about the 1928 silent release.",
            historyQuestion: "How can a vertically organized major studio make one anonymous clerk and one marriage feel specific by coordinating mass space, naturalistic performance, concealed-camera location work, continuity and even alternative release endings?",
            technicalHighlights: [
              { area: "historical_context", status: "source_verified", note: "AFI records the 1928 MGM/Loew's production and distribution context; the Library of Congress places the film after Vidor's The Big Parade and emphasizes its downbeat urban realism rather than heroic spectacle." },
              { area: "movement_and_tradition", status: "mapped", note: "The case sits inside mature American silent feature production and urban social realism. It does not claim The Crowd invented realist acting, location photography or classical continuity." },
              { area: "industry_and_production_context", status: "source_verified", note: "AFI identifies Metro-Goldwyn-Mayer Corp. under Loew's Inc. as production company and Metro-Goldwyn-Mayer Distributing Corp. as distributor. Industrial organization is therefore part of the film's documented production condition, not generic studio background." },
              { area: "reception_and_legacy", status: "source_verified", note: "AFI records strong contemporary critical response, substantial business and the 1981 Brownlow-Gill restoration; the Academy records nominations for Vidor's dramatic direction and for Unique and Artistic Picture; the Library of Congress includes the film in the National Film Registry." },
              { area: "screenplay", status: "source_verified", note: "AFI credits King Vidor and John V. A. Weaver for screenplay, Vidor for story and Joseph Farnham for titles. The production model focuses on accumulating work, marriage, parenthood, grief and disappointment without inventing an undocumented writing-room procedure." },
              { area: "directing", status: "source_verified", note: "AFI credits King Vidor; the Library of Congress connects his direction to the film's dynamic visual design and naturalistic central performances. Direction is modeled as coordination across departments rather than solitary execution." },
              { area: "performance", status: "source_verified", note: "The Library of Congress specifically characterizes Eleanor Boardman and James Murray's performances as naturalistic. The gameplay maps that quality to duration, framing and social interaction rather than asserting a private rehearsal method not documented by the sources." },
              { area: "production_design", status: "source_verified", note: "AFI credits Cedric Gibbons and A. Arnold Gillespie for settings. Their documented credit supports treating the office and domestic/public environments as designed production spaces, while the profile avoids inventing dimensions, construction materials or exact effects mechanisms." },
              { area: "costume_makeup", status: "mapped", note: "AFI credits André Ani for wardrobe. Clothing can help distinguish office, domestic and leisure contexts, but the available sources do not support a more detailed costume or makeup workflow." },
              { area: "cinematography", status: "source_verified", note: "AFI credits Henry Sharp as chief cinematographer; the Library of Congress highlights the movement from street/skyscraper scale into the vast office and Sharp's concealed-camera New York exteriors, including Coney Island." },
              { area: "lighting", status: "mapped", note: "Studio interiors and uncontrolled New York exteriors necessarily posed different exposure and illumination problems, but the institutional sources used here do not justify a specific lamp package or lighting formula." },
              { area: "camera_format", status: "source_verified", note: "AFI records black-and-white, silent physical properties, 98 minutes, 8,538/8,548 feet and nine reels. These values describe the documented release object without pretending every later restoration or projection speed is identical." },
              { area: "editing", status: "source_verified", note: "AFI credits Hugh Wynn and documents that seven endings were reportedly shot and previewed, with two endings ultimately available to exhibitors. Editing is therefore both continuity craft and explicit version/distribution management." },
              { area: "sound_design", status: "source_verified", note: "AFI identifies the 1928 film as silent. Dialogue, effects and music heard in later presentations must not be back-projected as synchronized original production sound." },
              { area: "music", status: "mapped", note: "AFI records a 1981 restoration by Kevin Brownlow and David Gill with a new Carl Davis score. That later score is useful preservation history, but the case does not invent a single fixed original 1928 score." },
              { area: "effects_animation", status: "mapped", note: "The famous office reveal depends on coordinated camera and setting scale, but the sources used here do not establish one exact miniature, matte or compositing recipe. Gameplay therefore teaches the spatial effect without fabricating the mechanism." },
              { area: "documentary_method", status: "mapped", note: "AFI and the Library of Congress document concealed-camera New York street photography. The film uses an observational location tactic inside staged fiction; this is not treated as proof that The Crowd is a documentary." },
            ],
          } as const satisfies FilmHistoryProfile;
          '''.replace("          ", ""))

          write("src/ui/data/scenarioProductionVerificationTheCrowd.ts", '''import type { ProductionCaseVerificationRecord } from "./scenarioProductionVerification";

          export const theCrowdProductionCaseVerification = {
            scenarioId: "scenario_the_crowd_1928",
            status: "verified",
            verifiedAt: "2026-08-15",
            summary: "AFI, the Library of Congress and the Academy support The Crowd as King Vidor's 1928 MGM/Loew's silent feature, written by Vidor and John V. A. Weaver, photographed by Henry Sharp, with settings credited to Cedric Gibbons and A. Arnold Gillespie and editing by Hugh Wynn. Institutional sources document concealed-camera New York exteriors, the celebrated movement from city scale into the vast office, and a production/release process in which multiple endings were previewed and two endings were made available to exhibitors. AFI also separates the 1928 black-and-white silent release from the 1981 Brownlow-Gill restoration with Carl Davis's new score. The Production Case therefore teaches large-studio organization, social realism, location/studio integration, continuity and version control without inventing an unsupported effects recipe or collapsing restoration history into original production.",
            sources: [
              {
                title: "The Crowd — AFI Catalog",
                publisher: "American Film Institute",
                url: "https://catalog.afi.com/Film/3514-THE-CROWD",
                sourceKind: "film_institute",
                supports: ["overall", "screenplay", "cinematography", "editing", "sound"],
                note: "AFI identifies MGM/Loew's production and distribution, Vidor and John V. A. Weaver's screenplay, Henry Sharp's photography, Cedric Gibbons and A. Arnold Gillespie's settings, Hugh Wynn's editing, André Ani's wardrobe, black-and-white silent 98-minute/nine-reel properties, concealed-camera New York work, multiple previewed endings, two exhibitor-selectable release endings, and the later 1981 restoration with Carl Davis score."
              },
              {
                title: "The Crowd (1928) — National Film Registry description",
                publisher: "Library of Congress",
                url: "https://www.loc.gov/programs/national-film-preservation-board/film-registry/descriptions-and-essays/",
                sourceKind: "archive_feature",
                supports: ["overall", "screenplay", "cinematography"],
                note: "The Library of Congress highlights Henry Sharp's dynamic interior cinematography, the move from skyscraper scale into the sea of office desks, concealed-camera New York/Coney Island exteriors, the Vidor-Weaver screenplay and Boardman/Murray's naturalistic performances."
              },
              {
                title: "The 1st Academy Awards — 1929",
                publisher: "Academy of Motion Picture Arts and Sciences",
                url: "https://www.oscars.org/oscars/ceremonies/1929",
                sourceKind: "film_institute",
                supports: ["overall"],
                note: "The Academy records The Crowd as a nominee for Unique and Artistic Picture and King Vidor as a nominee for Directing (Dramatic Picture), supporting its contemporary institutional recognition without turning awards into production evidence."
              }
            ]
          } as const satisfies ProductionCaseVerificationRecord;
          '''.replace("          ", ""))

          write("src/core/chapterSixHollywoodExpansion.test.ts", '''import assert from "node:assert/strict";
          import test from "node:test";

          import { chapterSixHollywoodExpansionDefinitions } from "./chapterSixHollywoodExpansion.js";

          test("Chapter 6 materializes The Gold Rush and The Crowd as distinct Hollywood-system cases", () => {
            assert.equal(chapterSixHollywoodExpansionDefinitions.length, 2);

            const goldRush = chapterSixHollywoodExpansionDefinitions.find((item) => item.id === "scenario_the_gold_rush_1925");
            assert.ok(goldRush);
            assert.equal(goldRush.runtimeMins, 88);
            assert.equal(goldRush.scenarioType, "star_producer_feature_comedy");
            assert.equal(goldRush.sourceId, "manual_the_gold_rush_1925");
            assert.ok(goldRush.premise.includes("United Artists"));
            assert.ok(goldRush.premise.includes("1942 reissue"));
            assert.ok(goldRush.requiredChoicesSeed.camera.includes("hollywood_miniature_landscape"));
            assert.ok(goldRush.requiredChoicesSeed.editing.includes("1925_1942_version_boundary"));
            assert.ok(goldRush.requiredChoicesSeed.sound.includes("silent_1925_release"));
            assert.ok(goldRush.requiredChoicesSeed.sound.includes("exclude_1942_narration_and_score"));

            const crowd = chapterSixHollywoodExpansionDefinitions.find((item) => item.id === "scenario_the_crowd_1928");
            assert.ok(crowd);
            assert.equal(crowd.title, "The Crowd");
            assert.equal(crowd.year, 1928);
            assert.equal(crowd.runtimeMins, 98);
            assert.equal(crowd.scenarioType, "studio_social_realism_production");
            assert.equal(crowd.sourceId, "manual_the_crowd_1928");
            assert.ok(crowd.aliases.includes("The Mob"));
            assert.ok(crowd.premise.includes("Metro-Goldwyn-Mayer"));
            assert.ok(crowd.requiredChoicesSeed.camera.includes("concealed_camera_new_york_exteriors"));
            assert.ok(crowd.requiredChoicesSeed.editing.includes("exhibitor_ending_version_control"));
            assert.ok(crowd.requiredChoicesSeed.sound.includes("silent_1928_release"));
            assert.ok(crowd.requiredChoicesSeed.sound.includes("1981_restoration_score_not_original"));
            assert.ok(crowd.learningGoals.length >= 6);
            assert.ok(crowd.phases.length >= 9);
          });
          '''.replace("          ", ""))

          replace_once(
              "src/ui/data/scenarioFilmStudyMap.ts",
              'import { goldRushFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsGoldRush";\n',
              'import { goldRushFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsGoldRush";\nimport { theCrowdFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsTheCrowd";\n',
          )
          replace_once(
              "src/ui/data/scenarioFilmStudyMap.ts",
              '  [goldRushFilmHistoryProfile.scenarioId]: goldRushFilmHistoryProfile,\n',
              '  [goldRushFilmHistoryProfile.scenarioId]: goldRushFilmHistoryProfile,\n  [theCrowdFilmHistoryProfile.scenarioId]: theCrowdFilmHistoryProfile,\n',
          )

          replace_once(
              "src/ui/data/scenarioProductionVerificationRegistry.ts",
              'import { goldRushProductionCaseVerification } from "./scenarioProductionVerificationGoldRush";\n',
              'import { goldRushProductionCaseVerification } from "./scenarioProductionVerificationGoldRush";\nimport { theCrowdProductionCaseVerification } from "./scenarioProductionVerificationTheCrowd";\n',
          )
          replace_once(
              "src/ui/data/scenarioProductionVerificationRegistry.ts",
              '  goldRushProductionCaseVerification,\n',
              '  goldRushProductionCaseVerification,\n  theCrowdProductionCaseVerification,\n',
          )

          replace_once(
              "scripts/film-history-chapter-six-atlas-audit.mjs",
              'const EXPECTED_ATLAS_COUNT = 399;',
              'const EXPECTED_ATLAS_COUNT = 400;',
          )
          replace_once(
              "scripts/film-history-chapter-six-atlas-audit.mjs",
              '  USE_EXISTING: ["The General", "The Gold Rush"],\n  P0: ["The Crowd"],',
              '  USE_EXISTING: ["The Crowd", "The General", "The Gold Rush"],\n  P0: [],',
          )

          replace_once(
              "scripts/production-case-rest-audit.mjs",
              'const EXPECTED_PLAYABLE_SCENARIOS = 399;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 399;',
              'const EXPECTED_PLAYABLE_SCENARIOS = 400;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 400;',
          )
          PY
      - name: Full v0.1 verification
        run: npm run verify:v0.1
      - name: Commit verified materialization and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/crowd-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete The Crowd 1928 production case"
          git push origin HEAD:agent/the-crowd-1928
