name: TEMP Chapter 19 The Substance materialize

on:
  push:
    branches:
      - agent/ch19-the-substance-production-case

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic canonical patch
        run: node scripts/temp-materialize-the-substance.mjs
      - name: Remove The Substance TEMP artifacts before full verification
        run: |
          git rm -f \
            .github/workflows/temp-ch19-the-substance-source-first.yml \
            .github/workflows/temp-ch19-the-substance-materialize.yml \
            scripts/temp-materialize-the-substance.mjs
          test ! -e .github/workflows/temp-ch19-the-substance-source-first.yml
          test ! -e .github/workflows/temp-ch19-the-substance-materialize.yml
          test ! -e scripts/temp-materialize-the-substance.mjs
      - name: Generate Chapter 19 resolved state
        run: node scripts/film-history-chapter-nineteen-atlas-audit.mjs --write=docs/film-history-chapter-nineteen-atlas-resolved.json
      - name: Full fail-closed verification
        run: npm run verify:v0.1
      - name: Verify post-gate canonical snapshot
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          const resolved = JSON.parse(readFileSync("docs/film-history-chapter-nineteen-atlas-resolved.json", "utf8"));
          const assert = (value, message) => { if (!value) throw new Error(message); };
          assert(resolved.atlas?.baselineFromClosedChapter18 === 539, "Chapter 18 baseline drifted");
          assert(resolved.atlas?.expectedCount === 569 && resolved.atlas?.actualCount === 569, "Atlas is not 569/569");
          assert(resolved.verificationIndex?.literalVerifiedScenarioIds === 569, "Production Verification index is not 569");
          const substance = resolved.candidates.find((item) => item.title === "The Substance");
          assert(substance?.decision === "USE_EXISTING", "The Substance did not resolve USE_EXISTING");
          assert(substance?.scenarioId === "scenario_the_substance_2024", "The Substance scenarioId drifted");
          assert(substance?.matches === 1 && substance?.productionVerified === true, "The Substance is not one matched production-verified case");
          assert(substance?.origin === "chapterNineteenTheSubstanceExpansion.ts", "The Substance origin drifted");
          assert(resolved.byDecision?.USE_EXISTING?.length === 37, "USE_EXISTING count is not 37");
          assert(resolved.byDecision?.P0?.length === 6, "P0 count is not 6");
          assert(resolved.byDecision?.P1?.length === 13, "P1 count is not 13");
          assert(resolved.byDecision?.P2?.length === 4, "P2 count is not 4");
          assert(resolved.byDecision?.EXISTING_REQUIRED?.length === 0, "EXISTING_REQUIRED is not empty");
          assert(resolved.recommendedNewProductionCases?.length === 19, "Recommended case count is not 19");
          assert(resolved.productionStrategy?.nextRecommendedCase === "The Boy and the Heron", "Next case is not The Boy and the Heron");
          assert(resolved.productionStrategy?.nextRecommendedLane === "regional_global", "Next lane is not regional_global");
          const expectedTitles = ["The Boy and the Heron", "Spider-Man: Across the Spider-Verse", "The Power of the Dog", "Guillermo del Toro's Pinocchio", "The Secret Agent"];
          const expectedLanes = ["regional_global", "industrial_scale_technical", "auteur_festival", "independent_low_mid_budget", "regional_global"];
          assert(JSON.stringify(resolved.recommendedNewProductionCases.slice(0, 5)) === JSON.stringify(expectedTitles), "First five recommended cases drifted");
          assert(JSON.stringify(resolved.productionStrategy.remainingSequence.slice(0, 5).map((item) => item.lane)) === JSON.stringify(expectedLanes), "First five scheduler lanes drifted");
          for (const path of [
            ".github/workflows/temp-ch19-the-substance-source-first.yml",
            ".github/workflows/temp-ch19-the-substance-materialize.yml",
            "scripts/temp-materialize-the-substance.mjs",
          ]) assert(!existsSync(path), `TEMP artifact remains: ${path}`);
          console.log(JSON.stringify({ atlas: `${resolved.atlas.actualCount}/${resolved.atlas.expectedCount}`, verification: resolved.verificationIndex.literalVerifiedScenarioIds, substance, byDecision: Object.fromEntries(Object.entries(resolved.byDecision).map(([key, value]) => [key, value.length])), next: resolved.productionStrategy.nextRecommendedCase, lane: resolved.productionStrategy.nextRecommendedLane }, null, 2));
          NODE
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/substance-diagnostics
          git status --short > /tmp/substance-diagnostics/status.txt
          git diff > /tmp/substance-diagnostics/diff.txt
          git diff --cached > /tmp/substance-diagnostics/cached-diff.txt
          cp docs/film-history-chapter-nineteen-atlas-resolved.json /tmp/substance-diagnostics/resolved.json 2>/dev/null || true
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: the-substance-materialization-diagnostics
          path: /tmp/substance-diagnostics
      - name: Commit verified canonical state and TEMP cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/film-history-chapter-nineteen-atlas-resolved.json \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          EXPECTED="$(cat <<'EOF' | sort
          .github/workflows/temp-ch19-the-substance-materialize.yml
          .github/workflows/temp-ch19-the-substance-source-first.yml
          docs/film-history-chapter-nineteen-atlas-resolved.json
          scripts/film-history-chapter-eighteen-completion-audit.mjs
          scripts/film-history-chapter-nineteen-atlas-audit.mjs
          scripts/production-case-rest-audit.mjs
          scripts/temp-materialize-the-substance.mjs
          src/core/filmHistoryChapterNineteenAuditContract.test.ts
          src/ui/data/filmScenarios.ts
          src/ui/data/scenarioFilmStudyMap.ts
          src/ui/data/scenarioProductionVerificationRegistry.ts
          EOF
          )"
          ACTUAL="$(git diff --cached --name-only | sort)"
          printf 'Expected staged paths:\n%s\nActual staged paths:\n%s\n' "$EXPECTED" "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          git commit -m "Materialize The Substance Chapter 19 production case"
          git push origin HEAD:agent/ch19-the-substance-production-case
