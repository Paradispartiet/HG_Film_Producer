name: Materialize full Film History Chapter 7

on:
  push:
    branches:
      - agent/film-history-chapter-seven-full
    paths:
      - .github/workflows/film-history-chapter-seven-full-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-history-chapter-seven-full
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize canonical Chapter 7 full text
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/core/filmHistoryChapterSeven.ts',
              '  sections,\n  filmReferences:',
              '  sections,\n  sources: filmHistoryChapterSevenSources,\n  filmReferences:',
          )

          replace_once(
              'src/core/filmHistoryBook.ts',
              'import { filmHistoryChapterSix } from "./filmHistoryChapterSix.js";\n',
              'import { filmHistoryChapterSix } from "./filmHistoryChapterSix.js";\nimport { filmHistoryChapterSeven } from "./filmHistoryChapterSeven.js";\n',
          )

          p = Path('src/core/filmHistoryBook.ts')
          text = p.read_text(encoding='utf-8')
          start = text.index('      outline(\n        "weimar-expressionism",')
          end_marker = '      outline(\n        "french-avant-gardes",'
          end = text.index(end_marker, start)
          text = text[:start] + '      filmHistoryChapterSeven,\n' + text[end:]
          p.write_text(text, encoding='utf-8')

          replace_once(
              'src/core/filmHistoryBook.test.ts',
              'test("only Chapters 7–30 remain explicit outlines after Chapter 6 completion", () => {\n  const completed = filmHistoryBookChapters.filter((chapter) => chapter.number <= 6);\n  assert.equal(completed.length, 6);',
              'test("only Chapters 8–30 remain explicit outlines after Chapter 7 completion", () => {\n  const completed = filmHistoryBookChapters.filter((chapter) => chapter.number <= 7);\n  assert.equal(completed.length, 7);',
          )
          replace_once(
              'src/core/filmHistoryBook.test.ts',
              '  const remaining = filmHistoryBookChapters.filter((chapter) => chapter.number > 6);\n  assert.equal(remaining.length, 24);',
              '  const remaining = filmHistoryBookChapters.filter((chapter) => chapter.number > 7);\n  assert.equal(remaining.length, 23);',
          )

          # Chapter 6 permanently asserted that Chapter 7 was still an outline.
          # Once Chapter 7 is canonical full content, that downstream status assertion must move with the book.
          replace_once(
              'src/core/filmHistoryChapterSix.test.ts',
              '  assert.equal(getFilmHistoryBookChapter("weimar-expressionism")?.status, "outline");',
              '  assert.equal(getFilmHistoryBookChapter("weimar-expressionism")?.status, "full");',
          )
          PY
      - name: Full v0.1 verification
        run: npm run verify:v0.1
      - name: Commit verified Chapter 7 full text and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/film-history-chapter-seven-full-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Film History Chapter 7 full text"
          git push origin HEAD:agent/film-history-chapter-seven-full
