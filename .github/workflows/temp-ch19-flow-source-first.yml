name: TEMP Chapter 19 Flow source-first

on:
  push:
    branches:
      - agent/ch19-flow-production-case
    paths:
      - .github/workflows/temp-ch19-flow-source-first.yml
      - src/core/chapterNineteenFlowExpansion.ts
      - src/core/chapterNineteenFlowExpansion.test.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenFlow.ts
      - src/ui/data/scenarioProductionVerificationFlow.ts

permissions:
  contents: read

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict Flow contract
        run: node --test dist/core/chapterNineteenFlowExpansion.test.js

      - name: Build UI
        run: npm run build:ui
