name: Materialize The Last Laugh 1924 production case

on:
  push:
    branches:
      - agent/the-last-laugh-1924
    paths:
      - .github/workflows/last-laugh-1924-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/the-last-laugh-1924
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate The Last Laugh into Atlas
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Runtime scenario merge
          replace_once(
              'src/ui/data/filmScenarios.ts',
              'import { mergeChapterSixHollywoodExpansion } from "../../core/chapterSixHollywoodExpansion.js";\n',
              'import { mergeChapterSixHollywoodExpansion } from "../../core/chapterSixHollywoodExpansion.js";\nimport { mergeChapterSevenWeimarExpansion } from "../../core/chapterSevenWeimarExpansion.js";\n',
          )
          replace_once(
              'src/ui/data/filmScenarios.ts',
              'const chapterSixHollywoodScenarios = mergeChapterSixHollywoodExpansion(chapterFiveInternationalScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixHollywoodScenarios);',
              'const chapterSixHollywoodScenarios = mergeChapterSixHollywoodExpansion(chapterFiveInternationalScenarios);\nconst chapterSevenWeimarScenarios = mergeChapterSevenWeimarExpansion(chapterSixHollywoodScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSevenWeimarScenarios);',
          )
          replace_once(
              'src/ui/data/filmScenarios.ts',
              '+manual_chapter_six_hollywood_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_six_hollywood_expansion_2026+manual_chapter_seven_weimar_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
          )
          replace_once(
              'src/ui/data/filmScenarios.ts',
              'Chapter 6 Hollywood studio/star-system expansion, modern independent/Asian/prize-cinema expansion',
              'Chapter 6 Hollywood studio/star-system expansion, Chapter 7 Weimar-cinema expansion, modern independent/Asian/prize-cinema expansion',
          )

          # Film Study runtime registration
          replace_once(
              'src/ui/data/scenarioFilmStudyMap.ts',
              'import { wingsFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsWings";\n',
              'import { wingsFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsWings";\nimport { theLastLaughFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsTheLastLaugh";\n',
          )
          replace_once(
              'src/ui/data/scenarioFilmStudyMap.ts',
              '  [wingsFilmHistoryProfile.scenarioId]: wingsFilmHistoryProfile,\n',
              '  [wingsFilmHistoryProfile.scenarioId]: wingsFilmHistoryProfile,\n  [theLastLaughFilmHistoryProfile.scenarioId]: theLastLaughFilmHistoryProfile,\n',
          )

          # Verification registry
          replace_once(
              'src/ui/data/scenarioProductionVerificationRegistry.ts',
              'import { wingsProductionCaseVerification } from "./scenarioProductionVerificationWings";\n',
              'import { wingsProductionCaseVerification } from "./scenarioProductionVerificationWings";\nimport { theLastLaughProductionCaseVerification } from "./scenarioProductionVerificationTheLastLaugh";\n',
          )
          replace_once(
              'src/ui/data/scenarioProductionVerificationRegistry.ts',
              '  wingsProductionCaseVerification,\n',
              '  wingsProductionCaseVerification,\n  theLastLaughProductionCaseVerification,\n',
          )

          # Chapter 7 audit: this later chapter owns the new expansion/count.
          replace_once('scripts/film-history-chapter-seven-atlas-audit.mjs', 'const EXPECTED_ATLAS_COUNT = 403;', 'const EXPECTED_ATLAS_COUNT = 404;')
          replace_once(
              'scripts/film-history-chapter-seven-atlas-audit.mjs',
              '  "chapterSixHollywoodExpansion.ts",\n  "modernCanonExpansion.ts",',
              '  "chapterSixHollywoodExpansion.ts",\n  "chapterSevenWeimarExpansion.ts",\n  "modernCanonExpansion.ts",',
          )
          replace_once(
              'scripts/film-history-chapter-seven-atlas-audit.mjs',
              '  USE_EXISTING: ["Metropolis", "Nosferatu", "The Cabinet of Dr. Caligari"],\n  P0: ["The Last Laugh"],',
              '  USE_EXISTING: ["Metropolis", "Nosferatu", "The Cabinet of Dr. Caligari", "The Last Laugh"],\n  P0: [],',
          )

          # Global production-case integrity owns all expansions.
          replace_once('scripts/production-case-rest-audit.mjs', 'const EXPECTED_PLAYABLE_SCENARIOS = 403;', 'const EXPECTED_PLAYABLE_SCENARIOS = 404;')
          replace_once('scripts/production-case-rest-audit.mjs', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 403;', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 404;')
          replace_once(
              'scripts/production-case-rest-audit.mjs',
              '  "chapterSixHollywoodExpansion.ts",\n  "modernCanonExpansion.ts",',
              '  "chapterSixHollywoodExpansion.ts",\n  "chapterSevenWeimarExpansion.ts",\n  "modernCanonExpansion.ts",',
          )

          # Update the owner-authored Chapter 7 audit contract to the materialized state.
          replace_once('src/core/filmHistoryChapterSevenAuditContract.test.ts', 'const EXPECTED_ATLAS_COUNT = 403', 'const EXPECTED_ATLAS_COUNT = 404') if False else None
          p = Path('src/core/filmHistoryChapterSevenAuditContract.test.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace('assert.match(audit, /const EXPECTED_ATLAS_COUNT = 403;/);', 'assert.match(audit, /const EXPECTED_ATLAS_COUNT = 404;/);', 1)
          text = text.replace('assert.match(audit, /USE_EXISTING: \\["Metropolis", "Nosferatu", "The Cabinet of Dr\\. Caligari"\\]/);', 'assert.match(audit, /USE_EXISTING: \\["Metropolis", "Nosferatu", "The Cabinet of Dr\\. Caligari", "The Last Laugh"\\]/);', 1)
          text = text.replace('assert.match(audit, /P0: \\["The Last Laugh"\\]/);', 'assert.match(audit, /P0: \\[\\]/);', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Full v0.1 verification
        run: npm run verify:v0.1
      - name: Commit verified Last Laugh materialization and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/last-laugh-1924-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete The Last Laugh 1924 production case"
          git push origin HEAD:agent/the-last-laugh-1924
