name: TEMP Materialize Touki Bouki Chapter 15

on:
  push:
    branches:
      - agent/ch15-touki-bouki-production-case

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ch15-touki-bouki-production-case

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integrate Touki Bouki atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          audit_scripts = [
              "scripts/film-history-chapter-twelve-atlas-audit.mjs",
              "scripts/film-history-chapter-thirteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fourteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fifteen-atlas-audit.mjs",
          ]
          for path in audit_scripts:
              replace_once(path, "const EXPECTED_ATLAS_COUNT = 445;", "const EXPECTED_ATLAS_COUNT = 446;")
              replace_once(
                  path,
                  '  "chapterFourteenMemoriesUnderdevelopmentExpansion.ts",\n',
                  '  "chapterFourteenMemoriesUnderdevelopmentExpansion.ts",\n  "chapterFifteenToukiBoukiExpansion.ts",\n',
              )

          path = "scripts/production-case-rest-audit.mjs"
          replace_once(path, "const EXPECTED_PLAYABLE_SCENARIOS = 445;", "const EXPECTED_PLAYABLE_SCENARIOS = 446;")
          replace_once(path, "const EXPECTED_VERIFIED_PRODUCTION_CASES = 445;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 446;")
          replace_once(
              path,
              '  "chapterFourteenMemoriesUnderdevelopmentExpansion.ts",\n',
              '  "chapterFourteenMemoriesUnderdevelopmentExpansion.ts",\n  "chapterFifteenToukiBoukiExpansion.ts",\n',
          )

          path = "src/ui/data/filmScenarios.ts"
          replace_once(
              path,
              'import { mergeChapterFourteenMemoriesUnderdevelopmentExpansion } from "../../core/chapterFourteenMemoriesUnderdevelopmentExpansion.js";\n',
              'import { mergeChapterFourteenMemoriesUnderdevelopmentExpansion } from "../../core/chapterFourteenMemoriesUnderdevelopmentExpansion.js";\nimport { mergeChapterFifteenToukiBoukiExpansion } from "../../core/chapterFifteenToukiBoukiExpansion.js";\n',
          )
          replace_once(
              path,
              'const modernCanonScenarios = mergeModernCanonExpansion(chapterFourteenMemoriesUnderdevelopmentScenarios);',
              'const chapterFifteenToukiBoukiScenarios = mergeChapterFifteenToukiBoukiExpansion(chapterFourteenMemoriesUnderdevelopmentScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterFifteenToukiBoukiScenarios);',
          )
          replace_once(
              path,
              '+manual_chapter_fourteen_memories_underdevelopment_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_fourteen_memories_underdevelopment_expansion_2026+manual_chapter_fifteen_touki_bouki_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
          )

          path = "src/ui/data/scenarioFilmStudyMap.ts"
          replace_once(
              path,
              'import { memoriesUnderdevelopmentFilmHistoryProfile } from "./scenarioFilmStudyNewWavesMemoriesUnderdevelopment";\n',
              'import { memoriesUnderdevelopmentFilmHistoryProfile } from "./scenarioFilmStudyNewWavesMemoriesUnderdevelopment";\nimport { toukiBoukiFilmHistoryProfile } from "./scenarioFilmStudyNewHollywoodToukiBouki";\n',
          )
          replace_once(
              path,
              '  [memoriesUnderdevelopmentFilmHistoryProfile.scenarioId]: memoriesUnderdevelopmentFilmHistoryProfile,\n',
              '  [memoriesUnderdevelopmentFilmHistoryProfile.scenarioId]: memoriesUnderdevelopmentFilmHistoryProfile,\n  [toukiBoukiFilmHistoryProfile.scenarioId]: toukiBoukiFilmHistoryProfile,\n',
          )

          path = "src/ui/data/scenarioProductionVerificationRegistry.ts"
          replace_once(
              path,
              'import { memoriesUnderdevelopmentProductionCaseVerification } from "./scenarioProductionVerificationMemoriesUnderdevelopment";\n',
              'import { memoriesUnderdevelopmentProductionCaseVerification } from "./scenarioProductionVerificationMemoriesUnderdevelopment";\nimport { toukiBoukiProductionCaseVerification } from "./scenarioProductionVerificationToukiBouki";\n',
          )
          replace_once(
              path,
              '  memoriesUnderdevelopmentProductionCaseVerification,\n',
              '  memoriesUnderdevelopmentProductionCaseVerification,\n  toukiBoukiProductionCaseVerification,\n',
          )

          for chapter in ("Twelve", "Thirteen", "Fourteen"):
              path = f"src/core/filmHistoryChapter{chapter}AuditContract.test.ts"
              p = Path(path)
              text = p.read_text()
              text2 = text.replace("EXPECTED_ATLAS_COUNT = 445", "EXPECTED_ATLAS_COUNT = 446")
              text2 = text2.replace("resolved.atlas.expectedCount, 445", "resolved.atlas.expectedCount, 446")
              text2 = text2.replace("resolved.atlas.actualCount, 445", "resolved.atlas.actualCount, 446")
              if text2 == text:
                  raise SystemExit(f"{path}: expected Atlas-count assertions not found")
              p.write_text(text2)

          path = "src/core/filmHistoryChapterFifteenAuditContract.test.ts"
          p = Path(path)
          text = p.read_text()
          changes = [
              ("EXPECTED_ATLAS_COUNT = 445", "EXPECTED_ATLAS_COUNT = 446"),
              ("resolved.atlas.expectedCount, 445", "resolved.atlas.expectedCount, 446"),
              ("resolved.atlas.actualCount, 445", "resolved.atlas.actualCount, 446"),
              ('  "The Spirit of the Beehive",\n  "Scenes from a Marriage",', '  "The Spirit of the Beehive",\n  "Touki Bouki",\n  "Scenes from a Marriage",'),
              ('const exactP1Queue = ["Touki Bouki", "Manila in the Claws of Light", "The Battle of Chile: Part I"];', 'const exactP1Queue = ["Manila in the Claws of Light", "The Battle of Chile: Part I"];'),
              ('  assert.equal(byTitle.get("The Spirit of the Beehive")?.scenarioId, "scenario_the_spirit_of_the_beehive_1973");\n', '  assert.equal(byTitle.get("The Spirit of the Beehive")?.scenarioId, "scenario_the_spirit_of_the_beehive_1973");\n  assert.equal(byTitle.get("Touki Bouki")?.scenarioId, "scenario_touki_bouki_1973");\n'),
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f"{path}: missing expected fragment {old!r}")
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Regenerate Chapter 12-15 Atlas reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json >/tmp/ch12.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json >/tmp/ch13.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json >/tmp/ch14.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json >/tmp/ch15.json
          node -e 'const r=require("./docs/film-history-chapter-fifteen-atlas-resolved.json"); if(r.atlas.actualCount!==446) process.exit(1); if(r.byDecision.P0.length!==0) process.exit(2); if(JSON.stringify(r.byDecision.P1)!==JSON.stringify(["Manila in the Claws of Light","The Battle of Chile: Part I"])) process.exit(3); const t=r.candidates.find(x=>x.title==="Touki Bouki"); if(!t||t.scenarioId!=="scenario_touki_bouki_1973"||t.decision!=="USE_EXISTING") process.exit(4);'

      - name: Verify full v0.1
        run: npm run verify:v0.1

      - name: Commit integration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ch15-touki-bouki-materialize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize Touki Bouki Chapter 15 Production Case"
          git push origin HEAD:agent/ch15-touki-bouki-production-case
