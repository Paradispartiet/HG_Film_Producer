name: TEMP Chapter 18 A Separation integration

on:
  push:
    branches:
      - agent/ch18-a-separation-production-case
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch18-a-separation-production-case
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Strengthen court-rebuild gameplay contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/core/chapterEighteenASeparationExpansion.ts';
          let t = fs.readFileSync(p, 'utf8');
          const from = "Build the judge's office and court material in available school spaces while preserving the cramped institutional behavior and spatial logic the screenplay needs.";
          const to = "Build the judge's office and court material inside two disused schools while preserving the cramped institutional behavior and spatial logic the screenplay needs.";
          if (!t.includes(to)) {
            if (!t.includes(from)) throw new Error('Expected A Separation court-rebuild task not found');
            t = t.replace(from, to);
            fs.writeFileSync(p, t);
          }
          NODE
      - name: Materialize integration
        run: node scripts/TEMP-ch18-a-separation-integrate.mjs
      - name: Commit deterministic integration
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          git commit -m "Strengthen A Separation court-rebuild gameplay contract"
          git push origin HEAD:agent/ch18-a-separation-production-case

# TEMP repair keeps the two-disused-schools fact explicit in player action.
# User-authored no-op change to verify repaired materialized 507/507 head.
