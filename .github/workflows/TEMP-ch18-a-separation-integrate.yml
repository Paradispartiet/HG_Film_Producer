name: TEMP Chapter 18 A Separation integration

on:
  push:
    branches:
      - agent/ch18-a-separation-production-case
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch18-a-separation-production-case
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize integration
        run: node scripts/TEMP-ch18-a-separation-integrate.mjs
      - name: Commit deterministic integration
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          git commit -m "Integrate A Separation into Chapter 18 Atlas"
          git push origin HEAD:agent/ch18-a-separation-production-case

# User-authored no-op change to run permanent verification on the materialized 507/507 head.
