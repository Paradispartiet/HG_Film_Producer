name: TEMP Materialize My Beautiful Laundrette Chapter 16

on:
  push:
    branches:
      - agent/ch16-my-beautiful-laundrette-production-case

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ch16-my-beautiful-laundrette-production-case
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate My Beautiful Laundrette permanently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = "src/ui/data/filmScenarios.ts"
          text = read(path)
          text = replace_once(
              text,
              'import { mergeChapterSixteenYellowEarthExpansion } from "../../core/chapterSixteenYellowEarthExpansion.js";\n',
              'import { mergeChapterSixteenYellowEarthExpansion } from "../../core/chapterSixteenYellowEarthExpansion.js";\nimport { mergeChapterSixteenMyBeautifulLaundretteExpansion } from "../../core/chapterSixteenMyBeautifulLaundretteExpansion.js";\n',
              "filmScenarios import",
          )
          text = replace_once(
              text,
              'const chapterSixteenYellowEarthScenarios = mergeChapterSixteenYellowEarthExpansion(chapterSixteenRaidersLostArkScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenYellowEarthScenarios);',
              'const chapterSixteenYellowEarthScenarios = mergeChapterSixteenYellowEarthExpansion(chapterSixteenRaidersLostArkScenarios);\nconst chapterSixteenMyBeautifulLaundretteScenarios = mergeChapterSixteenMyBeautifulLaundretteExpansion(chapterSixteenYellowEarthScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenMyBeautifulLaundretteScenarios);',
              "filmScenarios merge chain",
          )
          text = replace_once(
              text,
              '+manual_chapter_sixteen_yellow_earth_expansion_2026',
              '+manual_chapter_sixteen_yellow_earth_expansion_2026+manual_chapter_sixteen_my_beautiful_laundrette_expansion_2026',
              "filmScenarios source list",
          )
          write(path, text)

          path = "src/ui/data/scenarioFilmStudyMap.ts"
          text = read(path)
          text = replace_once(
              text,
              'import { yellowEarthFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenYellowEarth";\n',
              'import { yellowEarthFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenYellowEarth";\nimport { myBeautifulLaundretteFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenMyBeautifulLaundrette";\n',
              "Film Study import",
          )
          text = replace_once(
              text,
              '  [yellowEarthFilmHistoryProfile.scenarioId]: yellowEarthFilmHistoryProfile,\n',
              '  [yellowEarthFilmHistoryProfile.scenarioId]: yellowEarthFilmHistoryProfile,\n  [myBeautifulLaundretteFilmHistoryProfile.scenarioId]: myBeautifulLaundretteFilmHistoryProfile,\n',
              "Film Study profile map",
          )
          write(path, text)

          path = "src/ui/data/scenarioProductionVerificationRegistry.ts"
          text = read(path)
          text = replace_once(
              text,
              'import { yellowEarthProductionCaseVerification } from "./scenarioProductionVerificationYellowEarth";\n',
              'import { yellowEarthProductionCaseVerification } from "./scenarioProductionVerificationYellowEarth";\nimport { myBeautifulLaundretteProductionCaseVerification } from "./scenarioProductionVerificationMyBeautifulLaundrette";\n',
              "verification import",
          )
          text = replace_once(
              text,
              '  yellowEarthProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
              '  yellowEarthProductionCaseVerification,\n  myBeautifulLaundretteProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
              "verification registry record",
          )
          write(path, text)

          atlas_scripts = [
              "scripts/film-history-chapter-twelve-atlas-audit.mjs",
              "scripts/film-history-chapter-thirteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fourteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fifteen-atlas-audit.mjs",
              "scripts/film-history-chapter-sixteen-atlas-audit.mjs",
          ]
          for path in atlas_scripts:
              text = read(path)
              text = replace_once(text, "const EXPECTED_ATLAS_COUNT = 450;", "const EXPECTED_ATLAS_COUNT = 451;", f"{path} count")
              text = replace_once(
                  text,
                  '  "chapterSixteenYellowEarthExpansion.ts",\n',
                  '  "chapterSixteenYellowEarthExpansion.ts",\n  "chapterSixteenMyBeautifulLaundretteExpansion.ts",\n',
                  f"{path} expansion",
              )
              write(path, text)

          path = "scripts/production-case-rest-audit.mjs"
          text = read(path)
          text = replace_once(text, "const EXPECTED_PLAYABLE_SCENARIOS = 450;", "const EXPECTED_PLAYABLE_SCENARIOS = 451;", "production audit playable count")
          text = replace_once(text, "const EXPECTED_VERIFIED_PRODUCTION_CASES = 450;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 451;", "production audit verified count")
          text = replace_once(
              text,
              '  "chapterSixteenYellowEarthExpansion.ts",\n',
              '  "chapterSixteenYellowEarthExpansion.ts",\n  "chapterSixteenMyBeautifulLaundretteExpansion.ts",\n',
              "production audit expansion",
          )
          write(path, text)

          for path in [
              "src/core/filmHistoryChapterTwelveAuditContract.test.ts",
              "src/core/filmHistoryChapterThirteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFourteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFifteenAuditContract.test.ts",
          ]:
              text = read(path)
              count = text.count("450")
              if count < 3:
                  raise SystemExit(f"{path}: expected at least three 450 count locks, found {count}")
              write(path, text.replace("450", "451"))

          path = "src/core/filmHistoryChapterSixteenAuditContract.test.ts"
          text = read(path)
          count = text.count("450")
          if count < 4:
              raise SystemExit(f"Chapter 16 contract: expected count locks, found {count}")
          text = text.replace("450", "451")
          target_line = '  "My Beautiful Laundrette",\n'
          if text.count(target_line) != 2:
              raise SystemExit(f"Chapter 16 contract: expected My Beautiful Laundrette in P0 and recommended queues exactly twice, found {text.count(target_line)}")
          text = text.replace(target_line, "")
          text = replace_once(
              text,
              '  "Tampopo",\n  "Down by Law",',
              '  "Tampopo",\n  "My Beautiful Laundrette",\n  "Down by Law",',
              "Chapter 16 existing queue",
          )
          text = replace_once(
              text,
              '    "Tampopo": "scenario_tampopo_1985",\n    "Down by Law":',
              '    "Tampopo": "scenario_tampopo_1985",\n    "My Beautiful Laundrette": "scenario_my_beautiful_laundrette_1985",\n    "Down by Law":',
              "Chapter 16 exact ID map",
          )
          text = text.replace('    "Sugar Cane Alley",\n      "The Terminator",', '    "Sugar Cane Alley",\n    "The Terminator",')
          write(path, text)
          PY

      - name: Regenerate Chapter 12-16 Atlas reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json
          node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json

      - name: Assert canonical My Beautiful Laundrette result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('docs/film-history-chapter-sixteen-atlas-resolved.json', 'utf8'));
          if (report.atlas.expectedCount !== 451 || report.atlas.actualCount !== 451) throw new Error(`Atlas count mismatch: ${report.atlas.expectedCount}/${report.atlas.actualCount}`);
          if (report.verificationIndex.literalVerifiedScenarioIds !== 451) throw new Error(`Verification count mismatch: ${report.verificationIndex.literalVerifiedScenarioIds}`);
          const film = report.candidates.find((item) => item.title === 'My Beautiful Laundrette');
          if (!film) throw new Error('My Beautiful Laundrette candidate missing');
          if (film.decision !== 'USE_EXISTING') throw new Error(`decision ${film.decision}`);
          if (film.scenarioId !== 'scenario_my_beautiful_laundrette_1985') throw new Error(`id ${film.scenarioId}`);
          if (film.productionVerified !== true) throw new Error('My Beautiful Laundrette is not production verified');
          const expectedP0 = ['Police Story', 'The Official Story', 'Yeelen', 'Do the Right Thing'];
          if (JSON.stringify(report.byDecision.P0) !== JSON.stringify(expectedP0)) throw new Error(`P0 mismatch: ${JSON.stringify(report.byDecision.P0)}`);
          const expectedP1 = ['Mephisto','Missing','Blade Runner','E.T. the Extra-Terrestrial','Sugar Cane Alley','The Terminator','Come and See','Back to the Future','Aliens',"She's Gotta Have It",'A Better Tomorrow','RoboCop','Salaam Bombay!'];
          if (JSON.stringify(report.byDecision.P1) !== JSON.stringify(expectedP1)) throw new Error(`P1 mismatch: ${JSON.stringify(report.byDecision.P1)}`);
          NODE

      - name: Verify full v0.1
        run: npm run verify:v0.1

      - name: Commit permanent integration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ch16-my-beautiful-laundrette-materialize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize My Beautiful Laundrette Chapter 16 Production Case"
          git push origin HEAD:agent/ch16-my-beautiful-laundrette-production-case
