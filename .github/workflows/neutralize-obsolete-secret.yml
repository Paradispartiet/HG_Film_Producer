name: Neutralize obsolete migration secret

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/neutralize-obsolete-secret.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      OBSOLETE_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - name: Replace obsolete secret with inert value
        id: replace
        shell: bash
        run: |
          set -u
          if [[ -z "${OBSOLETE_TOKEN:-}" ]]; then
            echo 'result=already_absent' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' 'RETIRED' | GH_TOKEN="$OBSOLETE_TOKEN" gh secret set REPO_ADMIN_TOKEN --repo "$GITHUB_REPOSITORY" --body - >/dev/null 2>&1; then
            echo 'result=neutralized' >> "$GITHUB_OUTPUT"
          else
            echo 'result=update_denied' >> "$GITHUB_OUTPUT"
          fi
      - name: Record result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.replace.outputs.result }}
        run: |
          set -euo pipefail
          printf 'REPO_ADMIN_TOKEN=%s\nrun_id=%s\n' "${RESULT:-unknown}" "$GITHUB_RUN_ID" > /tmp/result
          encoded="$(base64 -w0 /tmp/result)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.obsolete-secret-neutralized.txt" -f message="Record obsolete secret neutralization ${GITHUB_RUN_ID}" -f content="$encoded" -f branch=main >/dev/null
