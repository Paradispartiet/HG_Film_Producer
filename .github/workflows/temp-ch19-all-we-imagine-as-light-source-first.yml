name: TEMP Chapter 19 All We Imagine as Light source-first

on:
  push:
    branches:
      - agent/ch19-all-we-imagine-as-light-production-case
    paths:
      - .github/workflows/temp-ch19-all-we-imagine-as-light-source-first.yml
      - src/core/chapterNineteenAllWeImagineAsLightExpansion.ts
      - src/core/chapterNineteenAllWeImagineAsLightExpansion.test.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenAllWeImagineAsLight.ts
      - src/ui/data/scenarioProductionVerificationAllWeImagineAsLight.ts

permissions:
  contents: read

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict All We Imagine as Light contract
        run: node --test dist/core/chapterNineteenAllWeImagineAsLightExpansion.test.js

      - name: Build UI
        run: npm run build:ui
