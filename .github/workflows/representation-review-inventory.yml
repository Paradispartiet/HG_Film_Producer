name: Materialize final representation review batch

on:
  push:
    branches:
      - agent/representation-review-closure-20260910

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized final reviews]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize final 70 exact reviews
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const coveragePath = 'data/film/film_history_representation_coverage_v1.json';
          const coverage = JSON.parse(readFileSync(coveragePath, 'utf8'));
          const runAudit = (out) => {
            const p = spawnSync('node', ['scripts/film-history-representation-coverage-audit-v1.mjs', `--write=${out}`], { stdio: 'inherit' });
            if (p.status !== 0) throw new Error(`Representation audit failed for ${out}`);
            return JSON.parse(readFileSync(out, 'utf8'));
          };
          const before = runAudit('.tmp/review-before.json');
          if (before.mapping.reviewedScenarioIds !== 543 || before.mapping.mappedScenarioIds !== 206 || before.mapping.reviewedNoMappingScenarioIds !== 337 || before.mapping.unmappedScenarioIds !== 70) throw new Error('Unexpected final-review baseline');
          if (before.core.runtimeAtlasScenarios !== 613 || before.core.uniqueProductionVerificationIds !== 613 || !before.core.exactSetEquality || before.coverage.p0OpenRows !== 1) throw new Error('Frozen representation invariant changed');

          const pvPathsByScenario = new Map();
          for (const file of readdirSync('src/ui/data')) {
            if (!file.startsWith('scenarioProductionVerification') || !file.endsWith('.ts')) continue;
            const path = `src/ui/data/${file}`;
            const source = readFileSync(path, 'utf8');
            for (const match of source.matchAll(/scenarioId\s*:\s*["']([^"']+)["']/g)) {
              const arr = pvPathsByScenario.get(match[1]) ?? [];
              arr.push(path);
              pvPathsByScenario.set(match[1], arr);
            }
          }

          const decisions = new Map(Object.entries({
            scenario_stranger_than_paradise_1984: { development_ids: ['modernism_new_waves_alternative_movements'], rationale: 'The permanent PV documents donated leftover stock, radically constrained black-and-white master-shot production and the film’s concrete role in shaping the American independent-film movement, connecting alternative form to material production scale rather than style alone.' },
            scenario_tangerines_2013: { development_ids: ['decolonial_transnational_historiography'], rationale: 'The permanent PV documents an Estonian-Georgian co-production, production in Guria standing in for the inaccessible Abkhazian conflict region, named companies and cross-border production labor, providing exact transnational geography and production-system evidence.' },
            scenario_taxi_2015: { development_ids: ['mena_industry_system'], rationale: 'The permanent PV documents Panahi’s state filmmaking ban, semi-clandestine dashboard-camera production, compact digital workflow and the loss of conventional production access as a direct production constraint, providing exact Iranian regulation and production-system evidence.' },
            scenario_terrified_2017: { development_ids: ['contemporary_popular_genres_as_industries'], rationale: 'The permanent PV documents an Argentine horror production built around a rented connected block, practical effects and props, supporting CGI, named production departments, theatrical release and later Shudder circulation, tying horror to a concrete local production and distribution pathway.' },
            scenario_the_big_sick_2017: { development_ids: ['genre_industries_horror_action_comedy_romance_exploitation_local_popular'], rationale: 'The permanent PV documents a multi-year romantic-comedy development process with Apatow and Mendel and a competitive Sundance acquisition by Amazon Studios for about USD 12 million, connecting the genre to a concrete independent development and distribution market.' },
            scenario_the_bothersome_man_2006: { development_ids: ['nordic_norwegian_silent_and_institution_history'], rationale: 'The permanent PV documents a Norwegian-Icelandic feature, national production records, Nordic institutional recognition and the production companies and craft departments behind the film, providing exact Nordic institutional and company history.' },
            scenario_the_child_2005: { development_ids: ['decolonial_transnational_historiography'], rationale: 'The permanent PV documents a Belgium-France production with Les Films du Fleuve, Archipel 35, RTBF, Arte France Cinéma, Belgian and French public support, Eurimages and MEDIA backing plus international distribution, providing inspectable transnational financing and circulation evidence.' },
            scenario_the_guilty_2018: { development_ids: ['nordic_norwegian_silent_and_institution_history'], rationale: 'The permanent PV documents New Danish Screen financing, a tightly constrained 13-day Danish production and complete institutional production records, directly teaching a modern Nordic public-support and production organization model.' },
            scenario_the_hateful_eight_2015: { development_ids: ['exhibition_and_viewing_history'], rationale: 'The permanent PV documents continuous 70 mm conforming, restored projector logistics and a limited Ultra Panavision 70 roadshow with overture and intermission, directly connecting production and delivery choices to a distinct theatrical exhibition system.' },
            scenario_the_host_2006: { development_ids: ['south_korea_industry_system', 'genre_industries_horror_action_comedy_romance_exploitation_local_popular'], rationale: 'The permanent PV uses KOFIC to document Chungeorahm Film production, release history and principal departments, while the EON Digital Film–The Orphanage VFX split and monster-film circulation tie a popular genre to a concrete South Korean company, labor and release system.' },
            scenario_the_house_that_jack_built_2018: { development_ids: ['nordic_norwegian_silent_and_institution_history', 'regional_incentives_studios_and_production_infrastructure'], rationale: 'The permanent PV documents Zentropa, Film i Väst, Copenhagen Film Fund, extensive Dalsland production and Studio Fares in Trollhättan, linking Nordic company/public-support structures and regional studio infrastructure to the production geography.' },
            scenario_the_killing_of_a_sacred_deer_2017: { development_ids: ['regional_incentives_studios_and_production_infrastructure'], rationale: 'The permanent PV documents Cincinnati principal photography, a regional film-commission partnership, local crew and extras, hospital and neighborhood location infrastructure and the production base choices that shaped the shoot.' },
            scenario_the_lobster_2015: { development_ids: ['decolonial_transnational_historiography'], rationale: 'The permanent PV documents a five-country European financing and production network, Irish location production, UK editing, Netherlands picture/sound post and French VFX work, providing exact transnational financing, labor and post-production geography.' },
            scenario_the_lost_weekend_1945: { development_ids: ['classical_hollywood_studio_system', 'genre_industries_horror_action_comedy_romance_exploitation_local_popular'], rationale: 'The permanent PV documents Paramount production organization, studio scheduling, Production Code and liquor-industry pressure plus a noir/documentary-realism industrial context, directly supporting both classical studio organization and genre-regulation history.' },
            scenario_the_man_without_a_past_2002: { development_ids: ['nordic_norwegian_silent_and_institution_history'], rationale: 'The permanent PV documents the complete Nordic coproduction and funding structure, Helsinki production geography, technical format and institutional records, providing exact Nordic company, financing and exhibition evidence.' },
            scenario_the_motorcycle_diaries_2004: { development_ids: ['decolonial_transnational_historiography'], rationale: 'The permanent PV documents an Argentina-Brazil-Chile-Peru-United States production identity, FilmFour participation, repeated route research and production across South America, providing exact transnational production geography and organization.' },
            scenario_the_passion_of_joan_of_arc_1928: { development_ids: ['preservation_restoration_material_survival_as_history_maker'], rationale: 'The permanent PV documents severe historical shortening, loss and later recovery of Dreyer material, making surviving-version history directly relevant to what the film’s production form can now be reconstructed and taught from.' },
            scenario_the_pianist_2002: { development_ids: ['decolonial_transnational_historiography'], rationale: 'The permanent PV documents a Poland-France-Germany-United Kingdom production with public funding, a Warsaw-Jüterbog-Beelitz-Babelsberg production route and multinational department organization, providing concrete transnational financing and production infrastructure evidence.' },
            scenario_the_square_2017: { development_ids: ['nordic_norwegian_silent_and_institution_history'], rationale: 'The permanent PV documents Plattform Produktion, Swedish public funding, a Swedish-German-French-Danish production network and Coproduction Office international sales, supplying exact Nordic company, financing and circulation evidence.' },
            scenario_tradgardsgatan_2017: { development_ids: ['nordic_norwegian_silent_and_institution_history'], rationale: 'The permanent PV documents difficult financing, collective Swedish production, Primodrom Produktion, SFI records and HD/DCP delivery, providing exact Nordic company and institutional production evidence.' },
            scenario_troll_hunter_2010: { development_ids: ['nordic_norwegian_silent_and_institution_history', 'contemporary_popular_genres_as_industries'], rationale: 'The permanent PV documents Filmkameratene and Norwegian production partners, regional location infrastructure, a USD 3.5 million budget with roughly USD 1 million of CGI and Storm Studios effects work, tying Norwegian institutions and local popular fantasy/horror production to a concrete industrial model.' },
            scenario_true_romance_1993: { development_ids: ['genre_industries_horror_action_comedy_romance_exploitation_local_popular'], rationale: 'The permanent PV documents Morgan Creek production, Warner distribution, theatrical and director-cut version history and the film’s crime/outlaw-romance production context, tying genre to a concrete studio-independent production and release system.' },
            scenario_virgin_mountain_2015: { development_ids: ['nordic_norwegian_silent_and_institution_history'], rationale: 'The permanent PV documents RVK Studios and Nimbus Film, Icelandic-Danish financing bodies, a familiar Icelandic crew and complete production records, providing exact Nordic company, financing and labor-system evidence.' },
            scenario_where_is_the_friend_s_house_1987: { development_ids: ['mena_industry_system'], rationale: 'The permanent PV documents Kanoon as producer, an Iranian production structure, nonprofessional casting and international-sales records, providing exact institutional and production evidence for Iranian cinema rather than nationality alone.' },
            scenario_wings_of_desire_1987: { development_ids: ['modernism_new_waves_alternative_movements'], rationale: 'The permanent PV is bound to the New German Cinema systems evidence set and documents Road Movies, Argos and WDR, a West Berlin shoot and a mixed black-and-white/colour production format, connecting the movement to concrete institutions and production practice.' },
            scenario_yol_1982: { development_ids: ['decolonial_transnational_historiography'], rationale: 'The permanent PV documents a Turkish-Swiss-French production made through Güney’s prison writing, flight from Turkey and Şerif Gören’s on-the-ground direction, providing exact transnational production, censorship and political-constraint evidence.' }
          }));

          const batch = before.scenarioInventory.filter(item => item.reviewState === 'UNMAPPED');
          if (batch.length !== 70) throw new Error(`Expected 70 cases, got ${batch.length}`);
          const batchIds = new Set(batch.map(item => item.scenarioId));
          for (const id of decisions.keys()) if (!batchIds.has(id)) throw new Error(`Mapped decision not in final batch: ${id}`);
          const existing = new Set(coverage.scenario_reviews.map(r => r.scenario_id));
          for (const item of batch) {
            if (existing.has(item.scenarioId)) throw new Error(`Already reviewed: ${item.scenarioId}`);
            const evidencePaths = [...new Set(pvPathsByScenario.get(item.scenarioId) ?? [])];
            if (!evidencePaths.length) throw new Error(`Missing permanent PV path: ${item.scenarioId}`);
            const decision = decisions.get(item.scenarioId);
            coverage.scenario_reviews.push(decision ? {
              scenario_id: item.scenarioId,
              review_state: 'MAPPED',
              development_ids: decision.development_ids,
              evidence_paths: evidencePaths,
              rationale: decision.rationale,
            } : {
              scenario_id: item.scenarioId,
              review_state: 'REVIEWED_NO_MAPPING',
              development_ids: [],
              evidence_paths: evidencePaths,
              rationale: `The permanent ProductionVerification evidence for ${item.title} was reviewed against all 34 representation-development requirements. It verifies title-specific production and craft history, but does not directly satisfy an additional scoped development row without substituting style, nationality, prestige, narrative subject or generic technical presence for industrial evidence.`,
            });
          }
          writeFileSync(coveragePath, `${JSON.stringify(coverage, null, 2)}\n`);
          const after = runAudit('.tmp/review-after.json');
          const mappedAdded = decisions.size;
          if (after.mapping.reviewedScenarioIds !== 613 || after.mapping.unmappedScenarioIds !== 0 || after.mapping.mappedScenarioIds !== 206 + mappedAdded || after.mapping.reviewedNoMappingScenarioIds !== 337 + (70 - mappedAdded)) throw new Error('Unexpected final review result counts');
          if (after.core.runtimeAtlasScenarios !== 613 || after.core.uniqueProductionVerificationIds !== 613 || !after.core.exactSetEquality || after.coverage.p0OpenRows !== 1) throw new Error('Frozen representation invariant changed after final reviews');
          console.log(JSON.stringify({ batch: 70, mappedAdded, mapping: after.mapping, coverage: after.coverage, representationalClosure: after.representationalClosure }, null, 2));
          NODE
      - name: Commit permanent final review batch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/film/film_history_representation_coverage_v1.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "Audit representation review closure final batch [materialized final reviews]"
          git push origin HEAD:agent/representation-review-closure-20260910