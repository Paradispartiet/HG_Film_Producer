name: Inspect final representation review batch

on:
  push:
    branches:
      - agent/representation-review-closure-20260910

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Print final 70 exact PV evidence records
        shell: bash
        run: |
          node scripts/film-history-representation-coverage-audit-v1.mjs --write=.tmp/review-closure.json
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const report = JSON.parse(readFileSync('.tmp/review-closure.json', 'utf8'));
          if (report.mapping.reviewedScenarioIds !== 543 || report.mapping.unmappedScenarioIds !== 70) throw new Error(`Unexpected baseline ${report.mapping.reviewedScenarioIds}/${report.mapping.unmappedScenarioIds}`);
          if (report.core.runtimeAtlasScenarios !== 613 || report.core.uniqueProductionVerificationIds !== 613 || !report.core.exactSetEquality) throw new Error('Frozen 613/613 invariant changed');
          if (report.coverage.p0OpenRows !== 1) throw new Error(`Expected one open P0 row, got ${report.coverage.p0OpenRows}`);
          const records = new Map();
          for (const file of readdirSync('src/ui/data')) {
            if (!file.startsWith('scenarioProductionVerification') || !file.endsWith('.ts')) continue;
            const path = `src/ui/data/${file}`;
            const source = readFileSync(path, 'utf8');
            const matches = [...source.matchAll(/scenarioId\s*:\s*["']([^"']+)["']/g)];
            for (let i = 0; i < matches.length; i += 1) {
              const start = matches[i].index;
              const end = i + 1 < matches.length ? matches[i + 1].index : source.length;
              const block = source.slice(start, end);
              const arr = records.get(matches[i][1]) ?? [];
              arr.push({ path, summary: [...block.matchAll(/summary\s*:\s*["'`]([^"'`]+)["'`]/g)].map(m => m[1]), notes: [...block.matchAll(/note\s*:\s*["'`]([^"'`]+)["'`]/g)].map(m => m[1]).slice(0, 12) });
              records.set(matches[i][1], arr);
            }
          }
          const batch = report.scenarioInventory.filter(item => item.reviewState === 'UNMAPPED');
          console.log(`SUMMARY\treviewed=${report.mapping.reviewedScenarioIds}\tunreviewed=${report.mapping.unmappedScenarioIds}\tbatch=${batch.length}`);
          for (const item of batch) {
            console.log(`CASE\t${item.scenarioId}\t${item.year}\t${item.title}\t${item.origin}`);
            for (const rec of records.get(item.scenarioId) ?? []) {
              console.log(`PV\t${rec.path}`);
              for (const text of rec.summary) console.log(`SUMMARYTEXT\t${text}`);
              for (const text of rec.notes) console.log(`NOTE\t${text}`);
            }
          }
          if (batch.length !== 70) throw new Error(`Expected 70 cases, got ${batch.length}`);
          NODE