name: TEMP Fix Chapter 16 Mephisto Classification

on:
  push:
    branches:
      - agent/ch16-franchise-video-global-new-cinemas-atlas-audit

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch16-franchise-video-global-new-cinemas-atlas-audit
          fetch-depth: 0
      - name: Reclassify Mephisto and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/film-history-chapter-sixteen-atlas-audit.mjs')
          text = p.read_text()
          old = '["Mephisto", "Mephisto", 1981, [], "anchor_film", "EXISTING_REQUIRED"'
          new = '["Mephisto", "Mephisto", 1981, [], "anchor_film", "P1"'
          if old not in text:
              raise SystemExit('Expected Mephisto classification marker not found')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/ch16-mephisto-classification-fix-once.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/film-history-chapter-sixteen-atlas-audit.mjs .github/workflows/ch16-mephisto-classification-fix-once.yml
          git commit -m "Fix Chapter 16 Mephisto audit classification"
          git push origin HEAD:agent/ch16-franchise-video-global-new-cinemas-atlas-audit
