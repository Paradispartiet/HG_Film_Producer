name: TEMP Resolve Chapter 16 Film History Atlas

on:
  push:
    branches:
      - agent/ch16-franchise-video-global-new-cinemas-atlas-audit

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ch16-franchise-video-global-new-cinemas-atlas-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Resolve Chapter 16 Atlas
        run: node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json
      - name: Verify full v0.1
        run: npm run verify:v0.1
      - name: Commit resolved report and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ch16-atlas-resolve-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/film-history-chapter-sixteen-atlas-resolved.json .github/workflows/ch16-atlas-resolve-once.yml
          git diff --cached --check
          git commit -m "Resolve Chapter 16 Film History Atlas audit"
          git push origin HEAD:agent/ch16-franchise-video-global-new-cinemas-atlas-audit
