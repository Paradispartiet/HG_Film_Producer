name: TEMP Reconcile Chapter 16 Mephisto Wording

on:
  push:
    branches:
      - agent/ch16-franchise-video-global-new-cinemas-atlas-audit

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch16-franchise-video-global-new-cinemas-atlas-audit
          fetch-depth: 0
      - name: Fix wording, regenerate report, and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/film-history-chapter-sixteen-atlas-audit.mjs')
          text = p.read_text()
          old = "Lajos Koltai's verified production system anchor European political cinema."
          new = "Lajos Koltai's production system makes Mephisto a useful European political-cinema gap candidate."
          if old not in text:
              raise SystemExit('Expected Mephisto wording marker not found')
          p.write_text(text.replace(old, new, 1))
          PY
          node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json >/tmp/ch16-audit.txt
          rm .github/workflows/ch16-mephisto-wording-reconcile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/film-history-chapter-sixteen-atlas-audit.mjs docs/film-history-chapter-sixteen-atlas-resolved.json .github/workflows/ch16-mephisto-wording-reconcile-once.yml
          git diff --cached --check
          git commit -m "Reconcile Chapter 16 Mephisto audit wording"
          git push origin HEAD:agent/ch16-franchise-video-global-new-cinemas-atlas-audit
