name: TEMP Finalize Back to the Future Chapter 16

on:
  push:
    branches:
      - agent/ch16-back-to-the-future-production-case

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ch16-back-to-the-future-production-case
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize Back to the Future permanently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = "src/ui/data/filmScenarios.ts"
          text = read(path)
          text = replace_once(text,
              'import { mergeChapterSixteenComeAndSeeExpansion } from "../../core/chapterSixteenComeAndSeeExpansion.js";\n',
              'import { mergeChapterSixteenComeAndSeeExpansion } from "../../core/chapterSixteenComeAndSeeExpansion.js";\nimport { mergeChapterSixteenBackToTheFutureExpansion } from "../../core/chapterSixteenBackToTheFutureExpansion.js";\n',
              "filmScenarios import")
          text = replace_once(text,
              'const chapterSixteenComeAndSeeScenarios = mergeChapterSixteenComeAndSeeExpansion(chapterSixteenTerminatorScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenComeAndSeeScenarios);',
              'const chapterSixteenComeAndSeeScenarios = mergeChapterSixteenComeAndSeeExpansion(chapterSixteenTerminatorScenarios);\nconst chapterSixteenBackToTheFutureScenarios = mergeChapterSixteenBackToTheFutureExpansion(chapterSixteenComeAndSeeScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenBackToTheFutureScenarios);',
              "filmScenarios chain")
          text = replace_once(text,
              '+manual_chapter_sixteen_come_and_see_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_sixteen_come_and_see_expansion_2026+manual_chapter_sixteen_back_to_the_future_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              "filmScenarios source list")
          write(path, text)

          path = "src/ui/data/scenarioFilmStudyMap.ts"
          text = read(path)
          text = replace_once(text,
              'import { comeAndSeeFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenComeAndSee";\n',
              'import { comeAndSeeFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenComeAndSee";\nimport { backToTheFutureFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenBackToTheFuture";\n',
              "Film Study import")
          text = replace_once(text,
              '  [comeAndSeeFilmHistoryProfile.scenarioId]: comeAndSeeFilmHistoryProfile,\n',
              '  [comeAndSeeFilmHistoryProfile.scenarioId]: comeAndSeeFilmHistoryProfile,\n  [backToTheFutureFilmHistoryProfile.scenarioId]: backToTheFutureFilmHistoryProfile,\n',
              "Film Study map")
          write(path, text)

          path = "src/ui/data/scenarioProductionVerificationRegistry.ts"
          text = read(path)
          text = replace_once(text,
              'import { comeAndSeeProductionCaseVerification } from "./scenarioProductionVerificationComeAndSee";\n',
              'import { comeAndSeeProductionCaseVerification } from "./scenarioProductionVerificationComeAndSee";\nimport { backToTheFutureProductionCaseVerification } from "./scenarioProductionVerificationBackToTheFuture";\n',
              "verification import")
          text = replace_once(text,
              '  comeAndSeeProductionCaseVerification,\n',
              '  comeAndSeeProductionCaseVerification,\n  backToTheFutureProductionCaseVerification,\n',
              "verification registry")
          write(path, text)

          atlas_scripts = [
              "scripts/film-history-chapter-twelve-atlas-audit.mjs",
              "scripts/film-history-chapter-thirteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fourteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fifteen-atlas-audit.mjs",
              "scripts/film-history-chapter-sixteen-atlas-audit.mjs",
          ]
          for path in atlas_scripts:
              text = read(path)
              text = replace_once(text, "const EXPECTED_ATLAS_COUNT = 462;", "const EXPECTED_ATLAS_COUNT = 463;", f"{path} count")
              text = replace_once(text,
                  '  "chapterSixteenComeAndSeeExpansion.ts",\n',
                  '  "chapterSixteenComeAndSeeExpansion.ts",\n  "chapterSixteenBackToTheFutureExpansion.ts",\n',
                  f"{path} expansion")
              write(path, text)

          path = "scripts/production-case-rest-audit.mjs"
          text = read(path)
          text = replace_once(text, "const EXPECTED_PLAYABLE_SCENARIOS = 462;", "const EXPECTED_PLAYABLE_SCENARIOS = 463;", "production playable")
          text = replace_once(text, "const EXPECTED_VERIFIED_PRODUCTION_CASES = 462;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 463;", "production verified")
          text = replace_once(text,
              '  "chapterSixteenComeAndSeeExpansion.ts",\n',
              '  "chapterSixteenComeAndSeeExpansion.ts",\n  "chapterSixteenBackToTheFutureExpansion.ts",\n',
              "production expansion")
          write(path, text)

          for path in [
              "src/core/filmHistoryChapterTwelveAuditContract.test.ts",
              "src/core/filmHistoryChapterThirteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFourteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFifteenAuditContract.test.ts",
          ]:
              text = read(path)
              if text.count("462") < 3:
                  raise SystemExit(f"{path}: missing 462 count locks")
              write(path, text.replace("462", "463"))

          path = "src/core/filmHistoryChapterSixteenAuditContract.test.ts"
          text = read(path)
          if text.count("462") < 4:
              raise SystemExit("Chapter 16 contract missing 462 count locks")
          text = text.replace("462", "463")
          text = replace_once(text,
              '  "The Official Story",\n  "Down by Law",',
              '  "The Official Story",\n  "Back to the Future",\n  "Down by Law",',
              "Chapter 16 existing")
          text = replace_once(text,
              'const exactP1Queue = [\n  "Back to the Future",\n',
              'const exactP1Queue = [\n',
              "Chapter 16 P1")
          text = replace_once(text,
              '    "Back to the Future",\n',
              '',
              "Chapter 16 recommended")
          text = replace_once(text,
              '    "The Official Story": "scenario_the_official_story_1985",\n    "Down by Law":',
              '    "The Official Story": "scenario_the_official_story_1985",\n    "Back to the Future": "scenario_back_to_the_future_1985",\n    "Down by Law":',
              "Chapter 16 exact ID")
          write(path, text)
          PY

      - name: Regenerate Chapter 12-16 Atlas reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json
          node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json

      - name: Assert canonical Back to the Future result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('docs/film-history-chapter-sixteen-atlas-resolved.json', 'utf8'));
          if (report.atlas.expectedCount !== 463 || report.atlas.actualCount !== 463) throw new Error(`Atlas ${report.atlas.expectedCount}/${report.atlas.actualCount}`);
          if (report.verificationIndex.literalVerifiedScenarioIds !== 463) throw new Error(`Verification ${report.verificationIndex.literalVerifiedScenarioIds}`);
          const film = report.candidates.find((item) => item.title === 'Back to the Future');
          if (!film || film.decision !== 'USE_EXISTING' || film.scenarioId !== 'scenario_back_to_the_future_1985' || film.productionVerified !== true) throw new Error(`Back to the Future ${JSON.stringify(film)}`);
          if (report.byDecision.P0.length !== 0) throw new Error(`P0 ${JSON.stringify(report.byDecision.P0)}`);
          const p1 = ['Aliens',"She's Gotta Have It",'A Better Tomorrow','RoboCop','Salaam Bombay!'];
          if (JSON.stringify(report.byDecision.P1) !== JSON.stringify(p1)) throw new Error(`P1 ${JSON.stringify(report.byDecision.P1)}`);
          NODE

      - name: Commit permanent state and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ch16-back-to-future-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/film-history-chapter-twelve-atlas-resolved.json \
            docs/film-history-chapter-thirteen-atlas-resolved.json \
            docs/film-history-chapter-fourteen-atlas-resolved.json \
            docs/film-history-chapter-fifteen-atlas-resolved.json \
            docs/film-history-chapter-sixteen-atlas-resolved.json \
            scripts/film-history-chapter-twelve-atlas-audit.mjs \
            scripts/film-history-chapter-thirteen-atlas-audit.mjs \
            scripts/film-history-chapter-fourteen-atlas-audit.mjs \
            scripts/film-history-chapter-fifteen-atlas-audit.mjs \
            scripts/film-history-chapter-sixteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterTwelveAuditContract.test.ts \
            src/core/filmHistoryChapterThirteenAuditContract.test.ts \
            src/core/filmHistoryChapterFourteenAuditContract.test.ts \
            src/core/filmHistoryChapterFifteenAuditContract.test.ts \
            src/core/filmHistoryChapterSixteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          git diff --cached --check
          git commit -m "Materialize Back to the Future Chapter 16 Production Case"
          git push origin HEAD:agent/ch16-back-to-the-future-production-case
