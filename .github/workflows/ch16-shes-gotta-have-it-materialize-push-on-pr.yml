name: TEMP Materialize She's Gotta Have It Chapter 16

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ch16-shes-gotta-have-it-production-case'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ch16-shes-gotta-have-it-production-case
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize She's Gotta Have It permanently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = "src/ui/data/filmScenarios.ts"
          text = read(path)
          text = replace_once(text,
              'import { mergeChapterSixteenAliensExpansion } from "../../core/chapterSixteenAliensExpansion.js";\n',
              'import { mergeChapterSixteenAliensExpansion } from "../../core/chapterSixteenAliensExpansion.js";\nimport { mergeChapterSixteenShesGottaHaveItExpansion } from "../../core/chapterSixteenShesGottaHaveItExpansion.js";\n',
              "filmScenarios import")
          text = replace_once(text,
              'const chapterSixteenAliensScenarios = mergeChapterSixteenAliensExpansion(chapterSixteenBackToTheFutureScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenAliensScenarios);',
              'const chapterSixteenAliensScenarios = mergeChapterSixteenAliensExpansion(chapterSixteenBackToTheFutureScenarios);\nconst chapterSixteenShesGottaHaveItScenarios = mergeChapterSixteenShesGottaHaveItExpansion(chapterSixteenAliensScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenShesGottaHaveItScenarios);',
              "filmScenarios chain")
          text = replace_once(text,
              '+manual_chapter_sixteen_aliens_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_sixteen_aliens_expansion_2026+manual_chapter_sixteen_shes_gotta_have_it_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              "filmScenarios source list")
          write(path, text)

          path = "src/ui/data/scenarioFilmStudyMap.ts"
          text = read(path)
          text = replace_once(text,
              'import { aliensFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenAliens";\n',
              'import { aliensFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenAliens";\nimport { shesGottaHaveItFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenShesGottaHaveIt";\n',
              "Film Study import")
          text = replace_once(text,
              '  [aliensFilmHistoryProfile.scenarioId]: aliensFilmHistoryProfile,\n',
              '  [aliensFilmHistoryProfile.scenarioId]: aliensFilmHistoryProfile,\n  [shesGottaHaveItFilmHistoryProfile.scenarioId]: shesGottaHaveItFilmHistoryProfile,\n',
              "Film Study map")
          write(path, text)

          path = "src/ui/data/scenarioProductionVerificationRegistry.ts"
          text = read(path)
          text = replace_once(text,
              'import { aliensProductionCaseVerification } from "./scenarioProductionVerificationAliens";\n',
              'import { aliensProductionCaseVerification } from "./scenarioProductionVerificationAliens";\nimport { shesGottaHaveItProductionCaseVerification } from "./scenarioProductionVerificationShesGottaHaveIt";\n',
              "verification import")
          text = replace_once(text,
              '  aliensProductionCaseVerification,\n',
              '  aliensProductionCaseVerification,\n  shesGottaHaveItProductionCaseVerification,\n',
              "verification registry")
          write(path, text)

          atlas_scripts = [
              "scripts/film-history-chapter-twelve-atlas-audit.mjs",
              "scripts/film-history-chapter-thirteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fourteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fifteen-atlas-audit.mjs",
              "scripts/film-history-chapter-sixteen-atlas-audit.mjs",
          ]
          for path in atlas_scripts:
              text = read(path)
              text = replace_once(text, "const EXPECTED_ATLAS_COUNT = 464;", "const EXPECTED_ATLAS_COUNT = 465;", f"{path} count")
              text = replace_once(text,
                  '  "chapterSixteenAliensExpansion.ts",\n',
                  '  "chapterSixteenAliensExpansion.ts",\n  "chapterSixteenShesGottaHaveItExpansion.ts",\n',
                  f"{path} expansion")
              write(path, text)

          path = "scripts/production-case-rest-audit.mjs"
          text = read(path)
          text = replace_once(text, "const EXPECTED_PLAYABLE_SCENARIOS = 464;", "const EXPECTED_PLAYABLE_SCENARIOS = 465;", "production playable")
          text = replace_once(text, "const EXPECTED_VERIFIED_PRODUCTION_CASES = 464;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 465;", "production verified")
          text = replace_once(text,
              '  "chapterSixteenAliensExpansion.ts",\n',
              '  "chapterSixteenAliensExpansion.ts",\n  "chapterSixteenShesGottaHaveItExpansion.ts",\n',
              "production expansion")
          write(path, text)

          for path in [
              "src/core/filmHistoryChapterTwelveAuditContract.test.ts",
              "src/core/filmHistoryChapterThirteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFourteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFifteenAuditContract.test.ts",
          ]:
              text = read(path)
              if text.count("464") < 3:
                  raise SystemExit(f"{path}: missing 464 count locks")
              write(path, text.replace("464", "465"))

          path = "src/core/filmHistoryChapterSixteenAuditContract.test.ts"
          text = read(path)
          if text.count("464") < 4:
              raise SystemExit("Chapter 16 contract missing 464 count locks")
          text = text.replace("464", "465")
          text = replace_once(text,
              """  "Aliens",\n  "Yeelen",""",
              """  "Aliens",\n  "She's Gotta Have It",\n  "Yeelen",""",
              "Chapter 16 existing")
          text = replace_once(text,
              """const exactP1Queue = [\n  "She's Gotta Have It",\n""",
              """const exactP1Queue = [\n""",
              "Chapter 16 P1")
          text = replace_once(text,
              """    "She's Gotta Have It",\n""",
              "",
              "Chapter 16 recommended")
          text = replace_once(text,
              """    "Aliens": "scenario_aliens_1986",\n    "Yeelen":""",
              """    "Aliens": "scenario_aliens_1986",\n    "She's Gotta Have It": "scenario_shes_gotta_have_it_1986",\n    "Yeelen":""",
              "Chapter 16 exact ID")
          write(path, text)
          PY

      - name: Regenerate Chapter 12-16 Atlas reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json
          node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json

      - name: Assert canonical She's Gotta Have It result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('docs/film-history-chapter-sixteen-atlas-resolved.json', 'utf8'));
          if (report.atlas.expectedCount !== 465 || report.atlas.actualCount !== 465) throw new Error(`Atlas ${report.atlas.expectedCount}/${report.atlas.actualCount}`);
          if (report.verificationIndex.literalVerifiedScenarioIds !== 465) throw new Error(`Verification ${report.verificationIndex.literalVerifiedScenarioIds}`);
          const film = report.candidates.find((item) => item.title === "She's Gotta Have It");
          if (!film || film.decision !== 'USE_EXISTING' || film.scenarioId !== 'scenario_shes_gotta_have_it_1986' || film.productionVerified !== true) throw new Error(`She's Gotta Have It ${JSON.stringify(film)}`);
          if (report.byDecision.P0.length !== 0) throw new Error(`P0 ${JSON.stringify(report.byDecision.P0)}`);
          const p1 = ['A Better Tomorrow','RoboCop','Salaam Bombay!'];
          if (JSON.stringify(report.byDecision.P1) !== JSON.stringify(p1)) throw new Error(`P1 ${JSON.stringify(report.byDecision.P1)}`);
          NODE

      - name: Commit only permanent She's Gotta Have It materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/film-history-chapter-twelve-atlas-resolved.json \
            docs/film-history-chapter-thirteen-atlas-resolved.json \
            docs/film-history-chapter-fourteen-atlas-resolved.json \
            docs/film-history-chapter-fifteen-atlas-resolved.json \
            docs/film-history-chapter-sixteen-atlas-resolved.json \
            scripts/film-history-chapter-twelve-atlas-audit.mjs \
            scripts/film-history-chapter-thirteen-atlas-audit.mjs \
            scripts/film-history-chapter-fourteen-atlas-audit.mjs \
            scripts/film-history-chapter-fifteen-atlas-audit.mjs \
            scripts/film-history-chapter-sixteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterTwelveAuditContract.test.ts \
            src/core/filmHistoryChapterThirteenAuditContract.test.ts \
            src/core/filmHistoryChapterFourteenAuditContract.test.ts \
            src/core/filmHistoryChapterFifteenAuditContract.test.ts \
            src/core/filmHistoryChapterSixteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          git diff --cached --check
          git commit -m "Materialize She's Gotta Have It Chapter 16 Production Case"
          git push origin HEAD:agent/ch16-shes-gotta-have-it-production-case
