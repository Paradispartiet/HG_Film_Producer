name: Resolve Film History Chapter 8 Atlas matrix

on:
  push:
    branches:
      - agent/film-history-chapter-eight-atlas-audit
    paths:
      - .github/workflows/film-history-chapter-eight-atlas-resolve.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-history-chapter-eight-atlas-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Resolve current Atlas matches
        run: node scripts/film-history-chapter-eight-atlas-resolver.mjs
      - name: Commit resolved matrix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/film-history-chapter-eight-atlas-resolve.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve Film History Chapter 8 Atlas matrix"
          git push origin HEAD:agent/film-history-chapter-eight-atlas-audit
