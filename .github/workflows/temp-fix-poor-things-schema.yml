name: TEMP Fix Poor Things expansion schema

on:
  push:
    branches:
      - agent/ch19-poor-things-production-case
    paths:
      - .github/workflows/temp-fix-poor-things-schema.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch19-poor-things-production-case
          fetch-depth: 0
      - name: Patch expansion adapter
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "src/core/chapterNineteenPoorThingsExpansion.ts";
          let s = readFileSync(path, "utf8");
          const before = `] as const satisfies readonly HistoricalFilmScenario[];

export function mergeChapterNineteenPoorThingsExpansion(
  scenarios: readonly HistoricalFilmScenario[]
): HistoricalFilmScenario[] {
  const merged = [...scenarios];
  const seen = new Set(merged.map((scenario) => normalizeEarlyCinemaTitle(scenario.title)));
  for (const definition of chapterNineteenPoorThingsExpansionDefinitions) {
    const key = normalizeEarlyCinemaTitle(definition.title);
    if (seen.has(key)) continue;
    merged.push(definition);
    seen.add(key);
  }
  return merged;
}`;
          const after = `] as const;

export function mergeChapterNineteenPoorThingsExpansion(baseScenarios: readonly HistoricalFilmScenario[]): readonly HistoricalFilmScenario[] {
  const merged = [...baseScenarios];
  let nextPosition = Math.max(0, ...baseScenarios.map((scenario) => scenario.source.position)) + 1;
  for (const definition of chapterNineteenPoorThingsExpansionDefinitions) {
    const acceptedTitles = [definition.title, definition.originalTitle, ...definition.aliases].map(normalizeEarlyCinemaTitle);
    const exists = merged.some((scenario) => scenario.id === definition.id || (scenario.film.year === definition.year && [scenario.film.title, scenario.film.original_title].map(normalizeEarlyCinemaTitle).some((title) => acceptedTitles.includes(title))));
    if (exists) continue;
    merged.push({
      id: definition.id,
      status: "manual_chapter_nineteen_poor_things_verified",
      source: { list_id: "manual_chapter_nineteen_poor_things_expansion_2026", position: nextPosition, imdb_id: definition.sourceId, url: definition.sourceUrl },
      film: { title: definition.title, original_title: definition.originalTitle, year: definition.year, title_type: definition.titleType, runtime_mins: definition.runtimeMins, directors: definition.directors, genres: definition.genres, genre_keys: definition.genres.map((genre) => genre.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "")), imdb_rating: 0, user_rating: 0 },
      scenario_type: definition.scenarioType,
      production_challenge: definition.premise,
      required_choices_seed: definition.requiredChoicesSeed,
      phases: definition.phases,
      learning_goals_seed: definition.learningGoals,
      manual_enrichment_needed: [],
    });
    nextPosition += 1;
  }
  return merged;
}`;
          if (!s.includes(before)) throw new Error("Poor Things adapter anchor not found exactly");
          s = s.replace(before, after);
          writeFileSync(path, s);
          NODE
          rm .github/workflows/temp-fix-poor-things-schema.yml
      - name: Commit adapter fix and TEMP cleanup
        run: |
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add src/core/chapterNineteenPoorThingsExpansion.ts
          git add -u .github/workflows/temp-fix-poor-things-schema.yml
          git diff --cached --check
          git commit -m "Align Poor Things expansion with Chapter 19 scenario schema"
          git push origin HEAD:agent/ch19-poor-things-production-case
