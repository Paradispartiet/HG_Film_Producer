name: TEMP Chapter 19 The Substance source-first

on:
  push:
    branches:
      - agent/ch19-the-substance-production-case

permissions:
  contents: read

jobs:
  source-first:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck source-first package
        run: npm run typecheck
      - name: Build core
        run: npm run build
      - name: Strict The Substance contract
        run: node --test dist/core/chapterNineteenTheSubstanceExpansion.test.js
      - name: Build UI
        run: npm run build:ui
