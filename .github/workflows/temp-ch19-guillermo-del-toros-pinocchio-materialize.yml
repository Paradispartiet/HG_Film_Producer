name: TEMP Chapter 19 Guillermo del Toro's Pinocchio materialize

on:
  push:
    branches:
      - agent/ch19-guillermo-del-toros-pinocchio-production-case
    paths:
      - .github/workflows/temp-ch19-guillermo-del-toros-pinocchio-materialize.yml
      - scripts/temp-materialize-guillermo-del-toros-pinocchio.mjs

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-guillermo-del-toros-pinocchio-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic canonical patch
        run: node scripts/temp-materialize-guillermo-del-toros-pinocchio.mjs

      - name: Remove Guillermo del Toro's Pinocchio TEMP artifacts before full verification
        shell: bash
        run: |
          set -euxo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/temp-ch19-guillermo-del-toros-pinocchio-materialize.yml \
            .github/workflows/temp-ch19-guillermo-del-toros-pinocchio-source-first.yml \
            scripts/temp-materialize-guillermo-del-toros-pinocchio.mjs
          test ! -e .github/workflows/temp-ch19-guillermo-del-toros-pinocchio-materialize.yml
          test ! -e .github/workflows/temp-ch19-guillermo-del-toros-pinocchio-source-first.yml
          test ! -e scripts/temp-materialize-guillermo-del-toros-pinocchio.mjs
          if find .github/workflows scripts -maxdepth 1 -type f -iname '*temp*pinocchio*' -print | grep -q .; then
            echo "Guillermo del Toro's Pinocchio TEMP artifacts still exist after cleanup" >&2
            find .github/workflows scripts -maxdepth 1 -type f -iname '*temp*pinocchio*' -print >&2
            exit 1
          fi
          git status --short

      - name: Generate Chapter 19 resolved state
        run: node scripts/film-history-chapter-nineteen-atlas-audit.mjs --write=docs/film-history-chapter-nineteen-atlas-resolved.json > /tmp/pinocchio-ch19-resolved.json

      - name: Full fail-closed verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee verify-v0.1-output.txt

      - name: Verify post-gate canonical snapshot
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const r = JSON.parse(readFileSync("docs/film-history-chapter-nineteen-atlas-resolved.json", "utf8"));
          const film = r.candidates.find((x) => x.title === "Guillermo del Toro's Pinocchio");
          if (r.atlas.actualCount !== 576 || r.atlas.expectedCount !== 576) throw new Error(`Atlas is not 576/576: ${r.atlas.actualCount}/${r.atlas.expectedCount}`);
          if (r.verificationIndex.literalVerifiedScenarioIds !== 576) throw new Error(`Production Verification count is ${r.verificationIndex.literalVerifiedScenarioIds}`);
          if (!film || film.decision !== "USE_EXISTING" || film.scenarioId !== "scenario_guillermo_del_toros_pinocchio_2022" || film.matches !== 1 || film.productionVerified !== true) throw new Error(`Guillermo del Toro's Pinocchio state invalid: ${JSON.stringify(film)}`);
          if (r.byDecision.USE_EXISTING.length !== 44 || r.byDecision.P0.length !== 4 || r.byDecision.P1.length !== 8 || r.byDecision.P2.length !== 4 || r.byDecision.EXISTING_REQUIRED.length !== 0) throw new Error(`Queue census invalid: ${JSON.stringify(Object.fromEntries(Object.entries(r.byDecision).map(([k,v]) => [k,v.length])))}`);
          if (r.recommendedNewProductionCases.length !== 12) throw new Error(`Recommended production case count is ${r.recommendedNewProductionCases.length}`);
          if (r.productionStrategy.nextRecommendedCase !== "Spider-Man: Across the Spider-Verse" || r.productionStrategy.nextRecommendedLane !== "industrial_scale_technical") throw new Error(`Balanced scheduler drifted unexpectedly: ${JSON.stringify(r.productionStrategy)}`);
          const expectedFirstFive = ["Spider-Man: Across the Spider-Verse", "The Secret Agent", "Dune: Part Two", "The Brutalist", "KPop Demon Hunters"];
          if (JSON.stringify(r.recommendedNewProductionCases.slice(0, 5)) !== JSON.stringify(expectedFirstFive)) throw new Error(`Recommended prefix drifted: ${JSON.stringify(r.recommendedNewProductionCases.slice(0, 5))}`);
          const expectedLanes = ["industrial_scale_technical", "regional_global", "industrial_scale_technical", "independent_low_mid_budget", "regional_global"];
          if (JSON.stringify(r.productionStrategy.remainingSequence.slice(0, 5).map((x) => x.lane)) !== JSON.stringify(expectedLanes)) throw new Error(`Lane prefix drifted: ${JSON.stringify(r.productionStrategy.remainingSequence.slice(0, 5))}`);
          console.log(JSON.stringify({atlas: r.atlas.actualCount, verified: r.verificationIndex.literalVerifiedScenarioIds, film, queue: Object.fromEntries(Object.entries(r.byDecision).map(([k,v]) => [k,v.length])), balancedScheduler: r.productionStrategy.nextRecommendedCase}, null, 2));
          NODE

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pinocchio-materialization-diagnostics
          path: |
            verify-v0.1-output.txt
            /tmp/pinocchio-ch19-resolved.json
          if-no-files-found: ignore

      - name: Commit verified canonical state and TEMP cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add \
            docs/film-history-chapter-nineteen-atlas-resolved.json \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Materialize Guillermo del Toro's Pinocchio Chapter 19 production case"
          git push origin HEAD:agent/ch19-guillermo-del-toros-pinocchio-production-case
