name: Diagnose Chapter 18 representation

on:
  push:
    branches:
      - agent/chapter-18-representation-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chapter-18-representation-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnose Chapter 18 representation audit
        run: node scripts/diagnoseChapter18RepresentationAudit.mjs
