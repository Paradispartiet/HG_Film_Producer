name: TEMP Annette materialize

on:
  push:
    branches:
      - agent/ch19-annette-production-case

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize Annette
        run: node scripts/TEMP-materialize-ch19-annette.mjs

      - name: Stage clean verification tree
        run: |
          rm scripts/TEMP-materialize-ch19-annette.mjs
          rm .github/workflows/TEMP-ch19-annette-materialize.yml

      - name: Full v0.1 verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee annette-verify.log

      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: annette-verification-diagnostics
          path: |
            annette-verify.log
            docs/film-history-chapter-nineteen-atlas-resolved.json
            docs/film-history-chapter-nineteen-cannes-major-prizes-audit.json
          if-no-files-found: ignore

      - name: Commit clean Annette case
        if: success()
        run: |
          rm -f annette-verify.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add Annette Chapter 19 production case'
          git push origin HEAD:agent/ch19-annette-production-case
