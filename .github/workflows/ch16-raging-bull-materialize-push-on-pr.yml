name: TEMP Materialize Raging Bull Chapter 16

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ch16-raging-bull-production-case'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ch16-raging-bull-production-case
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize Raging Bull permanently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = "src/ui/data/filmScenarios.ts"
          text = read(path)
          text = replace_once(text,
              'import { mergeChapterSixteenSalaamBombayExpansion } from "../../core/chapterSixteenSalaamBombayExpansion.js";\n',
              'import { mergeChapterSixteenSalaamBombayExpansion } from "../../core/chapterSixteenSalaamBombayExpansion.js";\nimport { mergeChapterSixteenRagingBullExpansion } from "../../core/chapterSixteenRagingBullExpansion.js";\n',
              "filmScenarios import")
          text = replace_once(text,
              'const chapterSixteenSalaamBombayScenarios = mergeChapterSixteenSalaamBombayExpansion(chapterSixteenRoboCopScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenSalaamBombayScenarios);',
              'const chapterSixteenSalaamBombayScenarios = mergeChapterSixteenSalaamBombayExpansion(chapterSixteenRoboCopScenarios);\nconst chapterSixteenRagingBullScenarios = mergeChapterSixteenRagingBullExpansion(chapterSixteenSalaamBombayScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenRagingBullScenarios);',
              "filmScenarios chain")
          text = replace_once(text,
              '+manual_chapter_sixteen_salaam_bombay_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_sixteen_salaam_bombay_expansion_2026+manual_chapter_sixteen_raging_bull_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              "filmScenarios source list")
          write(path, text)

          path = "src/ui/data/scenarioFilmStudyMap.ts"
          text = read(path)
          text = replace_once(text,
              'import { salaamBombayFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenSalaamBombay";\n',
              'import { salaamBombayFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenSalaamBombay";\nimport { ragingBullFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenRagingBull";\n',
              "Film Study import")
          text = replace_once(text,
              '  [salaamBombayFilmHistoryProfile.scenarioId]: salaamBombayFilmHistoryProfile,\n',
              '  [salaamBombayFilmHistoryProfile.scenarioId]: salaamBombayFilmHistoryProfile,\n  [ragingBullFilmHistoryProfile.scenarioId]: ragingBullFilmHistoryProfile,\n',
              "Film Study map")
          write(path, text)

          path = "src/ui/data/scenarioProductionVerificationRegistry.ts"
          text = read(path)
          text = replace_once(text,
              'import { salaamBombayProductionCaseVerification } from "./scenarioProductionVerificationSalaamBombay";\n',
              'import { salaamBombayProductionCaseVerification } from "./scenarioProductionVerificationSalaamBombay";\nimport { ragingBullProductionCaseVerification } from "./scenarioProductionVerificationRagingBull";\n',
              "verification import")
          text = replace_once(text,
              '  salaamBombayProductionCaseVerification,\n',
              '  salaamBombayProductionCaseVerification,\n  ragingBullProductionCaseVerification,\n',
              "verification registry")
          write(path, text)

          atlas_scripts = [
              "scripts/film-history-chapter-twelve-atlas-audit.mjs",
              "scripts/film-history-chapter-thirteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fourteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fifteen-atlas-audit.mjs",
              "scripts/film-history-chapter-sixteen-atlas-audit.mjs",
          ]
          for path in atlas_scripts:
              text = read(path)
              text = replace_once(text, "const EXPECTED_ATLAS_COUNT = 468;", "const EXPECTED_ATLAS_COUNT = 469;", f"{path} count")
              text = replace_once(text,
                  '  "chapterSixteenSalaamBombayExpansion.ts",\n',
                  '  "chapterSixteenSalaamBombayExpansion.ts",\n  "chapterSixteenRagingBullExpansion.ts",\n',
                  f"{path} expansion")
              write(path, text)

          path = "scripts/production-case-rest-audit.mjs"
          text = read(path)
          text = replace_once(text, "const EXPECTED_PLAYABLE_SCENARIOS = 468;", "const EXPECTED_PLAYABLE_SCENARIOS = 469;", "production playable")
          text = replace_once(text, "const EXPECTED_VERIFIED_PRODUCTION_CASES = 468;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 469;", "production verified")
          text = replace_once(text,
              '  "chapterSixteenSalaamBombayExpansion.ts",\n',
              '  "chapterSixteenSalaamBombayExpansion.ts",\n  "chapterSixteenRagingBullExpansion.ts",\n',
              "production expansion")
          write(path, text)

          for path in [
              "src/core/filmHistoryChapterTwelveAuditContract.test.ts",
              "src/core/filmHistoryChapterThirteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFourteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFifteenAuditContract.test.ts",
          ]:
              text = read(path)
              if text.count("468") < 3:
                  raise SystemExit(f"{path}: missing 468 count locks")
              write(path, text.replace("468", "469"))

          path = "src/core/filmHistoryChapterSixteenAuditContract.test.ts"
          text = read(path)
          if text.count("468") < 4:
              raise SystemExit("Chapter 16 contract missing 468 count locks")
          text = text.replace("468", "469")
          text = replace_once(text,
              'const exactExisting = [\n  "The Shining",\n  "Mephisto",',
              'const exactExisting = [\n  "The Shining",\n  "Raging Bull",\n  "Mephisto",',
              "Chapter 16 existing")
          text = replace_once(text,
              '  assert.deepEqual(resolved.byDecision.P2, ["Raging Bull"]);',
              '  assert.deepEqual(resolved.byDecision.P2, []);',
              "Chapter 16 P2")
          text = replace_once(text,
              '    "The Shining": "scenario_the_shining_1980",\n    "Mephisto":',
              '    "The Shining": "scenario_the_shining_1980",\n    "Raging Bull": "scenario_raging_bull_1980",\n    "Mephisto":',
              "Chapter 16 exact ID")
          write(path, text)
          PY

      - name: Regenerate Chapter 12-16 Atlas reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json
          node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json

      - name: Assert canonical Raging Bull result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('docs/film-history-chapter-sixteen-atlas-resolved.json', 'utf8'));
          if (report.atlas.expectedCount !== 469 || report.atlas.actualCount !== 469) throw new Error(`Atlas ${report.atlas.expectedCount}/${report.atlas.actualCount}`);
          if (report.verificationIndex.literalVerifiedScenarioIds !== 469) throw new Error(`Verification ${report.verificationIndex.literalVerifiedScenarioIds}`);
          const film = report.candidates.find((item) => item.title === 'Raging Bull');
          if (!film || film.decision !== 'USE_EXISTING' || film.scenarioId !== 'scenario_raging_bull_1980' || film.productionVerified !== true) throw new Error(`Raging Bull ${JSON.stringify(film)}`);
          if (report.byDecision.P0.length !== 0) throw new Error(`P0 ${JSON.stringify(report.byDecision.P0)}`);
          if (report.byDecision.P1.length !== 0) throw new Error(`P1 ${JSON.stringify(report.byDecision.P1)}`);
          if (report.byDecision.P2.length !== 0) throw new Error(`P2 ${JSON.stringify(report.byDecision.P2)}`);
          if (report.recommendedNewProductionCases.length !== 0) throw new Error(`recommended ${JSON.stringify(report.recommendedNewProductionCases)}`);
          NODE

      - name: Commit only permanent Raging Bull materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/film-history-chapter-twelve-atlas-resolved.json \
            docs/film-history-chapter-thirteen-atlas-resolved.json \
            docs/film-history-chapter-fourteen-atlas-resolved.json \
            docs/film-history-chapter-fifteen-atlas-resolved.json \
            docs/film-history-chapter-sixteen-atlas-resolved.json \
            scripts/film-history-chapter-twelve-atlas-audit.mjs \
            scripts/film-history-chapter-thirteen-atlas-audit.mjs \
            scripts/film-history-chapter-fourteen-atlas-audit.mjs \
            scripts/film-history-chapter-fifteen-atlas-audit.mjs \
            scripts/film-history-chapter-sixteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterTwelveAuditContract.test.ts \
            src/core/filmHistoryChapterThirteenAuditContract.test.ts \
            src/core/filmHistoryChapterFourteenAuditContract.test.ts \
            src/core/filmHistoryChapterFifteenAuditContract.test.ts \
            src/core/filmHistoryChapterSixteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          git diff --cached --check
          git commit -m "Materialize Raging Bull Chapter 16 Production Case"
          git push origin HEAD:agent/ch16-raging-bull-production-case