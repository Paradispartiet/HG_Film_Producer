name: Correct Fantomas verified gate

on:
  push:
    branches: [agent/fantomas-1913]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fantomas-1913
          fetch-depth: 0
      - name: Correct verified count and clean diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p = Path("scripts/production-case-rest-audit.mjs")
          text = p.read_text()
          old = "const EXPECTED_VERIFIED_PRODUCTION_CASES = 388;"
          new = "const EXPECTED_VERIFIED_PRODUCTION_CASES = 395;"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale verified gate, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          PY
          rm -f fantomas-ci-debug.txt
          rm .github/workflows/fantomas-fix-verified.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct verified production case gate"
          git push origin HEAD:agent/fantomas-1913
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify corrected branch
        run: npm run verify:v0.1
