name: TEMP Export Aliens Chapter 16 Materialization

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ch16-aliens-production-case'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch16-aliens-production-case
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize Aliens in working tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = "src/ui/data/filmScenarios.ts"
          text = read(path)
          text = replace_once(text,
              'import { mergeChapterSixteenBackToTheFutureExpansion } from "../../core/chapterSixteenBackToTheFutureExpansion.js";\n',
              'import { mergeChapterSixteenBackToTheFutureExpansion } from "../../core/chapterSixteenBackToTheFutureExpansion.js";\nimport { mergeChapterSixteenAliensExpansion } from "../../core/chapterSixteenAliensExpansion.js";\n',
              "filmScenarios import")
          text = replace_once(text,
              'const chapterSixteenBackToTheFutureScenarios = mergeChapterSixteenBackToTheFutureExpansion(chapterSixteenComeAndSeeScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenBackToTheFutureScenarios);',
              'const chapterSixteenBackToTheFutureScenarios = mergeChapterSixteenBackToTheFutureExpansion(chapterSixteenComeAndSeeScenarios);\nconst chapterSixteenAliensScenarios = mergeChapterSixteenAliensExpansion(chapterSixteenBackToTheFutureScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenAliensScenarios);',
              "filmScenarios chain")
          text = replace_once(text,
              '+manual_chapter_sixteen_back_to_the_future_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_sixteen_back_to_the_future_expansion_2026+manual_chapter_sixteen_aliens_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              "filmScenarios source list")
          write(path, text)

          path = "src/ui/data/scenarioFilmStudyMap.ts"
          text = read(path)
          text = replace_once(text,
              'import { backToTheFutureFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenBackToTheFuture";\n',
              'import { backToTheFutureFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenBackToTheFuture";\nimport { aliensFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenAliens";\n',
              "Film Study import")
          text = replace_once(text,
              '  [backToTheFutureFilmHistoryProfile.scenarioId]: backToTheFutureFilmHistoryProfile,\n',
              '  [backToTheFutureFilmHistoryProfile.scenarioId]: backToTheFutureFilmHistoryProfile,\n  [aliensFilmHistoryProfile.scenarioId]: aliensFilmHistoryProfile,\n',
              "Film Study map")
          write(path, text)

          path = "src/ui/data/scenarioProductionVerificationRegistry.ts"
          text = read(path)
          text = replace_once(text,
              'import { backToTheFutureProductionCaseVerification } from "./scenarioProductionVerificationBackToTheFuture";\n',
              'import { backToTheFutureProductionCaseVerification } from "./scenarioProductionVerificationBackToTheFuture";\nimport { aliensProductionCaseVerification } from "./scenarioProductionVerificationAliens";\n',
              "verification import")
          text = replace_once(text,
              '  backToTheFutureProductionCaseVerification,\n',
              '  backToTheFutureProductionCaseVerification,\n  aliensProductionCaseVerification,\n',
              "verification registry")
          write(path, text)

          atlas_scripts = [
              "scripts/film-history-chapter-twelve-atlas-audit.mjs",
              "scripts/film-history-chapter-thirteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fourteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fifteen-atlas-audit.mjs",
              "scripts/film-history-chapter-sixteen-atlas-audit.mjs",
          ]
          for path in atlas_scripts:
              text = read(path)
              text = replace_once(text, "const EXPECTED_ATLAS_COUNT = 463;", "const EXPECTED_ATLAS_COUNT = 464;", f"{path} count")
              text = replace_once(text,
                  '  "chapterSixteenBackToTheFutureExpansion.ts",\n',
                  '  "chapterSixteenBackToTheFutureExpansion.ts",\n  "chapterSixteenAliensExpansion.ts",\n',
                  f"{path} expansion")
              write(path, text)

          path = "scripts/production-case-rest-audit.mjs"
          text = read(path)
          text = replace_once(text, "const EXPECTED_PLAYABLE_SCENARIOS = 463;", "const EXPECTED_PLAYABLE_SCENARIOS = 464;", "production playable")
          text = replace_once(text, "const EXPECTED_VERIFIED_PRODUCTION_CASES = 463;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 464;", "production verified")
          text = replace_once(text,
              '  "chapterSixteenBackToTheFutureExpansion.ts",\n',
              '  "chapterSixteenBackToTheFutureExpansion.ts",\n  "chapterSixteenAliensExpansion.ts",\n',
              "production expansion")
          write(path, text)

          for path in [
              "src/core/filmHistoryChapterTwelveAuditContract.test.ts",
              "src/core/filmHistoryChapterThirteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFourteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFifteenAuditContract.test.ts",
          ]:
              text = read(path)
              if text.count("463") < 3:
                  raise SystemExit(f"{path}: missing 463 count locks")
              write(path, text.replace("463", "464"))

          path = "src/core/filmHistoryChapterSixteenAuditContract.test.ts"
          text = read(path)
          if text.count("463") < 4:
              raise SystemExit("Chapter 16 contract missing 463 count locks")
          text = text.replace("463", "464")
          text = replace_once(text,
              '  "Back to the Future",\n  "Down by Law",\n  "Yeelen",',
              '  "Back to the Future",\n  "Down by Law",\n  "Aliens",\n  "Yeelen",',
              "Chapter 16 existing")
          text = replace_once(text,
              'const exactP1Queue = [\n  "Aliens",\n',
              'const exactP1Queue = [\n',
              "Chapter 16 P1")
          text = replace_once(text,
              '    "Aliens",\n',
              '',
              "Chapter 16 recommended")
          text = replace_once(text,
              '    "Down by Law": "scenario_down_by_law_1986",\n    "Yeelen":',
              '    "Down by Law": "scenario_down_by_law_1986",\n    "Aliens": "scenario_aliens_1986",\n    "Yeelen":',
              "Chapter 16 exact ID")
          write(path, text)
          PY

      - name: Regenerate Chapter 12-16 Atlas reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json
          node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json
      - name: Assert canonical Aliens result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('docs/film-history-chapter-sixteen-atlas-resolved.json', 'utf8'));
          if (report.atlas.expectedCount !== 464 || report.atlas.actualCount !== 464) throw new Error(`Atlas ${report.atlas.expectedCount}/${report.atlas.actualCount}`);
          if (report.verificationIndex.literalVerifiedScenarioIds !== 464) throw new Error(`Verification ${report.verificationIndex.literalVerifiedScenarioIds}`);
          const film = report.candidates.find((item) => item.title === 'Aliens');
          if (!film || film.decision !== 'USE_EXISTING' || film.scenarioId !== 'scenario_aliens_1986' || film.productionVerified !== true) throw new Error(`Aliens ${JSON.stringify(film)}`);
          if (report.byDecision.P0.length !== 0) throw new Error(`P0 ${JSON.stringify(report.byDecision.P0)}`);
          const p1 = ["She's Gotta Have It",'A Better Tomorrow','RoboCop','Salaam Bombay!'];
          if (JSON.stringify(report.byDecision.P1) !== JSON.stringify(p1)) throw new Error(`P1 ${JSON.stringify(report.byDecision.P1)}`);
          NODE
      - name: Package exact permanent materialization
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/aliens-materialized-permanent.tar.gz \
            docs/film-history-chapter-twelve-atlas-resolved.json \
            docs/film-history-chapter-thirteen-atlas-resolved.json \
            docs/film-history-chapter-fourteen-atlas-resolved.json \
            docs/film-history-chapter-fifteen-atlas-resolved.json \
            docs/film-history-chapter-sixteen-atlas-resolved.json \
            scripts/film-history-chapter-twelve-atlas-audit.mjs \
            scripts/film-history-chapter-thirteen-atlas-audit.mjs \
            scripts/film-history-chapter-fourteen-atlas-audit.mjs \
            scripts/film-history-chapter-fifteen-atlas-audit.mjs \
            scripts/film-history-chapter-sixteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterTwelveAuditContract.test.ts \
            src/core/filmHistoryChapterThirteenAuditContract.test.ts \
            src/core/filmHistoryChapterFourteenAuditContract.test.ts \
            src/core/filmHistoryChapterFifteenAuditContract.test.ts \
            src/core/filmHistoryChapterSixteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
      - uses: actions/upload-artifact@v4
        with:
          name: aliens-materialized-permanent
          path: /tmp/aliens-materialized-permanent.tar.gz
          if-no-files-found: error
