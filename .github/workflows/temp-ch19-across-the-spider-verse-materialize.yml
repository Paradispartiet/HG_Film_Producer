name: TEMP Chapter 19 Across the Spider-Verse materialize

on:
  push:
    branches:
      - agent/ch19-across-the-spider-verse-production-case
    paths:
      - .github/workflows/temp-ch19-across-the-spider-verse-materialize.yml
      - scripts/temp-materialize-across-the-spider-verse.mjs

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-across-the-spider-verse-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic canonical patch
        run: node scripts/temp-materialize-across-the-spider-verse.mjs

      - name: Remove Across the Spider-Verse TEMP artifacts before full verification
        shell: bash
        run: |
          set -euxo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/temp-ch19-across-the-spider-verse-materialize.yml \
            .github/workflows/temp-ch19-across-the-spider-verse-source-first.yml \
            scripts/temp-materialize-across-the-spider-verse.mjs
          test ! -e .github/workflows/temp-ch19-across-the-spider-verse-materialize.yml
          test ! -e .github/workflows/temp-ch19-across-the-spider-verse-source-first.yml
          test ! -e scripts/temp-materialize-across-the-spider-verse.mjs
          if find .github/workflows scripts -maxdepth 1 -type f -iname '*temp*across*spider*verse*' -print | grep -q .; then
            echo "Across the Spider-Verse TEMP artifacts still exist after cleanup" >&2
            find .github/workflows scripts -maxdepth 1 -type f -iname '*temp*across*spider*verse*' -print >&2
            exit 1
          fi
          git status --short

      - name: Generate Chapter 19 resolved state
        run: node scripts/film-history-chapter-nineteen-atlas-audit.mjs --write=docs/film-history-chapter-nineteen-atlas-resolved.json > /tmp/across-the-spider-verse-ch19-resolved.json

      - name: Full fail-closed verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee verify-v0.1-output.txt

      - name: Verify post-gate canonical snapshot
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const r = JSON.parse(readFileSync("docs/film-history-chapter-nineteen-atlas-resolved.json", "utf8"));
          const film = r.candidates.find((x) => x.title === "Spider-Man: Across the Spider-Verse");
          if (r.atlas.actualCount !== 588 || r.atlas.expectedCount !== 588) throw new Error(`Atlas is not 588/588: ${r.atlas.actualCount}/${r.atlas.expectedCount}`);
          if (r.verificationIndex.literalVerifiedScenarioIds !== 588) throw new Error(`Production Verification count is ${r.verificationIndex.literalVerifiedScenarioIds}`);
          if (!film || film.decision !== "USE_EXISTING" || film.scenarioId !== "scenario_spider_man_across_the_spider_verse_2023" || film.matches !== 1 || film.productionVerified !== true) throw new Error(`Across the Spider-Verse state invalid: ${JSON.stringify(film)}`);
          if (r.byDecision.USE_EXISTING.length !== 56 || r.byDecision.P0.length !== 0 || r.byDecision.P1.length !== 2 || r.byDecision.P2.length !== 2 || r.byDecision.EXISTING_REQUIRED.length !== 0) throw new Error(`Queue census invalid: ${JSON.stringify(Object.fromEntries(Object.entries(r.byDecision).map(([k,v]) => [k,v.length])))}`);
          if (JSON.stringify(r.byDecision.P0) !== JSON.stringify([])) throw new Error(`P0 queue invalid: ${JSON.stringify(r.byDecision.P0)}`);
          if (JSON.stringify(r.byDecision.P1) !== JSON.stringify(["The Mitchells vs. the Machines", "Furiosa: A Mad Max Saga"])) throw new Error(`P1 queue invalid: ${JSON.stringify(r.byDecision.P1)}`);
          if (JSON.stringify(r.byDecision.P2) !== JSON.stringify(["Days", "The Green Knight"])) throw new Error(`P2 queue invalid: ${JSON.stringify(r.byDecision.P2)}`);
          const expectedRecommended = ["Furiosa: A Mad Max Saga", "The Mitchells vs. the Machines"];
          if (JSON.stringify(r.recommendedNewProductionCases) !== JSON.stringify(expectedRecommended)) throw new Error(`Recommended production cases drifted: ${JSON.stringify(r.recommendedNewProductionCases)}`);
          if (r.productionStrategy.nextRecommendedCase !== "Furiosa: A Mad Max Saga" || r.productionStrategy.nextRecommendedLane !== "industrial_scale_technical") throw new Error(`Balanced scheduler drifted unexpectedly: ${JSON.stringify(r.productionStrategy)}`);
          const lanes = r.productionStrategy.remainingSequence.slice(0, 2).map((x) => x.lane);
          if (JSON.stringify(lanes) !== JSON.stringify(["industrial_scale_technical", "industrial_scale_technical"])) throw new Error(`Lane prefix drifted: ${JSON.stringify(lanes)}`);
          console.log(JSON.stringify({atlas:r.atlas.actualCount,verified:r.verificationIndex.literalVerifiedScenarioIds,film,queue:Object.fromEntries(Object.entries(r.byDecision).map(([k,v])=>[k,v.length])),recommended:r.recommendedNewProductionCases,balancedScheduler:r.productionStrategy.nextRecommendedCase},null,2));
          NODE

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: across-the-spider-verse-materialization-diagnostics
          path: |
            verify-v0.1-output.txt
            /tmp/across-the-spider-verse-ch19-resolved.json
          if-no-files-found: ignore

      - name: Commit verified canonical state and TEMP cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add \
            docs/film-history-chapter-nineteen-atlas-resolved.json \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Materialize Across the Spider-Verse Chapter 19 production case"
          git push origin HEAD:agent/ch19-across-the-spider-verse-production-case
