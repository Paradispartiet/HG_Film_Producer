name: TEMP Stars at Noon reuse audit

on:
  push:
    branches:
      - agent/ch19-stars-at-noon-production-case

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Search tracked repository for pre-existing Stars at Noon identity
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/TEMP-ch19-stars-at-noon-reuse-audit.yml'
          cannes_json='docs/film-history-chapter-nineteen-cannes-major-prizes-audit.json'
          cannes_script='scripts/film-history-chapter-nineteen-cannes-major-prizes-audit.mjs'
          git grep -niE 'Stars at Noon|stars[_ -]at[_ -]noon|scenario_stars_at_noon_2022' HEAD -- . ":(exclude)$workflow" ":(exclude)$cannes_json" ":(exclude)$cannes_script" > stars-at-noon-reuse-hits.txt || true
          echo "Tracked identity hits outside Cannes manifest: $(wc -l < stars-at-noon-reuse-hits.txt)"
          cat stars-at-noon-reuse-hits.txt
          test ! -s stars-at-noon-reuse-hits.txt
          echo 'No pre-existing Stars at Noon scenario, Film Study, Production Verification or other tracked title identity found outside the Cannes obligation manifest.'
