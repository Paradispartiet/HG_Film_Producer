name: Attempt private repository visibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  make-private:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt repository visibility change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f visibility=private
