name: TEMP Sustainability Barbie P1 materialize

on:
  push:
    branches:
      - agent/sustainability-barbie-p1-materialize-20260911-temp
    paths:
      - .github/workflows/temp-sustainability-barbie-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/sustainability-barbie-p1-materialize-20260911-temp
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic sustainability patch
        run: node scripts/temp-close-sustainability-barbie.mjs

      - name: Remove TEMP artifacts before verification
        shell: bash
        run: |
          set -euxo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/temp-sustainability-barbie-materialize.yml \
            scripts/temp-close-sustainability-barbie.mjs
          test ! -e .github/workflows/temp-sustainability-barbie-materialize.yml
          test ! -e scripts/temp-close-sustainability-barbie.mjs
          if find .github/workflows scripts -maxdepth 1 -type f -iname '*temp*sustainability*barbie*' -print | grep -q .; then
            echo "TEMP sustainability-Barbie artifacts remain" >&2
            exit 1
          fi

      - name: Verify exact canonical working scope
        shell: bash
        run: |
          set -euxo pipefail
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/temp-sustainability-barbie-materialize.yml \
            data/film/film_history_representation_coverage_v1.json \
            scripts/temp-close-sustainability-barbie.mjs \
            src/ui/data/scenarioProductionVerificationBarbie.ts | sort)"
          test "$actual" = "$expected" || {
            echo "Unexpected working diff" >&2
            printf 'EXPECTED:\n%s\nACTUAL:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }
          git diff --check

      - name: Verify representation closure contract
        run: npm run audit:film-history-representation

      - name: Full fail-closed verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee verify-v0.1-output.txt

      - name: Verify post-gate canonical state
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const coverage = JSON.parse(readFileSync("data/film/film_history_representation_coverage_v1.json", "utf8"));
          const development = coverage.development_matrix.find((x) => x.development_id === "sustainable_production_and_carbon_constraints");
          const review = coverage.scenario_reviews.find((x) => x.scenario_id === "scenario_barbie_2023");
          if (coverage.baseline.expected_production_verified_core_scenarios !== 614) throw new Error("Core is not frozen at 614");
          if (!development || development.priority !== "P1" || development.declared_status !== 2) throw new Error(`Sustainability row invalid: ${JSON.stringify(development)}`);
          if (!String(development.coverage_basis ?? "").includes("85%") || !String(development.coverage_basis ?? "").includes("Warner Bros. Discovery")) throw new Error("Sustainability coverage basis lacks bounded WBD evidence");
          if (!review || review.review_state !== "MAPPED" || JSON.stringify(review.development_ids) !== JSON.stringify(["sustainable_production_and_carbon_constraints"])) throw new Error(`Barbie mapping invalid: ${JSON.stringify(review)}`);
          const p1Status0 = coverage.development_matrix.filter((x) => x.priority === "P1" && x.declared_status === 0);
          if (p1Status0.length !== 0) throw new Error(`P1 status-0 rows remain: ${p1Status0.map((x) => x.development_id).join(", ")}`);
          const pv = readFileSync("src/ui/data/scenarioProductionVerificationBarbie.ts", "utf8");
          for (const token of ["2023 Sustainability Report", "Warner Bros. Discovery", "approximately 85%", "100% renewable energy tariff", "predominantly second-hand costumes"]) {
            if (!pv.includes(token)) throw new Error(`Barbie PV missing sustainability token: ${token}`);
          }
          console.log(JSON.stringify({core:614, sustainabilityStatus:development.declared_status, barbie:review.review_state, p1Status0:p1Status0.length}, null, 2));
          NODE

      - name: Commit clean canonical state
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Close sustainability P1 coverage with Barbie"
          git push origin HEAD:agent/sustainability-barbie-p1-materialize-20260911-temp
