name: TEMP Chapter 19 Furiosa source hygiene

on:
  push:
    branches:
      - agent/ch19-furiosa-production-case
    paths:
      - .github/workflows/temp-ch19-furiosa-source-hygiene.yml
      - scripts/temp-cleanup-furiosa-source-hygiene.mjs

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-furiosa-production-case
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply literal cleanup
        run: node scripts/temp-cleanup-furiosa-source-hygiene.mjs
      - name: Remove TEMP hygiene artifacts
        run: |
          git rm -f .github/workflows/temp-ch19-furiosa-source-hygiene.yml scripts/temp-cleanup-furiosa-source-hygiene.mjs
          test ! -e .github/workflows/temp-ch19-furiosa-source-hygiene.yml
          test ! -e scripts/temp-cleanup-furiosa-source-hygiene.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build core
        run: npm run build
      - name: Strict Furiosa contract
        run: node --test dist/core/chapterNineteenFuriosaExpansion.test.js
      - name: Build UI
        run: npm run build:ui
      - name: Commit clean source
        run: |
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add src/core/chapterNineteenFuriosaExpansion.ts
          git diff --cached --check
          git commit -m "Clean Furiosa source identifiers"
          git push origin HEAD:agent/ch19-furiosa-production-case
