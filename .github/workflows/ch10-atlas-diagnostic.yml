name: Diagnose Film History Chapter 10 Atlas

on:
  push:
    branches: [agent/film-history-chapter-ten-atlas-audit]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-history-chapter-ten-atlas-audit
          fetch-depth: 0
      - name: Resolve Chapter 10 candidates against canonical Atlas
        run: python3 scripts/diagnose-film-history-ch10-atlas.py
      - name: Commit diagnostic report once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/film-history-chapter-ten-atlas-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Chapter 10 Atlas diagnostic"
          git push origin HEAD:agent/film-history-chapter-ten-atlas-audit
