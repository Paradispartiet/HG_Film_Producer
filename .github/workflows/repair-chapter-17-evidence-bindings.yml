name: Repair Chapter 17 evidence bindings

on:
  push:
    branches:
      - agent/chapter-17-evidence-binding-repair

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[chapter17-evidence-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chapter-17-evidence-binding-repair
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair exact Chapter 17 PV bindings
        run: node scripts/repairChapter17EvidenceBindings.mjs
      - name: Commit permanent audit repair only
        run: |
          rm scripts/repairChapter17EvidenceBindings.mjs
          rm .github/workflows/repair-chapter-17-evidence-bindings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/film/film_history_representation_coverage_v1.json scripts/repairChapter17EvidenceBindings.mjs .github/workflows/repair-chapter-17-evidence-bindings.yml
          git commit -m "Repair Chapter 17 evidence bindings [chapter17-evidence-repaired]"
          git push origin HEAD:agent/chapter-17-evidence-binding-repair
