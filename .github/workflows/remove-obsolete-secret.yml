name: Remove obsolete migration secret

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-obsolete-secret.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      OBSOLETE_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - name: Remove obsolete secret if present
        id: remove
        shell: bash
        run: |
          set -u
          if [[ -z "${OBSOLETE_TOKEN:-}" ]]; then
            echo 'result=already_absent' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if GH_TOKEN="$OBSOLETE_TOKEN" gh secret delete REPO_ADMIN_TOKEN --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'result=removed' >> "$GITHUB_OUTPUT"
          else
            echo 'result=delete_denied' >> "$GITHUB_OUTPUT"
          fi
      - name: Record result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.remove.outputs.result }}
        run: |
          set -euo pipefail
          printf 'REPO_ADMIN_TOKEN=%s\nrun_id=%s\n' "${RESULT:-unknown}" "$GITHUB_RUN_ID" > /tmp/result
          encoded="$(base64 -w0 /tmp/result)"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.obsolete-secret-cleanup.txt?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/.obsolete-secret-cleanup.txt" -f message="Record obsolete secret cleanup ${GITHUB_RUN_ID}" -f content="$encoded" -f branch=main)
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null
