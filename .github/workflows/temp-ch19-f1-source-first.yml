name: TEMP Chapter 19 F1 source-first

on:
  push:
    branches:
      - agent/ch19-f1-production-case
    paths:
      - .github/workflows/temp-ch19-f1-source-first.yml
      - src/core/chapterNineteenF1Expansion.ts
      - src/core/chapterNineteenF1Expansion.test.ts
      - src/ui/data/scenarioProductionVerificationF1.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenF1.ts

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-f1-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict F1 contract
        run: node --test dist/core/chapterNineteenF1Expansion.test.js

      - name: Build UI
        run: npm run build:ui
