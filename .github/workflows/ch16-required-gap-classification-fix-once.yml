name: TEMP Reconcile Chapter 16 Required Gap Classifications

on:
  push:
    branches:
      - agent/ch16-franchise-video-global-new-cinemas-atlas-audit

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch16-franchise-video-global-new-cinemas-atlas-audit
          fetch-depth: 0
      - name: Reclassify actual missing anchors and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/film-history-chapter-sixteen-atlas-audit.mjs')
          text = p.read_text()
          replacements = {
              '["Missing", "Missing", 1982, [], "anchor_film", "EXISTING_REQUIRED"': '["Missing", "Missing", 1982, [], "anchor_film", "P1"',
              '["Come and See", "Idi i smotri", 1985, ["Idi i smotri"], "anchor_film", "EXISTING_REQUIRED"': '["Come and See", "Idi i smotri", 1985, ["Idi i smotri"], "anchor_film", "P1"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected classification marker not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          Path('docs/.tmp-ch16-existing-required-gaps.json').unlink()
          Path('.github/workflows/ch16-required-gap-classification-fix-once.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/film-history-chapter-sixteen-atlas-audit.mjs docs/.tmp-ch16-existing-required-gaps.json .github/workflows/ch16-required-gap-classification-fix-once.yml
          git diff --cached --check
          git commit -m "Reconcile Chapter 16 required-gap classifications"
          git push origin HEAD:agent/ch16-franchise-video-global-new-cinemas-atlas-audit
