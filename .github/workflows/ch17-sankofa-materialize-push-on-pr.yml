name: TEMP Sankofa Chapter 17 materialize

on:
  push:
    branches:
      - agent/ch17-sankofa-production-case

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch17-sankofa-production-case
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize and structurally attest Sankofa
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {n}: {old[:100]}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/ui/data/filmScenarios.ts',
              'import { mergeChapterSeventeenHyenasExpansion } from "../../core/chapterSeventeenHyenasExpansion.js";\n',
              'import { mergeChapterSeventeenHyenasExpansion } from "../../core/chapterSeventeenHyenasExpansion.js";\nimport { mergeChapterSeventeenSankofaExpansion } from "../../core/chapterSeventeenSankofaExpansion.js";\n',
          )
          replace_once(
              'src/ui/data/filmScenarios.ts',
              'const chapterSeventeenHyenasScenarios = mergeChapterSeventeenHyenasExpansion(chapterSixteenRagingBullScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSeventeenHyenasScenarios);',
              'const chapterSeventeenHyenasScenarios = mergeChapterSeventeenHyenasExpansion(chapterSixteenRagingBullScenarios);\nconst chapterSeventeenSankofaScenarios = mergeChapterSeventeenSankofaExpansion(chapterSeventeenHyenasScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSeventeenSankofaScenarios);',
          )
          replace_once(
              'src/ui/data/filmScenarios.ts',
              '+manual_chapter_seventeen_hyenas_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_seventeen_hyenas_expansion_2026+manual_chapter_seventeen_sankofa_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
          )

          replace_once(
              'src/ui/data/scenarioFilmStudyMap.ts',
              'import { hyenasFilmHistoryProfile } from "./scenarioFilmStudyChapterSeventeenHyenas";\n',
              'import { hyenasFilmHistoryProfile } from "./scenarioFilmStudyChapterSeventeenHyenas";\nimport { sankofaFilmHistoryProfile } from "./scenarioFilmStudyChapterSeventeenSankofa";\n',
          )
          replace_once(
              'src/ui/data/scenarioFilmStudyMap.ts',
              '  [hyenasFilmHistoryProfile.scenarioId]: hyenasFilmHistoryProfile,\n',
              '  [hyenasFilmHistoryProfile.scenarioId]: hyenasFilmHistoryProfile,\n  [sankofaFilmHistoryProfile.scenarioId]: sankofaFilmHistoryProfile,\n',
          )

          replace_once(
              'src/ui/data/scenarioProductionVerificationRegistry.ts',
              'import { hyenasProductionCaseVerification } from "./scenarioProductionVerificationHyenas";\n',
              'import { hyenasProductionCaseVerification } from "./scenarioProductionVerificationHyenas";\nimport { sankofaProductionCaseVerification } from "./scenarioProductionVerificationSankofa";\n',
          )
          replace_once(
              'src/ui/data/scenarioProductionVerificationRegistry.ts',
              '  hyenasProductionCaseVerification,\n',
              '  hyenasProductionCaseVerification,\n  sankofaProductionCaseVerification,\n',
          )

          replace_once('scripts/production-case-rest-audit.mjs', 'const EXPECTED_PLAYABLE_SCENARIOS = 470;', 'const EXPECTED_PLAYABLE_SCENARIOS = 471;')
          replace_once('scripts/production-case-rest-audit.mjs', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 470;', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 471;')
          replace_once(
              'scripts/production-case-rest-audit.mjs',
              '  "chapterSeventeenHyenasExpansion.ts",\n  "modernCanonExpansion.ts",',
              '  "chapterSeventeenHyenasExpansion.ts",\n  "chapterSeventeenSankofaExpansion.ts",\n  "modernCanonExpansion.ts",',
          )

          words = ['twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen']
          for word in words:
              script = f'scripts/film-history-chapter-{word}-atlas-audit.mjs'
              replace_once(script, 'const EXPECTED_ATLAS_COUNT = 470;', 'const EXPECTED_ATLAS_COUNT = 471;')
              replace_once(
                  script,
                  '  "chapterSeventeenHyenasExpansion.ts",\n  "modernCanonExpansion.ts",',
                  '  "chapterSeventeenHyenasExpansion.ts",\n  "chapterSeventeenSankofaExpansion.ts",\n  "modernCanonExpansion.ts",',
              )

          for word in ['Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen']:
              path = Path(f'src/core/filmHistoryChapter{word}AuditContract.test.ts')
              s = path.read_text()
              if s.count('470') < 3:
                  raise SystemExit(f'{path}: insufficient 470 count anchors')
              path.write_text(s.replace('470', '471'))

          replace_once(
              'src/core/filmHistoryChapterSeventeenAuditContract.test.ts',
              '  "Hyenas",\n  "Farewell My Concubine",',
              '  "Hyenas",\n  "Sankofa",\n  "Farewell My Concubine",',
          )
          replace_once(
              'src/core/filmHistoryChapterSeventeenAuditContract.test.ts',
              'const exactP0Queue = [\n  "Sankofa",\n  "Chungking Express",',
              'const exactP0Queue = [\n  "Chungking Express",',
          )
          replace_once(
              'src/core/filmHistoryChapterSeventeenAuditContract.test.ts',
              '  "The Living End",\n  "Sankofa",\n  "The Piano",',
              '  "The Living End",\n  "The Piano",',
          )

          reports = [(w, f'docs/film-history-chapter-{w}-atlas-resolved.json') for w in words]
          for word, out in reports:
              subprocess.run(['node', f'scripts/film-history-chapter-{word}-atlas-audit.mjs', f'--write={out}'], check=True, stdout=subprocess.DEVNULL)

          report = json.loads(Path('docs/film-history-chapter-seventeen-atlas-resolved.json').read_text())
          assert report['atlas']['expectedCount'] == 471 and report['atlas']['actualCount'] == 471
          assert report['verificationIndex']['literalVerifiedScenarioIds'] == 471
          sankofa = next(x for x in report['candidates'] if x['title'] == 'Sankofa')
          assert sankofa['decision'] == 'USE_EXISTING'
          assert sankofa['scenarioId'] == 'scenario_sankofa_1993'
          assert sankofa['productionVerified'] is True
          assert report['byDecision']['P0'] == ['Chungking Express', 'Bandit Queen', 'Toy Story', 'The Matrix', 'Shiri']
          assert len(report['byDecision']['P1']) == 16
          assert report['byDecision']['P2'] == ['Goodfellas']
          assert 'Sankofa' not in report['recommendedNewProductionCases']

          subprocess.run(['node', 'scripts/production-case-rest-audit.mjs'], check=True)
          PY
      - name: Commit only permanent materialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts \
            scripts/production-case-rest-audit.mjs \
            scripts/film-history-chapter-twelve-atlas-audit.mjs \
            scripts/film-history-chapter-thirteen-atlas-audit.mjs \
            scripts/film-history-chapter-fourteen-atlas-audit.mjs \
            scripts/film-history-chapter-fifteen-atlas-audit.mjs \
            scripts/film-history-chapter-sixteen-atlas-audit.mjs \
            scripts/film-history-chapter-seventeen-atlas-audit.mjs \
            src/core/filmHistoryChapterTwelveAuditContract.test.ts \
            src/core/filmHistoryChapterThirteenAuditContract.test.ts \
            src/core/filmHistoryChapterFourteenAuditContract.test.ts \
            src/core/filmHistoryChapterFifteenAuditContract.test.ts \
            src/core/filmHistoryChapterSixteenAuditContract.test.ts \
            src/core/filmHistoryChapterSeventeenAuditContract.test.ts \
            docs/film-history-chapter-twelve-atlas-resolved.json \
            docs/film-history-chapter-thirteen-atlas-resolved.json \
            docs/film-history-chapter-fourteen-atlas-resolved.json \
            docs/film-history-chapter-fifteen-atlas-resolved.json \
            docs/film-history-chapter-sixteen-atlas-resolved.json \
            docs/film-history-chapter-seventeen-atlas-resolved.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "22"
          ! git diff --cached --name-only | grep -q '^\.github/workflows/'
          git commit -m "Materialize Sankofa Chapter 17 case"
          git push origin HEAD:agent/ch17-sankofa-production-case
