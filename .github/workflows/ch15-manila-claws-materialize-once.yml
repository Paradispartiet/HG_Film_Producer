name: TEMP Materialize Manila Chapter 15

on:
  push:
    branches:
      - agent/ch15-manila-claws-light-production-case

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ch15-manila-claws-light-production-case
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate Manila atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          for path in [
              "scripts/film-history-chapter-twelve-atlas-audit.mjs",
              "scripts/film-history-chapter-thirteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fourteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fifteen-atlas-audit.mjs",
          ]:
              replace_once(path, "const EXPECTED_ATLAS_COUNT = 446;", "const EXPECTED_ATLAS_COUNT = 447;")
              replace_once(path, '  "chapterFifteenToukiBoukiExpansion.ts",\n', '  "chapterFifteenToukiBoukiExpansion.ts",\n  "chapterFifteenManilaClawsLightExpansion.ts",\n')

          path = "scripts/production-case-rest-audit.mjs"
          replace_once(path, "const EXPECTED_PLAYABLE_SCENARIOS = 446;", "const EXPECTED_PLAYABLE_SCENARIOS = 447;")
          replace_once(path, "const EXPECTED_VERIFIED_PRODUCTION_CASES = 446;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 447;")
          replace_once(path, '  "chapterFifteenToukiBoukiExpansion.ts",\n', '  "chapterFifteenToukiBoukiExpansion.ts",\n  "chapterFifteenManilaClawsLightExpansion.ts",\n')

          path = "src/ui/data/filmScenarios.ts"
          replace_once(path, 'import { mergeChapterFifteenToukiBoukiExpansion } from "../../core/chapterFifteenToukiBoukiExpansion.js";\n', 'import { mergeChapterFifteenToukiBoukiExpansion } from "../../core/chapterFifteenToukiBoukiExpansion.js";\nimport { mergeChapterFifteenManilaClawsLightExpansion } from "../../core/chapterFifteenManilaClawsLightExpansion.js";\n')
          replace_once(path, 'const modernCanonScenarios = mergeModernCanonExpansion(chapterFifteenToukiBoukiScenarios);', 'const chapterFifteenManilaClawsLightScenarios = mergeChapterFifteenManilaClawsLightExpansion(chapterFifteenToukiBoukiScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterFifteenManilaClawsLightScenarios);')
          replace_once(path, '+manual_chapter_fifteen_touki_bouki_expansion_2026+manual_modern_indie_asian_prize_expansion_2026', '+manual_chapter_fifteen_touki_bouki_expansion_2026+manual_chapter_fifteen_manila_claws_light_expansion_2026+manual_modern_indie_asian_prize_expansion_2026')

          path = "src/ui/data/scenarioFilmStudyMap.ts"
          replace_once(path, 'import { toukiBoukiFilmHistoryProfile } from "./scenarioFilmStudyNewHollywoodToukiBouki";\n', 'import { toukiBoukiFilmHistoryProfile } from "./scenarioFilmStudyNewHollywoodToukiBouki";\nimport { manilaClawsLightFilmHistoryProfile } from "./scenarioFilmStudyNewHollywoodManilaClawsLight";\n')
          replace_once(path, '  [toukiBoukiFilmHistoryProfile.scenarioId]: toukiBoukiFilmHistoryProfile,\n', '  [toukiBoukiFilmHistoryProfile.scenarioId]: toukiBoukiFilmHistoryProfile,\n  [manilaClawsLightFilmHistoryProfile.scenarioId]: manilaClawsLightFilmHistoryProfile,\n')

          path = "src/ui/data/scenarioProductionVerificationRegistry.ts"
          replace_once(path, 'import { toukiBoukiProductionCaseVerification } from "./scenarioProductionVerificationToukiBouki";\n', 'import { toukiBoukiProductionCaseVerification } from "./scenarioProductionVerificationToukiBouki";\nimport { manilaClawsLightProductionCaseVerification } from "./scenarioProductionVerificationManilaClawsLight";\n')
          replace_once(path, '  toukiBoukiProductionCaseVerification,\n', '  toukiBoukiProductionCaseVerification,\n  manilaClawsLightProductionCaseVerification,\n')

          for chapter in ("Twelve", "Thirteen", "Fourteen"):
              path = f"src/core/filmHistoryChapter{chapter}AuditContract.test.ts"
              p = Path(path)
              text = p.read_text()
              text2 = text.replace("EXPECTED_ATLAS_COUNT = 446", "EXPECTED_ATLAS_COUNT = 447")
              text2 = text2.replace("resolved.atlas.expectedCount, 446", "resolved.atlas.expectedCount, 447")
              text2 = text2.replace("resolved.atlas.actualCount, 446", "resolved.atlas.actualCount, 447")
              if text2 == text:
                  raise SystemExit(f"{path}: expected Atlas-count assertions not found")
              p.write_text(text2)

          path = "src/core/filmHistoryChapterFifteenAuditContract.test.ts"
          p = Path(path)
          text = p.read_text()
          changes = [
              ("EXPECTED_ATLAS_COUNT = 446", "EXPECTED_ATLAS_COUNT = 447"),
              ("resolved.atlas.expectedCount, 446", "resolved.atlas.expectedCount, 447"),
              ("resolved.atlas.actualCount, 446", "resolved.atlas.actualCount, 447"),
              ('  "Dog Day Afternoon",\n  "Cría cuervos",', '  "Dog Day Afternoon",\n  "Manila in the Claws of Light",\n  "Cría cuervos",'),
              ('const exactP1Queue = ["Manila in the Claws of Light", "The Battle of Chile: Part I"];', 'const exactP1Queue = ["The Battle of Chile: Part I"];'),
              ('  assert.equal(byTitle.get("Dog Day Afternoon")?.scenarioId, "scenario_dog_day_afternoon_1975");\n', '  assert.equal(byTitle.get("Dog Day Afternoon")?.scenarioId, "scenario_dog_day_afternoon_1975");\n  assert.equal(byTitle.get("Manila in the Claws of Light")?.scenarioId, "scenario_manila_in_the_claws_of_light_1975");\n'),
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f"{path}: missing expected fragment {old!r}")
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Regenerate Chapter 12-15 reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json >/tmp/ch12.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json >/tmp/ch13.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json >/tmp/ch14.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json >/tmp/ch15.json
          node -e 'const r=require("./docs/film-history-chapter-fifteen-atlas-resolved.json"); if(r.atlas.actualCount!==447) process.exit(1); if(r.byDecision.P0.length!==0) process.exit(2); if(JSON.stringify(r.byDecision.P1)!==JSON.stringify(["The Battle of Chile: Part I"])) process.exit(3); const t=r.candidates.find(x=>x.title==="Manila in the Claws of Light"); if(!t||t.scenarioId!=="scenario_manila_in_the_claws_of_light_1975"||t.decision!=="USE_EXISTING") process.exit(4);'
      - name: Verify full v0.1
        run: npm run verify:v0.1
      - name: Commit integration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ch15-manila-claws-materialize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize Manila Chapter 15 Production Case"
          git push origin HEAD:agent/ch15-manila-claws-light-production-case
