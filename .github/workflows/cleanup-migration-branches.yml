name: Cleanup migration branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-migration-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete migration branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            chore/create-public-deploy-surface-2026-08-18
            chore/gh-bootstrap-export
            chore/ip-hardening-2026-08-18
            chore/privacy-finalize-2026-08-18
            chore/privacy-page-probe-2026-08-18
            chore/privacy-readiness-check-2026-08-18
            chore/private-aha-pilot-2026-08-18
            chore/private-film-football-final-2026-08-18
            chore/private-film-producer-pilot-2026-08-18
            chore/private-history-go-final-2026-08-18
            chore/private-visibility-attempt
            chore/verify-private-aha-production-2026-08-18
          )
          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "Deleted $branch"
            else
              echo "Already absent: $branch"
            fi
          done
