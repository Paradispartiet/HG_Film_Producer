name: TEMP fix Chapter 18 Cold War prep source

on:
  push:
    branches:
      - agent/ch18-cold-war-production-case

permissions:
  contents: write

concurrency:
  group: temp-ch18-cold-war-prep-source-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch18-cold-war-production-case
          fetch-depth: 0

      - name: Apply exact source-only correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/chapterEighteenColdWarExpansion.ts')
          s = p.read_text()
          old = '      { id: "prep_lock", label: "Lock six months of prep", player_task: "Coordinate camera, design, costume, locations and monochrome testing across the documented long preparation period." },'
          new = '      { id: "prep_lock", label: "Lock six months of prep", player_task: "Coordinate camera, design, costume, locations and monochrome testing across the documented six months of preparation." },'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one Cold War prep-lock anchor, got {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY

      - name: Commit source correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/chapterEighteenColdWarExpansion.ts
          git diff --cached --quiet && { echo 'No source correction produced'; exit 1; }
          git commit -m "Fix Cold War prep learning phase"
          git push origin HEAD:agent/ch18-cold-war-production-case
