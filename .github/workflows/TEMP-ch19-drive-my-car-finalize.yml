name: TEMP Chapter 19 Drive My Car finalize

on:
  push:
    branches:
      - agent/ch19-drive-my-car-production-case
    paths:
      - .github/workflows/TEMP-ch19-drive-my-car-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-drive-my-car-production-case
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exact Drive My Car integration patch
        run: |
          node - <<'NODE'
          const fs = require('fs');

          function replaceExact(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`${file}: missing exact anchor: ${before.slice(0, 240)}`);
            const next = source.replace(before, after);
            if (next === source) throw new Error(`${file}: replacement produced no change`);
            fs.writeFileSync(file, next);
          }

          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'import { mergeChapterNineteenNomadlandExpansion } from "../../core/chapterNineteenNomadlandExpansion.js";\n',
            'import { mergeChapterNineteenNomadlandExpansion } from "../../core/chapterNineteenNomadlandExpansion.js";\nimport { mergeChapterNineteenDriveMyCarExpansion } from "../../core/chapterNineteenDriveMyCarExpansion.js";\n',
          );
          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'const chapterNineteenNomadlandScenarios = mergeChapterNineteenNomadlandExpansion(chapterNineteenAvatarWayOfWaterScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenNomadlandScenarios);',
            'const chapterNineteenNomadlandScenarios = mergeChapterNineteenNomadlandExpansion(chapterNineteenAvatarWayOfWaterScenarios);\nconst chapterNineteenDriveMyCarScenarios = mergeChapterNineteenDriveMyCarExpansion(chapterNineteenNomadlandScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenDriveMyCarScenarios);',
          );
          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'manual_chapter_nineteen_nomadland_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
            'manual_chapter_nineteen_nomadland_expansion_2026+manual_chapter_nineteen_drive_my_car_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
          );

          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            'import { nomadlandProductionCaseVerification } from "./scenarioProductionVerificationNomadland";\n',
            'import { nomadlandProductionCaseVerification } from "./scenarioProductionVerificationNomadland";\nimport { driveMyCarProductionCaseVerification } from "./scenarioProductionVerificationDriveMyCar";\n',
          );
          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            '  avatarWayOfWaterProductionCaseVerification,\n  nomadlandProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
            '  avatarWayOfWaterProductionCaseVerification,\n  nomadlandProductionCaseVerification,\n  driveMyCarProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
          );

          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            'import { nomadlandFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenNomadland";\n',
            'import { nomadlandFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenNomadland";\nimport { driveMyCarFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenDriveMyCar";\n',
          );
          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            '  [avatarWayOfWaterFilmHistoryProfile.scenarioId]: avatarWayOfWaterFilmHistoryProfile,\n  [nomadlandFilmHistoryProfile.scenarioId]: nomadlandFilmHistoryProfile,\n  scenario_the_machinist_2004:',
            '  [avatarWayOfWaterFilmHistoryProfile.scenarioId]: avatarWayOfWaterFilmHistoryProfile,\n  [nomadlandFilmHistoryProfile.scenarioId]: nomadlandFilmHistoryProfile,\n  [driveMyCarFilmHistoryProfile.scenarioId]: driveMyCarFilmHistoryProfile,\n  scenario_the_machinist_2004:',
          );

          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            'const EXPECTED_PLAYABLE_SCENARIOS = 546;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 546;',
            'const EXPECTED_PLAYABLE_SCENARIOS = 547;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 547;',
          );
          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            '  "chapterNineteenNomadlandExpansion.ts",\n  "modernCanonExpansion.ts",',
            '  "chapterNineteenNomadlandExpansion.ts",\n  "chapterNineteenDriveMyCarExpansion.ts",\n  "modernCanonExpansion.ts",',
          );

          replaceExact(
            'scripts/film-history-chapter-nineteen-atlas-audit.mjs',
            'const EXPECTED_ATLAS_COUNT = 546;',
            'const EXPECTED_ATLAS_COUNT = 547;',
          );

          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  "The Disciple",\n  "Dune",\n  "Flee",',
            '  "The Disciple",\n  "Dune",\n  "Drive My Car",\n  "Flee",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            'const exactP1Queue = [\n  "Collective",\n  "The Power of the Dog",\n  "Drive My Car",\n  "Titane",',
            'const exactP1Queue = [\n  "Collective",\n  "The Power of the Dog",\n  "Titane",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 546;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 546);\n  assert.equal(resolved.atlas.actualCount, 546);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 546);',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 547;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 547);\n  assert.equal(resolved.atlas.actualCount, 547);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 547);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(exactUseExisting.length, 14);\n  assert.equal(exactP0Queue.length, 16);\n  assert.equal(exactP1Queue.length, 26);',
            '  assert.equal(exactUseExisting.length, 15);\n  assert.equal(exactP0Queue.length, 16);\n  assert.equal(exactP1Queue.length, 25);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 42);',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 41);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(resolved.productionStrategy.nextRecommendedCase, "Drive My Car");\n  assert.equal(resolved.productionStrategy.nextRecommendedLane, "auteur_festival");\n  assert.deepEqual(resolved.recommendedNewProductionCases.slice(0, 5), [\n    "Drive My Car",\n    "Collective",\n    "RRR",\n    "Top Gun: Maverick",\n    "Titane",\n  ]);\n  assert.deepEqual(\n    resolved.productionStrategy.remainingSequence.slice(0, 5).map((item) => item.lane),\n    ["auteur_festival", "nonfiction_hybrid", "regional_global", "industrial_scale_technical", "auteur_festival"],\n  );\n  assert.ok(!resolved.recommendedNewProductionCases.includes("Nomadland"));\n  assert.ok(resolved.recommendedNewProductionCases.indexOf("Top Gun: Maverick") > resolved.recommendedNewProductionCases.indexOf("Drive My Car"));',
            '  assert.equal(resolved.productionStrategy.nextRecommendedCase, "Collective");\n  assert.equal(resolved.productionStrategy.nextRecommendedLane, "nonfiction_hybrid");\n  assert.deepEqual(resolved.recommendedNewProductionCases.slice(0, 5), [\n    "Collective",\n    "RRR",\n    "Top Gun: Maverick",\n    "Titane",\n    "Everything Everywhere All at Once",\n  ]);\n  assert.deepEqual(\n    resolved.productionStrategy.remainingSequence.slice(0, 5).map((item) => item.lane),\n    ["nonfiction_hybrid", "regional_global", "industrial_scale_technical", "auteur_festival", "independent_low_mid_budget"],\n  );\n  assert.ok(!resolved.recommendedNewProductionCases.includes("Nomadland"));\n  assert.ok(!resolved.recommendedNewProductionCases.includes("Drive My Car"));\n  assert.ok(resolved.recommendedNewProductionCases.indexOf("Top Gun: Maverick") > resolved.recommendedNewProductionCases.indexOf("Collective"));',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  const flee = resolved.candidates.find((candidate) => candidate.title === "Flee");',
            '  const driveMyCar = resolved.candidates.find((candidate) => candidate.title === "Drive My Car");\n  assert.ok(driveMyCar);\n  assert.equal(driveMyCar.decision, "USE_EXISTING");\n  assert.equal(driveMyCar.scenarioId, "scenario_drive_my_car_2021");\n  assert.equal(driveMyCar.matches, 1);\n  assert.equal(driveMyCar.productionVerified, true);\n\n  const flee = resolved.candidates.find((candidate) => candidate.title === "Flee");',
          );

          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(verificationIds.size === 546, `Global Production Verification registry must contain exactly 546 unique scenarioIds after the seventh Chapter 19 case: ${verificationIds.size}`);',
            'invariant(verificationIds.size === 547, `Global Production Verification registry must contain exactly 547 unique scenarioIds after the eighth Chapter 19 case: ${verificationIds.size}`);',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 546, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 546.");',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 547, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 547.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 14 && chapter19.byDecision?.P0?.length === 16 && chapter19.byDecision?.P1?.length === 26 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 14 USE_EXISTING / 16 P0 / 26 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 15 && chapter19.byDecision?.P0?.length === 16 && chapter19.byDecision?.P1?.length === 25 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 15 USE_EXISTING / 16 P0 / 25 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(nomadland?.decision === "USE_EXISTING" && nomadland?.scenarioId === "scenario_nomadland_2020" && nomadland?.matches === 1 && nomadland?.productionVerified === true, "Nomadland is not closed as the seventh production-verified Chapter 19 USE_EXISTING case.");\ninvariant(chapter19.productionStrategy?.nextRecommendedCase === "Drive My Car" && chapter19.productionStrategy?.nextRecommendedLane === "auteur_festival", "Chapter 19 balanced scheduler must advance from Nomadland to Drive My Car after the seventh case.");',
            'invariant(nomadland?.decision === "USE_EXISTING" && nomadland?.scenarioId === "scenario_nomadland_2020" && nomadland?.matches === 1 && nomadland?.productionVerified === true, "Nomadland is not closed as the seventh production-verified Chapter 19 USE_EXISTING case.");\nconst driveMyCar = chapter19.candidates.find((candidate) => candidate.title === "Drive My Car");\ninvariant(driveMyCar?.decision === "USE_EXISTING" && driveMyCar?.scenarioId === "scenario_drive_my_car_2021" && driveMyCar?.matches === 1 && driveMyCar?.productionVerified === true, "Drive My Car is not closed as the eighth production-verified Chapter 19 USE_EXISTING case.");\ninvariant(chapter19.productionStrategy?.nextRecommendedCase === "Collective" && chapter19.productionStrategy?.nextRecommendedLane === "nonfiction_hybrid", "Chapter 19 balanced scheduler must advance from Drive My Car to Collective after the eighth case.");',
          );
          NODE

      - name: Generate canonical Chapter 19 snapshot
        run: |
          node scripts/film-history-chapter-nineteen-atlas-audit.mjs > /tmp/ch19-drive-my-car.json
          cp /tmp/ch19-drive-my-car.json docs/film-history-chapter-nineteen-atlas-resolved.json

      - name: Assert Drive My Car transition
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const driveMyCar = data.candidates.find((candidate) => candidate.title === 'Drive My Car');
          const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
          if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 547 || data.atlas.actualCount !== 547) throw new Error(JSON.stringify(data.atlas));
          if (data.verificationIndex.literalVerifiedScenarioIds !== 547) throw new Error(JSON.stringify(data.verificationIndex));
          if (!driveMyCar || driveMyCar.decision !== 'USE_EXISTING' || driveMyCar.scenarioId !== 'scenario_drive_my_car_2021' || driveMyCar.matches !== 1 || driveMyCar.productionVerified !== true || driveMyCar.origin !== 'chapterNineteenDriveMyCarExpansion.ts') throw new Error(JSON.stringify(driveMyCar));
          if (counts.USE_EXISTING !== 15 || counts.P0 !== 16 || counts.P1 !== 25 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(JSON.stringify(counts));
          if (data.productionStrategy.nextRecommendedCase !== 'Collective' || data.productionStrategy.nextRecommendedLane !== 'nonfiction_hybrid') throw new Error(JSON.stringify(data.productionStrategy));
          if (data.recommendedNewProductionCases.length !== 41 || data.recommendedNewProductionCases[0] !== 'Collective' || data.recommendedNewProductionCases.includes('Drive My Car')) throw new Error(JSON.stringify(data.recommendedNewProductionCases.slice(0, 8)));
          NODE

      - name: Remove TEMP surfaces from verification working tree
        run: |
          rm -f .github/workflows/TEMP-ch19-drive-my-car-*.yml
          rm -f TEMP-drive-my-car-*.txt TEMP-drive-my-car-*.log

      - name: Install dependencies
        run: npm ci

      - name: Verify full v0.1 fail-closed gate with diagnostics
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee /tmp/drive-my-car-verify.log

      - name: Upload full verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-my-car-verify-${{ github.run_attempt }}
          path: /tmp/drive-my-car-verify.log
          if-no-files-found: error

      - name: Assert Drive My Car snapshot survived full verification
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const driveMyCar = data.candidates.find((candidate) => candidate.title === 'Drive My Car');
          const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
          if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 547 || data.atlas.actualCount !== 547 || data.verificationIndex.literalVerifiedScenarioIds !== 547) throw new Error(JSON.stringify({ atlas: data.atlas, verificationIndex: data.verificationIndex }));
          if (!driveMyCar || driveMyCar.decision !== 'USE_EXISTING' || driveMyCar.scenarioId !== 'scenario_drive_my_car_2021' || driveMyCar.matches !== 1 || driveMyCar.productionVerified !== true) throw new Error(JSON.stringify(driveMyCar));
          if (counts.USE_EXISTING !== 15 || counts.P0 !== 16 || counts.P1 !== 25 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(JSON.stringify(counts));
          if (data.productionStrategy.nextRecommendedCase !== 'Collective' || data.productionStrategy.nextRecommendedLane !== 'nonfiction_hybrid') throw new Error(JSON.stringify(data.productionStrategy));
          NODE

      - name: Commit permanent materialization after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            scripts/production-case-rest-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            docs/film-history-chapter-nineteen-atlas-resolved.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent Drive My Car materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialize Chapter 19 Drive My Car production case"
          git push origin HEAD:agent/ch19-drive-my-car-production-case
