name: TEMP Materialize Chapter 16 Raiders

on:
  push:
    branches:
      - agent/ch16-raiders-lost-ark-production-case

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch16-raiders-lost-ark-production-case
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate Raiders atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing marker in {path}: {old}')
              p.write_text(text.replace(old, new, 1))

          # Runtime scenario chain.
          replace_once(
              'src/ui/data/filmScenarios.ts',
              'import { mergeChapterFifteenBattleChilePartOneExpansion } from "../../core/chapterFifteenBattleChilePartOneExpansion.js";\n',
              'import { mergeChapterFifteenBattleChilePartOneExpansion } from "../../core/chapterFifteenBattleChilePartOneExpansion.js";\nimport { mergeChapterSixteenRaidersLostArkExpansion } from "../../core/chapterSixteenRaidersLostArkExpansion.js";\n',
          )
          replace_once(
              'src/ui/data/filmScenarios.ts',
              'const modernCanonScenarios = mergeModernCanonExpansion(chapterFifteenBattleChilePartOneScenarios);',
              'const chapterSixteenRaidersLostArkScenarios = mergeChapterSixteenRaidersLostArkExpansion(chapterFifteenBattleChilePartOneScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenRaidersLostArkScenarios);',
          )
          replace_once(
              'src/ui/data/filmScenarios.ts',
              'manual_chapter_fifteen_battle_chile_part_one_expansion_2026',
              'manual_chapter_fifteen_battle_chile_part_one_expansion_2026+manual_chapter_sixteen_raiders_lost_ark_expansion_2026',
          )

          # Film Study registry.
          replace_once(
              'src/ui/data/scenarioFilmStudyMap.ts',
              'import { battleChilePartOneFilmHistoryProfile } from "./scenarioFilmStudyNewHollywoodBattleChilePartOne";\n',
              'import { battleChilePartOneFilmHistoryProfile } from "./scenarioFilmStudyNewHollywoodBattleChilePartOne";\nimport { raidersLostArkFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenRaiders";\n',
          )
          replace_once(
              'src/ui/data/scenarioFilmStudyMap.ts',
              '  [battleChilePartOneFilmHistoryProfile.scenarioId]: battleChilePartOneFilmHistoryProfile,\n',
              '  [battleChilePartOneFilmHistoryProfile.scenarioId]: battleChilePartOneFilmHistoryProfile,\n  [raidersLostArkFilmHistoryProfile.scenarioId]: raidersLostArkFilmHistoryProfile,\n',
          )

          # Production Verification registry.
          replace_once(
              'src/ui/data/scenarioProductionVerificationRegistry.ts',
              'import { battleChilePartOneProductionCaseVerification } from "./scenarioProductionVerificationBattleChilePartOne";\n',
              'import { battleChilePartOneProductionCaseVerification } from "./scenarioProductionVerificationBattleChilePartOne";\nimport { raidersLostArkProductionCaseVerification } from "./scenarioProductionVerificationRaidersLostArk";\n',
          )
          replace_once(
              'src/ui/data/scenarioProductionVerificationRegistry.ts',
              '  battleChilePartOneProductionCaseVerification,\n',
              '  battleChilePartOneProductionCaseVerification,\n  raidersLostArkProductionCaseVerification,\n',
          )

          # Global Production Case audit.
          p = Path('scripts/production-case-rest-audit.mjs')
          text = p.read_text()
          text = text.replace('const EXPECTED_PLAYABLE_SCENARIOS = 448;', 'const EXPECTED_PLAYABLE_SCENARIOS = 449;', 1)
          text = text.replace('const EXPECTED_VERIFIED_PRODUCTION_CASES = 448;', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 449;', 1)
          marker = '  "chapterFifteenBattleChilePartOneExpansion.ts",\n'
          if marker not in text: raise SystemExit('Missing production audit expansion marker')
          text = text.replace(marker, marker + '  "chapterSixteenRaidersLostArkExpansion.ts",\n', 1)
          p.write_text(text)

          # Chapter 12–16 Atlas rebuilds all canonical scenarios.
          for n in ('twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen'):
              path = Path(f'scripts/film-history-chapter-{n}-atlas-audit.mjs')
              text = path.read_text()
              if 'const EXPECTED_ATLAS_COUNT = 448;' not in text:
                  raise SystemExit(f'Missing 448 count in {path}')
              text = text.replace('const EXPECTED_ATLAS_COUNT = 448;', 'const EXPECTED_ATLAS_COUNT = 449;', 1)
              marker = '  "chapterFifteenBattleChilePartOneExpansion.ts",\n'
              if marker not in text:
                  raise SystemExit(f'Missing expansion marker in {path}')
              text = text.replace(marker, marker + '  "chapterSixteenRaidersLostArkExpansion.ts",\n', 1)
              path.write_text(text)

          # Chapter 12–15 permanent count contracts.
          for n in ('Twelve', 'Thirteen', 'Fourteen', 'Fifteen'):
              path = Path(f'src/core/filmHistoryChapter{n}AuditContract.test.ts')
              text = path.read_text()
              text = text.replace('EXPECTED_ATLAS_COUNT = 448', 'EXPECTED_ATLAS_COUNT = 449')
              text = text.replace('expectedCount, 448', 'expectedCount, 449')
              text = text.replace('actualCount, 448', 'actualCount, 449')
              path.write_text(text)

          # Chapter 16 resolved queue contract.
          p = Path('src/core/filmHistoryChapterSixteenAuditContract.test.ts')
          text = p.read_text()
          replacements = [
              ('EXPECTED_ATLAS_COUNT = 448', 'EXPECTED_ATLAS_COUNT = 449'),
              ('expectedCount, 448', 'expectedCount, 449'),
              ('actualCount, 448', 'actualCount, 449'),
              ('literalVerifiedScenarioIds, 448', 'literalVerifiedScenarioIds, 449'),
              ('const exactExisting = [\n  "The Shining",\n', 'const exactExisting = [\n  "The Shining",\n  "Raiders of the Lost Ark",\n'),
              ('const exactP0Queue = [\n  "Raiders of the Lost Ark",\n', 'const exactP0Queue = [\n'),
              ('    "Mephisto",\n    "Raiders of the Lost Ark",\n    "Missing",', '    "Mephisto",\n    "Missing",'),
              ('    "The Shining": "scenario_the_shining_1980",\n', '    "The Shining": "scenario_the_shining_1980",\n    "Raiders of the Lost Ark": "scenario_raiders_of_the_lost_ark_1981",\n'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing Chapter 16 contract marker: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json
          node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json

          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('docs/film-history-chapter-sixteen-atlas-resolved.json').read_text())
          assert report['atlas']['expectedCount'] == 449
          assert report['atlas']['actualCount'] == 449
          assert report['verificationIndex']['literalVerifiedScenarioIds'] == 449
          assert report['byDecision']['P0'] == ['Yellow Earth', 'My Beautiful Laundrette', 'Police Story', 'The Official Story', 'Yeelen', 'Do the Right Thing']
          assert report['byDecision']['P1'] == ['Mephisto', 'Missing', 'Blade Runner', 'E.T. the Extra-Terrestrial', 'Sugar Cane Alley', 'The Terminator', 'Come and See', 'Back to the Future', 'Aliens', "She's Gotta Have It", 'A Better Tomorrow', 'RoboCop', 'Salaam Bombay!']
          raiders = next(item for item in report['candidates'] if item['title'] == 'Raiders of the Lost Ark')
          assert raiders['decision'] == 'USE_EXISTING'
          assert raiders['scenarioId'] == 'scenario_raiders_of_the_lost_ark_1981'
          assert raiders['productionVerified'] is True
          assert 'Raiders of the Lost Ark' not in report['recommendedNewProductionCases']
          PY

          npm run verify:v0.1

          rm .github/workflows/ch16-raiders-materialize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize Raiders in Chapter 16 Atlas"
          git push origin HEAD:agent/ch16-raiders-lost-ark-production-case
