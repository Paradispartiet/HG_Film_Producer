name: Materialize Atlantis production case

on:
  push:
    branches:
      - agent/atlantis-1913

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire Atlantis into Chapter 5 and permanent gates
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) throw new Error(`Missing replacement anchor in ${path}: ${from}`);
            fs.writeFileSync(path, source.replace(from, to));
          }

          const corePath = 'src/core/chapterFiveInternationalExpansion.ts';
          const atlantisDefinition = `  {
            id: "scenario_atlantis_1913",
            title: "Atlantis",
            originalTitle: "Atlantis",
            aliases: [],
            year: 1913,
            titleType: "Feature",
            runtimeMins: 114,
            directors: ["August Blom"],
            genres: ["Drama", "Melodrama"],
            premise: "Build Atlantis as Nordisk Film's 1913 international literary-feature production problem: adapt Gerhart Hauptmann's long-form melodrama, coordinate a transatlantic narrative and large shipwreck set piece, sustain recognizable characters across an extended multi-reel structure, and manage differentiated export versions without collapsing them into one false master. Keep August Blom's direction, Karl Ludwig Schröder and Axel Garde's screenplay credit, Louis Larsen and Johan Ankerstjerne's shared cinematography credit, 35 mm silent production and the documented happy/Russian-market unhappy endings distinct. Treat the recent Titanic catastrophe as industrial context that may have encouraged Nordisk's investment, not as the source of Hauptmann's novel or as proof that Atlantis is a Titanic adaptation.",
            sourceId: "manual_atlantis_1913",
            sourceUrl: "https://www.dfi.dk/en/viden-om-film/filmdatabasen/film/atlantis-1",
            scenarioType: "international_literary_feature_production",
            requiredChoicesSeed: {
              screenplay: ["hauptmann_literary_adaptation", "transatlantic_multi_reel_structure", "character_arc_across_feature_scale"],
              camera: ["two_cinematographer_scale_coordination", "shipwreck_spatial_legibility", "performance_and_spectacle_balance"],
              editing: ["long_form_melodrama_progression", "shipwreck_escalation", "market_specific_ending_strategy"],
              sound: ["silent_photographed_production", "screening_specific_accompaniment", "no_synchronized_original_sound"],
              themes: ["film_history", "danish_silent_cinema", "nordisk_film", "literary_prestige", "international_export_versioning"],
            },
            learningGoals: [
              "Plan a long literary adaptation as a production system in which character arcs, travel, spectacle and emotional progression must remain legible across feature scale.",
              "Coordinate the documented two-person cinematography credit around performance, large-scale disaster staging and changing environments instead of reducing Atlantis to a lone-camera-author narrative.",
              "Design the shipwreck as a narrative and spatial escalation problem while avoiding unsupported claims about exact miniatures, tanks, compositing or mechanical-effects methods.",
              "Use Nordisk Film's unusually ambitious investment and international orientation to model how a small national industry could compete through prestige, scale and export rather than through domestic reach alone.",
              "Treat the happy ending and the unhappy Russian-market ending as explicit production-version choices, preserving market-specific assembly instead of inventing one immutable master cut.",
              "Separate historical layers carefully: Hauptmann's novel predates the film and was not inspired by Titanic, 1913 production was silent and 35 mm, and modern archival music/intertitles belong to later presentation history.",
            ],
            phases: [
              { id: "pitch", label: "International prestige pitch", player_task: "Define why Nordisk should risk exceptional resources on a Hauptmann adaptation whose literary prestige, feature length, travel and disaster spectacle must support international sales." },
              { id: "research", label: "Novel, company and version research", player_task: "Ground Hauptmann, Blom, Schröder, Garde, Larsen, Ankerstjerne, Nordisk Film, 35 mm format and the documented two-ending history in institutional evidence." },
              { id: "screenplay", label: "Feature-scale adaptation", player_task: "Select and restructure the novel so von Kammacher's crisis, Ingigerd, the voyage, shipwreck, New York and Eva remain one developing melodramatic line rather than disconnected attractions." },
              { id: "casting", label: "Characters across changing worlds", player_task: "Keep Olaf Fønss, Ida Orloff, Ebba Thomsen and the wider ensemble legible as the production moves through domestic, theatrical, maritime and American environments." },
              { id: "production_design", label: "Transatlantic scale", player_task: "Differentiate interiors, performance spaces, shipboard environments, disaster zones and later American settings without inventing undocumented construction specifications." },
              { id: "cinematography", label: "Two-camera-credit coordination", player_task: "Coordinate Louis Larsen and Johan Ankerstjerne's documented cinematography credit around readable performance, spatial scale and shipwreck escalation without assigning unsupported shot ownership." },
              { id: "editing", label: "Long form and export endings", player_task: "Sustain melodramatic progression across the long feature and branch the ending deliberately for different markets while preserving each version as a distinct historical object." },
              { id: "sound", label: "Silent production, later accompaniment", player_task: "Keep photographed production silent and distinguish any modern archival accompaniment or replacement intertitles from synchronized 1913 production sound." },
              { id: "release", label: "Export-scale risk", player_task: "Model how Nordisk's prestige, feature length, spectacle and market-specific versions seek international value while accepting that ambition can still disappoint critically or commercially." },
            ],
          },`;
          replaceOnce(corePath, '\n] as const;', `\n${atlantisDefinition}\n] as const;`);

          replaceOnce(
            'src/ui/data/scenarioFilmStudyMap.ts',
            'import { afgrundenFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsAfgrunden";',
            'import { afgrundenFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsAfgrunden";\nimport { atlantisFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsAtlantis";',
          );
          replaceOnce(
            'src/ui/data/scenarioFilmStudyMap.ts',
            '  [afgrundenFilmHistoryProfile.scenarioId]: afgrundenFilmHistoryProfile,',
            '  [afgrundenFilmHistoryProfile.scenarioId]: afgrundenFilmHistoryProfile,\n  [atlantisFilmHistoryProfile.scenarioId]: atlantisFilmHistoryProfile,',
          );

          replaceOnce(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            'import { afgrundenProductionCaseVerification } from "./scenarioProductionVerificationAfgrunden";',
            'import { afgrundenProductionCaseVerification } from "./scenarioProductionVerificationAfgrunden";\nimport { atlantisProductionCaseVerification } from "./scenarioProductionVerificationAtlantis";',
          );
          replaceOnce(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            '  afgrundenProductionCaseVerification,',
            '  afgrundenProductionCaseVerification,\n  atlantisProductionCaseVerification,',
          );

          replaceOnce('scripts/production-case-rest-audit.mjs', 'const EXPECTED_PLAYABLE_SCENARIOS = 397;', 'const EXPECTED_PLAYABLE_SCENARIOS = 398;');
          replaceOnce('scripts/production-case-rest-audit.mjs', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 397;', 'const EXPECTED_VERIFIED_PRODUCTION_CASES = 398;');

          replaceOnce('scripts/film-history-chapter-five-atlas-audit.mjs', 'const EXPECTED_ATLAS_COUNT = 397;', 'const EXPECTED_ATLAS_COUNT = 398;');
          replaceOnce(
            'scripts/film-history-chapter-five-atlas-audit.mjs',
            '  USE_EXISTING: ["Afgrunden", "Cabiria", "Fantômas", "Queen Elizabeth", "Traffic in Souls"],',
            '  USE_EXISTING: ["Afgrunden", "Atlantis", "Cabiria", "Fantômas", "Queen Elizabeth", "Traffic in Souls"],',
          );
          replaceOnce('scripts/film-history-chapter-five-atlas-audit.mjs', '  P1: ["Atlantis"],', '  P1: [],');
          NODE
      - name: Verify complete Atlantis branch
        run: npm run verify:v0.1
      - name: Commit verified Atlantis materialization
        run: |
          rm .github/workflows/atlantis-materialize.yml
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add src/core/chapterFiveInternationalExpansion.ts \
                  src/core/chapterFiveInternationalExpansion.test.ts \
                  src/ui/data/scenarioFilmStudyMap.ts \
                  src/ui/data/scenarioFilmStudySilentFoundationsAtlantis.ts \
                  src/ui/data/scenarioProductionVerificationRegistry.ts \
                  src/ui/data/scenarioProductionVerificationAtlantis.ts \
                  scripts/production-case-rest-audit.mjs \
                  scripts/film-history-chapter-five-atlas-audit.mjs \
                  .github/workflows/atlantis-materialize.yml
          git commit -m "Complete Atlantis 1913 production case"
          git push origin HEAD:agent/atlantis-1913
