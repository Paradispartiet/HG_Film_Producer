name: TEMP Chapter 19 Soul source diagnostic

on:
  push:
    branches:
      - agent/ch19-soul-production-case
    paths:
      - .github/workflows/TEMP-ch19-soul-diagnostic.yml
      - src/core/chapterNineteenSoulExpansion.ts
      - src/core/chapterNineteenSoulExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationSoul.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenSoul.ts

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-soul-production-case
          fetch-depth: 0
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Typecheck source-first Soul files
        run: npm run typecheck
      - name: Build core tests
        run: npm run build
      - name: Run strict Soul contract only
        run: node --test dist/core/chapterNineteenSoulExpansion.test.js
      - name: Build UI from source-first state
        run: npm run build:ui
