name: Finalize Fantomas branch

on:
  push:
    branches: [agent/fantomas-1913]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fantomas-1913
          fetch-depth: 0

      - name: Apply deterministic Fantomas completion patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          map_path = "src/ui/data/scenarioFilmStudyMap.ts"
          replace_once(
              map_path,
              '} from "./scenarioProductionVerificationRegistry";\n',
              '} from "./scenarioProductionVerificationRegistry";\nimport { fantomasFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsFantomas";\n',
          )
          replace_once(
              map_path,
              "const sourceBackedFilmHistoryProfiles = {\n",
              "const sourceBackedFilmHistoryProfiles = {\n  [fantomasFilmHistoryProfile.scenarioId]: fantomasFilmHistoryProfile,\n",
          )

          production_audit = "scripts/production-case-rest-audit.mjs"
          replace_once(production_audit, "const EXPECTED_PLAYABLE_SCENARIOS = 394;\n", "const EXPECTED_PLAYABLE_SCENARIOS = 395;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 388;\n")
          replace_once(
              production_audit,
              '  "chapterFourIndustryExpansion.ts",\n',
              '  "chapterFourIndustryExpansion.ts",\n  "chapterFiveInternationalExpansion.ts",\n',
          )
          replace_once(
              production_audit,
              "    expectedPlayableScenarios: EXPECTED_PLAYABLE_SCENARIOS,\n",
              "    expectedPlayableScenarios: EXPECTED_PLAYABLE_SCENARIOS,\n    expectedVerifiedProductionCases: EXPECTED_VERIFIED_PRODUCTION_CASES,\n",
          )
          replace_once(
              production_audit,
              "  ...(scenarios.length === EXPECTED_PLAYABLE_SCENARIOS ? [] : [`catalog_count:${scenarios.length}`]),\n",
              "  ...(scenarios.length === EXPECTED_PLAYABLE_SCENARIOS ? [] : [`catalog_count:${scenarios.length}`]),\n  ...(verificationIds.length === EXPECTED_VERIFIED_PRODUCTION_CASES ? [] : [`verification_count:${verificationIds.length}`]),\n",
          )
          replace_once(production_audit, '  auditDate: "2026-08-14",\n', '  auditDate: "2026-08-15",\n')

          chapter_five_audit = "scripts/film-history-chapter-five-atlas-audit.mjs"
          replace_once(chapter_five_audit, "const EXPECTED_ATLAS_COUNT = 394;\n", "const EXPECTED_ATLAS_COUNT = 395;\n")
          replace_once(
              chapter_five_audit,
              '  "chapterFourIndustryExpansion.ts",\n',
              '  "chapterFourIndustryExpansion.ts",\n  "chapterFiveInternationalExpansion.ts",\n',
          )
          replace_once(
              chapter_five_audit,
              '  USE_EXISTING: ["Queen Elizabeth", "Traffic in Souls"],\n  P0: ["Cabiria", "Fantômas"],\n',
              '  USE_EXISTING: ["Fantômas", "Queen Elizabeth", "Traffic in Souls"],\n  P0: ["Cabiria"],\n',
          )
          replace_once(chapter_five_audit, '  auditDate: "2026-08-14",\n', '  auditDate: "2026-08-15",\n')
          PY

          rm .github/workflows/fantomas-finalize.yml

      - name: Commit completion patch and restore workflow set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Fantomas runtime and audit gates"
          git push origin HEAD:agent/fantomas-1913

      - name: Verify committed branch
        run: npm ci && npm run verify:v0.1
