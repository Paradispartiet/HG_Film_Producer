name: Diagnose Film History Chapter 9 Atlas

on:
  push:
    branches:
      - agent/film-history-chapter-nine-atlas-audit
    paths:
      - .github/workflows/film-history-chapter-nine-atlas-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-history-chapter-nine-atlas-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan canonical 410-film Atlas
        run: node scripts/diagnose-film-history-chapter-nine-atlas.mjs
      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/film-history-chapter-nine-atlas-diagnostic.json
          git commit -m "Record Chapter 9 Atlas diagnostic"
          git push origin HEAD:agent/film-history-chapter-nine-atlas-audit
