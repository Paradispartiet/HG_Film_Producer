name: TEMP Chapter 19 Wolfwalkers log extract

on:
  push:
    branches:
      - agent/ch19-wolfwalkers-production-case
    paths:
      - .github/workflows/TEMP-ch19-wolfwalkers-log-extract.yml

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-wolfwalkers-production-case
          fetch-depth: 0

      - name: Extract failed verify log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run view 33259099722 \
            --repo Paradispartiet/HG_Film_Producer \
            --job 99117855062 \
            --log > TEMP-wolfwalkers-verify-failure.log 2>&1
          status=$?
          if [ "$status" -ne 0 ] || [ ! -s TEMP-wolfwalkers-verify-failure.log ]; then
            echo "gh run view failed with status $status; falling back to gh api" > TEMP-wolfwalkers-verify-failure.log
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/Paradispartiet/HG_Film_Producer/actions/jobs/99117855062/logs \
              >> TEMP-wolfwalkers-verify-failure.log 2>&1
          fi
          test -s TEMP-wolfwalkers-verify-failure.log

      - name: Persist TEMP diagnostic only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEMP-wolfwalkers-verify-failure.log
          git commit --no-verify -m "Capture Wolfwalkers verify log"
          git push origin HEAD:agent/ch19-wolfwalkers-production-case
