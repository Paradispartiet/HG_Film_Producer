name: TEMP Chapter 19 Wolfwalkers log extract

on:
  push:
    branches:
      - agent/ch19-wolfwalkers-production-case
    paths:
      - .github/workflows/TEMP-ch19-wolfwalkers-log-extract.yml

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-wolfwalkers-production-case
          fetch-depth: 0

      - name: Extract focused verify failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run view 33259099722 \
            --repo Paradispartiet/HG_Film_Producer \
            --job 99117855062 \
            --log > /tmp/wolfwalkers-full-verify.txt 2>&1
          {
            echo "=== focused failure markers ==="
            grep -nEi -C 18 '(AssertionError|ERR_ASSERTION|not ok|Error:|npm error|npm ERR|failed|failure|must contain|must preserve|drifted|expected.*actual|actual.*expected|exit code)' /tmp/wolfwalkers-full-verify.txt | tail -n 900 || true
            echo "=== final 700 lines ==="
            tail -n 700 /tmp/wolfwalkers-full-verify.txt
          } > TEMP-wolfwalkers-verify-failure.txt
          test -s TEMP-wolfwalkers-verify-failure.txt

      - name: Persist focused TEMP diagnostic only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEMP-wolfwalkers-verify-failure.txt
          git commit --no-verify -m "Reduce Wolfwalkers verify log"
          git push origin HEAD:agent/ch19-wolfwalkers-production-case
