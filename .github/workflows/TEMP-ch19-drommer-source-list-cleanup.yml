name: TEMP Drømmer source list cleanup

on:
  push:
    branches:
      - agent/ch19-drommer-production-case

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Register Drømmer source list metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ui/data/filmScenarios.ts')
          text = path.read_text()
          before = 'manual_chapter_nineteen_sound_of_falling_expansion_2026+manual_chapter_nineteen_eo_expansion_2026'
          after = 'manual_chapter_nineteen_sound_of_falling_expansion_2026+manual_chapter_nineteen_drommer_expansion_2026+manual_chapter_nineteen_eo_expansion_2026'
          if text.count(before) != 1:
              raise SystemExit(f'expected exactly one source_list_id marker, found {text.count(before)}')
          path.write_text(text.replace(before, after, 1))
          PY
          grep -F 'manual_chapter_nineteen_drommer_expansion_2026' src/ui/data/filmScenarios.ts

      - name: Full v0.1 verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee /tmp/drommer-source-list-verify.log

      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drommer-source-list-diagnostics
          path: /tmp/drommer-source-list-verify.log

      - name: Commit clean metadata correction
        if: success()
        shell: bash
        run: |
          rm .github/workflows/TEMP-ch19-drommer-source-list-cleanup.yml
          test ! -e .github/workflows/TEMP-ch19-drommer-source-list-cleanup.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register Drømmer scenario source metadata"
          git push origin HEAD:agent/ch19-drommer-production-case
