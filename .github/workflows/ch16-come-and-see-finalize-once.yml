name: TEMP Finalize Come and See Chapter 16

on:
  push:
    branches:
      - agent/ch16-come-and-see-production-case

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ch16-come-and-see-production-case
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize Come and See permanently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = "src/ui/data/filmScenarios.ts"
          text = read(path)
          text = replace_once(text,
              'import { mergeChapterSixteenTerminatorExpansion } from "../../core/chapterSixteenTerminatorExpansion.js";\n',
              'import { mergeChapterSixteenTerminatorExpansion } from "../../core/chapterSixteenTerminatorExpansion.js";\nimport { mergeChapterSixteenComeAndSeeExpansion } from "../../core/chapterSixteenComeAndSeeExpansion.js";\n',
              "filmScenarios import")
          text = replace_once(text,
              'const chapterSixteenTerminatorScenarios = mergeChapterSixteenTerminatorExpansion(chapterSixteenSugarCaneAlleyScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenTerminatorScenarios);',
              'const chapterSixteenTerminatorScenarios = mergeChapterSixteenTerminatorExpansion(chapterSixteenSugarCaneAlleyScenarios);\nconst chapterSixteenComeAndSeeScenarios = mergeChapterSixteenComeAndSeeExpansion(chapterSixteenTerminatorScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixteenComeAndSeeScenarios);',
              "filmScenarios chain")
          text = replace_once(text,
              '+manual_chapter_sixteen_terminator_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_sixteen_terminator_expansion_2026+manual_chapter_sixteen_come_and_see_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              "filmScenarios source list")
          write(path, text)

          path = "src/ui/data/scenarioFilmStudyMap.ts"
          text = read(path)
          text = replace_once(text,
              'import { terminatorFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenTerminator";\n',
              'import { terminatorFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenTerminator";\nimport { comeAndSeeFilmHistoryProfile } from "./scenarioFilmStudyChapterSixteenComeAndSee";\n',
              "Film Study import")
          text = replace_once(text,
              '  [terminatorFilmHistoryProfile.scenarioId]: terminatorFilmHistoryProfile,\n',
              '  [terminatorFilmHistoryProfile.scenarioId]: terminatorFilmHistoryProfile,\n  [comeAndSeeFilmHistoryProfile.scenarioId]: comeAndSeeFilmHistoryProfile,\n',
              "Film Study map")
          write(path, text)

          path = "src/ui/data/scenarioProductionVerificationRegistry.ts"
          text = read(path)
          text = replace_once(text,
              'import { terminatorProductionCaseVerification } from "./scenarioProductionVerificationTerminator";\n',
              'import { terminatorProductionCaseVerification } from "./scenarioProductionVerificationTerminator";\nimport { comeAndSeeProductionCaseVerification } from "./scenarioProductionVerificationComeAndSee";\n',
              "verification import")
          text = replace_once(text,
              '  terminatorProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
              '  terminatorProductionCaseVerification,\n  comeAndSeeProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
              "verification registry")
          write(path, text)

          atlas_scripts = [
              "scripts/film-history-chapter-twelve-atlas-audit.mjs",
              "scripts/film-history-chapter-thirteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fourteen-atlas-audit.mjs",
              "scripts/film-history-chapter-fifteen-atlas-audit.mjs",
              "scripts/film-history-chapter-sixteen-atlas-audit.mjs",
          ]
          for path in atlas_scripts:
              text = read(path)
              text = replace_once(text, "const EXPECTED_ATLAS_COUNT = 461;", "const EXPECTED_ATLAS_COUNT = 462;", f"{path} count")
              text = replace_once(text,
                  '  "chapterSixteenTerminatorExpansion.ts",\n',
                  '  "chapterSixteenTerminatorExpansion.ts",\n  "chapterSixteenComeAndSeeExpansion.ts",\n',
                  f"{path} expansion")
              write(path, text)

          path = "scripts/production-case-rest-audit.mjs"
          text = read(path)
          text = replace_once(text, "const EXPECTED_PLAYABLE_SCENARIOS = 461;", "const EXPECTED_PLAYABLE_SCENARIOS = 462;", "production playable")
          text = replace_once(text, "const EXPECTED_VERIFIED_PRODUCTION_CASES = 461;", "const EXPECTED_VERIFIED_PRODUCTION_CASES = 462;", "production verified")
          text = replace_once(text,
              '  "chapterSixteenTerminatorExpansion.ts",\n',
              '  "chapterSixteenTerminatorExpansion.ts",\n  "chapterSixteenComeAndSeeExpansion.ts",\n',
              "production expansion")
          write(path, text)

          for path in [
              "src/core/filmHistoryChapterTwelveAuditContract.test.ts",
              "src/core/filmHistoryChapterThirteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFourteenAuditContract.test.ts",
              "src/core/filmHistoryChapterFifteenAuditContract.test.ts",
          ]:
              text = read(path)
              if text.count("461") < 3:
                  raise SystemExit(f"{path}: missing 461 count locks")
              write(path, text.replace("461", "462"))

          path = "src/core/filmHistoryChapterSixteenAuditContract.test.ts"
          text = read(path)
          if text.count("461") < 4:
              raise SystemExit("Chapter 16 contract missing 461 count locks")
          text = text.replace("461", "462")
          text = replace_once(text,
              '  "The Terminator",\n  "Tampopo",',
              '  "The Terminator",\n  "Come and See",\n  "Tampopo",',
              "Chapter 16 existing")
          text = replace_once(text,
              'const exactP1Queue = [\n  "Come and See",\n',
              'const exactP1Queue = [\n',
              "Chapter 16 P1")
          text = replace_once(text,
              '    "Come and See",\n',
              '',
              "Chapter 16 recommended")
          text = replace_once(text,
              '    "The Terminator": "scenario_the_terminator_1984",\n    "Tampopo":',
              '    "The Terminator": "scenario_the_terminator_1984",\n    "Come and See": "scenario_come_and_see_1985",\n    "Tampopo":',
              "Chapter 16 exact ID")
          text = replace_once(text,
              '  for (const title of ["Come and See"]) {\n',
              '  for (const title of exactP1Queue) {\n',
              "Chapter 16 authority gaps")
          write(path, text)
          PY

      - name: Regenerate Chapter 12-16 Atlas reports
        shell: bash
        run: |
          set -euo pipefail
          node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json
          node scripts/film-history-chapter-thirteen-atlas-audit.mjs --write=docs/film-history-chapter-thirteen-atlas-resolved.json
          node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json
          node scripts/film-history-chapter-fifteen-atlas-audit.mjs --write=docs/film-history-chapter-fifteen-atlas-resolved.json
          node scripts/film-history-chapter-sixteen-atlas-audit.mjs --write=docs/film-history-chapter-sixteen-atlas-resolved.json

      - name: Assert canonical Come and See result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('docs/film-history-chapter-sixteen-atlas-resolved.json', 'utf8'));
          if (report.atlas.expectedCount !== 462 || report.atlas.actualCount !== 462) throw new Error(`Atlas ${report.atlas.expectedCount}/${report.atlas.actualCount}`);
          if (report.verificationIndex.literalVerifiedScenarioIds !== 462) throw new Error(`Verification ${report.verificationIndex.literalVerifiedScenarioIds}`);
          const film = report.candidates.find((item) => item.title === 'Come and See');
          if (!film || film.decision !== 'USE_EXISTING' || film.scenarioId !== 'scenario_come_and_see_1985' || film.productionVerified !== true) throw new Error(`Come and See ${JSON.stringify(film)}`);
          if (report.byDecision.P0.length !== 0) throw new Error(`P0 ${JSON.stringify(report.byDecision.P0)}`);
          const p1 = ['Back to the Future','Aliens',"She's Gotta Have It",'A Better Tomorrow','RoboCop','Salaam Bombay!'];
          if (JSON.stringify(report.byDecision.P1) !== JSON.stringify(p1)) throw new Error(`P1 ${JSON.stringify(report.byDecision.P1)}`);
          NODE

      - name: Commit permanent state and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ch16-come-and-see-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/film-history-chapter-twelve-atlas-resolved.json \
            docs/film-history-chapter-thirteen-atlas-resolved.json \
            docs/film-history-chapter-fourteen-atlas-resolved.json \
            docs/film-history-chapter-fifteen-atlas-resolved.json \
            docs/film-history-chapter-sixteen-atlas-resolved.json \
            scripts/film-history-chapter-twelve-atlas-audit.mjs \
            scripts/film-history-chapter-thirteen-atlas-audit.mjs \
            scripts/film-history-chapter-fourteen-atlas-audit.mjs \
            scripts/film-history-chapter-fifteen-atlas-audit.mjs \
            scripts/film-history-chapter-sixteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterTwelveAuditContract.test.ts \
            src/core/filmHistoryChapterThirteenAuditContract.test.ts \
            src/core/filmHistoryChapterFourteenAuditContract.test.ts \
            src/core/filmHistoryChapterFifteenAuditContract.test.ts \
            src/core/filmHistoryChapterSixteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          git diff --cached --check
          git commit -m "Materialize Come and See Chapter 16 Production Case"
          git push origin HEAD:agent/ch16-come-and-see-production-case
