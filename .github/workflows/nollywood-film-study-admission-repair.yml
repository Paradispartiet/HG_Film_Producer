name: Diagnose Nollywood unit test failure

on:
  push:
    branches:
      - agent/nollywood-representation-admission-run-20260911

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Materialize exact Living in Bondage admission
        shell: bash
        run: |
          python3 .github/scripts/repair_nollywood_film_study_admission.py
          test "$(grep -c '^const EXPECTED_ATLAS_COUNT = 613;$' scripts/film-history-chapter-nineteen-atlas-audit.mjs)" -eq 1
          sed -i 's/^const EXPECTED_ATLAS_COUNT = 613;$/const EXPECTED_ATLAS_COUNT = 614;/' scripts/film-history-chapter-nineteen-atlas-audit.mjs
          test "$(grep -c '^const EXPECTED_ATLAS_COUNT = 614;$' scripts/film-history-chapter-nineteen-atlas-audit.mjs)" -eq 1
      - name: Apply candidate Chapter 19 live-census contract fix
        shell: bash
        run: |
          test "$(grep -c 'assert.match(audit, /const EXPECTED_ATLAS_COUNT = 613;/);' src/core/filmHistoryChapterNineteenAuditContract.test.ts)" -eq 1
          test "$(grep -c 'assert.equal(resolved.atlas.expectedCount, 613);' src/core/filmHistoryChapterNineteenAuditContract.test.ts)" -eq 1
          test "$(grep -c 'assert.equal(resolved.atlas.actualCount, 613);' src/core/filmHistoryChapterNineteenAuditContract.test.ts)" -eq 1
          test "$(grep -c 'assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 613);' src/core/filmHistoryChapterNineteenAuditContract.test.ts)" -eq 1
          sed -i \
            -e 's@assert.match(audit, /const EXPECTED_ATLAS_COUNT = 613;/);@assert.match(audit, /const EXPECTED_ATLAS_COUNT = 614;/);@' \
            -e 's/assert.equal(resolved.atlas.expectedCount, 613);/assert.equal(resolved.atlas.expectedCount, 614);/' \
            -e 's/assert.equal(resolved.atlas.actualCount, 613);/assert.equal(resolved.atlas.actualCount, 614);/' \
            -e 's/assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 613);/assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 614);/' \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts
      - name: Diagnose first failing unit test
        shell: bash
        run: |
          set -o pipefail
          npm run build
          mkdir -p diagnostics
          for test_file in dist/core/*.test.js; do
            tmp_log="$(mktemp)"
            if node --test "$test_file" >"$tmp_log" 2>&1; then
              echo "PASS $test_file"
            else
              {
                echo "FAIL_TEST_FILE=$test_file"
                echo "--- failure tail ---"
                tail -n 100 "$tmp_log"
              } | tee diagnostics/nollywood-unit-test-failure.txt
              rm -f "$tmp_log"
              exit 1
            fi
            rm -f "$tmp_log"
          done
      - name: Upload unit test failure diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: nollywood-unit-test-failure
          path: diagnostics/nollywood-unit-test-failure.txt
          if-no-files-found: error
