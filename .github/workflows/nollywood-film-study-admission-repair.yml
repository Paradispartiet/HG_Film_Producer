name: Repair Nollywood admission Film Study gate

on:
  push:
    branches:
      - agent/nollywood-representation-admission-run-20260911

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admission workflow
        run: python3 .github/scripts/repair_nollywood_film_study_admission.py
      - name: Commit repair and remove helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/nollywood-film-study-admission-repair.yml
          git rm .github/scripts/repair_nollywood_film_study_admission.py
          git add .github/workflows/nollywood-representation-admission.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'Repair Nollywood admission Film Study gate [film-study repair]'
          git push origin HEAD:agent/nollywood-representation-admission-run-20260911
