name: Materialize verified Nollywood admission

on:
  push:
    branches:
      - agent/nollywood-representation-admission-run-20260911

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[nollywood materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Materialize exact Living in Bondage admission
        shell: bash
        run: |
          python3 .github/scripts/repair_nollywood_film_study_admission.py
          test "$(grep -c '^const EXPECTED_ATLAS_COUNT = 613;$' scripts/film-history-chapter-nineteen-atlas-audit.mjs)" -eq 1
          sed -i 's/^const EXPECTED_ATLAS_COUNT = 613;$/const EXPECTED_ATLAS_COUNT = 614;/' scripts/film-history-chapter-nineteen-atlas-audit.mjs
          test "$(grep -c '^const EXPECTED_ATLAS_COUNT = 614;$' scripts/film-history-chapter-nineteen-atlas-audit.mjs)" -eq 1
      - name: Verify representation closure
        shell: bash
        run: |
          mkdir -p .tmp
          node scripts/film-history-representation-coverage-audit-v1.mjs --write=.tmp/representation-closure.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('.tmp/representation-closure.json', 'utf8'));
          if (r.status !== 'PASS_REPRESENTATIONALLY_AUDITED') throw new Error(`Unexpected status ${r.status}`);
          if (r.core.expected !== 614 || r.core.runtimeAtlasScenarios !== 614 || r.core.uniqueProductionVerificationIds !== 614 || !r.core.exactSetEquality) throw new Error('614/614 core not exact');
          if (r.mapping.reviewedScenarioIds !== 614 || r.mapping.mappedScenarioIds !== 233 || r.mapping.reviewedNoMappingScenarioIds !== 381 || r.mapping.unmappedScenarioIds !== 0) throw new Error(`Unexpected closure mapping ${JSON.stringify(r.mapping)}`);
          if (r.coverage.p0OpenRows !== 0 || r.representationalClosure !== true) throw new Error(`Representation closure not achieved ${JSON.stringify(r.coverage)}`);
          console.log(JSON.stringify(r, null, 2));
          NODE
      - name: Verify preflight v0.1
        run: npm run preflight:v0.1
      - name: Verify production cases
        run: npm run audit:production-cases
      - name: Verify Film History chapter 1
        run: npm run audit:film-history-ch1
      - name: Verify Film History chapter 2
        run: npm run audit:film-history-ch2
      - name: Verify Film History chapter 3
        run: npm run audit:film-history-ch3
      - name: Verify Film History chapter 4
        run: npm run audit:film-history-ch4
      - name: Verify Film History chapter 5
        run: npm run audit:film-history-ch5
      - name: Verify Film History chapter 6
        run: npm run audit:film-history-ch6
      - name: Verify Film History chapter 7
        run: npm run audit:film-history-ch7
      - name: Verify Film History chapter 8
        run: npm run audit:film-history-ch8
      - name: Verify Film History chapter 9
        run: npm run audit:film-history-ch9
      - name: Verify Film History chapter 10
        run: npm run audit:film-history-ch10
      - name: Verify Film History chapter 11
        run: npm run audit:film-history-ch11
      - name: Verify Film History chapter 12
        run: npm run audit:film-history-ch12
      - name: Verify Film History chapter 13
        run: npm run audit:film-history-ch13
      - name: Verify Film History chapter 14
        run: npm run audit:film-history-ch14
      - name: Verify Film History chapter 15
        run: npm run audit:film-history-ch15
      - name: Verify Film History chapter 16
        run: npm run audit:film-history-ch16
      - name: Verify Film History chapter 17
        run: npm run audit:film-history-ch17
      - name: Verify Film History chapter 18
        run: npm run audit:film-history-ch18
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify Film History chapter 18 completion
        run: npm run audit:film-history-ch18-completion
      - name: Verify Film History chapter 19
        run: npm run audit:film-history-ch19
      - name: Verify unit tests
        shell: bash
        run: |
          npm run build
          for f in dist/core/*.test.js; do
            echo "=== UNIT_TEST_FILE: $f ==="
            node --test "$f" || exit $?
          done
      - name: Verify Chapter 19 festival awards
        run: npm run audit:film-history-ch19-festival-awards
      - name: Verify Chapter 19 Cannes major prizes
        run: npm run audit:film-history-ch19-cannes-major-prizes
      - name: Verify UI build
        run: npm run build:ui
      - name: Commit only verified production admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/core/nollywoodLivingInBondageExpansion.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioProductionVerification.ts \
            src/ui/data/scenarioProductionVerificationLivingInBondage.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts \
            src/ui/data/scenarioFilmStudyRepresentationLivingInBondage.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            scripts/film-history-representation-coverage-audit-v1.mjs \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            data/film/film_history_representation_coverage_v1.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 11
          git commit -m 'Close film-history representation audit with Nollywood admission [nollywood materialized]'
          git push origin HEAD:agent/nollywood-representation-admission-run-20260911
