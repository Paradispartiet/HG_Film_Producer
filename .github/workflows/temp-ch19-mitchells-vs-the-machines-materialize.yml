name: TEMP Chapter 19 Mitchells vs the Machines materialize

on:
  push:
    branches:
      - agent/ch19-mitchells-vs-the-machines-production-case
    paths:
      - .github/workflows/temp-ch19-mitchells-vs-the-machines-materialize.yml
      - scripts/temp-materialize-mitchells-vs-the-machines.mjs

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-mitchells-vs-the-machines-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic canonical patch
        run: node scripts/temp-materialize-mitchells-vs-the-machines.mjs

      - name: Remove Mitchells TEMP artifacts before full verification
        shell: bash
        run: |
          set -euxo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/temp-ch19-mitchells-vs-the-machines-materialize.yml \
            .github/workflows/temp-ch19-mitchells-vs-the-machines-source-first.yml \
            scripts/temp-materialize-mitchells-vs-the-machines.mjs
          test ! -e .github/workflows/temp-ch19-mitchells-vs-the-machines-materialize.yml
          test ! -e .github/workflows/temp-ch19-mitchells-vs-the-machines-source-first.yml
          test ! -e scripts/temp-materialize-mitchells-vs-the-machines.mjs
          if find .github/workflows scripts -maxdepth 1 -type f -iname '*temp*mitchell*' -print | grep -q .; then
            echo "Mitchells TEMP artifacts still exist after cleanup" >&2
            find .github/workflows scripts -maxdepth 1 -type f -iname '*temp*mitchell*' -print >&2
            exit 1
          fi
          git status --short

      - name: Generate Chapter 19 resolved state
        run: node scripts/film-history-chapter-nineteen-atlas-audit.mjs --write=docs/film-history-chapter-nineteen-atlas-resolved.json > /tmp/mitchells-ch19-resolved.json

      - name: Full fail-closed verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee verify-v0.1-output.txt

      - name: Verify post-gate canonical snapshot
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const r = JSON.parse(readFileSync("docs/film-history-chapter-nineteen-atlas-resolved.json", "utf8"));
          const film = r.candidates.find((x) => x.title === "The Mitchells vs. the Machines");
          if (r.atlas.actualCount !== 590 || r.atlas.expectedCount !== 590) throw new Error(`Atlas is not 590/590: ${r.atlas.actualCount}/${r.atlas.expectedCount}`);
          if (r.verificationIndex.literalVerifiedScenarioIds !== 590) throw new Error(`Production Verification count is ${r.verificationIndex.literalVerifiedScenarioIds}`);
          if (!film || film.decision !== "USE_EXISTING" || film.scenarioId !== "scenario_the_mitchells_vs_the_machines_2021" || film.matches !== 1 || film.productionVerified !== true) throw new Error(`Mitchells state invalid: ${JSON.stringify(film)}`);
          if (r.byDecision.USE_EXISTING.length !== 58 || r.byDecision.P0.length !== 0 || r.byDecision.P1.length !== 0 || r.byDecision.P2.length !== 2 || r.byDecision.EXISTING_REQUIRED.length !== 0) throw new Error(`Queue census invalid: ${JSON.stringify(Object.fromEntries(Object.entries(r.byDecision).map(([k,v]) => [k,v.length])))}`);
          if (JSON.stringify(r.byDecision.P0) !== JSON.stringify([])) throw new Error(`P0 queue invalid: ${JSON.stringify(r.byDecision.P0)}`);
          if (JSON.stringify(r.byDecision.P1) !== JSON.stringify([])) throw new Error(`P1 queue invalid: ${JSON.stringify(r.byDecision.P1)}`);
          if (JSON.stringify(r.byDecision.P2) !== JSON.stringify(["Days", "The Green Knight"])) throw new Error(`P2 queue invalid: ${JSON.stringify(r.byDecision.P2)}`);
          if (JSON.stringify(r.recommendedNewProductionCases) !== JSON.stringify([])) throw new Error(`Recommended production cases drifted: ${JSON.stringify(r.recommendedNewProductionCases)}`);
          if (r.productionStrategy.nextRecommendedCase !== null || r.productionStrategy.nextRecommendedLane !== null || JSON.stringify(r.productionStrategy.remainingSequence) !== JSON.stringify([])) throw new Error(`Balanced scheduler must be exhausted: ${JSON.stringify(r.productionStrategy)}`);
          console.log(JSON.stringify({atlas:r.atlas.actualCount,verified:r.verificationIndex.literalVerifiedScenarioIds,film,queue:Object.fromEntries(Object.entries(r.byDecision).map(([k,v])=>[k,v.length])),recommended:r.recommendedNewProductionCases,balancedScheduler:r.productionStrategy.nextRecommendedCase},null,2));
          NODE

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mitchells-materialization-diagnostics
          path: |
            verify-v0.1-output.txt
            /tmp/mitchells-ch19-resolved.json
          if-no-files-found: ignore

      - name: Commit verified canonical state and TEMP cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add \
            docs/film-history-chapter-nineteen-atlas-resolved.json \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Materialize The Mitchells vs. the Machines Chapter 19 production case"
          git push origin HEAD:agent/ch19-mitchells-vs-the-machines-production-case
