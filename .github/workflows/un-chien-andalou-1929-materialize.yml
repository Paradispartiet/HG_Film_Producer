name: Materialize Un Chien Andalou 1929 production case

on:
  push:
    branches:
      - agent/ch8-un-chien-andalou-1929
    paths:
      - .github/workflows/un-chien-andalou-1929-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch8-un-chien-andalou-1929
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate reviewed Un Chien Andalou case
        run: python3 scripts/materialize-un-chien-andalou-1929.py
      - name: Full v0.1 verification
        run: npm run verify:v0.1
      - name: Commit verified materialization and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/un-chien-andalou-1929-materialize.yml
          rm scripts/materialize-un-chien-andalou-1929.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Un Chien Andalou 1929 production case"
          git push origin HEAD:agent/ch8-un-chien-andalou-1929
