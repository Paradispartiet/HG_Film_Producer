name: TEMP Chapter 19 All Quiet on the Western Front materialize

on:
  push:
    branches:
      - agent/ch19-all-quiet-on-the-western-front-production-case
    paths:
      - .github/workflows/temp-ch19-all-quiet-on-the-western-front-materialize.yml
      - scripts/temp-materialize-all-quiet-on-the-western-front.mjs

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-all-quiet-on-the-western-front-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic canonical patch
        run: node scripts/temp-materialize-all-quiet-on-the-western-front.mjs

      - name: Remove All Quiet TEMP artifacts before full verification
        shell: bash
        run: |
          set -euxo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/temp-ch19-all-quiet-on-the-western-front-materialize.yml \
            .github/workflows/temp-ch19-all-quiet-on-the-western-front-source-first.yml \
            scripts/temp-materialize-all-quiet-on-the-western-front.mjs
          test ! -e .github/workflows/temp-ch19-all-quiet-on-the-western-front-materialize.yml
          test ! -e .github/workflows/temp-ch19-all-quiet-on-the-western-front-source-first.yml
          test ! -e scripts/temp-materialize-all-quiet-on-the-western-front.mjs
          if find .github/workflows scripts -maxdepth 1 -type f -iname '*temp*all*quiet*western*front*' -print | grep -q .; then
            echo "All Quiet TEMP artifacts still exist after cleanup" >&2
            find .github/workflows scripts -maxdepth 1 -type f -iname '*temp*all*quiet*western*front*' -print >&2
            exit 1
          fi
          git status --short

      - name: Generate Chapter 19 resolved state
        run: node scripts/film-history-chapter-nineteen-atlas-audit.mjs --write=docs/film-history-chapter-nineteen-atlas-resolved.json > /tmp/all-quiet-ch19-resolved.json

      - name: Full fail-closed verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee verify-v0.1-output.txt

      - name: Verify post-gate canonical snapshot
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const r = JSON.parse(readFileSync("docs/film-history-chapter-nineteen-atlas-resolved.json", "utf8"));
          const film = r.candidates.find((x) => x.title === "All Quiet on the Western Front");
          if (r.atlas.actualCount !== 573 || r.atlas.expectedCount !== 573) throw new Error(`Atlas is not 573/573: ${r.atlas.actualCount}/${r.atlas.expectedCount}`);
          if (r.verificationIndex.literalVerifiedScenarioIds !== 573) throw new Error(`Production Verification count is ${r.verificationIndex.literalVerifiedScenarioIds}`);
          if (!film || film.decision !== "USE_EXISTING" || film.scenarioId !== "scenario_all_quiet_on_the_western_front_2022" || film.matches !== 1 || film.productionVerified !== true) throw new Error(`All Quiet state invalid: ${JSON.stringify(film)}`);
          if (r.byDecision.USE_EXISTING.length !== 41 || r.byDecision.P0.length !== 5 || r.byDecision.P1.length !== 10 || r.byDecision.P2.length !== 4 || r.byDecision.EXISTING_REQUIRED.length !== 0) throw new Error(`Queue census invalid: ${JSON.stringify(Object.fromEntries(Object.entries(r.byDecision).map(([k,v]) => [k,v.length])))}`);
          if (r.recommendedNewProductionCases.length !== 15) throw new Error(`Recommended production case count is ${r.recommendedNewProductionCases.length}`);
          if (r.productionStrategy.nextRecommendedCase !== "The Boy and the Heron" || r.productionStrategy.nextRecommendedLane !== "regional_global") throw new Error(`Balanced scheduler drifted unexpectedly: ${JSON.stringify(r.productionStrategy)}`);
          console.log(JSON.stringify({atlas: r.atlas.actualCount, verified: r.verificationIndex.literalVerifiedScenarioIds, film, queue: Object.fromEntries(Object.entries(r.byDecision).map(([k,v]) => [k,v.length])), balancedScheduler: r.productionStrategy.nextRecommendedCase}, null, 2));
          NODE

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: all-quiet-materialization-diagnostics
          path: |
            verify-v0.1-output.txt
            /tmp/all-quiet-ch19-resolved.json
          if-no-files-found: ignore

      - name: Commit verified canonical state and TEMP cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add \
            docs/film-history-chapter-nineteen-atlas-resolved.json \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/production-case-rest-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Materialize All Quiet on the Western Front Chapter 19 production case"
          git push origin HEAD:agent/ch19-all-quiet-on-the-western-front-production-case
