name: TEMP A Hero materialize

on:
  push:
    branches:
      - agent/ch19-a-hero-production-case

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize A Hero
        run: node scripts/TEMP-run-ch19-a-hero-materializer-v2.mjs

      - name: Stage clean verification tree
        run: |
          rm scripts/TEMP-materialize-ch19-a-hero.mjs
          rm scripts/TEMP-run-ch19-a-hero-materializer-v2.mjs
          rm .github/workflows/TEMP-ch19-a-hero-materialize.yml

      - name: Full v0.1 verification
        run: npm run verify:v0.1

      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a-hero-verification-diagnostics
          path: |
            docs/film-history-chapter-nineteen-atlas-resolved.json
            docs/film-history-chapter-nineteen-cannes-major-prizes-audit.json
          if-no-files-found: ignore

      - name: Commit clean A Hero case
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add A Hero Chapter 19 production case'
          git push origin HEAD:agent/ch19-a-hero-production-case
