name: TEMP Ahed's Knee materialize

on:
  push:
    branches:
      - agent/ch19-aheds-knee-production-case

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize TEMP materializer quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/TEMP-materialize-ch19-aheds-knee.mjs")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          out = []
          for line in lines:
              if "const ahedsKneeNeedles =" not in line:
                  line = line.replace(r"Ahed\\'s", r"Ahed\'s")
              out.append(line)
          p.write_text("".join(out), encoding="utf-8")
          PY
          node --check scripts/TEMP-materialize-ch19-aheds-knee.mjs

      - name: Materialize Ahed's Knee
        run: node scripts/TEMP-materialize-ch19-aheds-knee.mjs

      - name: Stage clean verification tree
        run: |
          rm scripts/TEMP-materialize-ch19-aheds-knee.mjs
          rm .github/workflows/TEMP-ch19-aheds-knee-materialize.yml

      - name: Full v0.1 verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee aheds-knee-verify.log

      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aheds-knee-verification-diagnostics
          path: |
            aheds-knee-verify.log
            docs/film-history-chapter-nineteen-atlas-resolved.json
            docs/film-history-chapter-nineteen-cannes-major-prizes-audit.json
          if-no-files-found: ignore

      - name: Commit clean Ahed's Knee case
        if: success()
        run: |
          rm -f aheds-knee-verify.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "Add Ahed's Knee Chapter 19 production case"
          git push origin HEAD:agent/ch19-aheds-knee-production-case
