name: TEMP Chapter 19 Furiosa source-first

on:
  push:
    branches:
      - agent/ch19-furiosa-production-case
    paths:
      - .github/workflows/temp-ch19-furiosa-source-first.yml
      - src/core/chapterNineteenFuriosaExpansion.ts
      - src/core/chapterNineteenFuriosaExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationFuriosa.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenFuriosa.ts

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-furiosa-production-case
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build core
        run: npm run build
      - name: Strict Furiosa contract
        run: node --test dist/core/chapterNineteenFuriosaExpansion.test.js
      - name: Build UI
        run: npm run build:ui
