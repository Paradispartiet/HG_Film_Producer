name: TEMP Chapter 19 The Secret Agent source-first

on:
  push:
    branches:
      - agent/ch19-the-secret-agent-production-case
    paths:
      - .github/workflows/temp-ch19-the-secret-agent-source-first.yml
      - src/core/chapterNineteenTheSecretAgentExpansion.ts
      - src/core/chapterNineteenTheSecretAgentExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationTheSecretAgent.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenTheSecretAgent.ts

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-the-secret-agent-production-case
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build core
        run: npm run build
      - name: Strict The Secret Agent contract
        run: node --test dist/core/chapterNineteenTheSecretAgentExpansion.test.js
      - name: Build UI
        run: npm run build:ui
