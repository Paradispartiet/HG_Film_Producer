name: TEMP Chapter 19 Wolfwalkers source diagnostic

on:
  push:
    branches:
      - agent/ch19-wolfwalkers-production-case
    paths:
      - .github/workflows/TEMP-ch19-wolfwalkers-diagnostic.yml
      - src/core/chapterNineteenWolfwalkersExpansion.ts
      - src/core/chapterNineteenWolfwalkersExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationWolfwalkers.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenWolfwalkers.ts

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-wolfwalkers-production-case
          fetch-depth: 0
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Typecheck source-first Wolfwalkers files
        run: npm run typecheck
      - name: Build core tests
        run: npm run build
      - name: Run strict Wolfwalkers contract only
        run: node --test dist/core/chapterNineteenWolfwalkersExpansion.test.js
      - name: Build UI from source-first state
        run: npm run build:ui
