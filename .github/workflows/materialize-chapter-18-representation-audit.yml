name: Materialize Chapter 18 representation audit

on:
  push:
    branches:
      - agent/chapter-18-representation-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chapter-18-representation-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize fail-closed Chapter 18 audit
        run: node scripts/materializeChapter18RepresentationAudit.mjs
      - name: Commit permanent Chapter 18 audit only
        run: |
          rm scripts/diagnoseChapter18RepresentationAudit.mjs
          rm .github/workflows/diagnose-chapter-18-representation.yml
          rm scripts/materializeChapter18RepresentationAudit.mjs
          rm .github/workflows/materialize-chapter-18-representation-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/film/film_history_representation_coverage_v1.json scripts/diagnoseChapter18RepresentationAudit.mjs .github/workflows/diagnose-chapter-18-representation.yml scripts/materializeChapter18RepresentationAudit.mjs .github/workflows/materialize-chapter-18-representation-audit.yml
          git commit -m "Audit Chapter 18 representation coverage [chapter18-materialized]"
          git push origin HEAD:agent/chapter-18-representation-audit
