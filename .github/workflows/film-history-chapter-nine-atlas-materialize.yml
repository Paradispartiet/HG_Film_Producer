name: Materialize Film History Chapter 9 Atlas audit

on:
  push:
    branches:
      - agent/film-history-chapter-nine-atlas-audit
    paths:
      - .github/workflows/film-history-chapter-nine-atlas-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-history-chapter-nine-atlas-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire Chapter 9 audit into permanent verification chain
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: marker count {text.count(old)} for {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          rep("package.json",
              '    "audit:film-history-ch8": "node scripts/film-history-chapter-eight-atlas-audit.mjs",\n',
              '    "audit:film-history-ch8": "node scripts/film-history-chapter-eight-atlas-audit.mjs",\n    "audit:film-history-ch9": "node scripts/film-history-chapter-nine-atlas-audit.mjs",\n')
          rep("package.json",
              "npm run audit:film-history-ch7 && npm run audit:film-history-ch8 && npm run typecheck",
              "npm run audit:film-history-ch7 && npm run audit:film-history-ch8 && npm run audit:film-history-ch9 && npm run typecheck")
          rep("src/core/filmHistoryChapterEightAuditContract.test.ts",
              'assert.match(packageJson, /npm run audit:film-history-ch7 && npm run audit:film-history-ch8 && npm run typecheck/);',
              'assert.match(packageJson, /npm run audit:film-history-ch7 && npm run audit:film-history-ch8 && npm run audit:film-history-ch9 && npm run typecheck/);')
          rep("src/core/filmHistoryChapterSevenAuditContract.test.ts",
              'assert.match(packageJson, /npm run audit:film-history-ch6 && npm run audit:film-history-ch7 && npm run audit:film-history-ch8 && npm run typecheck/);',
              'assert.match(packageJson, /npm run audit:film-history-ch6 && npm run audit:film-history-ch7 && npm run audit:film-history-ch8 && npm run audit:film-history-ch9 && npm run typecheck/);')
          PY
      - name: Generate canonical Chapter 9 resolved report
        run: node scripts/film-history-chapter-nine-atlas-audit.mjs
      - name: Full v0.1 verification with captured output
        id: verify
        shell: bash
        run: |
          set +e
          npm run verify:v0.1 > verify-output.log 2>&1
          status=$?
          cat verify-output.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist verification failure for diagnosis
        if: steps.verify.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f verify-output.log docs/film-history-chapter-nine-atlas-resolved.json package.json src/core/filmHistoryChapterSevenAuditContract.test.ts src/core/filmHistoryChapterEightAuditContract.test.ts
          git commit -m "Capture Chapter 9 Atlas verification failure"
          git push origin HEAD:agent/film-history-chapter-nine-atlas-audit
          exit 1
      - name: Commit permanent audit and remove temporary diagnostic machinery
        if: steps.verify.outputs.status == '0'
        shell: bash
        run: |
          rm -f verify-output.log
          rm -f .github/workflows/film-history-chapter-nine-atlas-diagnostic.yml
          rm -f .github/workflows/film-history-chapter-nine-atlas-materialize.yml
          rm -f scripts/diagnose-film-history-chapter-nine-atlas.mjs
          rm -f docs/film-history-chapter-nine-atlas-diagnostic.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Film History Chapter 9 Atlas audit"
          git push origin HEAD:agent/film-history-chapter-nine-atlas-audit
