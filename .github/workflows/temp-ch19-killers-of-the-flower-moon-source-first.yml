name: TEMP Chapter 19 Killers of the Flower Moon source-first

on:
  push:
    branches:
      - agent/ch19-killers-of-the-flower-moon-production-case
    paths:
      - .github/workflows/temp-ch19-killers-of-the-flower-moon-source-first.yml
      - src/core/chapterNineteenKillersOfTheFlowerMoonExpansion.ts
      - src/core/chapterNineteenKillersOfTheFlowerMoonExpansion.test.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenKillersOfTheFlowerMoon.ts
      - src/ui/data/scenarioProductionVerificationKillersOfTheFlowerMoon.ts

permissions:
  contents: read

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict Killers contract
        run: node --test dist/core/chapterNineteenKillersOfTheFlowerMoonExpansion.test.js

      - name: Build UI
        run: npm run build:ui
