name: TEMP Chapter 19 Everything Everywhere All at Once source-first

on:
  push:
    branches:
      - agent/ch19-everything-everywhere-all-at-once-production-case
    paths:
      - .github/workflows/temp-ch19-everything-everywhere-all-at-once-source-first.yml
      - src/core/chapterNineteenEverythingEverywhereAllAtOnceExpansion.ts
      - src/core/chapterNineteenEverythingEverywhereAllAtOnceExpansion.test.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenEverythingEverywhereAllAtOnce.ts
      - src/ui/data/scenarioProductionVerificationEverythingEverywhereAllAtOnce.ts

permissions:
  contents: read

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict Everything Everywhere All at Once contract
        run: node --test dist/core/chapterNineteenEverythingEverywhereAllAtOnceExpansion.test.js

      - name: Build UI
        run: npm run build:ui
