name: Materialize Film History Chapter 14 Atlas audit

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: ch14-atlas-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ch14-new-waves-modernism-atlas-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply verified Chapter 14 reconciliation
        run: node scripts/materialize-ch14-atlas-audit-fixes.mjs
      - name: Generate canonical Chapter 14 Atlas report
        run: node scripts/film-history-chapter-fourteen-atlas-audit.mjs --write=docs/film-history-chapter-fourteen-atlas-resolved.json
      - name: Full v0.1 verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee ch14-atlas-audit-verify.log
      - name: Upload failed verification diagnostics
        if: steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ch14-atlas-audit-diagnostics
          path: ch14-atlas-audit-verify.log
      - name: Fail on verification error
        if: steps.verify.outcome == 'failure'
        run: exit 1
      - name: Commit permanent clean Chapter 14 audit
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          rm -f .github/workflows/ch14-atlas-audit-materialize.yml
          rm -f scripts/materialize-ch14-atlas-audit-fixes.mjs
          rm -f ch14-atlas-audit-verify.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated Chapter 14 audit diff to commit"; exit 1; }
          git commit -m "Materialize Film History Chapter 14 Atlas audit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
