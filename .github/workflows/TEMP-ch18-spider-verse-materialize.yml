name: TEMP materialize Chapter 18 Spider-Verse

on:
  push:
    branches: [agent/ch18-spider-verse-production-case]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch18-spider-verse-production-case
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize deterministic integration
        run: node scripts/TEMP-materialize-ch18-spider-verse.mjs

      - name: Full v0.1 verification
        run: npm run verify:v0.1

      - name: Commit materialized permanent state
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/production-case-rest-audit.mjs scripts/film-history-chapter-*-atlas-audit.mjs src/core/filmHistoryChapter*AuditContract.test.ts src/ui/data/filmScenarios.ts src/ui/data/scenarioFilmStudyMap.ts src/ui/data/scenarioProductionVerificationRegistry.ts
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 1
          fi
          git commit -m "Materialize Chapter 18 Spider-Verse integration [materialized]"
          git push origin HEAD:agent/ch18-spider-verse-production-case
