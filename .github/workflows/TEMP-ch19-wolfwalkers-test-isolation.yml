name: TEMP Chapter 19 Wolfwalkers test isolation

on:
  push:
    branches:
      - agent/ch19-wolfwalkers-production-case
    paths:
      - .github/workflows/TEMP-ch19-wolfwalkers-test-isolation.yml

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-wolfwalkers-production-case
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reuse exact Wolfwalkers patch from materializer
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('.github/workflows/TEMP-ch19-wolfwalkers-materialize.yml', 'utf8');
          const startMarker = "          node - <<'NODE'\n";
          const endMarker = "\n          NODE\n";
          const start = text.indexOf(startMarker);
          if (start < 0) throw new Error('materializer patch start marker not found');
          const end = text.indexOf(endMarker, start + startMarker.length);
          if (end < 0) throw new Error('materializer patch end marker not found');
          const body = text.slice(start + startMarker.length, end)
            .split('\n')
            .map((line) => line.startsWith('          ') ? line.slice(10) : line)
            .join('\n');
          fs.writeFileSync('/tmp/wolfwalkers-patch.js', body);
          NODE
          node /tmp/wolfwalkers-patch.js
          node scripts/film-history-chapter-nineteen-atlas-audit.mjs > /tmp/ch19-wolfwalkers.json
          cp /tmp/ch19-wolfwalkers.json docs/film-history-chapter-nineteen-atlas-resolved.json

      - name: Install dependencies
        run: npm ci

      - name: Probe build and test isolation
        run: |
          set +e
          : > TEMP-wolfwalkers-test-isolation.txt
          probe() {
            label="$1"
            node - "$label" >> TEMP-wolfwalkers-test-isolation.txt 2>&1 <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const label = process.argv[2];
          const p = 'docs/film-history-chapter-nineteen-atlas-resolved.json';
          const raw = fs.readFileSync(p, 'utf8');
          const d = JSON.parse(raw);
          const wolf = d.candidates.find((x) => x.title === 'Wolfwalkers');
          console.log(JSON.stringify({
            label,
            cwd: process.cwd(),
            sha256: crypto.createHash('sha256').update(raw).digest('hex'),
            atlas: d.atlas,
            verificationIndex: d.verificationIndex,
            useExisting: d.byDecision.USE_EXISTING.map((x) => x.title),
            p0: d.byDecision.P0.map((x) => x.title),
            wolfwalkers: wolf && {decision:wolf.decision,scenarioId:wolf.scenarioId,matches:wolf.matches,productionVerified:wolf.productionVerified}
          }, null, 2));
          NODE
          }

          echo '=== BEFORE BUILD ===' >> TEMP-wolfwalkers-test-isolation.txt
          probe before_build
          npm run build >> TEMP-wolfwalkers-test-isolation.txt 2>&1
          build_status=$?
          echo "build_status=$build_status" >> TEMP-wolfwalkers-test-isolation.txt
          probe after_build

          echo '=== ISOLATED CH19 CONTRACT ===' >> TEMP-wolfwalkers-test-isolation.txt
          node --test dist/core/filmHistoryChapterNineteenAuditContract.test.js >> TEMP-wolfwalkers-test-isolation.txt 2>&1
          isolated_status=$?
          echo "isolated_status=$isolated_status" >> TEMP-wolfwalkers-test-isolation.txt
          probe after_isolated

          echo '=== FULL TEST SERIAL ===' >> TEMP-wolfwalkers-test-isolation.txt
          node --test --test-concurrency=1 dist/core/*.test.js >> TEMP-wolfwalkers-test-isolation.txt 2>&1
          serial_status=$?
          echo "serial_status=$serial_status" >> TEMP-wolfwalkers-test-isolation.txt
          probe after_serial

          echo '=== FULL TEST DEFAULT ===' >> TEMP-wolfwalkers-test-isolation.txt
          node --test dist/core/*.test.js >> TEMP-wolfwalkers-test-isolation.txt 2>&1
          parallel_status=$?
          echo "parallel_status=$parallel_status" >> TEMP-wolfwalkers-test-isolation.txt
          probe after_default

          echo "SUMMARY build=$build_status isolated=$isolated_status serial=$serial_status default=$parallel_status" >> TEMP-wolfwalkers-test-isolation.txt
          exit 0

      - name: Persist isolation diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEMP-wolfwalkers-test-isolation.txt
          git commit --no-verify -m "Capture Wolfwalkers test isolation"
          git push origin HEAD:agent/ch19-wolfwalkers-production-case
