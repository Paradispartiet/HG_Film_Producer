name: Verify and deploy HG Film Producer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PRs only need read access. The deploy job receives Pages/OIDC write access
# separately, so verification can never publish by accident.
permissions:
  contents: read

concurrency:
  group: hg-film-producer-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, build, and prepare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full v0.1 verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee verify-v0.1-output.txt

      - name: Exercise Studio Career Film One to Film Two lifecycle
        run: node scripts/studio-career-lifecycle-qa.mjs

      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-v0.1-diagnostics
          path: verify-v0.1-output.txt

      - name: Verify production artifact
        shell: bash
        run: |
          set -euxo pipefail
          test -f dist/index.html

          echo "Contents of dist:"
          find dist -maxdepth 3 -type f -print | sort

          if grep -Fq '/src/ui/main.tsx' dist/index.html; then
            echo "::error file=dist/index.html::Vite source entrypoint is still present in the production artifact."
            exit 1
          fi

          if ! grep -Fq '/HG_Film_Producer/assets/' dist/index.html; then
            echo "::error file=dist/index.html::Expected repository-prefixed Vite asset path was not found."
            exit 1
          fi

          echo "Verified dist/index.html uses the built HG_Film_Producer asset bundle."

      # Repository Settings -> Pages -> Source must be "GitHub Actions".
      # Do not add actions/configure-pages here: the direct reactivation probe
      # already recorded configure=failure. Upload + deploy is the production path.
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  browser-qa:
    name: Chromium journey · 12 films × 4 languages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application
        run: npm ci

      # Keep the production lockfile untouched. Chromium is a QA-only tool;
      # our application has no browser automation runtime dependency.
      - name: Install headless Chromium QA tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build release candidate
        run: npm run build:ui

      - name: Exercise four-language user journeys
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > browser-qa-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "${preview_pid}" 2>/dev/null || true' EXIT
          node scripts/film-producer-four-language-browser-qa.mjs
          node scripts/studio-career-handoff-browser-qa.mjs

      - name: Preserve smoke evidence and visual-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-evidence
          path: |
            browser-qa-artifacts/
            browser-qa-preview.log
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, browser-qa]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
