name: Verify HG Film Producer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hg-film-producer-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full v0.1 verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee verify-v0.1-output.txt
      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-v0.1-diagnostics
          path: verify-v0.1-output.txt
      - name: Verify production artifact
        shell: bash
        run: |
          set -euxo pipefail
          test -f dist/index.html
          if grep -Fq '/src/ui/main.tsx' dist/index.html; then
            echo "::error file=dist/index.html::Vite source entrypoint is still present in the production artifact."
            exit 1
          fi
          if ! grep -Fq '/HG_Film_Producer/assets/' dist/index.html; then
            echo "::error file=dist/index.html::Expected production asset path was not found."
            exit 1
          fi
