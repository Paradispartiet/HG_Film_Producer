name: TEMP Chapter 19 Wolfwalkers materialize

on:
  push:
    branches:
      - agent/ch19-wolfwalkers-production-case
    paths:
      - .github/workflows/TEMP-ch19-wolfwalkers-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-wolfwalkers-production-case
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch Wolfwalkers runtime and Chapter 19 gates in working tree
        run: |
          node - <<'NODE'
          const fs = require('fs');

          function replaceExact(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`${file}: missing exact anchor: ${before.slice(0, 180)}`);
            fs.writeFileSync(file, source.replace(before, after));
          }

          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'import { mergeChapterNineteenSoulExpansion } from "../../core/chapterNineteenSoulExpansion.js";\n',
            'import { mergeChapterNineteenSoulExpansion } from "../../core/chapterNineteenSoulExpansion.js";\nimport { mergeChapterNineteenWolfwalkersExpansion } from "../../core/chapterNineteenWolfwalkersExpansion.js";\n',
          );
          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'const chapterNineteenSoulScenarios = mergeChapterNineteenSoulExpansion(chapterNineteenTenetScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenSoulScenarios);',
            'const chapterNineteenSoulScenarios = mergeChapterNineteenSoulExpansion(chapterNineteenTenetScenarios);\nconst chapterNineteenWolfwalkersScenarios = mergeChapterNineteenWolfwalkersExpansion(chapterNineteenSoulScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenWolfwalkersScenarios);',
          );
          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'manual_chapter_nineteen_tenet_expansion_2026+manual_chapter_nineteen_soul_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
            'manual_chapter_nineteen_tenet_expansion_2026+manual_chapter_nineteen_soul_expansion_2026+manual_chapter_nineteen_wolfwalkers_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
          );

          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            'import { soulProductionCaseVerification } from "./scenarioProductionVerificationSoul";\n',
            'import { soulProductionCaseVerification } from "./scenarioProductionVerificationSoul";\nimport { wolfwalkersProductionCaseVerification } from "./scenarioProductionVerificationWolfwalkers";\n',
          );
          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            '  soulProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
            '  soulProductionCaseVerification,\n  wolfwalkersProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
          );

          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            'import { soulFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenSoul";\n',
            'import { soulFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenSoul";\nimport { wolfwalkersFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenWolfwalkers";\n',
          );
          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            '  [soulFilmHistoryProfile.scenarioId]: soulFilmHistoryProfile,\n',
            '  [soulFilmHistoryProfile.scenarioId]: soulFilmHistoryProfile,\n  [wolfwalkersFilmHistoryProfile.scenarioId]: wolfwalkersFilmHistoryProfile,\n',
          );

          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            'const EXPECTED_PLAYABLE_SCENARIOS = 541;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 541;',
            'const EXPECTED_PLAYABLE_SCENARIOS = 542;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 542;',
          );
          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            '  "chapterNineteenSoulExpansion.ts",\n  "modernCanonExpansion.ts",',
            '  "chapterNineteenSoulExpansion.ts",\n  "chapterNineteenWolfwalkersExpansion.ts",\n  "modernCanonExpansion.ts",',
          );

          replaceExact(
            'scripts/film-history-chapter-nineteen-atlas-audit.mjs',
            'const EXPECTED_ATLAS_COUNT = 541;',
            'const EXPECTED_ATLAS_COUNT = 542;',
          );

          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            'const exactUseExisting = [\n  "Tenet",\n  "Soul",\n  "Quo Vadis, Aida?",',
            'const exactUseExisting = [\n  "Tenet",\n  "Soul",\n  "Wolfwalkers",\n  "Quo Vadis, Aida?",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            'const exactP0Queue = [\n  "Wolfwalkers",\n  "Dune",',
            'const exactP0Queue = [\n  "Dune",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 541;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 541);\n  assert.equal(resolved.atlas.actualCount, 541);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 541);',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 542;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 542);\n  assert.equal(resolved.atlas.actualCount, 542);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 542);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(exactUseExisting.length, 9);\n  assert.equal(exactP0Queue.length, 20);',
            '  assert.equal(exactUseExisting.length, 10);\n  assert.equal(exactP0Queue.length, 19);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 47);',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 46);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(soul.productionVerified, true);\n\n  for (const candidate of resolved.candidates) {',
            '  assert.equal(soul.productionVerified, true);\n\n  const wolfwalkers = resolved.candidates.find((candidate) => candidate.title === "Wolfwalkers");\n  assert.ok(wolfwalkers);\n  assert.equal(wolfwalkers.decision, "USE_EXISTING");\n  assert.equal(wolfwalkers.scenarioId, "scenario_wolfwalkers_2020");\n  assert.equal(wolfwalkers.matches, 1);\n  assert.equal(wolfwalkers.productionVerified, true);\n\n  for (const candidate of resolved.candidates) {',
          );

          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(verificationIds.size === 541, `Global Production Verification registry must contain exactly 541 unique scenarioIds after the second Chapter 19 case: ${verificationIds.size}`);',
            'invariant(verificationIds.size === 542, `Global Production Verification registry must contain exactly 542 unique scenarioIds after the third Chapter 19 case: ${verificationIds.size}`);',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 541, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 541.");',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 542, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 542.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 9 && chapter19.byDecision?.P0?.length === 20 && chapter19.byDecision?.P1?.length === 27 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 9 USE_EXISTING / 20 P0 / 27 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 10 && chapter19.byDecision?.P0?.length === 19 && chapter19.byDecision?.P1?.length === 27 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 10 USE_EXISTING / 19 P0 / 27 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'const soul = chapter19.candidates.find((candidate) => candidate.title === "Soul");\ninvariant(soul?.decision === "USE_EXISTING" && soul?.scenarioId === "scenario_soul_2020" && soul?.matches === 1 && soul?.productionVerified === true, "Soul is not closed as the second production-verified Chapter 19 USE_EXISTING case.");',
            'const soul = chapter19.candidates.find((candidate) => candidate.title === "Soul");\ninvariant(soul?.decision === "USE_EXISTING" && soul?.scenarioId === "scenario_soul_2020" && soul?.matches === 1 && soul?.productionVerified === true, "Soul is not closed as the second production-verified Chapter 19 USE_EXISTING case.");\nconst wolfwalkers = chapter19.candidates.find((candidate) => candidate.title === "Wolfwalkers");\ninvariant(wolfwalkers?.decision === "USE_EXISTING" && wolfwalkers?.scenarioId === "scenario_wolfwalkers_2020" && wolfwalkers?.matches === 1 && wolfwalkers?.productionVerified === true, "Wolfwalkers is not closed as the third production-verified Chapter 19 USE_EXISTING case.");',
          );
          NODE

      - name: Generate and materialize canonical Chapter 19 snapshot
        run: |
          node scripts/film-history-chapter-nineteen-atlas-audit.mjs > /tmp/ch19-wolfwalkers.json
          cp /tmp/ch19-wolfwalkers.json docs/film-history-chapter-nineteen-atlas-resolved.json

      - name: Assert Wolfwalkers transition before full verification
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const path of ['/tmp/ch19-wolfwalkers.json', 'docs/film-history-chapter-nineteen-atlas-resolved.json']) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const wolfwalkers = data.candidates.find((candidate) => candidate.title === 'Wolfwalkers');
            const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
            if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 542 || data.atlas.actualCount !== 542) throw new Error(`${path}: ${JSON.stringify(data.atlas)}`);
            if (data.verificationIndex.literalVerifiedScenarioIds !== 542) throw new Error(`${path}: ${JSON.stringify(data.verificationIndex)}`);
            if (!wolfwalkers || wolfwalkers.decision !== 'USE_EXISTING' || wolfwalkers.scenarioId !== 'scenario_wolfwalkers_2020' || wolfwalkers.matches !== 1 || wolfwalkers.productionVerified !== true) throw new Error(`${path}: ${JSON.stringify(wolfwalkers)}`);
            if (counts.USE_EXISTING !== 10 || counts.P0 !== 19 || counts.P1 !== 27 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(`${path}: ${JSON.stringify(counts)}`);
          }
          if (fs.readFileSync('/tmp/ch19-wolfwalkers.json', 'utf8') !== fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8')) throw new Error('Generated and canonical Chapter 19 snapshots differ.');
          NODE

      - name: Remove TEMP workflows from verification working tree
        run: rm .github/workflows/TEMP-ch19-wolfwalkers-diagnostic.yml .github/workflows/TEMP-ch19-wolfwalkers-materialize.yml

      - name: Install dependencies
        run: npm ci

      - name: Full fail-closed v0.1 verification
        run: |
          set +e
          npm run verify:v0.1 2>&1 | tee /tmp/wolfwalkers-verify.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "head=$(git rev-parse HEAD)"
              echo "status=$status"
              echo "--- verify tail ---"
              tail -n 400 /tmp/wolfwalkers-verify.log
            } > TEMP-wolfwalkers-verify-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TEMP-wolfwalkers-verify-failure.log
            git commit -m "Capture Wolfwalkers verify failure"
            git push origin HEAD:agent/ch19-wolfwalkers-production-case
          fi
          exit "$status"

      - name: Assert Wolfwalkers snapshot survived full verification
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const wolfwalkers = data.candidates.find((candidate) => candidate.title === 'Wolfwalkers');
          const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
          if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 542 || data.atlas.actualCount !== 542 || data.verificationIndex.literalVerifiedScenarioIds !== 542) throw new Error(JSON.stringify({ atlas: data.atlas, verificationIndex: data.verificationIndex }));
          if (!wolfwalkers || wolfwalkers.decision !== 'USE_EXISTING' || wolfwalkers.scenarioId !== 'scenario_wolfwalkers_2020' || wolfwalkers.matches !== 1 || wolfwalkers.productionVerified !== true) throw new Error(JSON.stringify(wolfwalkers));
          if (counts.USE_EXISTING !== 10 || counts.P0 !== 19 || counts.P1 !== 27 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(JSON.stringify(counts));
          NODE

      - name: Commit permanent materialization only after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            scripts/production-case-rest-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            docs/film-history-chapter-nineteen-atlas-resolved.json
          if git diff --cached --quiet; then
            echo "No permanent Wolfwalkers materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialize Chapter 19 Wolfwalkers production case"
          git push origin HEAD:agent/ch19-wolfwalkers-production-case
