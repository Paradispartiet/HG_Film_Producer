name: TEMP Chapter 19 Soul materialize

on:
  push:
    branches:
      - agent/ch19-soul-production-case
    paths:
      - .github/workflows/TEMP-ch19-soul-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-soul-production-case
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch Soul runtime and Chapter 19 gates in working tree
        run: |
          node - <<'NODE'
          const fs = require('fs');

          function replaceExact(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`${file}: missing exact anchor: ${before.slice(0, 160)}`);
            fs.writeFileSync(file, source.replace(before, after));
          }

          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'import { mergeChapterNineteenTenetExpansion } from "../../core/chapterNineteenTenetExpansion.js";\n',
            'import { mergeChapterNineteenTenetExpansion } from "../../core/chapterNineteenTenetExpansion.js";\nimport { mergeChapterNineteenSoulExpansion } from "../../core/chapterNineteenSoulExpansion.js";\n',
          );
          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'const chapterNineteenTenetScenarios = mergeChapterNineteenTenetExpansion(chapterEighteenTheNewWorldScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenTenetScenarios);',
            'const chapterNineteenTenetScenarios = mergeChapterNineteenTenetExpansion(chapterEighteenTheNewWorldScenarios);\nconst chapterNineteenSoulScenarios = mergeChapterNineteenSoulExpansion(chapterNineteenTenetScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenSoulScenarios);',
          );
          {
            const file = 'src/ui/data/filmScenarios.ts';
            const source = fs.readFileSync(file, 'utf8');
            const token = 'manual_chapter_nineteen_tenet_expansion_2026';
            if (!source.includes(token)) throw new Error(`${file}: missing Tenet source-version token`);
            if (!source.includes('manual_chapter_nineteen_soul_expansion_2026')) {
              fs.writeFileSync(file, source.replace(token, `${token}+manual_chapter_nineteen_soul_expansion_2026`));
            }
          }

          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            'import { tenetProductionCaseVerification } from "./scenarioProductionVerificationTenet";\n',
            'import { tenetProductionCaseVerification } from "./scenarioProductionVerificationTenet";\nimport { soulProductionCaseVerification } from "./scenarioProductionVerificationSoul";\n',
          );
          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            '  tenetProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
            '  tenetProductionCaseVerification,\n  soulProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
          );

          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            'import { tenetFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenTenet";\n',
            'import { tenetFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenTenet";\nimport { soulFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenSoul";\n',
          );
          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            '  [tenetFilmHistoryProfile.scenarioId]: tenetFilmHistoryProfile,\n',
            '  [tenetFilmHistoryProfile.scenarioId]: tenetFilmHistoryProfile,\n  [soulFilmHistoryProfile.scenarioId]: soulFilmHistoryProfile,\n',
          );

          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            'const EXPECTED_PLAYABLE_SCENARIOS = 540;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 540;',
            'const EXPECTED_PLAYABLE_SCENARIOS = 541;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 541;',
          );
          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            '  "chapterNineteenTenetExpansion.ts",\n  "modernCanonExpansion.ts",',
            '  "chapterNineteenTenetExpansion.ts",\n  "chapterNineteenSoulExpansion.ts",\n  "modernCanonExpansion.ts",',
          );

          replaceExact(
            'scripts/film-history-chapter-nineteen-atlas-audit.mjs',
            'const EXPECTED_ATLAS_COUNT = 540;',
            'const EXPECTED_ATLAS_COUNT = 541;',
          );

          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            'const exactUseExisting = [\n  "Tenet",\n  "Quo Vadis, Aida?",',
            'const exactUseExisting = [\n  "Tenet",\n  "Soul",\n  "Quo Vadis, Aida?",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            'const exactP0Queue = [\n  "Soul",\n  "Wolfwalkers",',
            'const exactP0Queue = [\n  "Wolfwalkers",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 540;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 540);\n  assert.equal(resolved.atlas.actualCount, 540);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 540);',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 541;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 541);\n  assert.equal(resolved.atlas.actualCount, 541);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 541);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(exactUseExisting.length, 8);\n  assert.equal(exactP0Queue.length, 21);',
            '  assert.equal(exactUseExisting.length, 9);\n  assert.equal(exactP0Queue.length, 20);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 48);',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 47);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(tenet.productionVerified, true);\n\n  for (const candidate of resolved.candidates) {',
            '  assert.equal(tenet.productionVerified, true);\n\n  const soul = resolved.candidates.find((candidate) => candidate.title === "Soul");\n  assert.ok(soul);\n  assert.equal(soul.decision, "USE_EXISTING");\n  assert.equal(soul.scenarioId, "scenario_soul_2020");\n  assert.equal(soul.matches, 1);\n  assert.equal(soul.productionVerified, true);\n\n  for (const candidate of resolved.candidates) {',
          );

          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(verificationIds.size === 540, `Global Production Verification registry must contain exactly 540 unique scenarioIds after the first Chapter 19 case: ${verificationIds.size}`);',
            'invariant(verificationIds.size === 541, `Global Production Verification registry must contain exactly 541 unique scenarioIds after the second Chapter 19 case: ${verificationIds.size}`);',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 540, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 540.");',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 541, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 541.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 8 && chapter19.byDecision?.P0?.length === 21 && chapter19.byDecision?.P1?.length === 27 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 8 USE_EXISTING / 21 P0 / 27 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 9 && chapter19.byDecision?.P0?.length === 20 && chapter19.byDecision?.P1?.length === 27 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 9 USE_EXISTING / 20 P0 / 27 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(tenet?.decision === "USE_EXISTING" && tenet?.scenarioId === "scenario_tenet_2020" && tenet?.matches === 1 && tenet?.productionVerified === true, "Tenet is not closed as the first production-verified Chapter 19 USE_EXISTING case.");',
            'invariant(tenet?.decision === "USE_EXISTING" && tenet?.scenarioId === "scenario_tenet_2020" && tenet?.matches === 1 && tenet?.productionVerified === true, "Tenet is not closed as the first production-verified Chapter 19 USE_EXISTING case.");\nconst soul = chapter19.candidates.find((candidate) => candidate.title === "Soul");\ninvariant(soul?.decision === "USE_EXISTING" && soul?.scenarioId === "scenario_soul_2020" && soul?.matches === 1 && soul?.productionVerified === true, "Soul is not closed as the second production-verified Chapter 19 USE_EXISTING case.");',
          );
          NODE

      - name: Generate and materialize canonical Chapter 19 snapshot
        run: |
          node scripts/film-history-chapter-nineteen-atlas-audit.mjs > /tmp/ch19-soul.json
          cp /tmp/ch19-soul.json docs/film-history-chapter-nineteen-atlas-resolved.json

      - name: Assert Soul transition before full verification
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const path of ['/tmp/ch19-soul.json', 'docs/film-history-chapter-nineteen-atlas-resolved.json']) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const soul = data.candidates.find((candidate) => candidate.title === 'Soul');
            const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
            if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 541 || data.atlas.actualCount !== 541) throw new Error(`${path}: ${JSON.stringify(data.atlas)}`);
            if (data.verificationIndex.literalVerifiedScenarioIds !== 541) throw new Error(`${path}: ${JSON.stringify(data.verificationIndex)}`);
            if (!soul || soul.decision !== 'USE_EXISTING' || soul.scenarioId !== 'scenario_soul_2020' || soul.matches !== 1 || soul.productionVerified !== true) throw new Error(`${path}: ${JSON.stringify(soul)}`);
            if (counts.USE_EXISTING !== 9 || counts.P0 !== 20 || counts.P1 !== 27 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(`${path}: ${JSON.stringify(counts)}`);
          }
          if (fs.readFileSync('/tmp/ch19-soul.json', 'utf8') !== fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8')) throw new Error('Generated and canonical Chapter 19 snapshots differ.');
          NODE

      - name: Remove TEMP workflows from verification working tree
        run: rm .github/workflows/TEMP-ch19-soul-diagnostic.yml .github/workflows/TEMP-ch19-soul-materialize.yml

      - name: Install dependencies
        run: npm ci

      - name: Full fail-closed v0.1 verification
        run: npm run verify:v0.1

      - name: Assert Soul snapshot survived full verification
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const soul = data.candidates.find((candidate) => candidate.title === 'Soul');
          const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
          if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 541 || data.atlas.actualCount !== 541 || data.verificationIndex.literalVerifiedScenarioIds !== 541) throw new Error(JSON.stringify({ atlas: data.atlas, verificationIndex: data.verificationIndex }));
          if (!soul || soul.decision !== 'USE_EXISTING' || soul.scenarioId !== 'scenario_soul_2020' || soul.matches !== 1 || soul.productionVerified !== true) throw new Error(JSON.stringify(soul));
          if (counts.USE_EXISTING !== 9 || counts.P0 !== 20 || counts.P1 !== 27 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(JSON.stringify(counts));
          NODE

      - name: Commit permanent materialization only after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            scripts/production-case-rest-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            docs/film-history-chapter-nineteen-atlas-resolved.json
          if git diff --cached --quiet; then
            echo "No permanent Soul materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialize Chapter 19 Soul production case"
          git push origin HEAD:agent/ch19-soul-production-case
