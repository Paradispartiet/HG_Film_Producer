name: TEMP Chapter 19 Dune finalize

on:
  push:
    branches:
      - agent/ch19-dune-production-case
    paths:
      - .github/workflows/TEMP-ch19-dune-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-dune-production-case
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exact Dune integration patch
        run: |
          node - <<'NODE'
          const fs = require('fs');

          function replaceExact(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`${file}: missing exact anchor: ${before.slice(0, 220)}`);
            const next = source.replace(before, after);
            if (next === source) throw new Error(`${file}: replacement produced no change`);
            fs.writeFileSync(file, next);
          }

          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'import { mergeChapterNineteenWolfwalkersExpansion } from "../../core/chapterNineteenWolfwalkersExpansion.js";\n',
            'import { mergeChapterNineteenWolfwalkersExpansion } from "../../core/chapterNineteenWolfwalkersExpansion.js";\nimport { mergeChapterNineteenDuneExpansion } from "../../core/chapterNineteenDuneExpansion.js";\n',
          );
          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'const chapterNineteenWolfwalkersScenarios = mergeChapterNineteenWolfwalkersExpansion(chapterNineteenSoulScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenWolfwalkersScenarios);',
            'const chapterNineteenWolfwalkersScenarios = mergeChapterNineteenWolfwalkersExpansion(chapterNineteenSoulScenarios);\nconst chapterNineteenDuneScenarios = mergeChapterNineteenDuneExpansion(chapterNineteenWolfwalkersScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterNineteenDuneScenarios);',
          );
          replaceExact(
            'src/ui/data/filmScenarios.ts',
            'manual_chapter_nineteen_soul_expansion_2026+manual_chapter_nineteen_wolfwalkers_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
            'manual_chapter_nineteen_soul_expansion_2026+manual_chapter_nineteen_wolfwalkers_expansion_2026+manual_chapter_nineteen_dune_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
          );

          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            'import { wolfwalkersProductionCaseVerification } from "./scenarioProductionVerificationWolfwalkers";\n',
            'import { wolfwalkersProductionCaseVerification } from "./scenarioProductionVerificationWolfwalkers";\nimport { duneProductionCaseVerification } from "./scenarioProductionVerificationDune";\n',
          );
          replaceExact(
            'src/ui/data/scenarioProductionVerificationRegistry.ts',
            '  soulProductionCaseVerification,\n  wolfwalkersProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
            '  soulProductionCaseVerification,\n  wolfwalkersProductionCaseVerification,\n  duneProductionCaseVerification,\n  lonelyVillaProductionCaseVerification,',
          );

          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            'import { wolfwalkersFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenWolfwalkers";\n',
            'import { wolfwalkersFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenWolfwalkers";\nimport { duneFilmHistoryProfile } from "./scenarioFilmStudyChapterNineteenDune";\n',
          );
          replaceExact(
            'src/ui/data/scenarioFilmStudyMap.ts',
            '  [wolfwalkersFilmHistoryProfile.scenarioId]: wolfwalkersFilmHistoryProfile,\n  scenario_the_machinist_2004:',
            '  [wolfwalkersFilmHistoryProfile.scenarioId]: wolfwalkersFilmHistoryProfile,\n  [duneFilmHistoryProfile.scenarioId]: duneFilmHistoryProfile,\n  scenario_the_machinist_2004:',
          );

          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            'const EXPECTED_PLAYABLE_SCENARIOS = 542;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 542;',
            'const EXPECTED_PLAYABLE_SCENARIOS = 543;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 543;',
          );
          replaceExact(
            'scripts/production-case-rest-audit.mjs',
            '  "chapterNineteenWolfwalkersExpansion.ts",\n  "modernCanonExpansion.ts",',
            '  "chapterNineteenWolfwalkersExpansion.ts",\n  "chapterNineteenDuneExpansion.ts",\n  "modernCanonExpansion.ts",',
          );

          replaceExact(
            'scripts/film-history-chapter-nineteen-atlas-audit.mjs',
            'const EXPECTED_ATLAS_COUNT = 542;',
            'const EXPECTED_ATLAS_COUNT = 543;',
          );

          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  "Wolfwalkers",\n  "The Disciple",\n  "The Worst Person in the World",',
            '  "Wolfwalkers",\n  "The Disciple",\n  "Dune",\n  "The Worst Person in the World",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            'const exactP0Queue = [\n  "Dune",\n  "Flee",',
            'const exactP0Queue = [\n  "Flee",',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 542;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 542);\n  assert.equal(resolved.atlas.actualCount, 542);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 542);',
            '  assert.match(audit, /const EXPECTED_ATLAS_COUNT = 543;/);\n  assert.equal(resolved.atlas.baselineFromClosedChapter18, 539);\n  assert.equal(resolved.atlas.expectedCount, 543);\n  assert.equal(resolved.atlas.actualCount, 543);\n  assert.equal(resolved.verificationIndex.literalVerifiedScenarioIds, 543);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(exactUseExisting.length, 10);\n  assert.equal(exactP0Queue.length, 19);',
            '  assert.equal(exactUseExisting.length, 11);\n  assert.equal(exactP0Queue.length, 18);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 46);',
            '  assert.equal(resolved.recommendedNewProductionCases.length, 45);',
          );
          replaceExact(
            'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
            '  assert.equal(wolfwalkers.productionVerified, true);\n\n  for (const candidate of resolved.candidates) {',
            '  assert.equal(wolfwalkers.productionVerified, true);\n\n  const dune = resolved.candidates.find((candidate) => candidate.title === "Dune");\n  assert.ok(dune);\n  assert.equal(dune.decision, "USE_EXISTING");\n  assert.equal(dune.scenarioId, "scenario_dune_2021");\n  assert.equal(dune.matches, 1);\n  assert.equal(dune.productionVerified, true);\n\n  for (const candidate of resolved.candidates) {',
          );

          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(verificationIds.size === 542, `Global Production Verification registry must contain exactly 542 unique scenarioIds after the third Chapter 19 case: ${verificationIds.size}`);',
            'invariant(verificationIds.size === 543, `Global Production Verification registry must contain exactly 543 unique scenarioIds after the fourth Chapter 19 case: ${verificationIds.size}`);',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 542, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 542.");',
            'invariant(chapter19.atlas?.baselineFromClosedChapter18 === 539 && chapter19.atlas?.actualCount === 543, "Chapter 19 must preserve the closed 539-scenario Chapter 18 baseline while advancing the current Atlas to 543.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 10 && chapter19.byDecision?.P0?.length === 19 && chapter19.byDecision?.P1?.length === 27 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 10 USE_EXISTING / 19 P0 / 27 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
            'invariant(chapter19.byDecision?.USE_EXISTING?.length === 11 && chapter19.byDecision?.P0?.length === 18 && chapter19.byDecision?.P1?.length === 27 && chapter19.byDecision?.P2?.length === 4 && chapter19.byDecision?.EXISTING_REQUIRED?.length === 0, "Chapter 19 resolved queue census drifted from 11 USE_EXISTING / 18 P0 / 27 P1 / 4 P2 / 0 EXISTING_REQUIRED.");',
          );
          replaceExact(
            'scripts/film-history-chapter-eighteen-completion-audit.mjs',
            'const wolfwalkers = chapter19.candidates.find((candidate) => candidate.title === "Wolfwalkers");\ninvariant(wolfwalkers?.decision === "USE_EXISTING" && wolfwalkers?.scenarioId === "scenario_wolfwalkers_2020" && wolfwalkers?.matches === 1 && wolfwalkers?.productionVerified === true, "Wolfwalkers is not closed as the third production-verified Chapter 19 USE_EXISTING case.");',
            'const wolfwalkers = chapter19.candidates.find((candidate) => candidate.title === "Wolfwalkers");\ninvariant(wolfwalkers?.decision === "USE_EXISTING" && wolfwalkers?.scenarioId === "scenario_wolfwalkers_2020" && wolfwalkers?.matches === 1 && wolfwalkers?.productionVerified === true, "Wolfwalkers is not closed as the third production-verified Chapter 19 USE_EXISTING case.");\nconst dune = chapter19.candidates.find((candidate) => candidate.title === "Dune");\ninvariant(dune?.decision === "USE_EXISTING" && dune?.scenarioId === "scenario_dune_2021" && dune?.matches === 1 && dune?.productionVerified === true, "Dune is not closed as the fourth production-verified Chapter 19 USE_EXISTING case.");',
          );
          NODE

      - name: Generate canonical Chapter 19 snapshot
        run: |
          node scripts/film-history-chapter-nineteen-atlas-audit.mjs > /tmp/ch19-dune.json
          cp /tmp/ch19-dune.json docs/film-history-chapter-nineteen-atlas-resolved.json

      - name: Assert Dune transition
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const dune = data.candidates.find((candidate) => candidate.title === 'Dune');
          const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
          const expectedUseExisting = ['Tenet','Soul','Quo Vadis, Aida?','Another Round','Never Rarely Sometimes Always','Wolfwalkers','The Disciple','Dune','The Worst Person in the World','Nickel Boys','Dahomey'];
          if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 543 || data.atlas.actualCount !== 543) throw new Error(JSON.stringify(data.atlas));
          if (data.verificationIndex.literalVerifiedScenarioIds !== 543) throw new Error(JSON.stringify(data.verificationIndex));
          if (!dune || dune.decision !== 'USE_EXISTING' || dune.scenarioId !== 'scenario_dune_2021' || dune.matches !== 1 || dune.productionVerified !== true) throw new Error(JSON.stringify(dune));
          if (counts.USE_EXISTING !== 11 || counts.P0 !== 18 || counts.P1 !== 27 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(JSON.stringify(counts));
          if (JSON.stringify(data.byDecision.USE_EXISTING) !== JSON.stringify(expectedUseExisting)) throw new Error(`USE_EXISTING order drift: ${JSON.stringify(data.byDecision.USE_EXISTING)}`);
          NODE

      - name: Remove TEMP surfaces from verification working tree
        run: |
          rm -f .github/workflows/TEMP-ch19-dune-*.yml
          rm -f TEMP-dune-*.txt TEMP-dune-*.log

      - name: Install dependencies
        run: npm ci

      - name: Full fail-closed v0.1 verification
        run: npm run verify:v0.1

      - name: Assert Dune snapshot survived full verification
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const dune = data.candidates.find((candidate) => candidate.title === 'Dune');
          const counts = Object.fromEntries(Object.entries(data.byDecision).map(([key, value]) => [key, value.length]));
          if (data.atlas.baselineFromClosedChapter18 !== 539 || data.atlas.expectedCount !== 543 || data.atlas.actualCount !== 543 || data.verificationIndex.literalVerifiedScenarioIds !== 543) throw new Error(JSON.stringify({ atlas: data.atlas, verificationIndex: data.verificationIndex }));
          if (!dune || dune.decision !== 'USE_EXISTING' || dune.scenarioId !== 'scenario_dune_2021' || dune.matches !== 1 || dune.productionVerified !== true) throw new Error(JSON.stringify(dune));
          if (counts.USE_EXISTING !== 11 || counts.P0 !== 18 || counts.P1 !== 27 || counts.P2 !== 4 || counts.EXISTING_REQUIRED !== 0) throw new Error(JSON.stringify(counts));
          NODE

      - name: Commit permanent materialization after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ui/data/filmScenarios.ts \
            src/ui/data/scenarioProductionVerificationRegistry.ts \
            src/ui/data/scenarioFilmStudyMap.ts \
            scripts/production-case-rest-audit.mjs \
            scripts/film-history-chapter-nineteen-atlas-audit.mjs \
            scripts/film-history-chapter-eighteen-completion-audit.mjs \
            src/core/filmHistoryChapterNineteenAuditContract.test.ts \
            docs/film-history-chapter-nineteen-atlas-resolved.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent Dune materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialize Chapter 19 Dune production case"
          git push origin HEAD:agent/ch19-dune-production-case
