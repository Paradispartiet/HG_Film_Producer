# Rerun with source-accurate company name before materialization
name: Materialize Smiling Madame Beudet 1923 production case

on:
  push:
    branches:
      - agent/ch8-smiling-madame-beudet-1923
    paths:
      - .github/workflows/smiling-madame-beudet-1923-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch8-smiling-madame-beudet-1923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Reconcile source-accurate production company name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/materialize-smiling-madame-beudet-1923.py')
          text = path.read_text(encoding='utf-8')
          old = "Germaine Dulac's 1923 Film d'Art – Vandal et Delac production problem"
          new = "Germaine Dulac's 1923 Le Film d'Art – Vandal et Delac production problem"
          if text.count(old) != 1:
              raise SystemExit(f'expected one company-name marker, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Integrate reviewed Smiling Madame Beudet case
        run: python3 scripts/materialize-smiling-madame-beudet-1923.py
      - name: Full v0.1 verification
        run: npm run verify:v0.1
      - name: Commit verified materialization and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/smiling-madame-beudet-1923-materialize.yml
          rm scripts/materialize-smiling-madame-beudet-1923.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete The Smiling Madame Beudet 1923 production case"
          git push origin HEAD:agent/ch8-smiling-madame-beudet-1923
