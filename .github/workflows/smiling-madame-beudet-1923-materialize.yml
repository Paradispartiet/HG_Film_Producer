name: Materialize The Smiling Madame Beudet 1923 production case

on:
  push:
    branches:
      - agent/ch8-madame-beudet-1923
    paths:
      - .github/workflows/smiling-madame-beudet-1923-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch8-madame-beudet-1923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate reviewed Madame Beudet case
        run: python3 scripts/materialize-smiling-madame-beudet-1923.py
      - name: Reconcile exact Chapter 8 regression expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expansion = Path("src/core/chapterEightFrenchAvantGardeExpansion.ts")
          text = expansion.read_text(encoding="utf-8")
          old = "Germaine Dulac's 1923 Film d'Art - Vandal et Delac adaptation"
          new = "Germaine Dulac's 1923 Le Film d'Art - Vandal et Delac adaptation"
          if text.count(old) != 1:
              raise SystemExit(f"premise marker mismatch: {text.count(old)}")
          expansion.write_text(text.replace(old, new, 1), encoding="utf-8")

          contract = Path("src/core/filmHistoryChapterEightAuditContract.test.ts")
          text = contract.read_text(encoding="utf-8")
          old = 'assert.deepEqual(resolved.byDecision.USE_EXISTING, ["The Passion of Joan of Arc", "Cœur fidèle", "Napoléon", "Un Chien Andalou", "Entr\'acte", "The Smiling Madame Beudet"]);'
          new = 'assert.deepEqual(resolved.byDecision.USE_EXISTING, ["The Passion of Joan of Arc", "Cœur fidèle", "Napoléon", "Un Chien Andalou", "The Smiling Madame Beudet", "Entr\'acte"]);'
          if text.count(old) != 1:
              raise SystemExit(f"resolved-order marker mismatch: {text.count(old)}")
          contract.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Full v0.1 verification with captured output
        id: verify
        shell: bash
        run: |
          set +e
          npm run verify:v0.1 > verify-output.log 2>&1
          status=$?
          cat verify-output.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist verification failure for diagnosis
        if: steps.verify.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f verify-output.log
          git commit -m "Capture Madame Beudet verification failure"
          git push origin HEAD:agent/ch8-madame-beudet-1923
          exit 1
      - name: Commit verified materialization and remove temporary files
        if: steps.verify.outputs.status == '0'
        shell: bash
        run: |
          rm -f verify-output.log
          rm .github/workflows/smiling-madame-beudet-1923-materialize.yml
          rm scripts/materialize-smiling-madame-beudet-1923.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete The Smiling Madame Beudet 1923 production case"
          git push origin HEAD:agent/ch8-madame-beudet-1923
