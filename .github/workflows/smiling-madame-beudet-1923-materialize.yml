# Diagnostic rerun with named verification gates
name: Materialize Smiling Madame Beudet 1923 production case

on:
  push:
    branches:
      - agent/ch8-smiling-madame-beudet-1923
    paths:
      - .github/workflows/smiling-madame-beudet-1923-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch8-smiling-madame-beudet-1923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate reviewed Smiling Madame Beudet case
        run: python3 scripts/materialize-smiling-madame-beudet-1923.py
      - name: Preflight
        run: npm run preflight:v0.1
      - name: Global production-case audit
        run: npm run audit:production-cases
      - name: Chapter 1 audit
        run: npm run audit:film-history-ch1
      - name: Chapter 2 audit
        run: npm run audit:film-history-ch2
      - name: Chapter 3 audit
        run: npm run audit:film-history-ch3
      - name: Chapter 4 audit
        run: npm run audit:film-history-ch4
      - name: Chapter 5 audit
        run: npm run audit:film-history-ch5
      - name: Chapter 6 audit
        run: npm run audit:film-history-ch6
      - name: Chapter 7 audit
        run: npm run audit:film-history-ch7
      - name: Chapter 8 audit
        run: npm run audit:film-history-ch8
      - name: Typecheck
        run: npm run typecheck
      - name: Build core tests
        run: npm run build
      - name: All core tests
        run: node --test dist/core/*.test.js
      - name: UI build
        run: npm run build:ui
      - name: Commit verified materialization and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/smiling-madame-beudet-1923-materialize.yml
          rm scripts/materialize-smiling-madame-beudet-1923.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete The Smiling Madame Beudet 1923 production case"
          git push origin HEAD:agent/ch8-smiling-madame-beudet-1923
