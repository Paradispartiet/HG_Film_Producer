name: Materialize Chapter 12 The Public Enemy

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

concurrency:
  group: ch12-public-enemy-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ch12-public-enemy-production-case'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize permanent Public Enemy integration
        run: node scripts/materialize-ch12-public-enemy.mjs

      - name: Generate canonical Chapter 12 Atlas report
        run: node scripts/film-history-chapter-twelve-atlas-audit.mjs --write=docs/film-history-chapter-twelve-atlas-resolved.json

      - name: Full v0.1 verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee ch12-public-enemy-verify.log

      - name: Upload failed verification diagnostics
        if: steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ch12-public-enemy-materialize-diagnostics
          path: ch12-public-enemy-verify.log

      - name: Fail on verification error
        if: steps.verify.outcome == 'failure'
        run: exit 1

      - name: Commit permanent clean Public Enemy diff
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          rm -f .github/workflows/ch12-public-enemy-materialize.yml
          rm -f scripts/materialize-ch12-public-enemy.mjs
          rm -f ch12-public-enemy-verify.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No materialized diff to commit"; exit 1; }
          git commit -m "Materialize The Public Enemy Chapter 12 Production Case"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
