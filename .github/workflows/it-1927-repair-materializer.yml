name: Repair It materializer marker

on:
  push:
    branches:
      - agent/it-1927
    paths:
      - .github/workflows/it-1927-repair-materializer.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/it-1927
          fetch-depth: 0
      - name: Repair exact Chapter 6 append marker
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/it-1927-materialize.yml')
          text = path.read_text(encoding='utf-8')
          old_a = '"  },\\n] as const;\\n\\nexport function mergeChapterSixHollywoodExpansion("'
          new_a = '"\\n] as const;\\n\\nexport function mergeChapterSixHollywoodExpansion("'
          old_b = '"  },\\n" + it_definition + "] as const;\\n\\nexport function mergeChapterSixHollywoodExpansion("'
          new_b = '"\\n" + it_definition + "] as const;\\n\\nexport function mergeChapterSixHollywoodExpansion("'
          if text.count(old_a) != 1 or text.count(old_b) != 1:
              raise SystemExit(f'Unexpected marker counts: old_a={text.count(old_a)}, old_b={text.count(old_b)}')
          path.write_text(text.replace(old_a, new_a, 1).replace(old_b, new_b, 1), encoding='utf-8')
          PY
      - name: Commit repair and self-delete
        shell: bash
        run: |
          rm .github/workflows/it-1927-repair-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair It materializer append marker"
          git push origin HEAD:agent/it-1927
