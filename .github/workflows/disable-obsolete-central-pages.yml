name: One-shot disable obsolete central Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/disable-obsolete-central-pages.yml

permissions:
  contents: write

jobs:
  disable:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - name: Disable obsolete central Pages site
        id: disable
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"
          code="$(curl --silent --output /tmp/body --write-out '%{http_code}' \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${ADMIN_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Paradispartiet/Paradispartiet.github.io/pages || true)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Record result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.disable.outputs.code }}
        run: |
          set -euo pipefail
          printf 'central_pages_delete_http=%s\nrun_id=%s\n' "$CODE" "$GITHUB_RUN_ID" > /tmp/status
          encoded="$(base64 -w0 /tmp/status)"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.central-pages-disable-status.txt?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/.central-pages-disable-status.txt" -f message="Record central Pages disable ${GITHUB_RUN_ID}" -f content="$encoded" -f branch=main)
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null
