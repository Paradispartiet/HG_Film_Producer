name: TEMP Chapter 18 Avatar integration

on:
  push:
    branches:
      - agent/ch18-avatar-production-case
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch18-avatar-production-case
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize integration
        run: node scripts/TEMP-ch18-avatar-integrate.mjs
      - name: Normalize Avatar candidate-order contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/core/filmHistoryChapterEighteenAuditContract.test.ts';
          let t = fs.readFileSync(p, 'utf8');
          const duplicate = '"4 Months, 3 Weeks and 2 Days", "Slumdog Millionaire", "Avatar",\n  "Waltz with Bashir", "Wendy and Lucy", "The Wrestler", "Hunger", "Avatar", "A Prophet"';
          const correct = '"4 Months, 3 Weeks and 2 Days", "Slumdog Millionaire",\n  "Waltz with Bashir", "Wendy and Lucy", "The Wrestler", "Hunger", "Avatar", "A Prophet"';
          if (t.includes(duplicate)) t = t.replace(duplicate, correct);
          if (!t.includes(correct)) throw new Error('Avatar candidate-order contract is not normalized');
          fs.writeFileSync(p, t);
          NODE
      - name: Commit deterministic integration
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          git commit -m "Normalize Avatar Chapter 18 integration"
          git push origin HEAD:agent/ch18-avatar-production-case

# TEMP repair keeps materialization idempotent with canonical candidate order.
# User-authored no-op change to verify repaired materialized 505/505 head.
