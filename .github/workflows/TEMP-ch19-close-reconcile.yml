name: TEMP Close Cannes reconciliation

on:
  push:
    branches:
      - agent/ch19-close-cannes-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Parse TEMP reconciliation gate
        run: node --check scripts/TEMP-reconcile-ch19-close.mjs

      - name: Reconcile Close without new Atlas identity
        run: node scripts/TEMP-reconcile-ch19-close.mjs

      - name: Stage clean verification tree
        run: |
          rm scripts/TEMP-reconcile-ch19-close.mjs
          rm .github/workflows/TEMP-ch19-close-reconcile.yml

      - name: Full v0.1 verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee close-reconcile-verify.log

      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: close-cannes-reconciliation-diagnostics
          path: |
            close-reconcile-verify.log
            docs/film-history-chapter-nineteen-atlas-resolved.json
            docs/film-history-chapter-nineteen-cannes-major-prizes-audit.json
          if-no-files-found: ignore

      - name: Commit clean Close reconciliation
        if: success()
        run: |
          rm -f close-reconcile-verify.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "Reconcile Close in Chapter 19 Cannes audit"
          git push origin HEAD:agent/ch19-close-cannes-reconciliation
