name: TEMP Perfect Days fail-closed materialization

on:
  push:
    branches:
      - agent/ch19-perfect-days-production-case

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Parse evidence refinement
        run: node --check scripts/TEMP-refine-ch19-perfect-days-evidence.mjs

      - name: Refine Perfect Days evidence boundaries
        run: node scripts/TEMP-refine-ch19-perfect-days-evidence.mjs

      - name: Parse materializer
        run: node --check scripts/TEMP-materialize-ch19-perfect-days.mjs

      - name: Materialize Perfect Days
        shell: bash
        run: |
          set -o pipefail
          node scripts/TEMP-materialize-ch19-perfect-days.mjs 2>&1 | tee perfect-days-materialize.log

      - name: Remove TEMP control files
        run: |
          rm scripts/TEMP-diagnose-ch19-perfect-days.mjs
          rm scripts/TEMP-refine-ch19-perfect-days-evidence.mjs
          rm scripts/TEMP-materialize-ch19-perfect-days.mjs
          rm .github/workflows/TEMP-ch19-perfect-days-diagnostic.yml
          git diff --check

      - name: Full v0.1 verification
        run: npm run verify:v0.1

      - name: Commit clean permanent tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No permanent Perfect Days changes produced" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)TEMP-|scripts/TEMP-' ; then
            echo "TEMP files remain in final index; refusing clean commit" >&2
            exit 1
          fi
          git commit -m "Add Perfect Days Chapter 19 production case"
          git push origin HEAD:agent/ch19-perfect-days-production-case
