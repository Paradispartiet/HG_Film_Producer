name: TEMP Perfect Days diagnostic

on:
  push:
    branches:
      - agent/ch19-perfect-days-production-case

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse diagnostic
        run: node --check scripts/TEMP-diagnose-ch19-perfect-days.mjs

      - name: Run tree-wide identity diagnostic
        shell: bash
        run: |
          set -o pipefail
          node scripts/TEMP-diagnose-ch19-perfect-days.mjs 2>&1 | tee perfect-days-diagnostic.log

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: perfect-days-identity-diagnostic
          path: perfect-days-diagnostic.log
