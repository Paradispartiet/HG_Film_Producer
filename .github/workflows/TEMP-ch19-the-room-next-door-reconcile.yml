name: TEMP Room Next Door reconciliation fail-closed

on:
  push:
    branches:
      - agent/ch19-the-room-next-door-reconciliation

permissions:
  contents: write

concurrency:
  group: temp-ch19-the-room-next-door-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lock existing Room Next Door identities
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object src/ui/data/scenarioFilmStudyContemporaryEuropeanSocialCareRoomNextDoor.ts)" = "0c612c1bc7a30e6e31022c89e7a4357977899ebf"
          test "$(git hash-object src/ui/data/scenarioProductionVerificationContemporaryEuropeanSocialCareSystemsBatch.ts)" = "7d87ca3d7a23dc99cb42ded10b1a299a90de622b"

      - name: Materialize Room Next Door candidate reconciliation
        run: node scripts/TEMP-ch19-the-room-next-door-reconcile.mjs

      - name: Full fail-closed verification
        run: npm run verify:v0.1

      - name: Assert exact permanent result
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e scripts/TEMP-ch19-the-room-next-door-reconcile.mjs
          test ! -e .github/workflows/TEMP-ch19-the-room-next-door-reconcile.yml
          test "$(git hash-object src/ui/data/scenarioFilmStudyContemporaryEuropeanSocialCareRoomNextDoor.ts)" = "0c612c1bc7a30e6e31022c89e7a4357977899ebf"
          test "$(git hash-object src/ui/data/scenarioProductionVerificationContemporaryEuropeanSocialCareSystemsBatch.ts)" = "7d87ca3d7a23dc99cb42ded10b1a299a90de622b"
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('docs/film-history-chapter-nineteen-atlas-resolved.json', 'utf8'));
          const room = r.candidates.find((x) => x.title === 'The Room Next Door');
          if (r.atlas.actualCount !== 591 || r.atlas.expectedCount !== 591) throw new Error('Atlas must remain 591/591');
          if (r.verificationIndex.literalVerifiedScenarioIds !== 591) throw new Error('PV count must remain 591');
          if (r.candidates.length !== 65) throw new Error(`Expected 65 candidates, got ${r.candidates.length}`);
          if (r.byDecision.USE_EXISTING.length !== 63) throw new Error(`Expected 63 USE_EXISTING, got ${r.byDecision.USE_EXISTING.length}`);
          if (r.byDecision.P2.length !== 2) throw new Error(`Expected 2 P2, got ${r.byDecision.P2.length}`);
          if (!room || room.scenarioId !== 'scenario_the_room_next_door_2024' || room.matches !== 1 || room.productionVerified !== true || room.decision !== 'USE_EXISTING') throw new Error('Room Next Door existing identity did not close exactly');
          NODE
          node scripts/film-history-chapter-nineteen-festival-awards-completion-audit.mjs > /tmp/festival.json
          node - <<'NODE'
          const f = require('/tmp/festival.json');
          const room = f.obligations.find((x) => x.title === 'The Room Next Door');
          if (!room || room.status !== 'PRODUCTION_VERIFIED' || room.scenarioId !== 'scenario_the_room_next_door_2024') throw new Error('Festival gate did not close Room Next Door');
          if (f.correctiveQueue[0]?.order !== 6 || f.correctiveQueue[0]?.title !== 'There Is No Evil') throw new Error(`Unexpected next correction: ${f.correctiveQueue[0]?.title}`);
          NODE
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/TEMP-ch19-the-room-next-door-reconcile.yml',
              'docs/film-history-chapter-nineteen-atlas-resolved.json',
              'scripts/TEMP-ch19-the-room-next-door-reconcile.mjs',
              'scripts/film-history-chapter-eighteen-completion-audit.mjs',
              'scripts/film-history-chapter-nineteen-atlas-audit.mjs',
              'src/core/filmHistoryChapterNineteenAuditContract.test.ts',
          }
          actual = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          if actual != expected:
              raise SystemExit(f'Unexpected working-tree diff. expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check

      - name: Commit permanent Room Next Door reconciliation only
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Reconcile The Room Next Door in Chapter 19"
          git push origin HEAD:${GITHUB_REF_NAME}
