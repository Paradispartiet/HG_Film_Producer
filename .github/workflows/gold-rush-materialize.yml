name: Materialize The Gold Rush production case

on:
  push:
    branches:
      - agent/the-gold-rush-1925
    paths:
      - .github/workflows/gold-rush-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/the-gold-rush-1925
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Write Gold Rush case and guarded registry updates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one marker in {path}, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          write("src/core/chapterSixHollywoodExpansion.ts", '''import type { HistoricalFilmScenario } from "./earlyCinemaExpansion.js";
          import { normalizeEarlyCinemaTitle } from "./earlyCinemaExpansion.js";

          export const chapterSixHollywoodExpansionDefinitions = [
            {
              id: "scenario_the_gold_rush_1925",
              title: "The Gold Rush",
              originalTitle: "The Gold Rush",
              aliases: [],
              year: 1925,
              titleType: "Feature",
              runtimeMins: 88,
              directors: ["Charles Chaplin"],
              genres: ["Adventure", "Comedy", "Drama", "Romance"],
              premise: "Build The Gold Rush as a 1925 Charles Chaplin Productions feature in star-producer authorship and independent distribution: coordinate Chaplin's Lone Prospector performance, feature-length comedy and pathos, Truckee snow-country location material, Hollywood studio construction, miniature mountain effects and United Artists release into one production system. Treat Chaplin as writer-director-producer-editor without erasing the documented work of cinematographer Roland Totheroh, art director Charles D. Hall and the wider unit. Keep the original 1925 silent release distinct from Chaplin's materially revised 1942 reissue, which replaced intertitles with Chaplin narration, added a newly composed synchronized score and altered footage and the ending.",
              sourceId: "manual_the_gold_rush_1925",
              sourceUrl: "https://catalog.afi.com/Film/9427-THE-GOLD-RUSH",
              scenarioType: "star_producer_feature_comedy",
              requiredChoicesSeed: {
                screenplay: ["tragedy_into_comedy_set_piece_structure", "lone_prospector_emotional_arc", "gag_and_pathos_feature_progression"],
                camera: ["truckee_location_scale", "hollywood_miniature_landscape", "performance_and_effects_spatial_legibility"],
                editing: ["feature_gag_escalation", "location_studio_continuity", "1925_1942_version_boundary"],
                sound: ["silent_1925_release", "variable_1925_exhibition_music", "exclude_1942_narration_and_score"],
                themes: ["film_history", "charlie_chaplin", "united_artists", "star_producer", "independent_distribution"],
              },
              learningGoals: [
                "Plan a feature in which comic set pieces, hunger, isolation, romance and aspiration accumulate into one emotional arc rather than a loose succession of gags.",
                "Coordinate location scale and studio control: use the documented Truckee snow-country shoot for Chilkoot Pass imagery while treating the Hollywood miniature mountain range and constructed environments as deliberate production solutions.",
                "Model Chaplin's unusually concentrated writer-director-producer-editor authority without turning the film into a lone-genius myth: cinematography, art direction, assistants, performers, extras and effects construction remain collaborative labor.",
                "Use The Gold Rush to teach United Artists as a distribution countermodel to vertically integrated majors: independent production control still depended on organized national and international release infrastructure.",
                "Keep performance and effects mutually legible so the Lone Prospector's body, the cabin, weather, mountain space and scale illusions produce comedy and danger inside the same visual system.",
                "Preserve version criticism: the 1925 silent release, its variable theatrical accompaniment, and the 1942 re-edited version with Chaplin narration and newly composed synchronized score are separate historical objects.",
              ],
              phases: [
                { id: "pitch", label: "Star-producer feature pitch", player_task: "Define why Chaplin should concentrate independent production resources on a long comedy where the Lone Prospector's star identity can carry both spectacle and pathos through United Artists distribution." },
                { id: "research", label: "Production and version research", player_task: "Ground Charles Chaplin Productions, United Artists, Truckee, Chaplin Studios, Roland Totheroh, Charles D. Hall and the 1925/1942 version boundary in institutional evidence." },
                { id: "screenplay", label: "Gag, danger and pathos", player_task: "Structure starvation, the cabin, Georgia, imagined success and comic set pieces so each gag changes the Prospector's dramatic situation instead of interrupting it." },
                { id: "casting", label: "Star body and ensemble", player_task: "Build around Chaplin's precise physical screen identity while keeping Georgia Hale, Mack Swain and Tom Murray legible as emotional, comic and danger-bearing partners." },
                { id: "production_design", label: "Klondike by location and construction", player_task: "Combine real snow-country scale with studio-built interiors and artificial mountain environments without pretending every image was made in one place or by one technique." },
                { id: "cinematography", label: "Performance inside scale", player_task: "Coordinate Totheroh's documented cinematography with location crowds, controlled studio staging and effects landscapes so bodies remain readable against dangerous space." },
                { id: "editing", label: "Feature rhythm and version boundary", player_task: "Escalate comic sequences and emotional returns across feature length, then explicitly separate the 1925 assembly from Chaplin's altered 1942 reissue." },
                { id: "sound", label: "Silent release, later sound reissue", player_task: "Treat 1925 as silent photographed production with exhibition-specific music, and exclude the 1942 narration and synchronized Chaplin score from claims about the original release." },
                { id: "release", label: "Independent production, organized distribution", player_task: "Model how Chaplin retained production control while United Artists supplied release infrastructure capable of turning a star-authored feature into an international event." },
              ],
            },
          ] as const;

          export function mergeChapterSixHollywoodExpansion(
            baseScenarios: readonly HistoricalFilmScenario[],
          ): readonly HistoricalFilmScenario[] {
            const merged = [...baseScenarios];
            let nextPosition = Math.max(0, ...baseScenarios.map((scenario) => scenario.source.position)) + 1;
            for (const definition of chapterSixHollywoodExpansionDefinitions) {
              const acceptedTitles = [definition.title, definition.originalTitle, ...definition.aliases].map(normalizeEarlyCinemaTitle);
              const exists = merged.some((scenario) =>
                scenario.id === definition.id ||
                (scenario.film.year === definition.year && [scenario.film.title, scenario.film.original_title].map(normalizeEarlyCinemaTitle).some((title) => acceptedTitles.includes(title))),
              );
              if (exists) continue;
              merged.push({
                id: definition.id,
                status: "manual_chapter_six_hollywood_verified",
                source: {
                  list_id: "manual_chapter_six_hollywood_expansion_2026",
                  position: nextPosition,
                  imdb_id: definition.sourceId,
                  url: definition.sourceUrl,
                },
                film: {
                  title: definition.title,
                  original_title: definition.originalTitle,
                  year: definition.year,
                  title_type: definition.titleType,
                  runtime_mins: definition.runtimeMins,
                  directors: definition.directors,
                  genres: definition.genres,
                  genre_keys: definition.genres.map((genre) => genre.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "")),
                  imdb_rating: 0,
                  user_rating: 0,
                },
                scenario_type: definition.scenarioType,
                production_challenge: definition.premise,
                required_choices_seed: definition.requiredChoicesSeed,
                phases: definition.phases,
                learning_goals_seed: definition.learningGoals,
                manual_enrichment_needed: [],
              });
              nextPosition += 1;
            }
            return merged;
          }
          '''.replace("          ", ""))

          write("src/core/chapterSixHollywoodExpansion.test.ts", '''import assert from "node:assert/strict";
          import test from "node:test";

          import { chapterSixHollywoodExpansionDefinitions } from "./chapterSixHollywoodExpansion.js";

          test("Chapter 6 materializes The Gold Rush as the first Hollywood studio-system expansion case", () => {
            assert.equal(chapterSixHollywoodExpansionDefinitions.length, 1);
            const goldRush = chapterSixHollywoodExpansionDefinitions[0];
            assert.equal(goldRush.id, "scenario_the_gold_rush_1925");
            assert.equal(goldRush.title, "The Gold Rush");
            assert.equal(goldRush.year, 1925);
            assert.equal(goldRush.runtimeMins, 88);
            assert.equal(goldRush.scenarioType, "star_producer_feature_comedy");
            assert.equal(goldRush.sourceId, "manual_the_gold_rush_1925");
            assert.ok(goldRush.requiredChoicesSeed.camera.includes("hollywood_miniature_landscape"));
            assert.ok(goldRush.requiredChoicesSeed.editing.includes("1925_1942_version_boundary"));
            assert.ok(goldRush.requiredChoicesSeed.sound.includes("exclude_1942_narration_and_score"));
            assert.ok(goldRush.learningGoals.length >= 6);
            assert.ok(goldRush.phases.length >= 9);
          });
          '''.replace("          ", ""))

          write("src/ui/data/scenarioFilmStudySilentFoundationsGoldRush.ts", '''import type { FilmHistoryProfile } from "./scenarioFilmStudyMap";

          export const goldRushFilmHistoryProfile = {
            scenarioId: "scenario_the_gold_rush_1925",
            period: "1925 mature American silent feature production: Charles Chaplin Productions working through United Artists distribution, combining star-producer authorship, location scale, studio construction, effects and feature-length comic dramaturgy",
            traditions: ["American silent feature comedy", "star-producer cinema", "United Artists independent distribution", "location-studio hybrid production", "physical comedy and pathos"],
            before: "Chaplin had moved from short-film companies through First National to his own studio and United Artists. The Gold Rush therefore belongs to an already mature feature and star economy rather than inventing feature comedy, independent production or screen stardom from nothing.",
            moment: "Chaplin writes, directs, produces, edits and stars, while Roland Totheroh photographs, Charles D. Hall leads art direction and a large unit combines two weeks of Truckee snow-country work with extensive Chaplin Studios production. The Chilkoot Pass crowd image uses hundreds of extras; the main shoot returns to Hollywood, where a large artificial mountain range and controlled sets turn dangerous geography into repeatable comic space.",
            after: "The film became one of Chaplin's defining international works and a durable example of star-controlled production distributed through United Artists. Chaplin's 1942 sound reissue also makes the film a particularly useful case for version history: narration, score, trims and altered footage must not be back-projected onto the 1925 release.",
            historyQuestion: "How could Chaplin combine concentrated star-producer control with collaborative craft and United Artists distribution while moving between real snow-country scale, studio construction and effects in a feature-length comedy?",
            technicalHighlights: [
              { area: "historical_context", status: "source_verified", note: "AFI dates production from February 1924 to April 1925, records the June 1925 Los Angeles premiere and August release, and identifies The Gold Rush as Chaplin's first starring feature released through United Artists." },
              { area: "movement_and_tradition", status: "mapped", note: "The film belongs to mature American silent feature comedy and Chaplin's established Tramp tradition. The profile does not claim it invented feature comedy, pathos or star authorship." },
              { area: "industry_and_production_context", status: "source_verified", note: "AFI credits Charles Chaplin Productions and United Artists; Chaplin's own archive identifies the film as a United Artists production. The case uses that evidence to teach independent production control joined to organized distribution rather than studio-system isolation." },
              { area: "reception_and_legacy", status: "source_verified", note: "The Library of Congress lists The Gold Rush in the National Film Registry, while Chaplin's archive documents its long afterlife and later 1942 reissue. Legacy is separated from claims about original production practice." },
              { area: "screenplay", status: "source_verified", note: "AFI credits Chaplin as writer and records the film's unusually long comedy-feature scale. The gameplay maps starvation, danger, romance and recurring set pieces into one dramatic progression rather than asserting an undocumented fixed shooting-script process." },
              { area: "directing", status: "source_verified", note: "AFI and institutional film records credit Chaplin as director, with Charles F. Reisner/Charles F. Riesner and other assistants documented in supporting direction roles. The profile keeps creative concentration distinct from solitary labor." },
              { area: "performance", status: "mapped", note: "Chaplin, Georgia Hale, Mack Swain and Tom Murray are documented cast members. Performance gameplay focuses on bodily timing, threat, sympathy and ensemble legibility without inventing rehearsal notes or a universal Chaplin acting method." },
              { area: "production_design", status: "source_verified", note: "Chaplin's archive documents the return from Truckee to Hollywood and construction of an elaborate miniature mountain range from timber, wire, burlap, plaster, salt and flour; AFI credits Charles D. Hall as technical/art direction." },
              { area: "costume_makeup", status: "mapped", note: "The Lone Prospector's established costume and the social contrast with the dance-hall world are visually central, but this profile does not assign undocumented wardrobe or makeup department processes." },
              { area: "cinematography", status: "source_verified", note: "AFI credits Roland Totheroh and Jack Wilson in photography, while Chaplin's archive documents the Truckee location work and controlled Hollywood effects environment. Camera planning is therefore collaborative and production-specific, not a lone-author claim." },
              { area: "lighting", status: "mapped", note: "Location snow, studio interiors and constructed effects environments required different exposure and illumination problems, but the institutional sources used here do not justify a specific lamp package or lighting formula." },
              { area: "camera_format", status: "mapped", note: "AFI records the 1925 release as black-and-white and silent and gives multiple surviving/release lengths. Because projection speed and restoration assembly materially change modern runtime, the case avoids pretending one present-day minute count is the untouched camera negative." },
              { area: "editing", status: "source_verified", note: "AFI credits Chaplin as editor. AFI and Chaplin's archive both document the 1942 re-edit, including replaced intertitles, narration and altered material, making version separation a core editorial lesson." },
              { area: "sound_design", status: "source_verified", note: "AFI records the original physical property as silent. The 1942 release added Chaplin narration, so synchronized speech must not be attributed to the 1925 production." },
              { area: "music", status: "source_verified", note: "The Chaplin archive documents different musical compilations for the 1925 premiere and first run, while Chaplin composed a new synchronized score for the 1942 reissue. The case therefore treats 1925 accompaniment and 1942 score as different evidence layers." },
              { area: "effects_animation", status: "source_verified", note: "Chaplin's archive explicitly describes the Hollywood miniature mountain range and the production's special-effects work after the Truckee location shoot. Effects are taught as constructed scale integrated with performance rather than invisible magic." },
              { area: "documentary_method", status: "not_central", note: "The Gold Rush is a staged comedy feature. Truckee location material supplies physical scale but does not turn the fictional Klondike narrative into documentary evidence." },
            ],
          } as const satisfies FilmHistoryProfile;
          '''.replace("          ", ""))

          write("src/ui/data/scenarioProductionVerificationGoldRush.ts", '''import type { ProductionCaseVerificationRecord } from "./scenarioProductionVerification";

          export const goldRushProductionCaseVerification = {
            scenarioId: "scenario_the_gold_rush_1925",
            status: "verified",
            verifiedAt: "2026-08-15",
            summary: "AFI, the Chaplin Office, Cineteca di Bologna and the Library of Congress support The Gold Rush as Chaplin's 1925 Charles Chaplin Productions feature released through United Artists, with Chaplin credited as writer, director, producer and editor and Roland Totheroh leading documented cinematography. Chaplin's archive records two weeks of Truckee snow-country photography with roughly six hundred extras for the Chilkoot Pass image before the main unit returned to Hollywood, where an elaborate artificial mountain range supported the effects-heavy studio production. The same archival record and AFI distinguish the original silent release from Chaplin's 1942 reissue, which replaced intertitles with his narration, added a newly composed synchronized score and altered footage. The Production Case therefore teaches star-producer control, collaborative craft, location/studio integration, effects scale and independent distribution without collapsing the 1925 and 1942 versions.",
            sources: [
              {
                title: "The Gold Rush — AFI Catalog",
                publisher: "American Film Institute",
                url: "https://catalog.afi.com/Film/9427-THE-GOLD-RUSH",
                sourceKind: "film_institute",
                supports: ["overall", "screenplay", "cinematography", "editing", "sound"],
                note: "AFI identifies Charles Chaplin Productions, United Artists distribution, Chaplin as director/writer/producer/editor, Roland Totheroh and Jack Wilson in photography, Charles D. Hall in art/technical direction, the 1924-1925 production span, original silent physical properties and release/version history."
              },
              {
                title: "Filming The Gold Rush",
                publisher: "Charlie Chaplin / Roy Export",
                url: "https://www.charliechaplin.com/en/films/2-The-Gold-Rush/articles/5-Filming-The-Gold-Rush",
                sourceKind: "archive_feature",
                supports: ["overall", "cinematography", "editing"],
                note: "The Chaplin archive documents the Truckee location shoot, roughly six hundred extras on the recreated Chilkoot Pass, the return to Hollywood for the main shoot, construction of the artificial mountain range, and the later 1942 reissue changes."
              },
              {
                title: "The Music of The Gold Rush",
                publisher: "Charlie Chaplin / Roy Export",
                url: "https://www.charliechaplin.com/en/films/2-The-Gold-Rush/articles/248-The-Music-of-The-Gold-Rush",
                sourceKind: "archive_feature",
                supports: ["overall", "sound"],
                note: "The Chaplin archive separates the compiled orchestral accompaniments used for the 1925 premiere and first run from Chaplin's newly composed synchronized score for the 1942 reissue."
              },
              {
                title: "La febbre dell'oro — 4K restoration",
                publisher: "Cineteca di Bologna",
                url: "https://cinetecadibologna.it/distribuzione/film/la-febbre-delloro/",
                sourceKind: "film_institute",
                supports: ["overall", "cinematography", "editing", "sound"],
                note: "Cineteca di Bologna credits Chaplin, Roland Totheroh and Charles D. Hall and documents the 2025 4K restoration from multiple archival elements, reinforcing that modern presentation runtime and restored image/sound layers must not be mistaken for one untouched 1925 master."
              }
            ]
          } as const satisfies ProductionCaseVerificationRecord;
          '''.replace("          ", ""))

          replace_once(
              "src/ui/data/filmScenarios.ts",
              'import { mergeChapterFiveInternationalExpansion } from "../../core/chapterFiveInternationalExpansion.js";\n',
              'import { mergeChapterFiveInternationalExpansion } from "../../core/chapterFiveInternationalExpansion.js";\nimport { mergeChapterSixHollywoodExpansion } from "../../core/chapterSixHollywoodExpansion.js";\n',
          )
          replace_once(
              "src/ui/data/filmScenarios.ts",
              'const chapterFiveInternationalScenarios = mergeChapterFiveInternationalExpansion(chapterFourIndustryScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterFiveInternationalScenarios);',
              'const chapterFiveInternationalScenarios = mergeChapterFiveInternationalExpansion(chapterFourIndustryScenarios);\nconst chapterSixHollywoodScenarios = mergeChapterSixHollywoodExpansion(chapterFiveInternationalScenarios);\nconst modernCanonScenarios = mergeModernCanonExpansion(chapterSixHollywoodScenarios);',
          )
          replace_once(
              "src/ui/data/filmScenarios.ts",
              '+manual_chapter_five_international_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
              '+manual_chapter_five_international_expansion_2026+manual_chapter_six_hollywood_expansion_2026+manual_modern_indie_asian_prize_expansion_2026',
          )
          replace_once(
              "src/ui/data/filmScenarios.ts",
              'Chapter 5 international/series expansion, modern independent/Asian/prize-cinema expansion',
              'Chapter 5 international/series expansion, Chapter 6 Hollywood studio/star-system expansion, modern independent/Asian/prize-cinema expansion',
          )

          replace_once(
              "src/ui/data/scenarioFilmStudyMap.ts",
              'import { atlantisFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsAtlantis";\n',
              'import { atlantisFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsAtlantis";\nimport { goldRushFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsGoldRush";\n',
          )
          replace_once(
              "src/ui/data/scenarioFilmStudyMap.ts",
              '  [atlantisFilmHistoryProfile.scenarioId]: atlantisFilmHistoryProfile,\n',
              '  [atlantisFilmHistoryProfile.scenarioId]: atlantisFilmHistoryProfile,\n  [goldRushFilmHistoryProfile.scenarioId]: goldRushFilmHistoryProfile,\n',
          )

          replace_once(
              "src/ui/data/scenarioProductionVerificationRegistry.ts",
              'import { atlantisProductionCaseVerification } from "./scenarioProductionVerificationAtlantis";\n',
              'import { atlantisProductionCaseVerification } from "./scenarioProductionVerificationAtlantis";\nimport { goldRushProductionCaseVerification } from "./scenarioProductionVerificationGoldRush";\n',
          )
          replace_once(
              "src/ui/data/scenarioProductionVerificationRegistry.ts",
              '  atlantisProductionCaseVerification,\n',
              '  atlantisProductionCaseVerification,\n  goldRushProductionCaseVerification,\n',
          )

          replace_once(
              "scripts/film-history-chapter-six-atlas-audit.mjs",
              'const EXPECTED_ATLAS_COUNT = 398;',
              'const EXPECTED_ATLAS_COUNT = 399;',
          )
          replace_once(
              "scripts/film-history-chapter-six-atlas-audit.mjs",
              '  "chapterFiveInternationalExpansion.ts",\n  "modernCanonExpansion.ts",',
              '  "chapterFiveInternationalExpansion.ts",\n  "chapterSixHollywoodExpansion.ts",\n  "modernCanonExpansion.ts",',
          )
          replace_once(
              "scripts/film-history-chapter-six-atlas-audit.mjs",
              '  USE_EXISTING: ["The General"],\n  P0: ["The Crowd", "The Gold Rush"],',
              '  USE_EXISTING: ["The General", "The Gold Rush"],\n  P0: ["The Crowd"],',
          )

          replace_once(
              "scripts/production-case-rest-audit.mjs",
              'const EXPECTED_PLAYABLE_SCENARIOS = 398;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 398;',
              'const EXPECTED_PLAYABLE_SCENARIOS = 399;\nconst EXPECTED_VERIFIED_PRODUCTION_CASES = 399;',
          )
          replace_once(
              "scripts/production-case-rest-audit.mjs",
              '  "chapterFiveInternationalExpansion.ts",\n  "modernCanonExpansion.ts",',
              '  "chapterFiveInternationalExpansion.ts",\n  "chapterSixHollywoodExpansion.ts",\n  "modernCanonExpansion.ts",',
          )
          PY
      - name: Full v0.1 verification
        run: npm run verify:v0.1
      - name: Commit verified materialization and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/gold-rush-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete The Gold Rush 1925 production case"
          git push origin HEAD:agent/the-gold-rush-1925
