name: Materialize Inside Out

on:
  push:
    branches:
      - agent/inside-out-production-case
    paths:
      - .github/workflows/materialize-inside-out.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Integrate Production Case
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one occurrence, found {count} for {old[:80]!r}")
              target.write_text(text.replace(old, new, 1))

          for old, new in [('import {\n  getHerFilmHistoryDonors,\n  getHerFilmHistoryProfile,\n} from "./scenarioFilmStudyConstructedWorldsHerCatalog";\n', 'import {\n  getHerFilmHistoryDonors,\n  getHerFilmHistoryProfile,\n} from "./scenarioFilmStudyConstructedWorldsHerCatalog";\nimport {\n  getInsideOutFilmHistoryDonors,\n  getInsideOutFilmHistoryProfile,\n} from "./scenarioFilmStudyConstructedWorldsInsideOutCatalog";\n'), ('  return getRushFilmHistoryProfile(scenarioId)\n    ?? getHerFilmHistoryProfile(scenarioId)\n    ?? getTheImpossibleFilmHistoryProfile(scenarioId)\n', '  return getRushFilmHistoryProfile(scenarioId)\n    ?? getHerFilmHistoryProfile(scenarioId)\n    ?? getInsideOutFilmHistoryProfile(scenarioId)\n    ?? getTheImpossibleFilmHistoryProfile(scenarioId)\n'), ('  const rushDonors = getRushFilmHistoryDonors(profile);\n  const herDonors = getHerFilmHistoryDonors(profile);\n  const impossibleDonors = getTheImpossibleFilmHistoryDonors(profile);\n', '  const rushDonors = getRushFilmHistoryDonors(profile);\n  const herDonors = getHerFilmHistoryDonors(profile);\n  const insideOutDonors = getInsideOutFilmHistoryDonors(profile);\n  const impossibleDonors = getTheImpossibleFilmHistoryDonors(profile);\n'), ('  const donors: readonly FilmHistoryProfile[] = (rushDonors\n    ?? herDonors\n    ?? impossibleDonors\n', '  const donors: readonly FilmHistoryProfile[] = (rushDonors\n    ?? herDonors\n    ?? insideOutDonors\n    ?? impossibleDonors\n'), ('  const start = rushDonors\n    ? 2\n    : herDonors || impossibleDonors || moonriseDonors || hugoDonors || walleDonors || dogvilleDonors || thePianistDonors\n', '  const start = rushDonors\n    ? 2\n    : herDonors || insideOutDonors || impossibleDonors || moonriseDonors || hugoDonors || walleDonors || dogvilleDonors || thePianistDonors\n'), ('  const walleMatch = "This matches the documented relationship between silent-comedy robot performance, ecological worldbuilding, color-scripted environments, simulated photographed-camera behavior, Ben Burtt\'s vocal-mechanical sound and orchestral-pop musical memory.";\n', '  const insideOutMatch = "This matches the documented relationship among Docter\'s daughter-inspired emotion research, the five-emotion screenplay, the Joy-Sadness journey, the parallel Riley and Mind worlds, Eggleston\'s mental geography, Lin and White\'s virtual camera-lighting grammar, particle bodies, geometry-light rendering, Nolting\'s parallel edit, Klyce and Mills\'s sound design and Giacchino\'s inward score.";\n  const insideOutPartial = "This is another real animation, subjective-interior or constructed-world system, but it does not combine a child\'s family transition, emotion research, five personified functions, parallel outer and inner causality, a Joy-Sadness journey and custom energy-light rendering in the same way.";\n  const insideOutMiss = "This places the film inside the wrong relationship between psychology research, child-centred family drama, voice-and-animation performance, dual-world design, virtual cinematography, geometry-light rendering, parallel editing, mental sound and inward music.";\n  const walleMatch = "This matches the documented relationship between silent-comedy robot performance, ecological worldbuilding, color-scripted environments, simulated photographed-camera behavior, Ben Burtt\'s vocal-mechanical sound and orchestral-pop musical memory.";\n'), ('              : hugoDonors\n                ? hugoMatch\n                : walleDonors\n                  ? walleMatch\n', '              : hugoDonors\n                ? hugoMatch\n                : insideOutDonors\n                  ? insideOutMatch\n                  : walleDonors\n                    ? walleMatch\n'), ('              : hugoDonors\n                ? hugoPartial\n                : walleDonors\n                  ? wallePartial\n', '              : hugoDonors\n                ? hugoPartial\n                : insideOutDonors\n                  ? insideOutPartial\n                  : walleDonors\n                    ? wallePartial\n'), ('              : hugoDonors\n                ? hugoMiss\n                : walleDonors\n                  ? walleMiss\n', '              : hugoDonors\n                ? hugoMiss\n                : insideOutDonors\n                  ? insideOutMiss\n                  : walleDonors\n                    ? walleMiss\n')]:
              replace_once("src/ui/data/scenarioFilmStudyConstructedWorldsBatch.ts", old, new)

          for old, new in [('import { rushProductionCaseVerification } from "./scenarioProductionVerificationRush";\n', 'import { rushProductionCaseVerification } from "./scenarioProductionVerificationRush";\nimport { insideOutProductionCaseVerification } from "./scenarioProductionVerificationInsideOut";\n'), ('  dogvilleProductionCaseVerification,\n  rushProductionCaseVerification,\n] as const satisfies readonly ProductionCaseVerificationRecord[];\n', '  dogvilleProductionCaseVerification,\n  rushProductionCaseVerification,\n  insideOutProductionCaseVerification,\n] as const satisfies readonly ProductionCaseVerificationRecord[];\n')]:
              replace_once("src/ui/data/scenarioProductionVerificationConstructedWorldsBatch.ts", old, new)

          for old, new in [('  ["Homesick Norwegian taboo-family intimacy system", ["scenario_homesick_2015"], 10],\n', '  ["Homesick Norwegian taboo-family intimacy system", ["scenario_homesick_2015"], 10],\n  ["Inside Out emotion-research and dual-world Pixar animation system", ["scenario_inside_out_2015"], 10],\n'), ('const expectedVerifiedCount = 339;', 'const expectedVerifiedCount = 340;')]:
              replace_once("src/ui/data/scenarioProductionVerification.test.ts", old, new)

          for old, new in [('| Source-verified Production Cases | 339 |', '| Source-verified Production Cases | 340 |'), ('| Remaining unverified Production Cases | 39 |', '| Remaining unverified Production Cases | 38 |'), ('| Source-backed Film Study profiles | 339 |', '| Source-backed Film Study profiles | 340 |'), ('all 339 verified records and profiles', 'all 340 verified records and profiles'), ('| `film_scenarios_seed.json` | 34 |', '| `film_scenarios_seed.json` | 33 |'), ('| 2010s | 37 |', '| 2010s | 36 |'), ('| Drama | 34 |', '| Drama | 33 |'), ('| Comedy | 10 |', '| Comedy | 9 |'), ('| Fantasy | 5 |', '| Fantasy | 4 |'), ('| Adventure | 3 |', '| Adventure | 2 |'), ('| Family | 2 |', '| Family | 1 |'), ('| Animation | 1 |\n', '')]:
              replace_once("docs/PRODUCTION_CASE_REST_AUDIT.md", old, new)

          audit_path = Path("docs/PRODUCTION_CASE_REST_AUDIT.md")
          audit = audit_path.read_text()
          lines = audit.splitlines()
          rewritten = []
          in_catalog = False
          row_number = 0
          for line in lines:
              if line == "## Complete remaining catalog":
                  in_catalog = True
                  rewritten.append(line)
                  continue
              if in_catalog and line.startswith("## Audit method"):
                  in_catalog = False
                  rewritten.append(line)
                  continue
              if in_catalog and "`scenario_inside_out_2015`" in line:
                  continue
              if in_catalog and re.match(r"^\| \d+ \|", line):
                  row_number += 1
                  line = re.sub(r"^\| \d+ \|", f"| {row_number} |", line)
              rewritten.append(line)
          audit_path.write_text("\n".join(rewritten) + "\n")

          Path(".github/workflows/materialize-inside-out.yml").unlink()
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify repository
        run: npm run verify:v0.1
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate Inside Out Production Case"
          git push origin HEAD:${GITHUB_REF_NAME}
