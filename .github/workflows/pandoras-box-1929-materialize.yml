name: Materialize Pandora's Box 1929 production case

on:
  push:
    branches:
      - agent/pandoras-box-1929
    paths:
      - .github/workflows/pandoras-box-1929-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pandoras-box-1929
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate Pandora's Box into Atlas
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Tighten the scenario wording to the exact screenplay credit carried by filmportal.
          replace_once(
              'src/core/chapterSevenWeimarExpansion.ts',
              "Ladislaus Vajda adapts Frank Wedekind's Erdgeist and Die Büchse der Pandora with additional documented writing participation,",
              "Ladislaus Vajda adapts Frank Wedekind's Erdgeist and Die Büchse der Pandora,",
          )
          replace_once(
              'src/core/chapterSevenWeimarExpansion.ts',
              'Ground Nebenzahl, Pabst, the documented writers, Brooks, Krampf, Andrejew, Heš, Staaken production, Südfilm distribution and later version history in institutional evidence.',
              'Ground Nebenzahl, Pabst, Vajda, Brooks, Krampf, Andrejew, Heš, Staaken production, Südfilm distribution and later version history in institutional evidence.',
          )

          # Film Study runtime registration.
          replace_once(
              'src/ui/data/scenarioFilmStudyMap.ts',
              'import { theLastLaughFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsTheLastLaugh";\n',
              'import { theLastLaughFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsTheLastLaugh";\nimport { pandorasBoxFilmHistoryProfile } from "./scenarioFilmStudySilentFoundationsPandorasBox";\n',
          )
          replace_once(
              'src/ui/data/scenarioFilmStudyMap.ts',
              '  [theLastLaughFilmHistoryProfile.scenarioId]: theLastLaughFilmHistoryProfile,\n',
              '  [theLastLaughFilmHistoryProfile.scenarioId]: theLastLaughFilmHistoryProfile,\n  [pandorasBoxFilmHistoryProfile.scenarioId]: pandorasBoxFilmHistoryProfile,\n',
          )

          # Production Verification runtime registration.
          replace_once(
              'src/ui/data/scenarioProductionVerificationRegistry.ts',
              'import { theLastLaughProductionCaseVerification } from "./scenarioProductionVerificationTheLastLaugh";\n',
              'import { theLastLaughProductionCaseVerification } from "./scenarioProductionVerificationTheLastLaugh";\nimport { pandorasBoxProductionCaseVerification } from "./scenarioProductionVerificationPandorasBox";\n',
          )
          replace_once(
              'src/ui/data/scenarioProductionVerificationRegistry.ts',
              '  theLastLaughProductionCaseVerification,\n',
              '  theLastLaughProductionCaseVerification,\n  pandorasBoxProductionCaseVerification,\n',
          )

          # Chapter 7 is now production-case complete: 405 Atlas scenarios and no P0/P1 gaps.
          replace_once(
              'scripts/film-history-chapter-seven-atlas-audit.mjs',
              'const EXPECTED_ATLAS_COUNT = 404;',
              'const EXPECTED_ATLAS_COUNT = 405;',
          )
          replace_once(
              'scripts/film-history-chapter-seven-atlas-audit.mjs',
              '  USE_EXISTING: ["Metropolis", "Nosferatu", "The Cabinet of Dr. Caligari", "The Last Laugh"],\n  P0: [],\n  P1: ["Pandora\'s Box"],',
              '  USE_EXISTING: ["Metropolis", "Nosferatu", "Pandora\'s Box", "The Cabinet of Dr. Caligari", "The Last Laugh"],\n  P0: [],\n  P1: [],',
          )

          # Global production-case integrity.
          replace_once(
              'scripts/production-case-rest-audit.mjs',
              'const EXPECTED_PLAYABLE_SCENARIOS = 404;',
              'const EXPECTED_PLAYABLE_SCENARIOS = 405;',
          )
          replace_once(
              'scripts/production-case-rest-audit.mjs',
              'const EXPECTED_VERIFIED_PRODUCTION_CASES = 404;',
              'const EXPECTED_VERIFIED_PRODUCTION_CASES = 405;',
          )

          # Permanent Chapter 7 reviewed matrix contract.
          p = Path('src/core/filmHistoryChapterSevenAuditContract.test.ts')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ('assert.match(audit, /const EXPECTED_ATLAS_COUNT = 404;/);', 'assert.match(audit, /const EXPECTED_ATLAS_COUNT = 405;/);'),
              ('assert.match(audit, /USE_EXISTING: \\["Metropolis", "Nosferatu", "The Cabinet of Dr\\. Caligari", "The Last Laugh"\\]/);', 'assert.match(audit, /USE_EXISTING: \\["Metropolis", "Nosferatu", "Pandora\\\'s Box", "The Cabinet of Dr\\. Caligari", "The Last Laugh"\\]/);'),
              ('assert.match(audit, /P1: \\["Pandora\'s Box"\\]/);', 'assert.match(audit, /P1: \\[\\]/);'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'filmHistoryChapterSevenAuditContract.test.ts: expected one marker, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Full v0.1 verification
        run: npm run verify:v0.1
      - name: Commit verified Pandora's Box materialization and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pandoras-box-1929-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Pandora's Box 1929 production case"
          git push origin HEAD:agent/pandoras-box-1929
