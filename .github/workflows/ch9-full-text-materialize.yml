name: Materialize Film History Chapter 9 full text

on:
  push:
    branches: [agent/ch9-soviet-montage-full-text]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch9-soviet-montage-full-text
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize Chapter 9 into canonical book
        run: python3 scripts/materialize-film-history-ch9-full.py
      - name: Full v0.1 verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:v0.1 2>&1 | tee ch9-full-verify.log
      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ch9-full-verify-log
          path: ch9-full-verify.log
      - name: Commit verified state
        run: |
          rm -f .github/workflows/ch9-full-text-materialize.yml scripts/materialize-film-history-ch9-full.py ch9-full-verify.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Film History Chapter 9 full text"
          git push origin HEAD:agent/ch9-soviet-montage-full-text
