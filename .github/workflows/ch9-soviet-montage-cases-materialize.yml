name: Materialize Chapter 9 Soviet montage cases

on:
  push:
    branches: [agent/ch9-soviet-montage-production-cases]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ch9-soviet-montage-production-cases
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire production cases
        run: python3 scripts/materialize-ch9-cases.py
      - name: Update resolved Chapter 9 contract
        run: python3 scripts/fix-ch9-case-contract.py
      - name: Regenerate Chapter 9 report
        run: npm run audit:film-history-ch9
      - name: Full v0.1 verification
        run: npm run verify:v0.1
      - name: Commit verified state
        run: |
          rm -f .github/workflows/ch9-soviet-montage-cases-materialize.yml scripts/materialize-ch9-cases.py scripts/fix-ch9-case-contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Chapter 9 Soviet montage Production Cases"
          git push origin HEAD:agent/ch9-soviet-montage-production-cases
