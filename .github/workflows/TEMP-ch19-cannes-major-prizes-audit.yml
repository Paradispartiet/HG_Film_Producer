name: TEMP Cannes major-prizes audit

on:
  push:
    branches:
      - agent/ch19-cannes-major-prizes-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cannes major-prizes report
        run: npm run audit:film-history-ch19-cannes-major-prizes -- --write=docs/film-history-chapter-nineteen-cannes-major-prizes-audit.json

      - name: Lock source-first diagnostic baseline
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('docs/film-history-chapter-nineteen-cannes-major-prizes-audit.json', 'utf8'));
          const invariant = (condition, message) => { if (!condition) throw new Error(message); };
          invariant(report.prerequisites?.topPrizeGateClosed === true, 'Top-prize prerequisite is not closed.');
          invariant(report.technicalBaseline?.atlasActual === 593 && report.technicalBaseline?.atlasExpected === 593, `Expected deployed 593/593 baseline, found ${report.technicalBaseline?.atlasActual}/${report.technicalBaseline?.atlasExpected}.`);
          invariant(report.technicalBaseline?.productionVerificationIds === 593, `Expected 593 PV IDs, found ${report.technicalBaseline?.productionVerificationIds}.`);
          invariant(report.technicalBaseline?.chapterNineteenCandidates === 70, `Expected 70 Chapter 19 candidates, found ${report.technicalBaseline?.chapterNineteenCandidates}.`);
          invariant(report.summary?.awardObligations === 43, `Expected 43 award obligations, found ${report.summary?.awardObligations}.`);
          invariant(report.summary?.uniqueAwardedFilms === 41, `Expected 41 unique awarded films, found ${report.summary?.uniqueAwardedFilms}.`);
          invariant(report.summary?.productionVerifiedObligations === 20, `Expected 20 already production-verified award obligations, found ${report.summary?.productionVerifiedObligations}.`);
          invariant(report.summary?.productionVerifiedFilms === 19, `Expected 19 already production-verified awarded films, found ${report.summary?.productionVerifiedFilms}.`);
          invariant(report.summary?.unresolvedFilms === 22 && report.summary?.missingCandidateFilms === 22, `Expected 22 unresolved missing-candidate films, found ${report.summary?.unresolvedFilms}/${report.summary?.missingCandidateFilms}.`);
          invariant(report.correctiveQueue?.length === 22, `Expected 22 film-level corrective tasks, found ${report.correctiveQueue?.length}.`);
          invariant(report.correctiveQueue?.[0]?.title === 'A Hero', `Expected A Hero as first corrective leader, found ${report.correctiveQueue?.[0]?.title}.`);
          NODE

      - name: Full v0.1 verification
        run: npm run verify:v0.1

      - name: Commit clean audit package
        run: |
          rm .github/workflows/TEMP-ch19-cannes-major-prizes-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/film-history-chapter-nineteen-cannes-major-prizes-audit.json .github/workflows/TEMP-ch19-cannes-major-prizes-audit.yml
          git diff --cached --check
          git commit -m 'Materialize Cannes major-prizes source-first audit'
          git push origin HEAD:agent/ch19-cannes-major-prizes-audit
