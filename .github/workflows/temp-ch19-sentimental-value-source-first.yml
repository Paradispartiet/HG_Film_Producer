name: TEMP Chapter 19 Sentimental Value source-first

on:
  push:
    branches:
      - agent/ch19-sentimental-value-production-case
    paths:
      - .github/workflows/temp-ch19-sentimental-value-source-first.yml
      - src/core/chapterNineteenSentimentalValueExpansion.ts
      - src/core/chapterNineteenSentimentalValueExpansion.test.ts
      - src/ui/data/scenarioProductionVerificationSentimentalValue.ts
      - src/ui/data/scenarioFilmStudyChapterNineteenSentimentalValue.ts

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/ch19-sentimental-value-production-case

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck source-first package
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Strict Sentimental Value contract
        run: node --test dist/core/chapterNineteenSentimentalValueExpansion.test.js

      - name: Build UI
        run: npm run build:ui
